apply plugin: 'com.android.application'

android {
    namespace = "com.redvsblue.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.redvsblue.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('RVB_ANDROID_VERSION_CODE') ?: '20')
        versionName System.getenv('RVB_ANDROID_VERSION_NAME') ?: "0.1.1"
        manifestPlaceholders = [rvbAppLabel: '红蓝对决·安卓测试版']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        uiAcceptance {
            initWith debug
            applicationIdSuffix ".uiqa"
            versionNameSuffix "-RED199-candidate"
            matchingFallbacks = ['debug']
        }
        demo {
            initWith uiAcceptance
            manifestPlaceholders = [rvbAppLabel: '红蓝对决·试玩版']
            applicationIdSuffix ""
            versionNameSuffix "-demo"
            debuggable false
            signingConfig null
            matchingFallbacks = ['release', 'debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        uiAcceptance.assets.srcDir "$buildDir/generated/ui-acceptance-assets"
        uiAcceptance.res.srcDir "$buildDir/generated/android-distribution-res"
        uiAcceptance.assets.srcDir "$buildDir/generated/android-host-assets"
        uiAcceptance.jniLibs.srcDir "$buildDir/generated/android-host-jni"
        demo {
            java.srcDir "src/uiAcceptance/java"
            res.srcDirs = ["src/uiAcceptance/res", "$buildDir/generated/android-distribution-res"]
            manifest.srcFile "src/uiAcceptance/AndroidManifest.xml"
            assets.srcDirs = ["$buildDir/generated/ui-acceptance-assets", "$buildDir/generated/android-host-assets"]
            jniLibs.srcDir "$buildDir/generated/android-host-jni"
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/librvb_node.so'] } }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def stageUiAcceptance = tasks.register('stageUiAcceptance', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/stage-android-ui-acceptance.mjs'
}
tasks.configureEach { task ->
    if (task.name == 'preUiAcceptanceBuild') task.dependsOn(stageUiAcceptance)
}

def stageDemo = tasks.register('stageDemo', Exec) {
    workingDir rootProject.projectDir.parentFile
    environment 'RVB_ANDROID_PUBLIC_DEMO', '1'
    commandLine 'node', 'scripts/stage-android-ui-acceptance.mjs'
}
tasks.configureEach { task ->
    if (task.name == 'preDemoBuild') task.dependsOn(stageDemo)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
