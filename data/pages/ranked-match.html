<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排位赛前 · RED vs BLUE</title><link rel="stylesheet" href="css/tabletop/tabletop.css"><link rel="stylesheet" href="css/tabletop/online.css"><link rel="stylesheet" href="css/tabletop/ranked-match.css"><script src="js/server-utils.js"></script><script src="js/ranked-session.js"></script><script defer src="js/ranked-match.js"></script></head>
<body data-art-page="ranked-match"><div class="ranked-shell">
<header class="game-header"><a class="game-brand" href="official.html"><span>RED</span><small>vs</small><span>BLUE</span></a><span class="header-divider"></span><h1>官方排位</h1><span class="header-end">测试赛季 · 1v1</span></header>
<main class="ranked-main"><nav class="ranked-progress" aria-label="排位进度"><span class="done">匹配成功</span><span id="stepVeto">双方禁图</span><span id="stepMap">确定地图</span><span>选择阵容</span><span>进入对战</span></nav>
<div class="ranked-heading"><div><p class="kicker">RANKED MATCH</p><h2 id="stageTitle">正在进入排位比赛</h2><p id="stageHint">正在读取服务器状态…</p></div><div class="ranked-clock"><strong id="deadline">--</strong><span id="deadlineLabel">服务器计时</span></div></div>
<div class="ranked-players" id="players"></div>
<section id="vetoStage" hidden><div id="mapCards" class="ranked-map-grid"></div><p class="ranked-map-legend">浅色：地面　深色：墙体　棕色：掩体　灰蓝：洞穴</p></section>
<section id="mapStage" class="ranked-reveal" hidden><div><canvas id="chosenMap" role="img" aria-label="本局地图"></canvas></div><aside class="ranked-map-note"><p class="kicker">本局战场</p><h2 id="chosenName"></h2><p id="banSummary"></p><p id="mapHint">根据地图选择光方或暗方，再组建你的阵容。</p></aside></section>
<p id="matchMessage" role="status" aria-live="polite"></p>
</main><footer class="ranked-dock"><div><strong id="dockTitle">等待服务器</strong><p id="dockHint">断线后可使用原账号返回本局。</p></div><button id="withdraw" class="button">退出并认负</button><button id="confirmBan" class="button primary" disabled hidden>确认禁用</button><button id="chooseRoster" class="button primary" hidden>选择阵营与阵容</button><a id="returnLobby" class="button" href="official.html" hidden>返回排位大厅</a></footer>
</div><dialog id="mapDialog" class="game-dialog"><form method="dialog"><button class="dialog-close" aria-label="关闭地图预览">×</button></form><h2 id="detailName"></h2><canvas id="detailMap" role="img" aria-label="地图地形预览"></canvas><p>地图预览不会提交禁图。</p></dialog><dialog id="withdrawDialog" class="game-dialog"><h2>退出本局排位？</h2><p>主动退出将判负并计入 Elo，同时增加15分钟匹配冷却。仅关闭窗口不会立即认负，倒计时仍继续。</p><form method="dialog"><button value="cancel" class="button">继续比赛</button><button value="withdraw" class="button">确认退出并认负</button></form></dialog></body></html>
