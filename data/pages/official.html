<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方排位 · RED vs BLUE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e2e8f0;font:16px/1.65 system-ui,sans-serif}main{max-width:960px;margin:36px auto;padding:0 24px}h1{margin-bottom:0}p,small{color:#aab9ce}a{color:#93c5fd}section{background:#142034;padding:24px;border:1px solid #35445a;border-radius:16px;margin:20px 0}label{display:block;margin:12px 0 4px}input,select{width:100%;padding:11px;background:#0b1424;color:#e2e8f0;border:1px solid #63748d;border-radius:7px;font:inherit}button{padding:11px 18px;background:#254465;border:1px solid #63748d;border-radius:7px;color:white;font:inherit;margin:12px 10px 0 0;cursor:pointer}button.primary{background:#2159bd}button:disabled{opacity:.5;cursor:wait}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.score{font-size:38px;color:#93c5fd;font-weight:700}#message{white-space:pre-wrap;overflow-wrap:anywhere;min-height:26px;color:#fde68a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #35445a}td{overflow-wrap:anywhere}#history article{padding:12px 0;border-bottom:1px solid #35445a}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:0 14px}section{padding:16px}}
</style><script src="js/server-utils.js"></script><script defer src="js/official.js"></script></head>
<body><main><a href="multiplayer.html">← 休闲联机</a><h1>官方 1v1 排位</h1><p>系统匹配 · 服务器裁定 · Elo 积分</p>
<section><label for="server">官方服务器地址</label><input id="server" type="url" placeholder="http://127.0.0.1:2568"><small>本机试运行可用 HTTP；异地登录须使用组织者提供的 HTTPS 地址。</small><button id="connect">连接服务器</button><div id="message" role="status" aria-live="polite"></div></section>
<section id="auth"><h2>服务器账号</h2><label for="authAction">操作</label><select id="authAction"><option value="login">登录</option><option value="register">注册并发送验证邮件</option><option value="verify">完成邮箱验证</option><option value="forgot">申请找回密码邮件</option><option value="reset">使用邮件代码重置密码</option></select>
<form id="authForm"><label for="email">邮箱</label><input id="email" type="email" required autocomplete="email" maxlength="254"><div id="nameField" hidden><label for="name">昵称</label><input id="name" maxlength="24" autocomplete="nickname"></div><div id="passwordField"><label for="password">密码（至少10个字符）</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="current-password"></div><div id="codeField" hidden><label for="code">邮件中的验证代码</label><input id="code" autocomplete="one-time-code" maxlength="64"></div><button class="primary" type="submit">继续</button></form><p>注册免费开放。验证邮箱后即可排位；与 P2P 的本地身份分开。</p></section>
<section id="profile" hidden><h2 id="welcome"></h2><p id="season"></p><div class="score" id="rating"></div><p id="record"></p><p id="queueStatus" aria-live="polite"></p><label for="alignment">本局使用的阵营</label><select id="alignment"><option value="light">光方</option><option value="dark">暗方</option></select><button class="primary" id="join">开始匹配</button><button id="cancel" hidden>取消匹配</button><button class="primary" id="enter" hidden>进入当前比赛</button><button id="logout">退出账号</button><p>匹配接受任意 Elo 的真人对手，不用 AI 填空。匹配成功后请在3分钟内完成入场和选阵容。掉线120秒后由 AI 接管，仍可重连；本局按最终胜负计分。</p></section>
<div class="grid"><section><h2>当前赛季排行榜</h2><table><thead><tr><th>玩家</th><th>Elo</th><th>场次</th></tr></thead><tbody id="leaderboard"></tbody></table></section><section><h2>我的近期比赛</h2><div id="history"><p>登录后查看战绩。</p></div></section></div></main></body></html>
