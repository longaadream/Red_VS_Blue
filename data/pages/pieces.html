<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>棋子图鉴 - RED vs BLUE</title>
  <script src="js/pack-fetch.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; padding: 7px 12px; font-size: 14px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .topbar h1 { font-size: 17px; font-weight: 700; }
    .topbar .count { font-size: 13px; color: #64748b; margin-left: auto; }

    /* Filters */
    .filters {
      display: flex; gap: 8px; padding: 12px 16px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      flex-shrink: 0; padding: 6px 14px;
      border-radius: 20px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8;
      font-size: 13px; cursor: pointer;
    }
    .filter-btn.active-all  { background: #334155; color: #e2e8f0; border-color: #475569; }
    .filter-btn.active-red  { background: rgba(239,68,68,.2); color: #ef4444; border-color: #ef4444; }
    .filter-btn.active-blue { background: rgba(59,130,246,.2); color: #60a5fa; border-color: #3b82f6; }

    /* Piece list */
    .piece-list { padding: 0 16px 24px; }

    .piece-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    .piece-card:active { border-color: #475569; }
    .piece-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
    }
    .piece-avatar {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      overflow: hidden;
    }
    .piece-avatar img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 10px;
    }
    .faction-red  { background: rgba(239,68,68,.15); }
    .faction-blue { background: rgba(59,130,246,.15); }
    .faction-neutral { background: rgba(100,116,139,.15); }

    .piece-info { flex: 1; }
    .piece-name { font-size: 15px; font-weight: 700; }
    .piece-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .faction-label-red  { color: #f87171; }
    .faction-label-blue { color: #60a5fa; }

    .expand-icon { color: #475569; font-size: 16px; transition: transform .2s; }
    .expanded .expand-icon { transform: rotate(90deg); }

    /* Stats row */
    .stats-row {
      display: flex; gap: 0;
      border-top: 1px solid #1e293b;
    }
    .stat-cell {
      flex: 1; padding: 8px 4px; text-align: center;
      border-right: 1px solid #1e293b;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: 16px; font-weight: 700; }
    .stat-lbl { font-size: 10px; color: #475569; margin-top: 1px; text-transform: uppercase; }

    /* Skills detail (expandable) */
    .skills-panel { display: none; border-top: 1px solid #1e293b; padding: 12px 14px; }
    .piece-card.expanded .skills-panel { display: block; }
    .skill-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
    }
    .skill-row:last-child { border-bottom: none; }
    .skill-icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
    .skill-name { font-size: 13px; font-weight: 600; }
    .skill-desc { font-size: 12px; color: #64748b; margin-top: 2px; }
    .skill-badge {
      display: inline-block; font-size: 10px; border-radius: 4px;
      padding: 1px 5px; margin-left: 4px;
    }
    .badge-super  { background: rgba(168,85,247,.2); color: #c084fc; }
    .badge-buff   { background: rgba(34,197,94,.2); color: #4ade80; }
    .badge-normal { background: rgba(100,116,139,.2); color: #94a3b8; }

    /* Description */
    .piece-desc { font-size: 12px; color: #64748b; padding: 0 14px 12px; }

    /* Keywords panel */
    .keywords-panel { display: none; border-top: 1px solid #1e293b; padding: 12px 14px; }
    .piece-card.expanded .keywords-panel { display: block; }
    .keyword-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid #1e293b;
    }
    .keyword-row:last-child { border-bottom: none; }
    .keyword-name { font-size: 13px; font-weight: 600; color: #a855f7; }
    .keyword-desc { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* Related cards */
    .related-cards-panel { display: none; border-top: 1px solid #1e293b; padding: 12px 14px; }
    .piece-card.expanded .related-cards-panel { display: block; }
    .related-card-row {
      background: #0f172a; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    .related-card-row:last-child { margin-bottom: 0; }
    .related-card-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .related-card-type { font-size: 10px; color: #475569; }
    .related-card-desc { font-size: 11px; color: #64748b; margin-top: 2px; }

    /* Loading / error */
    .status-msg {
      text-align: center; padding: 60px 20px;
      color: #475569; font-size: 14px;
    }
    .status-msg .big { font-size: 32px; margin-bottom: 12px; }
    .no-data-hint { font-size: 12px; color: #334155; margin-top: 8px; }

    /* RED-104: paper-doll workbench art direction.
       Layout, content structure and interaction rules intentionally remain unchanged. */
    :root {
      --workbench-ink: #362d24;
      --workbench-muted: #786957;
      --workbench-paper: #e8dcc4;
      --workbench-paper-deep: #d8c5a4;
      --workbench-paper-light: #f4ead6;
      --workbench-edge: #9f825d;
      --workbench-wood: #34261d;
      --workbench-mat: #263a34;
      --workbench-red: #b7493e;
      --workbench-blue: #416f8f;
      --workbench-green: #4d795c;
      --workbench-purple: #765584;
    }

    body {
      background-color: var(--workbench-mat);
      background-image:
        linear-gradient(rgba(222, 234, 219, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(222, 234, 219, .045) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(255, 229, 181, .09), transparent 27%),
        linear-gradient(135deg, #2e443d 0%, #21332e 100%);
      background-size: 24px 24px, 24px 24px, auto, auto;
      color: var(--workbench-ink);
    }

    .topbar {
      background-color: var(--workbench-wood);
      background-image:
        linear-gradient(90deg, rgba(255,255,255,.025), rgba(0,0,0,.08)),
        repeating-linear-gradient(4deg, transparent 0 18px, rgba(141, 100, 69, .14) 19px, transparent 20px 34px);
      border-bottom-color: #6f513b;
      box-shadow: 0 5px 14px rgba(20, 14, 10, .3);
    }
    .topbar h1 {
      color: #f3e4c7;
      letter-spacing: .08em;
      text-shadow: 0 1px 0 #170f0a;
    }
    .topbar .count { color: #bfa98b; }

    .back-btn {
      background: #4b382a;
      border-color: #806249;
      border-radius: 4px;
      color: #e6d4b8;
      box-shadow: inset 0 1px rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.2);
    }
    .back-btn:hover { background: #594331; color: #fff2dc; }

    .filters {
      background: rgba(27, 43, 38, .48);
      border-bottom: 1px dashed rgba(227, 212, 178, .18);
    }
    .filter-btn {
      border-radius: 5px;
      border-color: #9e8767;
      background: linear-gradient(180deg, #e6d7b9, #cdb78f);
      color: #574838;
      box-shadow: 0 2px 5px rgba(10, 18, 15, .28), inset 0 1px rgba(255,255,255,.55);
      font-weight: 600;
    }
    .filter-btn:hover { border-color: #c5ad83; color: #2f271f; }
    .filter-btn.active-all {
      background: linear-gradient(180deg, #f2e7d0, #d8c29a);
      color: #30271f;
      border-color: #dcc69e;
      box-shadow: 0 2px 5px rgba(10,18,15,.28), inset 0 -3px #665644;
    }
    .filter-btn.active-red {
      background: linear-gradient(180deg, #efd3ca, #d7aaa0);
      color: #7e302a;
      border-color: #b7493e;
      box-shadow: 0 2px 5px rgba(10,18,15,.28), inset 0 -3px var(--workbench-red);
    }
    .filter-btn.active-blue {
      background: linear-gradient(180deg, #d4e2e6, #afcad1);
      color: #264e68;
      border-color: #416f8f;
      box-shadow: 0 2px 5px rgba(10,18,15,.28), inset 0 -3px var(--workbench-blue);
    }

    .piece-card {
      position: relative;
      background-color: var(--workbench-paper);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.38) 0 1px, transparent 2px),
        radial-gradient(circle at 74% 62%, rgba(79,55,35,.09) 0 1px, transparent 2px),
        linear-gradient(100deg, rgba(255,255,255,.2), transparent 28%, rgba(99,73,46,.05));
      background-size: 19px 23px, 27px 21px, auto;
      border-color: var(--workbench-edge);
      border-radius: 5px;
      box-shadow: 0 5px 12px rgba(11, 20, 17, .28), inset 0 0 0 1px rgba(255,255,255,.25);
      color: var(--workbench-ink);
    }
    .piece-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 42px;
      height: 6px;
      transform: translateX(-50%);
      background: rgba(199, 178, 135, .72);
      border-left: 1px solid rgba(105, 81, 49, .2);
      border-right: 1px solid rgba(105, 81, 49, .2);
      box-shadow: 0 1px 2px rgba(76, 53, 28, .18);
      pointer-events: none;
    }
    .piece-card:has(.faction-red) {
      box-shadow: 0 5px 12px rgba(11,20,17,.28), inset 4px 0 rgba(183,73,62,.7), inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .piece-card:has(.faction-blue) {
      box-shadow: 0 5px 12px rgba(11,20,17,.28), inset 4px 0 rgba(65,111,143,.72), inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .piece-card:hover { border-color: #c3a577; }
    .piece-card:active { border-color: #765d40; }
    .piece-card.expanded {
      background-color: var(--workbench-paper-light);
      box-shadow: 0 7px 18px rgba(11,20,17,.36), inset 0 0 0 1px rgba(255,255,255,.35);
    }

    .piece-avatar {
      border-radius: 3px;
      border: 2px solid #f5ead3;
      outline: 1px solid #927553;
      box-shadow: 2px 3px 0 rgba(96, 71, 44, .2);
      transform: rotate(-1.5deg);
    }
    .piece-avatar img {
      border-radius: 1px;
      filter: saturate(.82) contrast(.96) sepia(.08);
    }
    .faction-red  { background: #d7aaa0; }
    .faction-blue { background: #afcad1; }
    .faction-neutral { background: #c8b99c; }

    .piece-name { color: #2e261f; text-shadow: 0 1px rgba(255,255,255,.5); }
    .piece-meta, .piece-desc { color: var(--workbench-muted); }
    .faction-label-red { color: #a33d35; }
    .faction-label-blue { color: #356683; }
    .expand-icon { color: #806d56; }

    .stats-row,
    .skills-panel,
    .keywords-panel,
    .related-cards-panel { border-top-color: #bda783; }
    .stats-row {
      background: rgba(124, 95, 58, .07);
      border-top-style: dashed;
    }
    .stat-cell { border-right-color: #c7b593; }
    .stat-lbl { color: #8b765d; letter-spacing: .08em; }
    .stat-cell:nth-child(1) .stat-val { color: var(--workbench-red) !important; }
    .stat-cell:nth-child(2) .stat-val { color: #a96736 !important; }
    .stat-cell:nth-child(3) .stat-val { color: var(--workbench-green) !important; }
    .stat-cell:nth-child(4) .stat-val { color: var(--workbench-blue) !important; }
    .stat-cell:nth-child(5) .stat-val { color: var(--workbench-purple) !important; }

    .skills-panel,
    .keywords-panel,
    .related-cards-panel {
      background-color: rgba(255, 248, 230, .35);
      background-image: repeating-linear-gradient(0deg, transparent 0 25px, rgba(91, 119, 135, .08) 26px);
    }
    .skill-row, .keyword-row {
      border-bottom-color: #cfbd9d;
      border-bottom-style: dashed;
    }
    .skill-name { color: #3d3329; }
    .skill-desc, .keyword-desc, .related-card-desc { color: #756653; }
    .keyword-name { color: var(--workbench-purple); }
    .skill-badge { border: 1px solid currentColor; border-radius: 3px; }
    .badge-super { background: #dfcfdf; color: #6e4d78; }
    .badge-buff { background: #cfe0cd; color: #456c4c; }
    .badge-normal { background: #ddd3c1; color: #6f6251; }

    .related-card-row {
      background: #f6eddc;
      border: 1px solid #c8b28e;
      border-radius: 3px;
      box-shadow: 1px 2px 0 rgba(102, 76, 45, .13);
    }
    .related-card-name { color: #3d3329; }
    .related-card-type { color: #8a745a; }

    .status-msg { color: #d7c5a5; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .no-data-hint { color: #a99575; }

    @media (prefers-reduced-motion: reduce) {
      .expand-icon { transition: none; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <a class="back-btn" href="index.html">← 返回</a>
    <h1>棋子图鉴</h1>
    <span class="count" id="countLabel"></span>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active-all" id="btnAll"  onclick="setFilter('all')">全部</button>
    <button class="filter-btn"           id="btnRed"  onclick="setFilter('red')">红方</button>
    <button class="filter-btn"           id="btnBlue" onclick="setFilter('blue')">蓝方</button>
  </div>

  <!-- Piece list -->
  <div class="piece-list" id="pieceList">
    <div class="status-msg">
      <div class="big">⏳</div>
      <div>正在加载棋子数据…</div>
    </div>
  </div>

  <script>
    let allPieces = []
    let skillsCache = {}
    let currentFilter = 'all'

    // ── Fetch helpers ──────────────────────────────────────────
    async function fetchJson(path) {
      if (window.fetchPackJson && /^\.?\/?data\//.test(path)) {
        return window.fetchPackJson(path)
      }
      const res = await fetch(path)
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      return res.json()
    }

    async function loadPieces() {
      try {
        // Load from local data/ (offline-first, no server fallback)
        const ids = await fetchJson('./data/pieces/manifest.json')

        // Load each piece JSON
        const pieces = []
        for (const id of ids) {
          try {
            const p = await fetchJson(`./data/pieces/${id}.json`)
            pieces.push(p)
          } catch { /* skip broken files */ }
        }
        allPieces = pieces
      } catch (e) {
        allPieces = []
        document.getElementById('pieceList').innerHTML = `
          <div class="status-msg">
            <div class="big">📭</div>
            <div>未找到棋子数据</div>
            <div class="no-data-hint">请先运行 npm run build:android 生成本地数据</div>
          </div>`
        return
      }
    }

    async function loadSkill(skillId) {
      if (skillsCache[skillId]) return skillsCache[skillId]
      try {
        const s = await fetchJson(`./data/skills/${skillId}.json`)
        skillsCache[skillId] = s
        return s
      } catch { return null }
    }

    // ── Keywords ───────────────────────────────────────────────
    let keywordsCache = null

    async function loadKeywords() {
      if (keywordsCache) return keywordsCache
      try {
        keywordsCache = await fetchJson('./data/skill-keywords.json')
        return keywordsCache
      } catch { return [] }
    }

    // ── Related cards ─────────────────────────────────────────
    let cardsCache = {}

    async function loadCard(cardId) {
      if (cardsCache[cardId]) return cardsCache[cardId]
      try {
        const c = await fetchJson(`./data/cards/${cardId}.json`)
        cardsCache[cardId] = c
        return c
      } catch { return null }
    }

    // ── Render ────────────────────────────────────────────────
    function setFilter(f) {
      currentFilter = f
      document.getElementById('btnAll').className  = 'filter-btn' + (f === 'all'  ? ' active-all'  : '')
      document.getElementById('btnRed').className  = 'filter-btn' + (f === 'red'  ? ' active-red'  : '')
      document.getElementById('btnBlue').className = 'filter-btn' + (f === 'blue' ? ' active-blue' : '')
      renderList()
    }

    function renderList() {
      const filtered = currentFilter === 'all'
        ? allPieces
        : allPieces.filter(p => p.faction === currentFilter)

      document.getElementById('countLabel').textContent = `${filtered.length} 个棋子`

      if (!filtered.length) {
        document.getElementById('pieceList').innerHTML =
          `<div class="status-msg"><div class="big">🔍</div><div>没有符合条件的棋子</div></div>`
        return
      }

      document.getElementById('pieceList').innerHTML = filtered.map(p => renderCard(p)).join('')
    }

    function factionClass(f) {
      if (f === 'red')  return 'faction-red'
      if (f === 'blue') return 'faction-blue'
      return 'faction-neutral'
    }
    function factionLabel(f) {
      if (f === 'red')  return '<span class="faction-label-red">红方</span>'
      if (f === 'blue') return '<span class="faction-label-blue">蓝方</span>'
      return '<span style="color:#94a3b8">中立</span>'
    }
    function pieceAvatarHtml(p) {
      // 有图片文件（.jpg/.png/.svg）时显示真实头像
      if (p.image && p.image.includes('.')) {
        const fallback = p.faction === 'red' ? '🔴' : p.faction === 'blue' ? '🔵' : '⚪'
        return `<img src="images/${p.image}" alt="${p.name || p.id}" onerror="this.parentElement.textContent='${fallback}'">`
      }
      // emoji 直接显示
      if (p.image) return p.image
      if (p.faction === 'red')  return '🔴'
      if (p.faction === 'blue') return '🔵'
      return '⚪'
    }

    function renderCard(p) {
      const stats = p.stats || {}
      const skills = (p.skills || []).map(s => {
        const sid = typeof s === 'string' ? s : (s.skillId || s.id || '')
        return `<div class="skill-row">
          <div class="skill-icon">⚡</div>
          <div>
            <div class="skill-name">${sid}</div>
            <div class="skill-desc" id="sdesc-${p.id}-${sid}">加载中…</div>
          </div>
        </div>`
      }).join('')

      const transformedSkillsHtml = (p.transformedSkills || []).map(ts => {
        const sid = ts.skillId || ts.id || ''
        return `<div class="skill-row">
          <div class="skill-icon">🔓</div>
          <div>
            <div class="skill-name">${sid} <span class="skill-badge badge-super">可解锁</span></div>
            <div class="skill-desc" id="tsdesc-${p.id}-${sid}">加载中…</div>
            <div style="font-size:10px;color:#475569;margin-top:2px" id="tstrigg-${p.id}-${sid}"></div>
          </div>
        </div>`
      }).join('')

      return `<div class="piece-card" id="card-${p.id}" onclick="toggleCard('${p.id}', ${JSON.stringify(p.skills || []).replace(/"/g, '&quot;')}, ${JSON.stringify(p.transformedSkills || []).replace(/"/g, '&quot;')}, ${JSON.stringify(p.relatedCards || []).replace(/"/g, '&quot;')})">
        <div class="piece-header">
          <div class="piece-avatar ${factionClass(p.faction)}">${pieceAvatarHtml(p)}</div>
          <div class="piece-info">
            <div class="piece-name">${p.name || p.id}</div>
            <div class="piece-meta">${factionLabel(p.faction)} · ${rarityLabel(p.rarity)}</div>
          </div>
          <span class="expand-icon">›</span>
        </div>
        ${p.description ? `<div class="piece-desc">${p.description}</div>` : ''}
        <div class="stats-row">
          <div class="stat-cell"><div class="stat-val" style="color:#ef4444">${stats.maxHp ?? '—'}</div><div class="stat-lbl">HP</div></div>
          <div class="stat-cell"><div class="stat-val" style="color:#f97316">${stats.attack ?? '—'}</div><div class="stat-lbl">攻击</div></div>
          <div class="stat-cell"><div class="stat-val" style="color:#22c55e">${stats.defense ?? '—'}</div><div class="stat-lbl">防御</div></div>
          <div class="stat-cell"><div class="stat-val" style="color:#3b82f6">${stats.moveRange ?? '—'}</div><div class="stat-lbl">移动</div></div>
          ${stats.attackRange ? `<div class="stat-cell"><div class="stat-val" style="color:#a855f7">${stats.attackRange}</div><div class="stat-lbl">射程</div></div>` : ''}
        </div>
        <div class="skills-panel">
          <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">技能</div>
          ${skills || '<div style="font-size:13px;color:#475569">无技能</div>'}
          ${transformedSkillsHtml ? `
          <div style="font-size:12px;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">可解锁技能</div>
          ${transformedSkillsHtml}` : ''}
        </div>
        ${p.relatedCards && p.relatedCards.length > 0 ? `
        <div class="related-cards-panel" id="rcpanel-${p.id}">
          <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">相关手牌</div>
          <div id="rccontent-${p.id}">加载中…</div>
        </div>` : ''}
        <div class="keywords-panel" id="kwpanel-${p.id}">
          <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">关键词</div>
          <div id="kwcontent-${p.id}">加载中…</div>
        </div>
      </div>`
    }

    function rarityLabel(r) {
      const map = { common: '普通', uncommon: '精良', rare: '稀有', epic: '史诗', legendary: '传说' }
      return map[r] || r || ''
    }

    async function fillSkillDesc(pieceId, sid, descIdPrefix, skillData, triggerBy) {
      const descEl = document.getElementById(`${descIdPrefix}-${pieceId}-${sid}`)
      if (!descEl || descEl.textContent !== '加载中…') return
      if (skillData) {
        const badgeClass = skillData.type === 'super' ? 'badge-super' : skillData.type === 'buff' ? 'badge-buff' : 'badge-normal'
        const badgeText  = skillData.type === 'super' ? '充能' : skillData.type === 'buff' ? '增益' : '普通'
        const nameEl = descEl.previousElementSibling
        if (nameEl) {
          const lockedBadge = descIdPrefix === 'tsdesc' ? ' <span class="skill-badge badge-super">可解锁</span>' : ''
          nameEl.innerHTML = `${skillData.name || sid} <span class="skill-badge ${badgeClass}">${badgeText}</span>${lockedBadge}`
        }
        descEl.textContent = skillData.description || ''
        const chips = []
        if (skillData.actionPointCost) chips.push(`⚡${skillData.actionPointCost} 行动点`)
        if (skillData.cooldownTurns)   chips.push(`⏱${skillData.cooldownTurns} 回合冷却`)
        if (skillData.chargeCost)      chips.push(`🔋${skillData.chargeCost}/${skillData.maxCharges || skillData.chargeCost} 充能`)
        if (chips.length) {
          const chipEl = document.createElement('div')
          chipEl.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-top:4px'
          chipEl.innerHTML = chips.map(c => `<span style="font-size:10px;background:#0f172a;border:1px solid #334155;border-radius:4px;padding:1px 6px;color:#94a3b8">${c}</span>`).join('')
          descEl.after(chipEl)
        }
        if (triggerBy) {
          const triggEl = document.getElementById(`tstrigg-${pieceId}-${sid}`)
          if (triggEl) {
            // Look up the trigger skill name
            const trigSkill = await loadSkill(triggerBy)
            triggEl.textContent = `激活「${trigSkill ? trigSkill.name : triggerBy}」后解锁`
          }
        }
      } else {
        descEl.textContent = ''
      }
    }

    async function toggleCard(pieceId, skillsRaw, transformedRaw, relatedCards) {
      const card = document.getElementById('card-' + pieceId)
      if (!card) return
      card.classList.toggle('expanded')
      if (card.classList.contains('expanded')) {
        const skills = typeof skillsRaw === 'string' ? JSON.parse(skillsRaw.replace(/&quot;/g, '"')) : skillsRaw
        for (const s of skills) {
          const sid = typeof s === 'string' ? s : (s.skillId || s.id || '')
          const skillData = await loadSkill(sid)
          await fillSkillDesc(pieceId, sid, 'sdesc', skillData, null)
        }
        const transformed = typeof transformedRaw === 'string' ? JSON.parse(transformedRaw.replace(/&quot;/g, '"')) : (transformedRaw || [])
        for (const ts of transformed) {
          const sid = ts.skillId || ts.id || ''
          const skillData = await loadSkill(sid)
          await fillSkillDesc(pieceId, sid, 'tsdesc', skillData, ts.triggeredBy || null)
        }

        // Load related cards
        const rcContent = document.getElementById('rccontent-' + pieceId)
        if (rcContent && relatedCards && relatedCards.length > 0) {
          const cardHtmls = []
          for (const cardId of relatedCards) {
            const cardData = await loadCard(cardId)
            if (cardData) {
              cardHtmls.push(`<div class="related-card-row">
                <div class="related-card-name">${cardData.icon || '🎴'} ${cardData.name || cardId} <span style="color:#a855f7;font-size:11px">AP:${cardData.actionPointCost ?? 0}</span></div>
                <div class="related-card-type">${cardData.type === 'active' ? '主动' : '反应'}</div>
                <div class="related-card-desc">${cardData.description || ''}</div>
              </div>`)
            }
          }
          rcContent.innerHTML = cardHtmls.join('')
        } else if (rcContent) {
          rcContent.innerHTML = '<div style="font-size:12px;color:#475569">无相关手牌</div>'
        }

        // Load keywords from skills
        const kwContent = document.getElementById('kwcontent-' + pieceId)
        if (kwContent) {
          const allKeywords = []
          const allSkills = [...(skills || []), ...(transformed || [])]
          for (const s of allSkills) {
            const sid = typeof s === 'string' ? s : (s.skillId || s.id || '')
            const skillData = await loadSkill(sid)
            if (skillData && skillData.keywords && skillData.keywords.length > 0) {
              allKeywords.push(...skillData.keywords)
            }
          }
          if (allKeywords.length > 0) {
            const keywordsData = await loadKeywords()
            const keywordMap = {}
            if (Array.isArray(keywordsData)) {
              keywordsData.forEach(kw => { keywordMap[kw.name] = kw })
            }
            const kwHtmls = []
            const seen = new Set()
            for (const kwName of allKeywords) {
              if (seen.has(kwName)) continue
              seen.add(kwName)
              const kw = keywordMap[kwName]
              kwHtmls.push(`<div class="keyword-row">
                <div class="keyword-name">${kwName}</div>
                <div class="keyword-desc">${kw ? (kw.shortDescription || kw.longDescription || '') : ''}</div>
              </div>`)
            }
            kwContent.innerHTML = kwHtmls.join('')
          } else {
            kwContent.innerHTML = '<div style="font-size:12px;color:#475569">无关键词</div>'
          }
        }
      }
    }

    // ── Boot ─────────────────────────────────────────────────
    loadPieces().then(() => {
      renderList()
    })
  </script>
</body>
</html>
