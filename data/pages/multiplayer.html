<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>房间大厅 · RED vs BLUE</title><link rel="stylesheet" href="css/tabletop/tabletop.css"><link rel="stylesheet" href="css/tabletop/online.css"></head>
<body data-art-page="multiplayer"><div class="game-shell"><header class="game-header"><a class="game-brand" href="index.html"><span>RED</span><small>vs</small><span>BLUE</span></a><span class="header-divider"></span><h1>联机大厅</h1><span class="header-end">朋友对战 · 合作冒险</span><a class="back-link" href="index.html">主菜单</a></header>
<nav class="game-nav" aria-label="联机导航"><a class="selected" href="multiplayer.html"><img src="images/tabletop/ui-map.svg" alt="">房间大厅</a><a href="official.html"><img src="images/tabletop/ui-confirm.svg" alt="">官方排位</a><div class="nav-note">与朋友联机<br>自建 / 加入<small>选择服务器，与朋友同桌</small></div></nav>
<main class="game-main"><div class="view-heading"><div><p class="kicker">ROOM LOBBY</p><h2>房间大厅</h2></div><div class="toolbar"><button class="button primary" onclick="document.getElementById('hostDialog').showModal()">创建房间</button></div></div>
<div class="browser-layout"><section class="room-browser server-list"><div class="server-settings-row"><label for="serverKind">服务器</label><select id="serverKind"><option value="official">官方服务器</option><option value="custom">加入非官方服务器</option></select><input id="relayUrl" type="url" aria-label="非官方服务器地址" hidden placeholder="组织者提供的服务器地址" autocomplete="url"><button class="button" id="refresh">连接 / 刷新</button></div><details id="customSettings" hidden><summary>非官方服务器设置</summary><label for="publishKey">开房密钥（服务器要求时填写）</label><input id="publishKey" type="password" autocomplete="off"></details><div class="browser-filters"><select id="publicModeFilter" aria-label="模式筛选"><option value="all">全部模式</option><option value="1v1">1v1</option><option value="2v2">2v2</option><option value="pve">PVE</option></select></div><div class="room-columns" style="display:flex;justify-content:space-between"><span>公开房间</span><span>PVP / 2v2 / PVE</span></div><div id="hosts" class="room-scroll" aria-live="polite"><div class="browser-empty">连接服务器，浏览朋友的房间。<br>也可以使用朋友的邀请码加入。</div></div></section>
<aside class="room-preview"><div class="preview-label">加入朋友</div><h3 style="margin-top:20px">有邀请码？</h3><p>输入朋友分享的8位主机邀请码。</p><label for="inviteMode">玩法</label><select id="inviteMode"><option value="pvp">PVP · 对战</option><option value="pve">PVE · 冒险</option></select><label for="invite" class="preview-label">主机邀请码</label><input id="invite" maxlength="8" placeholder="A12BCD34" autocomplete="off"><button id="joinInvite" class="button primary">连接主机</button><div class="preview-note">使用同一版本客户端与朋友联机。</div></aside></div>
<section id="publicationControls" hidden><p id="publication" role="status"></p><span id="share"></span><button id="copy" class="button">复制邀请信息</button><button id="stop" class="button">关闭房间共享</button></section><div id="error" class="connection-error" role="alert"></div><div class="server-guide">房主在线时，朋友可以加入。<button class="button" onclick="document.getElementById('diagnosticDialog').showModal()">连接诊断</button></div>
</main><footer class="game-footer"><span>休闲对战 · 不计排位分</span><a href="index.html">返回主页</a></footer></div>
<dialog class="game-dialog" id="hostDialog"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button></form><h2>创建房间</h2><p>选择玩法，邀请朋友一起玩。</p><label for="gameMode">玩法</label><select id="gameMode"><option value="pvp">PVP · 1v1 / 2v2</option><option value="pve">PVE · 合作冒险</option></select><label for="hostName">房间标识</label><input id="hostName" maxlength="60" placeholder="我的游戏房间"><label><input id="visible" type="checkbox" checked> 在公开列表显示</label><button id="publish" class="button primary">创建房间</button><p class="modalError" role="alert"></p></dialog>

<dialog class="game-dialog" id="diagnosticDialog"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button></form><h2>连接诊断</h2><p>检查当前地址并生成可发给组织者的诊断信息，不包含私钥、发布密钥和游戏存档。</p><button id="diagnose" class="button">检查连接</button><button id="copyDiagnosis" class="button" hidden>复制诊断信息</button><pre id="diagnosis" aria-live="polite"></pre><p class="modalError" role="alert"></p></dialog>
<script src="js/pack-fetch.js"></script><script src="js/server-utils.js"></script>
<script src="js/colyseus-sdk.js"></script><script src="js/colyseus-client.js"></script>
<script src="js/crypto-lib.js"></script><script src="js/identity.js"></script>
<script src="js/multiplayer.js"></script>
</body></html>
