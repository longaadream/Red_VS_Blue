<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>联机大厅 - RED vs BLUE</title>
  <script src="js/pack-fetch.js"></script>
  <script src="js/server-utils.js"></script>
  <script src="js/colyseus-sdk.js"></script>
  <script src="js/colyseus-client.js"></script>
  <script src="js/crypto-lib.js"></script>
  <script src="js/identity.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh;
      padding: 0 0 calc(60px + env(safe-area-inset-bottom));
    }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: #0f172a; border-bottom: 1px solid #1e293b;
      position: sticky; top: 0; z-index: 20;
    }
    .back-btn {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; padding: 6px 11px; font-size: 14px; cursor: pointer;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:active { opacity: .7; }
    .topbar-title { font-size: 16px; font-weight: 700; flex: 1; }
    .user-pill {
      background: #1e293b; border: 1px solid #334155; border-radius: 20px;
      padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 5px;
      flex-shrink: 0;
    }
    .user-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    /* ── Section ── */
    .section { padding: 16px 14px 8px; }
    .section-label {
      font-size: 11px; font-weight: 700; color: #475569;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
    }

    /* ── Server badge ── */
    .server-badge {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .server-badge-url { font-size: 12px; color: #64748b; word-break: break-all; flex: 1; }
    .server-badge-url span { color: #94a3b8; }
    .btn-disconnect {
      background: transparent; border: 1px solid #475569; color: #94a3b8;
      border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; margin-left: 8px;
    }
    .btn-disconnect:active { opacity: .7; }

    /* ── Actions row ── */
    .actions-row {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .btn-refresh {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      color: #94a3b8; padding: 10px 14px; font-size: 13px; cursor: pointer; flex-shrink: 0;
    }
    .btn-refresh:active { background: #263348; }
    .btn-create {
      flex: 1; padding: 10px 14px;
      background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-create:active { opacity: .85; }

    /* ── Invite code row ── */
    .invite-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .invite-input {
      flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      color: #e2e8f0; font-size: 13px; padding: 10px 14px; outline: none;
    }
    .invite-input::placeholder { color: #475569; }
    .invite-input:focus { border-color: #3b82f6; }
    .btn-invite-join {
      background: #0f766e; color: #fff; border: none;
      border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .btn-invite-join:active { opacity: .85; }

    /* ── Create room overlay ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: flex-end; z-index: 100;
    }
    .sheet {
      background: #0f172a; border-top: 1px solid #334155;
      border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      width: 100%; max-height: 80vh; overflow-y: auto;
    }
    .sheet-title {
      font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 18px;
    }
    .field-label {
      font-size: 12px; color: #64748b; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 6px; margin-top: 14px;
    }
    .field-label:first-of-type { margin-top: 0; }
    .sheet select {
      width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      color: #e2e8f0; font-size: 14px; padding: 10px 12px; outline: none;
    }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 12px 14px;
    }
    .toggle-row span { font-size: 14px; color: #94a3b8; }
    .toggle-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #3b82f6; }
    .btn-primary {
      width: 100%; padding: 14px; background: #3b82f6; color: #fff;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 20px;
    }
    .btn-primary:active { opacity: .85; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-cancel {
      width: 100%; padding: 12px; background: transparent; color: #64748b;
      border: 1px solid #334155; border-radius: 12px; font-size: 14px;
      cursor: pointer; margin-top: 8px;
    }
    .btn-cancel:active { opacity: .7; }
    .err-msg {
      background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px;
      color: #fca5a5; font-size: 13px; padding: 10px 14px; margin-top: 10px;
      display: none;
    }

    /* ── Faction picker ── */
    .faction-row {
      display: flex; gap: 12px; margin-top: 8px;
    }
    .btn-faction {
      flex: 1; padding: 16px 8px; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; border: 2px solid transparent; transition: all .15s;
    }
    .btn-faction.red {
      background: #2d0a0a; border-color: #7f1d1d; color: #fca5a5;
    }
    .btn-faction.red:active, .btn-faction.red.selected {
      background: #7f1d1d; border-color: #ef4444; color: #fff;
    }
    .btn-faction.blue {
      background: #0a1830; border-color: #1e3a8a; color: #93c5fd;
    }
    .btn-faction.blue:active, .btn-faction.blue.selected {
      background: #1e3a8a; border-color: #3b82f6; color: #fff;
    }

    /* ── Room cards ── */
    .room-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .room-info { flex: 1; }
    .room-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .room-meta { font-size: 12px; color: #64748b; }
    .btn-join {
      background: #3b82f6; color: #fff; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
    }
    .btn-join:active { opacity: .85; }
    .btn-spectate {
      background: #7c3aed; color: #fff; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; flex-shrink: 0; margin-right: 6px;
    }
    .btn-spectate:active { opacity: .85; }
    .btn-delete {
      background: #dc2626; color: #fff; border: none;
      border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700;
      cursor: pointer; flex-shrink: 0; margin-right: 6px;
    }
    .btn-delete:active { opacity: .85; }

    .empty-state {
      text-align: center; padding: 40px 20px;
      color: #475569; font-size: 14px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    .spinner-sm {
      width: 20px; height: 20px;
      border: 3px solid #1e293b; border-top-color: #3b82f6;
      border-radius: 50%; display: inline-block;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #64748b; padding: 0 14px 10px;
    }

    /* ── Float bar ── */
    #floatBar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0f172a; border-top: 1px solid #1e293b;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; z-index: 50;
    }

    /* ── Windows hover enhancements ── */
    @media (hover: hover) {
      .room-card:hover { background: #263348; border-color: #475569; }
      .btn-join:hover { opacity: .9; }
      .btn-create:hover { opacity: .9; }
      .btn-refresh:hover { background: #263348; }
      .back-btn:hover { background: #263348; }
      .btn-invite-join:hover { opacity: .9; }
      .btn-cancel:hover { background: #1e293b; }
    }
  </style>
  <link rel="stylesheet" href="css/tabletop/tabletop.css" />
<link rel="stylesheet" href="css/tabletop/online.css">
</head>
<body data-art-page="lobby">

  <div class="game-shell">
    <header class="game-header"><a class="game-brand" href="index.html"><span>RED</span><small>vs</small><span>BLUE</span></a><span class="header-divider"></span><h1>联机大厅</h1><div class="header-end user-pill"><span class="user-dot" id="userDot"></span><span id="userName">本地玩家</span></div><a class="back-link" href="index.html">返回主菜单</a></header>
    <nav class="game-nav" aria-label="联机导航"><a class="selected" href="lobby.html"><img src="images/tabletop/ui-map.svg" alt="">房间大厅</a><a href="official.html"><img src="images/tabletop/ui-confirm.svg" alt="">官方排位</a><a href="multiplayer.html"><img src="images/tabletop/ui-tools.svg" alt="">服务器</a><div class="nav-note">自由对战<br>1v1 / 2v2<br><small>P2P 与转发房间不计分</small></div></nav>
    <main class="game-main">
      <div class="view-heading"><div><p class="kicker">CUSTOM GAMES</p><h2>房间大厅</h2></div><div class="toolbar"><button class="button" onclick="document.getElementById('inviteDialog').showModal()">邀请码加入</button><button class="button primary" id="openCreateRoom" onclick="openCreateSheet()">创建房间</button></div></div>
      <div class="browser-layout"><section class="room-browser">
        <div class="browser-filters"><input id="roomSearch" type="search" aria-label="搜索房间" placeholder="搜索房间或地图" oninput="filterLobbyRooms()"><select id="modeFilter" aria-label="模式筛选" onchange="filterLobbyRooms()"><option value="all">全部模式</option><option value="1v1">1v1</option><option value="2v2">2v2</option></select><select id="stateFilter" aria-label="状态筛选" onchange="filterLobbyRooms()"><option value="all">全部状态</option><option value="waiting">可加入</option><option value="watch">可观战</option></select><button class="button" onclick="loadRooms()" id="refreshBtn">刷新</button></div>
        <div class="room-columns"><span>房间 / 地图</span><span>模式</span><span>人数</span><span>状态</span><span></span></div>
        <div id="roomList" class="room-scroll"><div class="browser-empty">正在连接并读取房间…</div></div>
        <div class="browser-caption"><span id="roomCount">当前服务器</span><span id="statusBar" role="status"></span></div>
      </section><aside class="room-preview"><div class="preview-label">房间详情</div><img class="preview-emblem" src="images/tabletop/desk-emblem.svg" alt=""><h3 id="selectedRoomName">选择一个房间</h3><p id="selectedRoomInfo">在列表中选择房间，查看模式、地图和席位。</p><div id="selectedRoomActions"></div><div class="preview-note">想和朋友单独开一局？<br>创建私密房间后分享邀请码。</div></aside></div>
      <div id="rejoinBar" class="rejoin-strip" style="display:none"><span>你有一场进行中的对局</span><button class="button primary" id="rejoinBtn" onclick="rejoinBattle()">重新加入</button><button class="button" onclick="dismissRejoin()">忽略</button></div><div id="rejoinFeedback" role="status" style="display:none"></div>
    </main>
    <footer class="game-footer"><div class="connection-indicator"><span id="floatStatus">连接中</span><span class="server-address" id="serverUrlDisplay">未连接</span></div><a href="multiplayer.html">更换服务器 / 连接设置</a></footer>
  </div>

  <!-- Create room overlay -->
  <div id="createSheet" class="overlay" style="display:none" onclick="if(event.target===this)closeCreateSheet()">
    <div class="sheet">
      <div class="sheet-title">创建房间</div>
      <div class="field-label">地图</div>
      <select id="mapSelect" disabled><option value="">正在加载地图…</option></select>
      <label class="field-label" for="matchMode">对局模式</label>
      <select id="matchMode" onchange="mapsLoaded=false;loadMaps()"><option value="1v1">1v1 · 双人对战</option><option value="2v2">2v2 · 蓝1 → 红1 → 红2 → 蓝2</option></select>
      <div class="field-label">可见性</div>
      <div class="toggle-row">
        <span>公开房间（所有人可见）</span>
        <input type="checkbox" id="visibilityToggle" checked>
      </div>
      <div id="createErr" class="err-msg"></div>
      <button class="btn-primary" id="createRoomBtn" onclick="doCreateRoom()" disabled>创建并加入</button>
      <button class="btn-cancel" onclick="closeCreateSheet()">取消</button>
    </div>
  </div>

  <script>
    // RvBUtils loaded from js/server-utils.js
    // RvBIdentity loaded from js/identity.js

    let pollTimer = null

    function goBack() { window.location.href = 'index.html' }

    async function detectLocalServerUrl() {
      if (window.RvBBridge) return 'http://localhost:7878'
      if ((window.RvBHost || window.electronAPI) && (window.RvBHost || window.electronAPI).getMode) {
        try {
          const mode = await (window.RvBHost || window.electronAPI).getMode()
          if (mode && mode.localUrl) return mode.localUrl
        } catch {}
      }
      return ''
    }

    function parseBridgeJson(raw) {
      try { return JSON.parse(raw || '{}') } catch { return {} }
    }

    async function detectRunningLocalServerUrl() {
      if (window.RvBBridge && typeof window.RvBBridge.getMobileServerStatus === 'function') {
        const status = parseBridgeJson(window.RvBBridge.getMobileServerStatus())
        if (status && status.running) return 'http://localhost:7878'
      }
      if ((window.RvBHost || window.electronAPI) && (window.RvBHost || window.electronAPI).getMode) {
        try {
          const mode = await (window.RvBHost || window.electronAPI).getMode()
          if (mode && mode.ready && mode.localUrl) return mode.localUrl
        } catch {}
      }
      return ''
    }

    async function applyLobbyServerMode() {
      const params = new URLSearchParams(window.location.search)
      const mode = params.get('server')
      const url = params.get('serverUrl') || params.get('url')
      if (url) {
        RvBUtils.saveServerConfig({ mode: mode || RvBUtils.getServerModeForUrl(url), url })
        return
      }
      if (mode === 'local') {
        const localUrl = await detectLocalServerUrl()
        if (localUrl) RvBUtils.saveServerConfig({ mode: 'local', url: localUrl })
      } else if (mode === 'lan' || mode === 'remote') {
        localStorage.setItem('rvb_lobby_server_mode', mode)
      }
    }

    async function reconcileLobbyServerMode() {
      const params = new URLSearchParams(window.location.search)
      const hasExplicitServerUrl = !!(params.get('serverUrl') || params.get('url'))
      await applyLobbyServerMode()
      const savedMode = localStorage.getItem('rvb_lobby_server_mode') || ''
      const runningLocalUrl = await detectRunningLocalServerUrl()
      if (!hasExplicitServerUrl && runningLocalUrl && (savedMode === 'local' || !savedMode)) {
        RvBUtils.saveServerConfig({ mode: 'local', url: runningLocalUrl })
      }
      const el = document.getElementById('serverUrlDisplay')
      if (el) el.textContent = RvBUtils.getServerUrl() || '未连接'
      updateFloatBar()
    }

    function getLobbyServerMode() {
      const saved = RvBUtils.getServerUrl()
      if (/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\b/.test(saved)) return 'local'
      return localStorage.getItem('rvb_lobby_server_mode') || 'remote'
    }

    function refreshUserUI() {
      const identity = RvBIdentity.getIdentity()
      const tag = identity.id ? (' #' + identity.id.slice(0, 6).toUpperCase()) : ''
      document.getElementById('userName').textContent = (identity.displayName || '玩家') + tag
      document.getElementById('userDot').style.background = '#22c55e'
    }

    let lobbyColyseusReady = false
    let lobbyWsConnecting = null
    async function ensureLobbyWs() {
      if (lobbyColyseusReady && window.RvBColyseus && RvBColyseus.isConnected()) return
      if (lobbyWsConnecting) return lobbyWsConnecting
      lobbyWsConnecting = new Promise((resolve, reject) => {
        if (typeof RvBColyseus === 'undefined') {
          reject(new Error('Colyseus 客户端未加载'))
          return
        }
        const identity = RvBIdentity.getIdentity()
        const timer = setTimeout(() => reject(new Error('Colyseus 连接超时')), 5000)
        RvBColyseus.on('connect', function() {
          lobbyColyseusReady = true
          clearTimeout(timer)
          resolve()
        })
        RvBColyseus.on('disconnect', function() { lobbyColyseusReady = false })
        RvBColyseus.on('message', function(msg) {
          if (msg.type === 'lobbyUpdate' && Array.isArray(msg.rooms)) renderRooms(msg.rooms)
        })
        RvBColyseus.connect('__lobby', identity.id || 'lobby-' + Date.now())
      }).finally(() => { lobbyWsConnecting = null })
      return lobbyWsConnecting
    }

    async function colyseusRequest(method, data, timeoutMs) {
      await ensureLobbyWs()
      return RvBColyseus.request(method, data || {}, timeoutMs || 6000)
    }

    async function lobbyRequest(method, data, timeoutMs) {
      return colyseusRequest(method, data, timeoutMs)
    }
    const GAME_PROFILE_IDENTITY_SCHEMA = 'rvb-game-profile-identity/v1'
    const BATTLE_RUNNER_REVISION = 'rvb-battle-runner/v1'
    const SHA256_HEX = /^[a-f0-9]{64}$/
    const GAME_PROFILE_KEYS = [
      'schemaVersion',
      'engineAbi',
      'runnerRevision',
      'resolvedProfileHash',
      'authorityContentHash',
    ]

    function isGameProfileIdentity(value) {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return false
      const keys = Object.keys(value).sort()
      const expectedKeys = GAME_PROFILE_KEYS.slice().sort()
      return keys.length === expectedKeys.length
        && keys.every((key, index) => key === expectedKeys[index])
        && value.schemaVersion === GAME_PROFILE_IDENTITY_SCHEMA
        && typeof value.engineAbi === 'string'
        && value.engineAbi.length > 0
        && typeof value.runnerRevision === 'string'
        && value.runnerRevision.length > 0
        && SHA256_HEX.test(value.resolvedProfileHash)
        && SHA256_HEX.test(value.authorityContentHash)
    }

    function readStoredGameProfileIdentity() {
      try {
        const stored = localStorage.getItem('rvb_game_profile_identity')
        if (!stored) return null
        const parsed = JSON.parse(stored)
        return isGameProfileIdentity(parsed) ? parsed : null
      } catch {
        return null
      }
    }

    async function getLocalGameProfileIdentity() {
      let profileIdentity
      if (
        (window.RvBHost || window.electronAPI)
        && typeof (window.RvBHost || window.electronAPI).getMode === 'function'
      ) {
        const mode = await (window.RvBHost || window.electronAPI).getMode()
        const normalizeUrl = value => String(value || '').trim().replace(/\/+$/, '')
        const currentServerUrl = window.RvBUtils && RvBUtils.getServerUrl
          ? RvBUtils.getServerUrl()
          : ''
        const isLocalAuthority = normalizeUrl(currentServerUrl) === normalizeUrl(mode && mode.localUrl)
        profileIdentity = mode && (isLocalAuthority ? mode.localAuthorityProfileIdentity : mode.profileIdentity)
      } else {
        const nativeApp = window.Capacitor && window.Capacitor.isNativePlatform()
        if (nativeApp) {
          const response = await fetch('__tutorial-profile.json', { cache: 'no-store' })
          if (!response.ok) throw new Error('本地资源不可用，请恢复内置资源或安装兼容资源包')
          profileIdentity = await response.json()
        } else profileIdentity = readStoredGameProfileIdentity()
        const localRuntimeUrl = /^https?:$/.test(window.location.protocol)
          ? window.location.origin
          : ''
        if (!nativeApp && !profileIdentity) {
          const catalogIdentity = localRuntimeUrl
            ? await RvBColyseus.requestCatalogIdentityAt(localRuntimeUrl, 'local-profile-runtime')
            : await lobbyRequest('catalog.identity')
          profileIdentity = catalogIdentity && catalogIdentity.profileIdentity
        }
      }

      if (!isGameProfileIdentity(profileIdentity)) {
        throw new Error('本地 Profile Identity 无效，请返回首页打开“资源包管理”检查安装状态')
      }
      try {
        localStorage.setItem('rvb_game_profile_identity', JSON.stringify(profileIdentity))
      } catch {}
      return profileIdentity
    }

    function summarizeGameProfileIdentity(identity) {
      if (!identity || typeof identity !== 'object') return '未知'
      const shortHash = value => typeof value === 'string' ? value.slice(0, 12) : '未知'
      return [
        identity.engineAbi || '未知 ABI',
        identity.runnerRevision || '未知 Runner',
        'authority=' + shortHash(identity.authorityContentHash),
        'profile=' + shortHash(identity.resolvedProfileHash),
      ].join(' · ')
    }

    function formatProfileError(error) {
      const code = error && error.code
      if (!code || !/^(PROFILE_|ENGINE_ABI_|RUNNER_REVISION_|PINNED_PROFILE_)/.test(code)) {
        return error && error.message ? error.message : String(error)
      }
      const context = error.context || {}
      return [
        '兼容性检查失败（' + code + '）',
        '服务器：' + summarizeGameProfileIdentity(context.expected || context.active),
        '本地：' + summarizeGameProfileIdentity(context.actual || context.pinned),
        '请留在大厅，返回首页打开“资源包管理”安装或激活匹配版本。',
      ].join('\n')
    }

    function updateFloatBar() {
      const saved = RvBUtils.getServerUrl()
      const status = document.getElementById('floatStatus')
      if (!status) return
      if (saved) {
        const mode = getLobbyServerMode()
        const label = mode === 'local' ? '本机主机' : (mode === 'lan' ? '局域网主机' : '远程服务器')
        status.textContent = '🟢 ' + label + '：' + saved.replace(/^https?:\/\//, '').slice(0, 30)
        status.style.color = '#22c55e'
      } else {
        status.textContent = '⚫ 离线模式'
        status.style.color = '#64748b'
      }
    }

    async function loadRooms() {
      if (!RvBUtils.getServerUrl()) {
        document.getElementById('roomList').innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div>未连接服务器</div>'
        return
      }
      const btn = document.getElementById('refreshBtn')
      const statusBar = document.getElementById('statusBar')
      btn.disabled = true
      statusBar.innerHTML = '<span class="spinner-sm"></span><span>加载中…</span>'
      try {
        const data = await lobbyRequest('rooms.list')
        renderRooms(data.rooms || [])
        statusBar.textContent = '上次更新：' + new Date().toLocaleTimeString()
      } catch (e) {
        document.getElementById('roomList').innerHTML =
          '<div class="browser-empty">暂时无法读取房间：' + escHtml(e.message) + '<br><a href="multiplayer.html">打开服务器连接设置</a></div>'
        statusBar.textContent = ''
      } finally {
        btn.disabled = false
      }
    }

    let catalogRooms = [], selectedRoomId = null
    function renderRooms(rooms) {
      const seen = new Set()
      catalogRooms = (Array.isArray(rooms) ? rooms : []).filter(r => {
        if (!r || !r.id || seen.has(r.id) || r.status === 'finished' || (r.visibility && r.visibility !== 'public')) return false
        seen.add(r.id); return true
      })
      filterLobbyRooms()
    }
    function filterLobbyRooms() {
      const search = document.getElementById('roomSearch').value.toLocaleLowerCase().trim()
      const mode = document.getElementById('modeFilter').value, state = document.getElementById('stateFilter').value
      const filtered = catalogRooms.filter(r => {
        const waiting = ['waiting','open'].includes(r.status) || !r.status
        const count = r.players ? r.players.length : (r.playerCount || 0)
        return (mode === 'all' || (r.mode || (r.maxPlayers === 4 ? '2v2' : '1v1')) === mode) &&
          (state === 'all' || (state === 'waiting' ? waiting && (count < (r.maxPlayers || 2) || roomMembership(r)) : r.status === 'in-progress' && r.spectatingEnabled !== false && (r.spectatorCount || 0) < 8)) &&
          (!search || (String(r.name || r.id) + ' ' + getMapDisplayName(r.mapId)).toLocaleLowerCase().includes(search))
      })
      const list = document.getElementById('roomList'); list.replaceChildren()
      document.getElementById('roomCount').textContent = filtered.length + ' 个房间 / 共 ' + catalogRooms.length + ' 个'
      if (!filtered.some(r => r.id === selectedRoomId)) selectedRoomId = filtered[0]?.id || null
      if (!filtered.length) {
        const empty = document.createElement('div'); empty.className = 'browser-empty'
        empty.textContent = catalogRooms.length ? '没有符合筛选条件的房间。' : '这里还没有房间。创建一局，邀请朋友来玩吧。'; list.appendChild(empty)
      }
      filtered.forEach(r => {
        const row = document.createElement('div'); row.className = 'room-card room-row' + (r.id === selectedRoomId ? ' is-selected' : '')
        row.tabIndex = 0; row.setAttribute('role','button'); row.setAttribute('aria-pressed', String(r.id === selectedRoomId))
        const count = r.players ? r.players.length : (r.playerCount || 0), waiting = ['waiting','open'].includes(r.status) || !r.status
        const name = document.createElement('div'); name.className = 'room-info'
        const title = document.createElement('strong'); title.className = 'room-name'; title.textContent = r.name || r.id
        const map = document.createElement('small'); map.className = 'room-meta'; map.textContent = getMapDisplayName(r.mapId)
        name.append(title,map); row.appendChild(name)
        for (const value of [r.mode || (r.maxPlayers === 4 ? '2v2' : '1v1'), count + '/' + (r.maxPlayers || 2), waiting ? (count >= (r.maxPlayers || 2) ? '已满' : '等待中') : r.status === 'ready' ? '选人中' : r.status === 'in-progress' ? '对局中' : '状态未知']) { const cell = document.createElement('span'); cell.textContent = value; row.appendChild(cell) }
        const action = roomAction(r); row.appendChild(action)
        row.onclick = () => { selectedRoomId = r.id; filterLobbyRooms() }
        row.onkeydown = e => { if (e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectedRoomId = r.id; filterLobbyRooms() } }
        list.appendChild(row)
      })
      const selected = filtered.find(r => r.id === selectedRoomId), actions = document.getElementById('selectedRoomActions'); actions.replaceChildren()
      document.getElementById('selectedRoomName').textContent = selected ? selected.name || selected.id : '选择一个房间'
      document.getElementById('selectedRoomInfo').textContent = selected ? getMapDisplayName(selected.mapId) + ' · ' + (selected.mode || (selected.maxPlayers === 4 ? '2v2' : '1v1')) + '\n观众 ' + (selected.spectatorCount || 0) + '/8' : '加入公开房间，或使用邀请码加入朋友的房间。'
      if (selected) {
        actions.appendChild(roomAction(selected))
        const me = RvBIdentity.getIdentity().id
        if (me && selected.hostId && selected.hostId.toLowerCase() === me.toLowerCase() && selected.status !== 'in-progress') {
          const remove = document.createElement('button'); remove.className = 'button danger'; remove.textContent = '删除我的房间'; remove.onclick = e => deleteRoom(selected.id,e); actions.appendChild(remove)
        }
      }
    }
    function roomAction(r) {
      const button = document.createElement('button'), waiting = ['waiting','open'].includes(r.status) || !r.status
      const count = r.players ? r.players.length : (r.playerCount || 0)
      const member = roomMembership(r)
      button.dataset.roomId = r.id
      button.className = waiting ? 'btn-join button primary' : 'btn-spectate button'
      button.textContent = member ? '返回' : waiting ? '加入' : r.status === 'ready' ? '选人中' : r.spectatingEnabled === false ? '观战关闭' : '观战'
      button.disabled = !member && (waiting ? count >= (r.maxPlayers || 2) : r.status !== 'in-progress' || r.spectatingEnabled === false || (r.spectatorCount || 0) >= 8)
      button.onclick = e => { e.stopPropagation(); if (member) joinRoom(r.id, member.alignment, 'rejoin'); else if (waiting) showFactionPicker(r.id); else spectateRoom(r.id) }
      return button
    }
    function roomMembership(room) {
      const id = RvBIdentity.getIdentity()?.id
      return id && Array.isArray(room.players) ? room.players.find(player => player.id && player.id.toLowerCase() === id.toLowerCase()) : null
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    let _pendingJoinRoomId = null
    let _pendingJoinAction = 'join'
    function showFactionPicker(roomId, action) {
      if (!RvBUtils.getServerUrl()) { alert('请先连接服务器'); return }
      _pendingJoinRoomId = roomId
      _pendingJoinAction = action || 'join'
      document.getElementById('factionBtnRed').classList.remove('selected')
      document.getElementById('factionBtnBlue').classList.remove('selected')
      document.getElementById('factionSheet').style.display = 'flex'
    }
    function closeFactionSheet() {
      document.getElementById('factionSheet').style.display = 'none'
      _pendingJoinRoomId = null
      _pendingJoinAction = 'join'
    }
    async function confirmJoin(faction) {
      const roomId = _pendingJoinRoomId
      const action = _pendingJoinAction
      if (!roomId) return
      document.getElementById('factionSheet').style.display = 'none'
      _pendingJoinRoomId = null
      _pendingJoinAction = 'join'
      await joinRoom(roomId, faction, action)
    }

    async function joinRoom(roomId, faction, action) {
      try {
        const identity = RvBIdentity.getIdentity()
        if (!identity) { alert('请先设置账号'); return }
        const { id: playerId, displayName: playerName } = identity
        const publicKey = typeof RvBIdentity.getPublicKey === 'function'
          ? RvBIdentity.getPublicKey()
          : (identity.publicKey || '')
        const profileIdentity = await getLocalGameProfileIdentity()
        const requestedAction = action || 'join'
        const payload = { action: requestedAction, roomId, playerId, timestamp: Date.now() }
        const signature = await RvBIdentity.sign(payload)
        const body = { action: requestedAction, roomId, playerId, playerName, publicKey, payload, signature, profileIdentity }
        if (faction) body.alignment = faction
        await lobbyRequest('rooms.action', body)
        window.location.href = 'room.html?roomId=' + encodeURIComponent(roomId)
          + '&playerId=' + encodeURIComponent(playerId)
          + '&playerName=' + encodeURIComponent(playerName)
          + (faction ? '&alignment=' + encodeURIComponent(faction) : '')
      } catch (e) { alert('加入房间失败：' + formatProfileError(e)) }
    }

    async function spectateRoom(roomId) {
      const { id: spectatorId, displayName: spectatorName } = RvBIdentity.getIdentity()
      try {
        const profileIdentity = await getLocalGameProfileIdentity()
        await lobbyRequest('rooms.spectate', { roomId, spectatorId, spectatorName, profileIdentity })
        window.location.href = 'battle.html?roomId=' + encodeURIComponent(roomId)
          + '&playerId=' + encodeURIComponent(spectatorId)
          + '&mode=spectate'
      } catch (e) { alert('观战失败：' + formatProfileError(e)) }
    }

    async function deleteRoom(roomId, event) {
      event.stopPropagation()
      if (!confirm('确定要删除这个房间吗？')) return
      const { id: playerId } = RvBIdentity.getIdentity()
      try {
        await lobbyRequest('rooms.delete', { roomId, playerId })
        loadRooms()
      } catch (e) { alert('删除房间失败：' + e.message) }
    }

    const isPublishedGuest = /^\/hosts\//.test(new URL(RvBUtils.getServerUrl() || location.origin).pathname)
    if (isPublishedGuest) {
      const createEntry = document.getElementById('openCreateRoom')
      createEntry.disabled = true
      createEntry.textContent = '请由玩家主机创建房间'
    }
    async function openCreateSheet() {
      if (isPublishedGuest) return
      if (!RvBUtils.getServerUrl()) { alert('请先连接服务器'); return }
      document.getElementById('createSheet').style.display = 'flex'
      document.getElementById('createErr').style.display = 'none'
      await loadMaps()
    }

    function closeCreateSheet() {
      document.getElementById('createSheet').style.display = 'none'
    }

    async function fetchLocalJson(path) {
      if (window.fetchPackJson && /^\.?\/?data\//.test(path)) {
        return window.fetchPackJson(path)
      }
      const res = await fetch(path)
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.json()
    }

    const DEFAULT_SELECTED_MAP_ID = 'large-hole-arena'
    const MAP_NAMES = Object.create(null)
    let mapsLoaded = false
    let mapsLoadPromise = null

    function getMapDisplayName(mapId) {
      if (!mapId) return '未指定'
      return MAP_NAMES[mapId] || mapId
    }

    async function loadMaps() {
      const sel = document.getElementById('mapSelect')
      const createBtn = document.getElementById('createRoomBtn')
      if (mapsLoaded) return true
      if (mapsLoadPromise) return mapsLoadPromise

      document.getElementById('matchMode').disabled = true
      sel.disabled = true
      createBtn.disabled = true
      sel.innerHTML = '<option value="">正在加载地图…</option>'
      mapsLoadPromise = (async () => {
        try {
          const payload = await lobbyRequest('catalog.maps', { mode: document.getElementById('matchMode').value })
          const maps = Array.isArray(payload.maps) ? payload.maps : []
          if (!maps.length) throw new Error('服务器未返回可选地图')

          const previous = sel.value
          sel.innerHTML = ''
          for (const map of maps) {
            if (!map || typeof map.id !== 'string' || !map.id) continue
            MAP_NAMES[map.id] = map.name || map.id
            const opt = document.createElement('option')
            opt.value = map.id
            opt.textContent = MAP_NAMES[map.id]
            sel.appendChild(opt)
          }
          if (!sel.options.length) throw new Error('服务器地图目录无有效条目')

          const preferred = previous || DEFAULT_SELECTED_MAP_ID
          if (Array.from(sel.options).some(option => option.value === preferred)) sel.value = preferred
          mapsLoaded = true
          sel.disabled = false
          createBtn.disabled = false
          return true
        } catch (error) {
          mapsLoaded = false
          sel.innerHTML = '<option value="">地图加载失败</option>'
          sel.disabled = true
          createBtn.disabled = true
          const errEl = document.getElementById('createErr')
          errEl.textContent = '地图加载失败：' + (error && error.message ? error.message : String(error))
          errEl.style.display = 'block'
          return false
        } finally {
          mapsLoadPromise = null
          document.getElementById('matchMode').disabled = false
        }
      })()
      return mapsLoadPromise
    }

    let createRoomPromise = null
    async function doCreateRoom() {
      if (createRoomPromise) return createRoomPromise
      const identity = RvBIdentity.getIdentity()
      const { id: hostId, displayName: playerName } = identity
      const publicKey = typeof RvBIdentity.getPublicKey === 'function'
        ? RvBIdentity.getPublicKey() : (identity.publicKey || '')
      const visibility = document.getElementById('visibilityToggle').checked ? 'public' : 'private'
      const errEl = document.getElementById('createErr')
      const createBtn = document.getElementById('createRoomBtn')
      errEl.style.display = 'none'
      createBtn.disabled = true
      createBtn.textContent = '正在创建…'
      createRoomPromise = (async () => {
        try {
          if (!(await loadMaps())) throw new Error('地图目录尚未就绪')
          const mapId = document.getElementById('mapSelect').value
          if (!mapId) throw new Error('请选择地图')
          await reconcileLobbyServerMode()
          const profileIdentity = await getLocalGameProfileIdentity()
          const mode = document.getElementById('matchMode').value
          const room = await lobbyRequest('rooms.create', { name: playerName + ' 的 ' + mode + ' 房间', mode, hostId, hostName: playerName, publicKey, mapId, visibility, profileIdentity })
          if (room.id) { closeCreateSheet(); showFactionPicker(room.id, 'join') }
          else throw new Error('未返回房间 ID')
        } catch (e) {
          const serverUrl = (window.RvBUtils && RvBUtils.getServerUrl && RvBUtils.getServerUrl()) || '未设置'
          errEl.textContent = '创建失败：' + formatProfileError(e) + '（服务器：' + serverUrl + '）'
          errEl.style.display = 'block'
        } finally {
          createBtn.textContent = '创建并加入'
          createBtn.disabled = !mapsLoaded
          createRoomPromise = null
        }
      })()
      return createRoomPromise
    }

    async function joinByCode(spectating) {
      const raw = document.getElementById('inviteInput').value.trim()
      if (!raw) return
      const code = raw.toUpperCase()
      try {
        const match = await lobbyRequest('rooms.resolveInvite', { inviteCode: code })
        if (spectating) await spectateRoom(match.id)
        else if (match.status === 'waiting' || match.status === 'ready') { document.getElementById('inviteDialog').close(); showFactionPicker(match.id) }
        else alert('对局已开始，可以选择观战')
      } catch (e) { alert('查找房间失败：' + e.message) }
    }

    function hideRejoin() {
      window._rejoinInfo = null
      const bar = document.getElementById('rejoinBar')
      if (bar) bar.style.display = 'none'
    }
    function showRejoinFeedback(message) {
      const feedback = document.getElementById('rejoinFeedback')
      if (feedback) {
        feedback.textContent = message
        feedback.style.display = message ? 'block' : 'none'
      }
      if (message) console.warn('[lobby:rejoin] ' + message)
    }
    function clearInvalidRejoin(message) {
      try { localStorage.removeItem('rvb_active_battle') } catch (e) {
        console.warn('[lobby:rejoin] 无法清理本地对局记录', e)
      }
      hideRejoin()
      showRejoinFeedback(message)
    }
    function isValidRejoinInfo(info) {
      return !!info && typeof info === 'object' &&
        typeof info.roomId === 'string' && info.roomId.trim().length > 0 &&
        typeof info.playerId === 'string' && info.playerId.trim().length > 0
    }
    function isActiveBattleRoom(room, playerId) {
      const activeStatuses = ['in-progress', 'playing', 'battle']
      if (!room || !activeStatuses.includes(room.status) || !Array.isArray(room.players)) return false
      const normalizedPlayerId = playerId.toLowerCase()
      return room.players.some(player =>
        player && typeof player.id === 'string' && player.id.toLowerCase() === normalizedPlayerId
      )
    }
    async function checkRejoin() {
      hideRejoin()
      showRejoinFeedback('')
      let saved = null
      try {
        saved = localStorage.getItem('rvb_active_battle')
      } catch (e) {
        showRejoinFeedback('无法读取本地对局记录：' + (e && e.message ? e.message : String(e)))
        return
      }
      if (!saved) return

      let info
      try {
        info = JSON.parse(saved)
      } catch {
        clearInvalidRejoin('保存的对局信息无效，已清理')
        return
      }
      if (!isValidRejoinInfo(info)) {
        clearInvalidRejoin('保存的对局信息缺失，已清理')
        return
      }
      info = {
        ...info,
        roomId: info.roomId.trim(),
        playerId: info.playerId.trim(),
      }

      if (!RvBUtils.getServerUrl()) {
        showRejoinFeedback('未连接服务器，暂时无法验证保存的对局')
        return
      }
      try {
        const room = await lobbyRequest('rooms.get', { roomId: info.roomId })
        if (!isActiveBattleRoom(room, info.playerId)) {
          clearInvalidRejoin('保存的对局已失效，已清理')
          return
        }
        window._rejoinInfo = info
        const bar = document.getElementById('rejoinBar')
        if (bar) bar.style.display = 'flex'
      } catch (e) {
        const message = e && e.message ? e.message : String(e)
        if (/room not found/i.test(message)) {
          clearInvalidRejoin('保存的对局已不存在，已清理')
          return
        }
        showRejoinFeedback('无法验证保存的对局：' + message)
      }
    }
    function rejoinBattle() {
      if (!window._rejoinInfo) {
        dismissRejoin()
        const message = '没有可重新加入的对局，请刷新大厅后重试'
        showRejoinFeedback(message)
        alert(message)
        return
      }
      const { roomId, playerId, playerName } = window._rejoinInfo
      const url = RvBUtils.getServerUrl()
      if (!url) { alert('未连接服务器，无法重新加入'); return }
      window.location.href = 'battle.html?roomId=' + encodeURIComponent(roomId) + '&playerId=' + encodeURIComponent(playerId) + (playerName ? '&playerName=' + encodeURIComponent(playerName) : '')
    }
    function dismissRejoin() {
      try { localStorage.removeItem('rvb_active_battle') } catch {}
      hideRejoin()
    }

    window.addEventListener('load', async () => {
      await reconcileLobbyServerMode()
      document.getElementById('serverUrlDisplay').textContent = RvBUtils.getServerUrl() || '未连接'
      try { await RvBIdentity.ensureIdentity() } catch (error) { document.getElementById('roomList').textContent = '本地玩家身份初始化失败：' + error.message; return }
      refreshUserUI()
      updateFloatBar()
      await checkRejoin()
      await loadMaps()
      loadRooms()
    })
    window.addEventListener('unload', () => { if (pollTimer) clearInterval(pollTimer) })
  </script>
  <!-- Faction picker overlay -->
  <div id="factionSheet" class="overlay" style="display:none" onclick="if(event.target===this)closeFactionSheet()">
    <div class="sheet">
      <div class="sheet-title">选择阵营</div>
      <div class="faction-row">
        <button class="btn-faction red" id="factionBtnRed" onclick="confirmJoin('dark')">🌑 暗<br><span style="font-size:11px;font-weight:400;opacity:.85">只选暗阵营棋子</span></button>
        <button class="btn-faction blue" id="factionBtnBlue" onclick="confirmJoin('light')">☀️ 光<br><span style="font-size:11px;font-weight:400;opacity:.85">只选光阵营棋子</span></button>
      </div>
      <button class="btn-cancel" style="margin-top:14px" onclick="closeFactionSheet()">取消</button>
    </div>
  </div>
</body>
</html>
