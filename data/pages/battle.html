      RvBWs.connect(roomId, myPlayerId, wsMode)
    }

    // Relay host: create initial battle state via local engine, push to relay
    async function initRelayHostBattle() {
      try {
        addLog('正在通过 WebSocket 初始化对战', 'info')
        if (window.RvBWs && RvBWs.request) {
        await RvBWs.request('rooms.action', { roomId, action: 'start-game', playerId: myPlayerId, accountId: myAccountId, playerName: myPlayerName }, 8000)
        }
      } catch (e) { addLog('初始化出错：' + e.message, 'err') }
    }

    // Initialize a real battle: connect WS (server will push initial stateUpdate on subscribe).
    // State arrives through WS; HTTP is only used as a recovery fallback.
    async function initBattle() {
      connectBattleWs(wsMode)
      setTimeout(function() {
        if (!G) {
          try { if (window.RvBWs && RvBWs.send) RvBWs.send({ type: 'requestBattleSnapshot' }) } catch {}
          recoverBattleStateViaHttp()
        }
      }, 8000)
    }

    async function recoverBattleStateViaHttp() {
      try {
        const res = await RvBUtils.serverFetch('/api/rooms/' + encodeURIComponent(roomId) + '/battle', { method: 'GET', timeoutMs: 5000 })
        if (!res.ok) {
          const text = await res.text().catch(() => '')
          throw new Error('HTTP ' + res.status + ' ' + text)
        }
        const data = await res.json()
        if (data && data.state) {
          addLog('[HTTP fallback] 已拉取服务端战斗状态 ' + String(data.stateHash || '').slice(0, 12), 'info')
          applyServerState(data.state, data.seed || null)
          return
        }
        throw new Error('empty battle state')
      } catch (e) {
        showMsg('WebSocket 已发起连接，但尚未收到战斗状态；HTTP 兜底也失败：' + ((e && e.message) || e), 'err')
      }
    }

    // Kept as a no-op for old call sites.
    async function pollActions() { /* deprecated: state arrives via WS only */ }

    // Exact target candidates are produced by the authoritative rule query.
    // The page controller only converts stable TargetRef values into presentation
    // cells and intent payloads; the presentation layer never reimplements legality.
    function _actionHasFirstTarget(action) {
      return !!(action && (action.targetPieceId || action.targetX != null || action.targetY != null))
    }

    function _targetPayloadFromCell(piece, x, y, targetType) {
      return targetType === 'piece' && piece
        ? { pieceId: piece.instanceId, x: piece.x, y: piece.y }
        : { x, y }
    }

    function _appendTargetToAction(action, piece, x, y, targetType) {
      delete action.target
      delete action.clientActionId
      delete action.requestId
      if (!_actionHasFirstTarget(action)) {
        if (targetType === 'piece' && piece) {
          action.targetPieceId = piece.instanceId
          delete action.targetX; delete action.targetY
        } else {
          delete action.targetPieceId
          action.targetX = x
          action.targetY = y
        }
        return action
      }
      const extraTargets = Array.isArray(action.extraTargets) ? action.extraTargets.slice() : []
      extraTargets.push(_targetPayloadFromCell(piece, x, y, targetType))
      action.extraTargets = extraTargets
      return action
    }

    function computeValidSkillTargets(sp) {
      if (!G || !sp || !pendingSkill) return new Set()
      const valid = new Set()
      const preparation = pendingSkill.preparation
      if (!preparation || !Array.isArray(preparation.candidates)) return valid
      for (const ref of preparation.candidates) {
        if (ref.type === 'cell') {
          valid.add(ref.x + ',' + ref.y)
        } else if (ref.type === 'piece') {
          const piece = G.pieces.find(p => p.instanceId === ref.pieceId && p.currentHp > 0)
          if (piece && piece.x != null && piece.y != null) valid.add(piece.x + ',' + piece.y)
        }
      }
      return valid
    }

    // Cache valid targets on pendingSkill once (not per frame)
    function _updatePendingSkillTargets() {
      if (!pendingSkill || !G) return
      const sp = G.pieces.find(p => p.instanceId === selectedPieceId)
      pendingSkill.validTargets = computeValidSkillTargets(sp || { instanceId: '' })
      updateRed43QaEvidence()
    }

    // ── Target overlay ──
    function targetTypeText(targetType, filter) {
      const tt = (targetType || '').toLowerCase()
      const ff = (filter || '').toLowerCase()
      if (tt === 'grid' || tt === 'cell' || tt === 'tile' || tt === 'empty') return '选择一个地格'
      if (ff === 'ally' || ff === 'allies' || ff === 'friendly') return '选择一个友方角色'
      if (ff === 'enemy' || ff === 'enemies') return '选择一个敌方角色'
      if (tt === 'self') return '选择自己'
      if (tt === 'piece' || tt === 'character') return '选择一个角色'
      return '选择目标'
    }
    function targetStepPrefix(index) {
      const idx = Number(index)
      return Number.isFinite(idx) && idx > 0 ? '第' + (idx + 1) + '步：' : ''
    }
    function _targetPromptText() {
      if (pendingCardAction) {
        return targetStepPrefix(pendingCardAction.pendingTargetIndex) +
          targetTypeText(pendingCardAction.pendingTargetType, pendingCardAction.pendingTargetFilter)
      }
      if (!pendingSkill) return ''
      if (pendingSkill.hint) return pendingSkill.hint
      return targetStepPrefix(pendingSkill.pendingTargetIndex) +
        targetTypeText(pendingSkill.targetType, pendingSkill.filter)
    }
    function renderTargetOverlay() {
      const el = document.getElementById('targetOverlay')
      if (!el) return
      if (pendingSkill || pendingCardAction) {
        document.getElementById('targetPromptText').textContent = _targetPromptText()
        el.classList.add('show')
      } else {
        el.classList.remove('show')
      }
    }
    function cancelTargetSelection() {
      if (G && (pendingTargetSelectionForMe() || pendingOptionSelectionForMe())) {
        const pendingTarget = G.pendingTargetSelection
        doAction({
          type: 'cancelPendingSelection',
          playerId: myPlayerId,
          selectionId: pendingTarget && pendingTarget.selectionId,
          stateRevision: pendingTarget && pendingTarget.stateRevision,
        })
      }
      pendingSkill = null; pendingCardAction = null; pendingMove = false
      setMoveButtonClass(false)
      const sp = autoMoveSelectedIfPossible()
      renderBoard(); renderSkillBar(sp || null); renderActionBar(); renderTargetOverlay()
    }

    function setMoveButtonClass(active) {
      const btn = document.getElementById('btnMove')
      if (btn) btn.className = 'btn-action' + (active ? ' active-move' : '')
    }

    function setMoveButtonDisabled(disabled) {
      const btn = document.getElementById('btnMove')
      if (btn) btn.disabled = disabled
    }

    function canAutoMovePiece(piece) {
      if (!G || !piece || piece.currentHp <= 0) return false
      if (!window.BattleLegalActions || typeof GameEngine === 'undefined') return false
      return BattleLegalActions.queryMoveCells({
        snapshot: G,
        playerId: myPlayerId,
        pieceId: piece.instanceId,
        engine: GameEngine,
      }).size > 0
    }

    function autoMoveSelectedIfPossible() {
      const sp = G && selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null
      pendingMove = canAutoMovePiece(sp)
      setMoveButtonClass(pendingMove)
      return sp
    }

    // Client player routing
    // Training mode can control both players; PVP only controls the local player.
    // This keeps account identity separate from match player identity.
    function clientOwns(pid) {
      if (!pid) return false
      if (TRAINING_MODE) return true
      return String(pid).toLowerCase() === String(myPlayerId).toLowerCase()
    }

    // ── Render ──
    // Render
    function pendingTargetSelectionForMe() {
      const pbt = G && G.pendingTargetSelection
      return !!(pbt && pbt.playerId && clientOwns(pbt.playerId))
    }

    function pendingOptionSelectionForMe() {
      const pbc = G && G.pendingOptionSelection
      return !!(pbc && pbc.playerId && clientOwns(pbc.playerId))
    }

    function pendingOptionSelectionForOther() {
      const pbc = G && G.pendingOptionSelection
      return !!(pbc && pbc.playerId && !clientOwns(pbc.playerId))
    }

    function battleInteractionMode() {
      if (TRAINING_MODE && placingMode) return 'place'
      if (pendingSkill || (pendingCardAction && pendingCardAction.type)) return 'target'
      if (pendingMove) return 'move'
      return 'inspect'
    }

    function refreshBattleLegalActions() {
      if (!G || !window.BattleLegalActions) return
      if (pendingMove && selectedPieceId) {
        validMoves = BattleLegalActions.queryMoveCells({
          snapshot: G,
          playerId: myPlayerId,
          pieceId: selectedPieceId,
          engine: typeof GameEngine === 'undefined' ? null : GameEngine,
        })
      } else {
        validMoves = new Set()
      }
      if (pendingSkill) _updatePendingSkillTargets()
      if (pendingCardAction && pendingCardAction.type) {
        const preparation = pendingCardAction.preparation
        const cells = new Set()
        if (preparation && Array.isArray(preparation.candidates)) {
          preparation.candidates.forEach(ref => {
            if (ref.type === 'cell') cells.add(ref.x + ',' + ref.y)
            if (ref.type === 'piece') {
              const piece = G.pieces.find(p => p.instanceId === ref.pieceId && p.currentHp > 0)
              if (piece && piece.x != null && piece.y != null) cells.add(piece.x + ',' + piece.y)
            }
          })
        }
        pendingCardAction.validTargets = cells
      }
    }

    function createBattlePresentationModel(snapshot) {
      if (!snapshot || !window.BattleViewModel) return null
      const isCurrentSnapshot = snapshot === G
      const targetCells = isCurrentSnapshot && pendingSkill
        ? (pendingSkill.validTargets || new Set())
        : (isCurrentSnapshot && pendingCardAction && pendingCardAction.type
            ? (pendingCardAction.validTargets || new Set())
            : new Set())
      return BattleViewModel.create({
        snapshot: snapshot,
        viewerId: myPlayerId,
        selectedPieceId: selectedPieceId,
        interactionMode: battleInteractionMode(),
        legal: {
          moveCells: isCurrentSnapshot ? validMoves : new Set(),
          targetCells: targetCells,
          placementCells: isCurrentSnapshot && TRAINING_MODE && placingMode
            ? BattleLegalActions.queryTrainingPlacementCells(snapshot)
            : new Set(),
        },
      })
    }

    let _pendingChoiceShown = null  // track which pendingOptionSelection we've shown
    function render() {
      if (!G) return
      checkClientGameOver()
      renderBoard()
      renderPanels()
      renderActionBar()
      renderHand()
      renderTargetOverlay()
      const pbc = G.pendingOptionSelection
      if (pendingOptionSelectionForMe()) {
        const key = pbc.playerId + ':' + (G.turn ? G.turn.turnNumber : 0) + ':' + (pbc.options || []).map(o => o.value || o.id || o.label).join(',')
        if (_pendingChoiceShown !== key) {
          _pendingChoiceShown = key
          showOptionPicker(pbc.title || '请选择', pbc.options || [], {
            type: 'pendingOptionSelect',
            playerId: pbc.playerId,
            cancelValue: pbc.cancelValue
          })
        }
      } else {
        _pendingChoiceShown = null
        if (pendingOptionAction && pendingOptionAction.type === 'pendingOptionSelect') {
          pendingOptionAction = null
          _pickerOptions = []
          const overlay = document.getElementById('optionPickerOverlay')
          if (overlay) overlay.classList.remove('show')
        }
      }
      const pbt = G.pendingTargetSelection
      if (pendingTargetSelectionForMe()) {
        console.log('[STAGE3] G.pendingTargetSelection: playerId=' + pbt.playerId + ' targetType=' + pbt.targetType + ' hasEffectCode=' + !!pbt.effectCode + ' effectCodeLen=' + (pbt.effectCode ? pbt.effectCode.length : 0))
        const actionType = 'pendingTargetSelect'
        if (!pendingSkill || pendingSkill.turnTargetActionType !== actionType) {
          pendingSkill = {
            targetType: pbt.targetType,
            range: pbt.range || 99,
            filter: pbt.filter || 'all',
            pendingTargetIndex: Number(pbt.step) || 0,
            turnTargetActionType: actionType,
            turnTargetPlayerId: pbt.playerId,
            preparation: {
              kind: 'needTarget',
              selectionId: pbt.selectionId,
              stateRevision: pbt.stateRevision,
              step: Number(pbt.step) || 0,
              targetType: pbt.targetType === 'piece' ? 'piece' : 'cell',
              filter: pbt.filter || 'all',
              range: pbt.range,
              candidates: Array.isArray(pbt.candidates) ? pbt.candidates : [],
            },
            validTargets: new Set(),
          }
          _updatePendingSkillTargets()
          console.log('[STAGE4] entered target-select mode, validTargets count=' + pendingSkill.validTargets.size)
          setStatusMsg(pbt.title || _targetPromptText() || '请选择目标')
          renderBoard()
          renderTargetOverlay()
        }
      } else if (pendingSkill && pendingSkill.turnTargetActionType === 'pendingTargetSelect') {
        pendingSkill = null
        renderBoard()
        renderActionBar()
        renderTargetOverlay()
      }
      updateRed43QaEvidence()
    }

    function renderBoard() {
      if (!G || !G.map) return
      refreshBattleLegalActions()
      currentBattleViewModel = createBattlePresentationModel(G)
      if (!currentBattleViewModel) return
      if (battlePresentation) battlePresentation.update(currentBattleViewModel)
      recalcCellSize()

      // ── Compute highlights (shared between 3D and HTML paths) ───────────────
      const tiles = currentBattleViewModel.board.tiles
      const cellMap = {}
      currentBattleViewModel.pieces.forEach(p => { if (p.visible) cellMap[p.x + ',' + p.y] = p })

      const toKey = cell => cell.x + ',' + cell.y
      const hlMoveKeys = new Set(currentBattleViewModel.legal.moveCells.map(toKey))
      const hlSkillKeys = new Set(currentBattleViewModel.legal.targetCells.map(toKey))
      const hlPlaceKeys = new Set(currentBattleViewModel.legal.placementCells.map(toKey))

      // ── 3D path ─────────────────────────────────────────────────────────────
      if (_use3d) return

      // ── HTML grid fallback ───────────────────────────────────────────────────
      const grid = document.getElementById('gameGrid')
      if (!grid) return
      const { width, height } = currentBattleViewModel.board
      grid.style.gridTemplateColumns = 'repeat(' + width + ', var(--cell-size, 44px))'

      const cells = []
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const tile = tiles.find(t => t.x === x && t.y === y)
          const ttype = tile ? (tile.props && tile.props.type ? tile.props.type : (tile.type || 'floor')) : 'floor'
          const tclass = TILE_CLASS[ttype] || 't-floor'
          const key = x + ',' + y
          const piece = cellMap[key]
          const isSel = piece && piece.id === selectedPieceId

          let cls = 'cell ' + tclass
          if (isSel) cls += ' hl-selected'
          else if (hlMoveKeys.has(key)) cls += ' hl-move'
          else if (hlSkillKeys.has(key)) cls += ' hl-skill'
          else if (hlPlaceKeys.has(key)) cls += ' hl-place'

          const tileEfxList = currentBattleViewModel.effects.filter(te => te.x === x && te.y === y)
          let tileEfxHtml = ''
          if (tileEfxList.length) {
            const icons = tileEfxList
              .map(te => {
                const meta = tileEffectMeta(te)
                const label = meta.icon
                return `<span title="${escHtml(te.type || '')}" style="display:inline-flex;align-items:center;justify-content:center;min-width:13px;height:13px;border-radius:999px;border:1px solid ${escHtml(meta.border)};background:${escHtml(meta.bg)};color:${escHtml(meta.color)};font-size:10px;line-height:1;font-weight:900">${escHtml(label)}</span>`
              })
              .join('')
            if (icons) {
              tileEfxHtml = `<div style="position:absolute;right:1px;bottom:1px;display:flex;gap:1px;align-items:center;justify-content:flex-end;max-width:calc(100% - 2px);pointer-events:none;z-index:4">${icons}</div>`
            }
          }

          let inner = ''
          if (piece) {
            const maxHp = piece.health.max
            const pct = Math.max(0, Math.round(piece.health.current / maxHp * 100))
            const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
            const faction = piece.faction || 'red'
            const tokCls = 'piece-tok ' + faction + (isSel ? ' selected-tok' : '')
            const tags = piece.statusSummary
            const tagsHtml = tags.map(t => `<span class="status-tag" title="${escHtml(t.id || '')}">${escHtml(t.label || t.id || '?')}</span>`).join('')
            const tmpl = PIECES_BY_ID[piece.templateId]
            const imgSrc = tmpl && tmpl.image ? 'images/' + tmpl.image : null
            const imgHtml = imgSrc
              ? `<img src="${imgSrc}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" style="width:100%;height:100%;object-fit:cover;border-radius:4px">`
              : ''
            inner = `<div class="${tokCls}">
              <div class="piece-tags">${tagsHtml}</div>
              ${imgHtml}
              <span class="piece-tok-ph" style="${imgSrc?'display:none':'display:flex'}">${faction==='red'?'🔴':'🔵'}</span>
              <div class="tok-hp-bar"><div class="tok-hp-fill ${fillCls}" style="width:${pct}%"></div></div>
            </div>`
          }
          const _ctxAttr = piece ? ` oncontextmenu="event.preventDefault();dispatchBattleIntent({type:'inspect-piece',pieceId:'${escHtml(piece.id)}'})"` : ''
          const _pieceAttrs = piece
            ? ` data-piece-id="${escHtml(piece.id)}" data-owner-player-id="${escHtml(piece.ownerPlayerId || '')}" data-relation="${String(piece.ownerPlayerId || '').toLowerCase() === myPlayerId ? 'ally' : 'enemy'}"`
            : ''
          cells.push(`<div class="${cls}" data-x="${x}" data-y="${y}" onclick="dispatchBattleIntent({type:'activate-cell',x:${x},y:${y}})"${_pieceAttrs}${_ctxAttr}>${tileEfxHtml}${inner}</div>`)
        }
      }
      grid.innerHTML = cells.join('')
    }

    // Sort pieces so summons appear adjacent to their summoner
    function sortWithSummons(pieces) {
      const mains = pieces.filter(p => !p.summonedByInstanceId && !p.summonerInstanceId)
      const summons = pieces.filter(p => p.summonedByInstanceId || p.summonerInstanceId)
      const result = []
      for (const main of mains) {
        const mine = summons.filter(s =>
          s.summonedByInstanceId === main.instanceId ||
          s.summonerInstanceId === main.instanceId
        )
        // Stable "random" above/below: use last char code of instanceId
        const code = main.instanceId ? main.instanceId.charCodeAt(main.instanceId.length - 1) : 0
        if (code % 2 === 0) {
          result.push(...mine, main)   // summons above
        } else {
          result.push(main, ...mine)   // summons below
        }
      }
      // Any unmatched summons at end
      for (const s of summons) { if (!result.includes(s)) result.push(s) }
      return result
    }

    function renderPanels() {
      if (!G) return
      // Determine which player is me
      const myPieces = sortWithSummons(
        G.pieces.filter(p => p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId)
      )
      const oppPieces = sortWithSummons(
        G.pieces.filter(p => !(p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId))
      )

      // Update labels; use player name if available.
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const oppMeta = G.players && G.players.find(p => !(p.playerId && p.playerId.toLowerCase() === myPlayerId))
      const factionIcon = myFaction === 'red' ? '[R]' : '[B]'
      const oppIcon = myFaction === 'red' ? '[B]' : '[R]'
      const myName = myPlayerName || playerNames[myPlayerId] || '我方'
      const oppPid = oppMeta && (oppMeta.playerId || '').toLowerCase()
      const oppName = (oppPid && playerNames[oppPid]) || (oppMeta && oppMeta.name) || (myFaction === 'red' ? '对方' : '对方')
      document.getElementById('myLabel').textContent = factionIcon + ' ' + myName
      document.getElementById('oppLabel').textContent = oppIcon + ' ' + oppName

      document.getElementById('myPieces').innerHTML = myPieces.map(p => renderPieceCard(p, true)).join('')
      document.getElementById('oppPieces').innerHTML = oppPieces.map(p => renderPieceCard(p, false)).join('')

      // Update piece select dropdown
      const sel = document.getElementById('pieceSelect')
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      if (sel) {
        const prev = sel.value
        if (isMyTurn) {
          sel.innerHTML = '<option value="">选择棋子</option>' +
            myPieces.filter(p => p.currentHp > 0).map(p => {
              const tmpl = PIECES_BY_ID[p.templateId]
              const name = p.name || (tmpl && tmpl.name) || p.templateId
              return `<option value="${p.instanceId}">${escHtml(name)} HP:${p.currentHp}</option>`
            }).join('')
          if (prev && myPieces.find(p => p.instanceId === prev && p.currentHp > 0)) sel.value = prev
        } else {
          sel.innerHTML = '<option value="">对方回合</option>'
        }
      }

      // Update skill bar
      const _skillBarPiece = selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null
      renderSkillBar(_skillBarPiece)
    }

    function renderPieceCard(piece, isMe) {
      const mhp = pieceMaxHp(piece)
      const dispHp = pieceDispHp(piece)
      const pct = Math.max(0, Math.round(dispHp / mhp * 100))
      const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
      const dead = piece.currentHp <= 0
      const sel = piece.instanceId === selectedPieceId && isMe
      const stats = pieceDispStats(piece)

      const tags = pieceDispTags(piece).filter(t => t.visible !== false)
      const tagsHtml = tags.map(t => {
        const label = t.name || t.type || t.id || '?'
        const stacks = t.stacks ? `脳${t.stacks}` : (t.duration ? `${t.duration}T` : '')
        return `<span class="status-tag" title="${escHtml(t.id||'')}">${escHtml(label)}${stacks ? ' ' + stacks : ''}</span>`
      }).join('')

      const tmpl = PIECES_BY_ID[piece.templateId]
      const displayName = piece.name || (tmpl && tmpl.name) || piece.templateId
      const imgSrc = tmpl && tmpl.image ? 'images/' + tmpl.image : null
      const onclick = !dead ? `onclick="dispatchBattleIntent({type:'select-piece',pieceId:'${piece.instanceId}'})"` : ''
      const iid = escHtml(piece.instanceId)
      return `<div class="piece-card ${dead?'dead':''} ${sel?'selected':''}" data-piece-id="${iid}" data-owner-player-id="${escHtml(piece.ownerPlayerId || '')}" data-relation="${isMe ? 'ally' : 'enemy'}" ${onclick}
        ontouchstart="startPressTimer(event,'${iid}')"
        ontouchend="clearPressTimer()" ontouchmove="clearPressTimer()"
        oncontextmenu="event.preventDefault();showPieceInfo('${iid}')">
        <button class="piece-info-btn" onclick="event.stopPropagation();showPieceInfo('${iid}')">鈸?/button>
        ${imgSrc ? `<img src="${imgSrc}" onerror="this.style.display='none'" style="width:100%;height:40px;object-fit:cover;border-radius:5px;margin-bottom:3px">` : ''}
        <div class="piece-card-name">${escHtml(displayName)}</div>
        <div class="piece-card-hp">${dispHp}/${mhp} HP</div>
        <div class="hp-bar"><div class="hp-fill ${fillCls}" style="width:${pct}%"></div></div>
        <div class="res-row">攻击 ${stats.attack??'?'} 防御 ${stats.defense??'?'} 移动 ${stats.moveRange??'?'}</div>
        ${tagsHtml ? '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px">' + tagsHtml + '</div>' : ''}
      </div>`
    }

    function renderSkillBar(piece) {
      const bar = document.getElementById('skillBar')
      if (!bar) return
      if (!piece || piece.currentHp <= 0) { bar.style.display = 'none'; return }
      if (!(piece.ownerPlayerId && piece.ownerPlayerId.toLowerCase() === myPlayerId)) {
        bar.style.display = 'none'
        return
      }

      const isMyTurn = G && G.turn && G.turn.currentPlayerId &&
        G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const inAction = G && G.turn && G.turn.phase === 'action'
      const myMeta = G && G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const ap = myMeta ? (myMeta.actionPoints || 0) : 0
      const cp = myMeta ? (myMeta.chargePoints || 0) : 0
      const skills = pieceDispSkills(piece).filter(sk => {
        const skData = skillDefOf(skillIdOf(sk))
        return skData.kind !== 'passive'
      })
      if (!skills.length) { bar.style.display = 'none'; return }

      bar.style.display = 'flex'
      bar.innerHTML = skills.map(sk => {
        const sid = skillIdOf(sk)
        const skData = skillDefOf(sid)
        const isCharge = skData.type === 'super'
        const onCD = (sk.currentCooldown || 0) > 0
        const noUses = sk.usesRemaining === 0
        const isActive = pendingSkill && pendingSkill.skillId === sid
        const icon = skData.icon || (isCharge ? 'C' : 'S')
        const rawName = skData.name || sid
        const rawDesc = skData.description || ''
        const apCost = skData.actionPointCost || 0
        const cpCost = isCharge ? (skData.chargeCost ?? 1) : (skData.chargeCost || 0)
        const apLow = ap < apCost
        const cpLow = cp < cpCost
        const displayName = rawName.length > 7 ? rawName.slice(0, 6) + '...' : rawName
        const displayDesc = rawDesc.length > 22 ? rawDesc.slice(0, 21) + '...' : rawDesc
        const typeLabel = isCharge ? '充能' : '基础'
        const typeCls = isCharge ? 'cp' : 'ap'
        const canAct = isMyTurn && inAction && piece.ownerPlayerId.toLowerCase() === myPlayerId
        const disabled = !canAct || onCD || noUses

        let cls = 'skill-card'
        if (isCharge) cls += ' sk-charge'
        if (isActive) cls += ' sk-active'
        if (disabled) cls += ' sk-disabled'

        const cdCover = (onCD || noUses) ? `
          <div class="sk-cd-cover">
            <div class="sk-cd-num">${onCD ? sk.currentCooldown : 'OK'}</div>
            <div class="sk-cd-lbl">${onCD ? 'CD' : '已用'}</div>
          </div>` : ''

        const titleParts = [rawName]
        if (rawDesc) titleParts.push(rawDesc)
        titleParts.push(`行动点消耗：${apCost}`)
        titleParts.push(`充能点消耗：${cpCost}`)

        return `<div class="${cls}" onclick="dispatchBattleIntent({type:'select-skill',skillId:'${escHtml(sid)}'})" title="${escHtml(titleParts.join('\n'))}">
          ${cdCover}
          <div class="sk-cost-row">
            <span class="sk-cost-orb action ${apLow ? 'low' : ''}" title="行动点消耗"><span class="resource-glyph action"></span>${apCost}</span>
            <span class="sk-cost-orb charge ${cpLow ? 'low' : ''}" title="充能点消耗"><span class="resource-glyph charge"></span>${cpCost}</span>
          </div>
          <div class="sk-icon">${icon}</div>
          <div class="sk-name">${escHtml(displayName)}</div>
          <div class="sk-type-tag ${typeCls}">${typeLabel}</div>
        </div>`
      }).join('')
    }

    function renderHand() {
      if (!G) return
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const hand = (myMeta && myMeta.hand) || []
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const ap = myMeta ? myMeta.actionPoints : 0

      document.getElementById('handCount').textContent = hand.length
      let hudHand = document.getElementById('hudHandCount')
      if (!hudHand) {
        const topbar = document.querySelector('.topbar')
        if (topbar) {
          const handBadge = document.createElement('div')
          handBadge.className = 'hud-hand'
          handBadge.title = '手牌'
          handBadge.innerHTML = '🃏 <span id="hudHandCount">0</span>'
          topbar.appendChild(handBadge)
          hudHand = document.getElementById('hudHandCount')
        }
      }
      if (hudHand) hudHand.textContent = hand.length
      const targetHint = document.getElementById('handTarget')
      targetHint.style.display = pendingCardAction ? 'inline' : 'none'

      const container = document.getElementById('handCards')
      if (!hand.length) {
        container.innerHTML = '<div class="hand-empty">暂无手牌</div>'
        return
      }

      container.innerHTML = hand.map(card => {
        const def = cardsById[card.cardId] || (G.customCards && G.customCards[card.cardId]) || {}
        const cost = card.actionPointCost ?? def.actionPointCost ?? 0
        const canPlay = isMyTurn && ap >= cost && (def.type === 'active' || def.type === 'reactive' || !def.type)
        const isPending = pendingCardAction && pendingCardAction.cardInstanceId === card.instanceId
        const isReactive = def.type === 'reactive'
        let cls = 'card-item'
        if (isPending) cls += ' card-pending'
        else if (!canPlay) cls += ' card-disabled'
        if (isReactive) cls += ' card-reactive'

        const gemCls = cost === 0 ? 'free' : ''
        const icon = def.icon || '*'
        const typeLabel = def.type === 'reactive' ? '触发' : def.type === 'passive' ? '持续' : '主动'
        const artSrc = def.image ? `images/card-art/${def.image}` : null
        const artContent = artSrc
          ? `<img src="${artSrc}" style="width:100%;height:100%;object-fit:cover;border-radius:8px 8px 0 0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none;font-size:28px;width:100%;height:100%;align-items:center;justify-content:center">${icon}</span>`
          : `<span style="font-size:28px">${icon}</span>`

        const cdTurnsCard = def.cooldownTurns ?? def.cooldown ?? 0
        const cdHtml = cdTurnsCard > 0
          ? `<span style="font-size:8px;color:#475569"> CD${cdTurnsCard}</span>` : ''

        const cid = escHtml(card.instanceId)
        const cdid = escHtml(card.cardId)
        const cardName = def.name || card.cardId
        return `<button type="button" class="${cls}"
          aria-label="${escHtml(cardName)}，行动点 ${cost}" aria-pressed="${isPending}" aria-disabled="${!canPlay}"
          onclick="onCardClick('${cid}','${cdid}')"
          ontouchstart="startCardPressTimer(event,'${cid}','${cdid}')"
          ontouchend="clearPressTimer()" ontouchmove="clearPressTimer()"
          oncontextmenu="event.preventDefault();showCardDetail('${cid}','${cdid}')">
          <div class="card-mana-gem ${gemCls}">${cost}</div>
          <div class="card-art">${artContent}</div>
          <div class="card-name-banner">${escHtml(def.name || card.cardId)}</div>
          <div class="card-body">
            <div class="card-desc">${escHtml(def.description || '暂无描述')}</div>
            <div class="card-type-badge">${typeLabel}${cdHtml}</div>
          </div>
        </button>`
      }).join('')
    }

    function onCardClick(cardInstanceId, cardId) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      if (!isMyTurn) return

      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const def = cardsById[cardId] || (G.customCards && G.customCards[cardId]) || {}
      const cost = def.actionPointCost || 0
      const ap = myMeta ? myMeta.actionPoints : 0
      if (ap < cost) { setStatusMsg('行动点不足（需要 ' + cost + '，剩余 ' + ap + '）'); return }

      // Cancel any pending skill/move
      pendingMove = false
      pendingSkill = null
      setMoveButtonClass(false)
      renderSkillBar(G && selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null)

      // Second click on same card: confirm and play
      if (pendingCardAction && pendingCardAction.cardInstanceId === cardInstanceId) {
        pendingCardAction = null
        renderHand()
        doAction({ type: 'playCard', playerId: myPlayerId, cardInstanceId })
        return
      }

      // First click: select/preview the card
      pendingCardAction = { cardInstanceId, cardId }
      renderHand()
      setStatusMsg('🃏 再次点击释放，点其他地方取消')
    }

    function renderActionBar() {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const phase = G.turn ? G.turn.phase : ''
      const inAction = phase === 'action'
      const inEnd   = phase === 'end'
      const inStart = phase === 'start'

      const _waitingForOther = pendingOptionSelectionForOther()
      const btnEnd = document.getElementById('btnEnd')
      if (btnEnd) {
        btnEnd.disabled = _waitingForOther || !isMyTurn || (!inStart && !inAction && !inEnd)
        btnEnd.textContent = inAction ? '结束回合 ->' : '继续 ->'
        btnEnd.classList.toggle('is-start', inStart || inEnd)
      }

      const _selPiece = G && G.pieces && G.pieces.find(p => p.instanceId === selectedPieceId)
      const _isOwnSelected = _selPiece && _selPiece.ownerPlayerId && _selPiece.ownerPlayerId.toLowerCase() === myPlayerId
      const _canMoveSelected = canAutoMovePiece(_selPiece)
      setMoveButtonDisabled(_waitingForOther || !isMyTurn || !selectedPieceId || !inAction || !_isOwnSelected || !_canMoveSelected)

      if (pendingSkill && pendingSkill.turnTargetActionType) {
        setStatusMsg(_targetPromptText() || '选择回合目标')
      } else if (pendingOptionSelectionForOther()) {
        setStatusMsg('等待对方选择...')
        pendingMove = false
        pendingSkill = null
        setMoveButtonClass(false)
        renderSkillBar(_selPiece || null)
      } else if (pendingOptionSelectionForMe() || pendingTargetSelectionForMe()) {
        setStatusMsg('等待你的选择')
      } else if (!isMyTurn) {
        setStatusMsg('等待对方操作 [' + (PHASE_LABELS[phase] || phase) + ']')
        pendingMove = false
        pendingSkill = null
        setMoveButtonClass(false)
        renderSkillBar(_selPiece || null)
      } else if (inEnd) {
        setStatusMsg('结束阶段：点击继续推进回合')
      } else if (inStart) {
        setStatusMsg('开始阶段处理中...')
      } else if (pendingCardAction) {
        setStatusMsg(_targetPromptText() || '选择卡牌目标')
      } else if (pendingMove) {
        setStatusMsg('点击高亮格子移动棋子')
      } else if (pendingSkill) {
        setStatusMsg(_targetPromptText() || '选择技能目标')
      } else if (selectedPieceId && _isOwnSelected) {
        setStatusMsg('已选中棋子，选择行动')
      } else if (selectedPieceId) {
        setStatusMsg('已选中棋子。右键查看详细信息')
      } else {
        setStatusMsg('选择棋子开始行动')
      }
    }

    // ── Cell click ──
    function handleBattleIntent(intent) {
      if (!intent) return
      if (intent.type === 'activate-cell') return onCellClick(intent.x, intent.y)
      if (intent.type === 'inspect-piece') return showPieceInfo(intent.pieceId)
      if (intent.type === 'select-piece') return selectPiece(intent.pieceId)
      if (intent.type === 'clear-selection') return clearPieceSelection()
      if (intent.type === 'select-skill') return selectSkillCard(intent.skillId)
      if (intent.type === 'cancel-target') return cancelTargetSelection()
      if (intent.type === 'toggle-move') return toggleMove()
    }

    function dispatchBattleIntent(intent) {
      if (battlePresentation) return battlePresentation.dispatch(intent)
      return handleBattleIntent(intent)
    }

    function onCellClick(x, y) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const piece = G.pieces.find(p => p.x === x && p.y === y && p.currentHp > 0)

      // While the other player is choosing, only allow inspecting pieces.
      if (pendingOptionSelectionForOther()) {
        if (piece) selectPiece(piece.instanceId)
        return
      }

      // Training: place piece mode
      if (TRAINING_MODE && placingMode) {
        const templateId = document.getElementById('placeTemplate')?.value
        if (!templateId) { addLog('请先选择棋子类型', 'err'); return }
        if (!templateId) { addLog('请先选择棋子类型', 'err'); return }
        const placementAllowed = currentBattleViewModel && currentBattleViewModel.legal.placementCells
          .some(cell => cell.x === x && cell.y === y)
        if (!placementAllowed) { addLog('不可放置此处', 'err'); return }
        sendPatch({ type: 'addPiece', ownerPlayerId, templateId, x, y }).then(ok => {
          if (ok) addLog('放置 ' + (PIECES_BY_ID[templateId]?.name || templateId), 'info')
        })
        return
      }

      // Pending card target selection
      if (pendingCardAction) {
        const cardPreparation = pendingCardAction.preparation
        if (cardPreparation && Array.isArray(cardPreparation.candidates)) {
          const allowed = cardPreparation.candidates.some(ref =>
            (ref.type === 'cell' && ref.x === x && ref.y === y) ||
            (ref.type === 'piece' && piece && ref.pieceId === piece.instanceId),
          )
          if (!allowed) {
            setStatusMsg('目标不在权威候选集合内')
            return
          }
        }
        let action
        const cardTargetType = cardPreparation && cardPreparation.targetType
        const hasPrimaryTarget = pendingCardAction.targetPieceId || pendingCardAction.targetX !== undefined || pendingCardAction.targetY !== undefined
        if (hasPrimaryTarget) {
          const newExtra = _targetPayloadFromCell(piece, x, y, cardTargetType)
          action = Object.assign({}, pendingCardAction, {
            extraTargets: (pendingCardAction.extraTargets || []).concat([newExtra])
          })
        } else {
          const firstTarget = { targetX: x, targetY: y }
          if (cardTargetType === 'piece' && piece) firstTarget.targetPieceId = piece.instanceId
          action = Object.assign({}, pendingCardAction, firstTarget)
        }
        delete action.clientActionId
        delete action.requestId
        delete action.preparation
        delete action.validTargets
        pendingCardAction = null
        document.getElementById('handTarget').style.display = 'none'
        doAction(action)
        return
      }

      if (pendingSkill && pendingSkill.turnTargetActionType) {
        const turnTargets = pendingSkill.validTargets
        if (turnTargets && !turnTargets.has(x + ',' + y)) {
          setStatusMsg('目标不在权威合法目标集合内')
          return
        }
        const turnTargetType = pendingSkill.preparation && pendingSkill.preparation.targetType
        const action = {
          type: pendingSkill.turnTargetActionType,
          playerId: pendingSkill.turnTargetPlayerId || myPlayerId,
          targetX: x,
          targetY: y,
          selectionId: pendingSkill.preparation && pendingSkill.preparation.selectionId,
          stateRevision: pendingSkill.preparation && pendingSkill.preparation.stateRevision,
        }
        if (turnTargetType === 'piece' && piece) action.targetPieceId = piece.instanceId
        const _pts = G && G.pendingTargetSelection
        console.log('[STAGE5] submitting ' + action.type + ' targetX=' + x + ' targetY=' + y + ' playerId=' + action.playerId + ' | G.pendingTargetSelection:', _pts ? { hasEffectCode: !!_pts.effectCode, effectCodeLen: _pts.effectCode ? _pts.effectCode.length : 0 } : null)
        addLog('[DEBUG pendingTargetClick] action=' + JSON.stringify(action) + ' pending=' + JSON.stringify(_pts ? {
          playerId: _pts.playerId,
          title: _pts.title,
          targetType: _pts.targetType,
          range: _pts.range,
          filter: _pts.filter,
          hasEffectCode: !!_pts.effectCode,
          triggerContext: _pts.triggerContext
        } : null), 'info')
        pendingSkill = null
        setStatusMsg('已提交目标选择')
        renderBoard()
        renderActionBar()
        renderTargetOverlay()
        doAction(action)
        return
      }

      if (pendingMove && selectedPieceId) {
        if (piece) {
          selectPiece(piece.instanceId)
          return
        }
        // 合法性拦截：只允许点击高亮格
        if (!validMoves.has(x + ',' + y)) {
          setStatusMsg('❌ 无法移动到该位置')
          return
        }
        doAction({ type: 'move', playerId: myPlayerId, pieceId: selectedPieceId, toX: x, toY: y })
        pendingMove = false
        setMoveButtonClass(false)
        return
      }

      if (pendingSkill && selectedPieceId) {
        // Only allow clicks on highlighted valid skill targets.
        const key = x + ',' + y
        const vt = pendingSkill.validTargets
        if (vt && !vt.has(key)) {
          // Invalid target: inspect a piece if present, otherwise show a hint.
          if (piece) { selectPiece(piece.instanceId); return }
          setStatusMsg('目标不在技能范围内')
          return
        }
        // Build action from baseAction when available, or create a fresh action.
        const skData = skillDefOf(pendingSkill.skillId)
        const isCharge = skData.type === 'super' || pendingSkill.skillType === 'super'
        const action = pendingSkill.baseAction
          ? Object.assign({}, pendingSkill.baseAction)
          : {
              type: isCharge ? 'useChargeSkill' : 'useBasicSkill',
              playerId: myPlayerId,
              pieceId: selectedPieceId,
              skillId: pendingSkill.skillId
            }
        // Set target using the first flat slot, then append later selectTarget calls to extraTargets.
        _appendTargetToAction(action, piece, x, y, pendingSkill.preparation && pendingSkill.preparation.targetType)
        pendingSkill = null
        doAction(action)
        return
      }

      // Left-click selects any piece for the compact status rail.
      // Right-click on a piece opens the detailed info modal.
      if (piece) {
        selectPiece(piece.instanceId)
      }
    }

    function clearPieceSelection() {
      selectedPieceId = null
      pendingMove = false
      pendingSkill = null
      validMoves = new Set()
      setMoveButtonClass(false)
      const pieceSelect = document.getElementById('pieceSelect')
      if (pieceSelect) pieceSelect.value = ''
      renderSkillBar(null)
      render()
    }

    function selectPiece(instanceId) {
      if (selectedPieceId === instanceId) {
        clearPieceSelection()
        return
      }
      selectedPieceId = instanceId
      pendingSkill = null
      // Sync dropdown
      const pieceSelect = document.getElementById('pieceSelect')
      if (pieceSelect) {
        const hasOption = Array.from(pieceSelect.options || []).some(opt => opt.value === instanceId)
        pieceSelect.value = hasOption ? instanceId : ''
      }
      // Render skill bar
      const sp = autoMoveSelectedIfPossible()
      renderSkillBar(sp)
      render()
    }

    function selectPieceFromDropdown() {
      const val = document.getElementById('pieceSelect')?.value
      if (val) dispatchBattleIntent({ type: 'select-piece', pieceId: val })
    }

    function toggleMove() {
      if (!selectedPieceId) return
      pendingMove = !pendingMove
      pendingSkill = null
      setMoveButtonClass(pendingMove)
      const sp = G && G.pieces.find(p => p.instanceId === selectedPieceId)
      renderBoard(); renderSkillBar(sp); renderActionBar()
    }

    // selectSkillCard: called when a skill card in the skill bar is clicked
    async function selectSkillCard(skId) {
      if (!selectedPieceId || !skId || !G) return
      const sp = G.pieces.find(p => p.instanceId === selectedPieceId)
      if (!sp) return
      const skData = skillDefOf(skId)
      const isCharge = skData.type === 'super'
      const actionType = isCharge ? 'useChargeSkill' : 'useBasicSkill'

      // Toggle off: clicking the active skill again cancels selection
      if (pendingSkill && pendingSkill.skillId === skId) {
        pendingSkill = null
        autoMoveSelectedIfPossible()
        renderBoard(); renderSkillBar(sp); renderActionBar(); renderTargetOverlay()
        return
      }

      pendingMove = false
      setMoveButtonClass(false)

      // Pre-check resources so failed clicks explain themselves before sending an action.
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      if (myMeta) {
        const apCost = skData.actionPointCost || 0
        if (apCost > 0 && (myMeta.actionPoints || 0) < apCost) {
          setStatusMsg('行动点不足（需要 ' + apCost + '，剩余 ' + (myMeta.actionPoints || 0) + '）')
          return
        }
        if (isCharge) {
          const cpCost = skData.chargeCost ?? 1
          if ((myMeta.chargePoints || 0) < cpCost) {
            setStatusMsg('充能点不足（需要 ' + cpCost + '，剩余 ' + (myMeta.chargePoints || 0) + '）')
            return
          }
        }
      }

      const draftAction = { type: actionType, playerId: myPlayerId, pieceId: selectedPieceId, skillId: skId }
      await doAction(draftAction)
    }

    async function doTurnControl() {
      if (!G || !G.turn) return
      if (G.turn.phase === 'action') {
        await doEndTurn()
      } else {
        await doBeginPhase()
      }
    }

    async function doEndTurn() {
      await doAction({ type: 'endTurn', playerId: myPlayerId })
      // If phase is now 'end', auto-advance to next player's turn
      if (G && G.turn && G.turn.phase === 'end') {
        await doBeginPhase()
      }
    }

    async function doBeginPhase() {
      await doAction({ type: 'beginPhase' })
    }

    function withClientActionId(action) {
      if (!action || action.clientActionId) return action
      window.__rvbActionSeq = (window.__rvbActionSeq || 0) + 1
      const actor = (action.playerId || myPlayerId || 'client').replace(/[^a-z0-9_-]/gi, '').slice(0, 32) || 'client'
      return Object.assign({}, action, {
        clientActionId: actor + '-' + Date.now().toString(36) + '-' + window.__rvbActionSeq
      })
    }

    async function trainingDoAction(action) {
      if (!G) return
      try {
        document.getElementById('btnEnd').disabled = true
        setMoveButtonDisabled(true)
        const oldG = G
        const newG = await trainingApiFetch('PUT', { action, battleState: G })
        G = newG
        console.log('[STAGE2.5] G updated: pendingTargetSelection=', G.pendingTargetSelection ? { playerId: G.pendingTargetSelection.playerId, hasEffectCode: !!G.pendingTargetSelection.effectCode, effectCodeLen: G.pendingTargetSelection.effectCode ? G.pendingTargetSelection.effectCode.length : 0 } : null, '| clientOwns(training-blue)=', clientOwns('training-blue'))
        console.log('[STAGE2.5b] pendingTargetSelectionForMe()=', pendingTargetSelectionForMe())
        spawnStateFloaters(oldG, G)
        flushActionLog(oldG, G)
        if (action.type === 'endTurn') {
          if (G.turn && G.turn.phase === 'end') {
            try { G = await trainingApiFetch('PUT', { action: { type: 'beginPhase' }, battleState: G }) } catch {}
          }
          myPlayerId = G.turn.currentPlayerId
          myFaction = getTrainingPlayerFaction(myPlayerId)
          const btn = document.getElementById('btnSwitchPov')
          if (btn) btn.textContent = '切换视角 ' + trainingPlayerLabel(myPlayerId)
        }
        if (action.pieceId && G.pieces.some(p => p.instanceId === action.pieceId && p.currentHp > 0)) {
          selectedPieceId = action.pieceId
        } else if (action.type === 'endTurn' || action.type === 'beginPhase') {
          selectedPieceId = null
        }
        pendingSkill = null; pendingCardAction = null
        autoMoveSelectedIfPossible()
        render(); checkClientGameOver()
      } catch (e) {
        if (e.needsTargetSelection) {
          if (!enterActionTargetMode(action, targetPreparationFromError(e))) {
            setStatusMsg('权威目标查询未返回候选集合')
          }
        } else if (e.needsOptionSelection) {
          var optionRetry = Object.assign({}, action)
          if (e.preparation && e.preparation.kind === 'needOption') {
            optionRetry.selectionId = e.preparation.selectionId
            optionRetry.stateRevision = e.preparation.stateRevision
          }
          showOptionPicker(e.title||'请选择', e.options||[], optionRetry)
        } else {
          const errMsg = e.message || String(e) || '操作失败'
          addLog('[ERROR] action=' + action.type + ' error=' + errMsg, 'err')
          setStatusMsg(errMsg)
          pendingSkill = null; pendingMove = false
        }
        renderActionBar()
      }
    }

    async function doAction(action) {
      action = withClientActionId(action)
      var authorityTrace = null
      if (TRAINING_MODE) { await trainingDoAction(action); return }
      const url = getServerUrl()
      if (!url) { addLog('未连接服务器', 'err'); return }
      if (!G) { addLog('游戏状态未就绪', 'err'); return }
      try {
        document.getElementById('btnEnd').disabled = true
        setMoveButtonDisabled(true)
        if (action.type === 'endTurn') addLog('正在结束回合...', 'info')

        if (typeof GameEngine !== 'undefined' && GameEngine.safeCloneBattleState) {
          try {
            authorityTrace = runDeterministicAuthorityAction(GameEngine.safeCloneBattleState(G), action).trace || null
          } catch (e) {
            if (enterActionTargetMode(action, targetPreparationFromError(e))) return
            throw e
          }
        }

        // Relay guest: submit action via WS, wait for stateUpdate.
        if (wsMode === 'relay' && wsRole === 'guest') {
          relaySeq++
          RvBWs.send({ type: 'action', seq: relaySeq, action, prevStateHash: '', trace: authorityTrace })
          if (action.pieceId && G.pieces.some(p => p.instanceId === action.pieceId && p.currentHp > 0)) {
            selectedPieceId = action.pieceId
          } else if (action.type === 'endTurn' || action.type === 'beginPhase') { selectedPieceId = null }
          pendingSkill = null; pendingCardAction = null; autoMoveSelectedIfPossible()
          return
        }

        // Relay host: apply locally + push stateUpdate.
        if (wsMode === 'relay' && wsRole === 'host' && G &&
            typeof GameEngine !== 'undefined' && GameEngine.runBattleAction) {
          try {
            const result = runDeterministicAuthorityAction(G, action)
            const newG = result.state
            if (action.pieceId && newG.pieces.some(p => p.instanceId === action.pieceId && p.currentHp > 0)) {
              selectedPieceId = action.pieceId
            } else if (action.type === 'endTurn' || action.type === 'beginPhase') { selectedPieceId = null }
            pendingSkill = null; pendingCardAction = null; autoMoveSelectedIfPossible()
            applyServerState(newG, gameSeed)
            relaySeq++
            RvBWs.send({ type: 'stateUpdate', seq: relaySeq, state: newG, seed: gameSeed, stateHash: result.stateHash })
          } catch (e) {
            if (!enterActionTargetMode(action, targetPreparationFromError(e))) {
              addLog('本地处理失败：' + e.message, 'err')
              renderActionBar()
            }
          }
          return
        }

        // LAN WS: submit action via WS only.
        if (wsConnected && typeof RvBWs !== 'undefined' && RvBWs.isConnected()) {
          RvBWs.send({ type: 'action', action, playerId: myPlayerId, trace: authorityTrace })
          if (action.pieceId && G.pieces.some(p => p.instanceId === action.pieceId && p.currentHp > 0)) {
            selectedPieceId = action.pieceId
          } else if (action.type === 'endTurn' || action.type === 'beginPhase') { selectedPieceId = null }
          pendingSkill = null; pendingCardAction = null; autoMoveSelectedIfPossible()
          return
        }

        addLog('WebSocket 未连接，无法发送动作；请检查网络和服务端', 'err')
        setStatusMsg('WebSocket 未连接')
        renderActionBar()
      } catch (e) {
        addLog('发送动作失败：' + e.message, 'err')
        renderActionBar()
      }
    }

    function actionLabel(a) {
      if (a.type === 'endTurn') return '结束回合'
      if (a.type === 'move') return '移动至 (' + a.to.x + ',' + a.to.y + ')'
      if (a.type === 'useBasicSkill' || a.type === 'useChargeSkill') {
        const sk = skillDefOf(a.skillId)
        return '使用技能：' + (sk ? sk.name : a.skillId)
      }
      if (a.type === 'playCard') {
        const def = cardsById[a.cardId] || {}
        return '打出手牌：' + (def.name || a.cardInstanceId)
      }
      return a.type
    }
    function actionClass(a) {
      if (a.type === 'move') return 'move'
      if (a.type.includes('kill')) return 'skill'
      if (a.type === 'endTurn') return 'turn'
      return 'info'
    }

    function checkClientGameOver() {
      if (!G || G.gameOver || G.winner) return
      const livingOwners = new Set(G.pieces.filter(p => p.currentHp > 0).map(p => p.ownerPlayerId))
      const playerIds = (G.players || []).map(p => p.playerId).filter(Boolean)
      const defeated = playerIds.filter(playerId => !livingOwners.has(playerId))
      if (defeated.length === 1 && playerIds.length === 2) {
        G.winner = playerIds.find(playerId => playerId !== defeated[0])
        G.gameOver = true
        handleGameOver()
      }
    }

    function handleGameOver() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      // Notify the WS server about gameOver before disconnecting so it can record the game.
      if (!TRAINING_MODE && !SPECTATE_MODE && G && (G.winner || G.gameOver) &&
          typeof RvBWs !== 'undefined' && RvBWs.isConnected()) {
        try { RvBWs.send({ type: 'gameOver', playerId: myPlayerId, winner: G.winner || 'draw' }) } catch {}
      }
      if (typeof RvBWs !== 'undefined') RvBWs.disconnect()
      try { localStorage.removeItem('rvb_active_battle') } catch {}
      if (recordSaved) return
      recordSaved = true
      if (!TRAINING_MODE && !SPECTATE_MODE) {
      // Save battle record locally
      try {
        const identity = (typeof RvBIdentity !== 'undefined') ? RvBIdentity.getIdentity() : null
        if (identity && G) {
          const winner = G.winner
          const myResult = winner
            ? (winner === myFaction || winner === myPlayerId ? 'win' : 'loss')
            : 'draw'
          const oppPlayer = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() !== myPlayerId)
          const record = {
            gameId: roomId + '-' + Date.now(),
            timestamp: Date.now(),
            result: myResult,
            myFaction,
            myPlayerId,
            opponentName: (oppPlayer && (playerNames[oppPlayer.playerId] || oppPlayer.name)) || '对手',
            opponentId: oppPlayer ? oppPlayer.playerId : null,
          }
          const records = JSON.parse(localStorage.getItem('rvb_battle_records') || '[]')
          records.push(record)
          // Keep last 200 records
          if (records.length > 200) records.splice(0, records.length - 200)
          localStorage.setItem('rvb_battle_records', JSON.stringify(records))
        }
      } catch {}
      // gameOver notification is sent before disconnect.
      }
      const winner = G.winner
      const iWon = winner && (
        winner.toLowerCase() === myFaction ||
        winner.toLowerCase() === myPlayerId
      )
      const isDraw = !winner
      const winnerLabel = winner
        ? (playerNames[String(winner).toLowerCase()] || winner)
        : ''
      document.getElementById('resultIcon').textContent = isDraw ? '=' : (iWon ? 'WIN' : 'LOSE')
      document.getElementById('resultTitle').textContent = isDraw ? '平局' : (iWon ? '胜利' : '失败')
      document.getElementById('resultSub').textContent = (winnerLabel ? winnerLabel + ' 获胜 - ' : '') + '第 ' + (G.turn ? G.turn.turnNumber : '?') + ' 回合结束'
      if (TRAINING_MODE) {
        // Replace the lobby button with restart in training mode.
        const overlay = document.getElementById('resultOverlay')
        overlay.querySelector('button[onclick="goBack()"]')?.remove()
        const restartBtn = document.createElement('button')
        restartBtn.style.cssText = 'background:#1d4ed8;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px'
        restartBtn.textContent = '重新开始'
        restartBtn.onclick = () => { overlay.style.display = 'none'; showTrainingSetup() }
        overlay.appendChild(restartBtn)
      }
      document.getElementById('resultOverlay').style.display = 'flex'
      if (!TRAINING_MODE && !SPECTATE_MODE) {
      // Sign game record asynchronously
      _signGameRecord()
      }
    }

    var _signedRecord = null

    async function _signGameRecord() {
      if (!window.RvBIdentity) return
      const identity = RvBIdentity.getIdentity()
      if (!identity) return
      const statusEl = document.getElementById('recordStatus')
      try {
        statusEl.textContent = '正在获取战报...'
        // Wait a moment for server to finalize the game record
        await new Promise(r => setTimeout(r, 800))
        if (!window.RvBWs || !RvBWs.isConnected || !RvBWs.isConnected() || !RvBWs.request) {
          statusEl.textContent = ''
          return
        }
        const record = await RvBWs.request('gameRecord.get', { roomId }, 5000)
        if (record.error) { statusEl.textContent = ''; return }

        // Sign the record (without signatures field)
        const { signatures: _s, ...recordToSign } = record
        statusEl.textContent = '正在签名战报...'
        const publicKey = RvBIdentity.getPublicKey()
        const signature = await RvBIdentity.sign(recordToSign)

        // Submit signature
        const submitData = await RvBWs.request('gameRecord.sign', { roomId, playerId: identity.id, publicKey, signature }, 5000)
        const count = submitData?.signaturesCount || 1
        statusEl.textContent = '已签名 (' + count + '/2)'

        // Store full record for download
        _signedRecord = { ...record, signatures: { ...(record.signatures || {}), [identity.id]: signature } }
        document.getElementById('recordDownloadBtn').style.display = 'inline-block'
      } catch { statusEl.textContent = '' }
    }

    function downloadGameRecord() {
      if (!_signedRecord) return
      const blob = new Blob([JSON.stringify(_signedRecord, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'rvb-record-' + (_signedRecord.gameId || Date.now()) + '.json'
      a.click()
      URL.revokeObjectURL(url)
    }

    // ── Helpers ──
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    function setStatusMsg(msg) {
      const el = document.getElementById('statusMsg')
      if (el) el.textContent = msg
    }
    function showMsg(msg, type) {
      const loadingMsg = document.getElementById('loadingMsg')
      const spinner = document.querySelector('#loadingOverlay .spinner')
      loadingMsg.textContent = msg
      loadingMsg.style.color = type === 'err' ? '#f87171' : '#64748b'
      if (spinner) spinner.style.display = type === 'err' ? 'none' : ''
    }
    function openLog() { document.getElementById('logOverlay').classList.add('show') }
    function closeLog() { document.getElementById('logOverlay').classList.remove('show') }
    function addLog(msg, cls) {
      const body = document.getElementById('logBody')
      if (!body) return
      const p = document.createElement('p')
      p.className = 'log-' + (cls || 'info')
      p.textContent = msg
      body.appendChild(p)
      body.scrollTop = body.scrollHeight
    }
    function clearLog() { const b = document.getElementById('logBody'); if (b) b.innerHTML = '' }
    function goBack() {
      if (TRAINING_MODE) { window.location.href = 'index.html'; return }
      // Carry current server mode/url back to the lobby.
      try {
        const p = window.RvBUtils && RvBUtils.appendServerParams
          ? RvBUtils.appendServerParams(new URLSearchParams())
          : new URLSearchParams()
        p.set('v', Date.now().toString())
        window.location.href = 'lobby.html?' + p.toString()
      } catch {
        window.location.href = 'lobby.html'
      }
    }
    function confirmLeave() {
      if (TRAINING_MODE || !G || G.gameOver || G.winner) { goBack(); return }
      goBack()
    }

    // ── Map pan / zoom ───────────────────────────────────────────────────────
    let mapViewScale = 1
    let mapViewX = 0
    let mapViewY = 0
    let isPanning = false
    const activePointers = new Map()
    let lastPanPoint = null
    let lastPinchDistance = 0
    let mapClickSuppressed = false

    function getMapTarget() {
      return document.querySelector('.board-stage')
    }
    function applyMapView() {
      const target = getMapTarget()
      if (!target) return
      target.style.transform = `translate(${mapViewX}px, ${mapViewY}px) scale(${mapViewScale})`
    }
    function resetMapView() {
      mapViewScale = 1
      mapViewX = 0
      mapViewY = 0
      applyMapView()
    }

    function resetBoardView() {
      if (_use3d && battlePresentation && battlePresentation.resetView) {
        battlePresentation.resetView()
      } else {
        resetMapView()
      }
      setStatusMsg('棋盘镜头已复位')
    }

    function toggleBattleDetail() {
      const collapsed = document.body.classList.toggle('battle-detail-collapsed')
      const button = document.getElementById('btnToggleBattleDetail')
      if (button) {
        button.setAttribute('aria-pressed', String(!collapsed))
        button.title = collapsed ? '显示棋子详情栏' : '隐藏棋子详情栏'
      }
      requestAnimationFrame(function () {
        if (battlePresentation) battlePresentation.resize()
      })
    }
    function clampMapScale(v) {
      return Math.max(1, Math.min(2.5, v))
    }
    function pointerDistance() {
      const pts = Array.from(activePointers.values())
      if (pts.length < 2) return 0
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)
    }
    function initMapControls() {
      const wrap = document.getElementById('boardWrap')
      if (!wrap || wrap.dataset.mapControlsReady === '1') return
      wrap.dataset.mapControlsReady = '1'
      wrap.addEventListener('pointerdown', e => {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
        if (activePointers.size >= 2) {
          lastPinchDistance = pointerDistance()
          mapClickSuppressed = true
          try { wrap.setPointerCapture(e.pointerId) } catch {}
          e.preventDefault()
          return
        }
        if (mapViewScale > 1 || e.target === wrap || e.target.id === 'gameGrid') {
          isPanning = mapViewScale > 1
          lastPanPoint = { x: e.clientX, y: e.clientY }
          try { wrap.setPointerCapture(e.pointerId) } catch {}
        }
      })
      wrap.addEventListener('pointermove', e => {
        if (!activePointers.has(e.pointerId)) return
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
        if (activePointers.size >= 2) {
          const dist = pointerDistance()
          if (lastPinchDistance > 0 && dist > 0) {
            const nextScale = clampMapScale(mapViewScale * (dist / lastPinchDistance))
            mapViewScale = nextScale
            applyMapView()
          }
          lastPinchDistance = dist
          mapClickSuppressed = true
          e.preventDefault()
          return
        }
        if (isPanning && lastPanPoint && mapViewScale > 1) {
          const dx = e.clientX - lastPanPoint.x
          const dy = e.clientY - lastPanPoint.y
          if (Math.abs(dx) + Math.abs(dy) > 2) {
            mapViewX += dx
            mapViewY += dy
            lastPanPoint = { x: e.clientX, y: e.clientY }
            mapClickSuppressed = true
            wrap.classList.add('dragging')
            applyMapView()
          }
          e.preventDefault()
        }
      }, { passive: false })
      function endPointer(e) {
        activePointers.delete(e.pointerId)
        if (activePointers.size < 2) lastPinchDistance = 0
        if (!activePointers.size) {
          isPanning = false
          lastPanPoint = null
          wrap.classList.remove('dragging')
          if (mapClickSuppressed) setTimeout(() => { mapClickSuppressed = false }, 60)
        }
      }
      wrap.addEventListener('pointerup', endPointer)
      wrap.addEventListener('pointercancel', endPointer)
      wrap.addEventListener('click', e => {
        if (!mapClickSuppressed) return
        e.preventDefault()
        e.stopPropagation()
      }, true)
      wrap.addEventListener('dblclick', e => {
        resetMapView()
        e.preventDefault()
      })
      wrap.addEventListener('wheel', e => {
        if (!e.ctrlKey && Math.abs(e.deltaY) < Math.abs(e.deltaX)) return
        const prev = mapViewScale
        const next = clampMapScale(prev * (e.deltaY < 0 ? 1.1 : 0.9))
        if (next === prev) return
        mapViewScale = next
        applyMapView()
        e.preventDefault()
      }, { passive: false })
    }

    // ── Start ──
    // ── Dynamic cell sizing ───────────────────────────────────────────────────
    function recalcCellSize() {
      if (_use3d && battlePresentation) { battlePresentation.resize(); return }
      if (!G || !G.map) return
      const cols = G.map.width
      const rows = G.map.height
      const wrap = document.getElementById('boardWrap')
      if (!wrap) return
      const railW = document.querySelector('.board-side-rail')?.offsetWidth || 0
      const availW = wrap.clientWidth - railW - 28
      const topbarH = document.querySelector('.topbar')?.offsetHeight || 44
      const phaseH  = document.querySelector('.phase-bar')?.offsetHeight || 0
      const actionH = document.querySelector('.action-bar')?.offsetHeight || 0
      const trainingBarH = document.getElementById('trainingBar')?.offsetHeight || 0
      const skillBarH = document.getElementById('skillBar')?.offsetHeight || 0
      const availH  = window.innerHeight - topbarH - phaseH - actionH - trainingBarH - skillBarH - 20
      const byW = Math.floor(availW / cols)
      const byH = Math.floor(availH / rows)
      const sz = Math.max(28, Math.min(72, byW, byH))
      document.documentElement.style.setProperty('--cell-size', sz + 'px')
      const grid = document.getElementById('gameGrid')
      if (grid) grid.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell-size, 44px))'
    }
    window.addEventListener('resize', recalcCellSize)

    // ── Fullscreen map mode ───────────────────────────────────────────────────
    let fullMapMode = false
    function toggleFullMap() {
      fullMapMode = !fullMapMode
      document.body.classList.toggle('full-map', fullMapMode)
      document.getElementById('btnFullMap').textContent = fullMapMode ? '退出全图' : '全图'
      setTimeout(recalcCellSize, 50)
    }

    // ── Collapsible sections (log / hand) ─────────────────────────────────────
    function toggleSection(section) {
      if (section === 'log') {
        const body = document.getElementById('logBody')
        const arrow = document.getElementById('logArrow')
        const open = !body.classList.contains('collapsed')
        body.classList.toggle('collapsed', open)
        if (arrow) { arrow.textContent = open ? '>' : 'v'; arrow.classList.toggle('open', !open) }
      } else if (section === 'hand') {
        const body = document.getElementById('handBody')
        const arrow = document.getElementById('handArrow')
        const open = !body.classList.contains('collapsed')
        body.classList.toggle('collapsed', open)
        if (arrow) { arrow.textContent = open ? '>' : 'v'; arrow.classList.toggle('open', !open) }
      }
      setTimeout(recalcCellSize, 50)
    }

    window.addEventListener('load', () => {
      const hasThreeRenderer = !!(window.THREE && window.BattleRenderer3D)
      const renderer = hasThreeRenderer ? window.BattleRenderer3D : {
        init() {}, update() {}, resize() {}, resetView() {}, projectCell() { return null },
        screenToCell() { return null }, dispose() {}, animateAction() {}, spawnFloater() {},
      }
      const domUi = BattleDomUI.create({ document, onTurnAnnounce: showTurnAnnounce })
      battlePresentation = BattlePresentation.create({ renderer, domUi, onIntent: handleBattleIntent })
      battlePresentation.mount({
        boardContainer: document.getElementById('boardStage3d'),
        floatLayer: document.getElementById('floatLayer'),
      })
      _use3d = hasThreeRenderer
      if (!_use3d) initMapControls()
      init()

      function shouldCancelPendingCardTarget(pendingAction, target) {
        if (!pendingAction) return false
        if (!target || typeof target.closest !== 'function') return true
        // A battlefield pointerup can synchronously advance a card to its next
        // target step before the matching click bubbles to document.
        return !target.closest('.card-item, #boardWrap, #targetOverlay')
      }

      // Click outside the hand and battlefield to cancel card targeting.
      document.addEventListener('click', function(e) {
        if (!shouldCancelPendingCardTarget(pendingCardAction, e.target)) return
        pendingCardAction = null
        renderHand()
        renderBoard()
        renderTargetOverlay()
      }, false)

      // 修复手机端棋子属性弹窗关闭按钮
      // Close piece info modal when tapping the backdrop on mobile.
      const pieceModal = document.getElementById('pieceInfoModal')
      if (pieceModal) {
        pieceModal.addEventListener('touchend', function(e) {
          if (e.target === pieceModal) { e.preventDefault(); closePieceInfo() }
        }, { passive: false })
        const piClose = pieceModal.querySelector('.pi-close')
        if (piClose) {
          piClose.addEventListener('touchend', function(e) {
            e.preventDefault(); e.stopPropagation(); closePieceInfo()
          }, { passive: false })
        }
      }

      // 修复手机端卡牌详情弹窗关闭按钮
      const cardModal = document.getElementById('cardDetailModal')
      if (cardModal) {
        cardModal.addEventListener('touchend', function(e) {
          if (e.target === cardModal) { e.preventDefault(); closeCardDetail() }
        }, { passive: false })
        const cdClose = cardModal.querySelector('.cd-close')
        if (cdClose) {
          cdClose.addEventListener('touchend', function(e) {
            e.preventDefault(); e.stopPropagation(); closeCardDetail()
          }, { passive: false })
        }
      }
    })
    function disposeBattlePage() {
      if (pollTimer) clearInterval(pollTimer)
      pollTimer = null
      if (battlePresentation) battlePresentation.dispose()
    }
    window.addEventListener('pagehide', disposeBattlePage)
    window.addEventListener('unload', disposeBattlePage)

    // ── Debug modifier panel (backtick key toggle) ────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === '`' || e.key === '~') {
        const p = document.getElementById('debugPanel')
        if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none'
      }
    })
    function _debugMyPlayer() {
      if (!G || !myPlayerId) return null
      return G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
    }
    function debugSetAP(n) {
      const mp = _debugMyPlayer(); if (!mp) return
      mp.actionPoints = Math.max(0, (mp.actionPoints || 0) + n)
      render(); addLog('[修改器] AP +' + n, 'info')
    }
    function debugSetCP(n) {
      const mp = _debugMyPlayer(); if (!mp) return
      mp.chargePoints = Math.max(0, (mp.chargePoints || 0) + n)
      render(); addLog('[修改器] CP +' + n, 'info')
    }
    function debugHealSelected(hp) {
      if (!G || !selectedPieceId) { addLog('[修改器] 未选中棋子', 'err'); return }
      const p = G.pieces && G.pieces.find(pc => pc.instanceId === selectedPieceId)
      if (!p) return
      const max = p.maxHp || (p.stats && p.stats.maxHp) || 1
      p.currentHp = Math.min(max, (p.currentHp || 0) + hp)
      render(); addLog('[修改器] 治疗 ' + (p.name || p.instanceId), 'info')
    }
    function debugKillSelected() {
      if (!G || !selectedPieceId) { addLog('[修改器] 未选中棋子', 'err'); return }
      const p = G.pieces && G.pieces.find(pc => pc.instanceId === selectedPieceId)
      if (!p) return
      p.currentHp = 0
      render(); addLog('[修改器] 击杀 ' + (p.name || p.instanceId), 'info')
    }
    function debugResetCooldowns() {
      if (!G) return
      const mp = _debugMyPlayer(); if (!mp) return
      const myPieces = G.pieces && G.pieces.filter(p => p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId)
      if (!myPieces) return
      myPieces.forEach(p => {
        if (p.skills) p.skills.forEach(sk => { sk.currentCooldown = 0 })
      })
      render(); addLog('[修改器] 已重置所有CD', 'info')
    }
  </script>

  <!-- Debug modifier panel (toggle with ` key) -->
  <div id="debugPanel" style="display:none;position:fixed;top:56px;right:10px;
    background:rgba(0,0,0,.88);padding:12px 14px;border-radius:10px;z-index:9999;
    color:#e2e8f0;border:1px solid #334155;min-width:160px;font-size:13px">
    <div style="font-weight:700;margin-bottom:10px;color:#94a3b8;font-size:11px;letter-spacing:.08em">局内修改器</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button onclick="debugSetAP(3)"  style="background:#1e3a8a;border:1px solid #3b82f6;border-radius:6px;color:#bfdbfe;padding:5px 8px;cursor:pointer;font-size:12px">AP +3</button>
      <button onclick="debugSetAP(-1)" style="background:#1e293b;border:1px solid #475569;border-radius:6px;color:#94a3b8;padding:5px 8px;cursor:pointer;font-size:12px">AP -1</button>
        <div class="legend-item"><div class="legend-dot" style="background:#3b0764"></div>充能点</div>
      <button onclick="debugHealSelected(999)" style="background:#052e16;border:1px solid #22c55e;border-radius:6px;color:#4ade80;padding:5px 8px;cursor:pointer;font-size:12px">满血 (选中棋子)</button>
      <button onclick="debugKillSelected()"    style="background:#450a0a;border:1px solid #991b1b;border-radius:6px;color:#fca5a5;padding:5px 8px;cursor:pointer;font-size:12px">击杀 (选中棋子)</button>
      <button onclick="debugResetCooldowns()"  style="background:#1a1205;border:1px solid #b45309;border-radius:6px;color:#fbbf24;padding:5px 8px;cursor:pointer;font-size:12px">重置所有 CD</button>
    </div>
    <div style="margin-top:8px;font-size:10px;color:#475569">按 ` 切换</div>
  </div>

  <!-- Target selection overlay (pointer-events:none so board stays clickable) -->
  <div id="targetOverlay">
    <div class="target-prompt" id="targetPromptText">选择目标</div>
    <button class="target-cancel-btn" onclick="dispatchBattleIntent({type:'cancel-target'})">取消</button>
  </div>

  <!-- Fullscreen log overlay -->
  <div id="logOverlay">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #334155;flex-shrink:0;background:#070f1e">
      <div style="font-size:15px;font-weight:700;color:#e2e8f0">📜 战斗日志</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="clearLog()" style="background:none;border:1px solid #334155;border-radius:6px;color:#64748b;padding:4px 10px;font-size:12px;cursor:pointer">清空</button>
        <button onclick="closeLog()" style="background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;padding:0 4px">✕</button>
      </div>
    </div>
    <div id="logBody" style="flex:1;overflow-y:auto;padding:10px 16px;font-size:13px;"></div>
  </div>

  <!-- Surrender confirm overlay -->
  <div id="surrenderConfirmOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center">
    <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:28px 24px;max-width:300px;width:90%;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">🏳️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#e2e8f0">确认投降？</div>
      <div style="font-size:13px;color:#94a3b8;margin-bottom:20px">这将立即结束对战。</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="cancelSurrender()" style="flex:1;padding:10px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;font-size:14px;cursor:pointer">取消</button>
        <button onclick="doSurrender()" style="flex:1;padding:10px;background:#dc2626;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">投降</button>
      </div>
    </div>
  </div>

</body>
</html>
