    function renderBoard() {
      if (!G || !G.map) return
      const grid = document.getElementById('gameGrid')
      const { width, height, tiles } = G.map
      recalcCellSize()
      grid.style.gridTemplateColumns = 'repeat(' + width + ', var(--cell-size, 44px))'

      // Build cell map for quick lookup
      const cellMap = {}
      G.pieces.forEach(p => { if (p.currentHp > 0) cellMap[p.x + ',' + p.y] = p })

      // Compute highlights
      const hlMove = new Set(), hlSkill = new Set(), hlPlace = new Set()
      if (TRAINING_MODE && placingMode) {
        tiles.forEach(t => { if (t.props && t.props.walkable && !cellMap[t.x + ',' + t.y]) hlPlace.add(t.x + ',' + t.y) })
      }
      const sp = selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null
      validMoves = new Set()
      if (sp && pendingMove) {
        const range = (sp.moveRange !== undefined ? sp.moveRange : ((sp.stats && sp.stats.moveRange) || 3))
        const tileMap = {}
        tiles.forEach(t => { tileMap[t.x + ',' + t.y] = t })
        // 四方向射线扫描，遇墙停止（服务器规则：车式直线移动，可穿越棋子但不可落点）
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          for (let step = 1; step <= range; step++) {
            const x = sp.x + dx * step, y = sp.y + dy * step
            const key = x + ',' + y
            const t = tileMap[key]
            if (!t || !t.props || !t.props.walkable) break  // 墙，停止扫描
            if (!cellMap[key]) validMoves.add(key)          // 落点：未被占用才高亮
            // 有棋子占据时仍继续扫描（可穿越），但该格不可落点
          }
        }
        validMoves.forEach(k => hlMove.add(k))
      }
      if (sp && pendingSkill) {
        (pendingSkill.validTargets || new Set()).forEach(k => hlSkill.add(k))
      }

      const cells = []
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const tile = tiles.find(t => t.x === x && t.y === y)
          const ttype = tile ? (tile.props && tile.props.type ? tile.props.type : (tile.type || 'floor')) : 'floor'
          const tclass = TILE_CLASS[ttype] || 't-floor'
          const key = x + ',' + y
          const piece = cellMap[key]
          const isSel = piece && piece.instanceId === selectedPieceId

          let cls = 'cell ' + tclass
          if (isSel) cls += ' hl-selected'
          else if (hlMove.has(key)) cls += ' hl-move'
          else if (hlSkill.has(key)) cls += ' hl-skill'
          else if (hlPlace.has(key)) cls += ' hl-place'

          // Tile overlay effects (e.g. Shishio burn tiles)
          const tileEfx = G && G.extensions && G.extensions.tileEffects &&
            G.extensions.tileEffects.find(te => te.x === x && te.y === y)
          let cellStyle = ''
          let tileEfxHtml = ''
          if (tileEfx) {
            if (tileEfx.bgColor) cellStyle += `background:${tileEfx.bgColor};`
            if (tileEfx.boxShadow) cellStyle += `box-shadow:${tileEfx.boxShadow};`
            if (tileEfx.icon) {
              const ip = tileEfx.iconPosition || 'bottom-right'
              const ipStyle = ip === 'bottom-right' ? 'bottom:1px;right:1px' : 'top:1px;right:1px'
              tileEfxHtml = `<span style="position:absolute;${ipStyle};font-size:10px;line-height:1;pointer-events:none">${tileEfx.icon}</span>`
            }
          }

          let inner = ''
          if (piece) {
            const maxHp = pieceMaxHp(piece)
            const pct = Math.max(0, Math.round(pieceDispHp(piece) / maxHp * 100))
            const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
            const faction = piece.faction || 'red'
            const tokCls = 'piece-tok ' + faction + (isSel ? ' selected-tok' : '')

            // StatusTags (use displayStatusTags for clones)
            const tags = pieceDispTags(piece).filter(t => t.visible !== false)
            const tagsHtml = tags.map(t => `<span class="status-tag" title="${escHtml(t.id || '')}">${escHtml(t.name || t.type || t.id || '?')}</span>`).join('')

            const tmpl = PIECES_BY_ID[piece.templateId]
            const imgSrc = tmpl && tmpl.image ? 'images/' + tmpl.image : null
            const imgHtml = imgSrc
              ? `<img src="${imgSrc}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" style="width:100%;height:100%;object-fit:cover;border-radius:4px">`
              : ''
            inner = `<div class="${tokCls}">
              <div class="piece-tags">${tagsHtml}</div>
              ${imgHtml}
              <span class="piece-tok-ph" style="${imgSrc?'display:none':'display:flex'}">${faction==='red'?'🔴':'🔵'}</span>
              <div class="tok-hp-bar"><div class="tok-hp-fill ${fillCls}" style="width:${pct}%"></div></div>
            </div>`
          }
          const _ctxAttr = piece ? ` oncontextmenu="event.preventDefault();showPieceInfo('${escHtml(piece.instanceId)}')"` : ''
          cells.push(`<div class="${cls}"${cellStyle ? ` style="${cellStyle}"` : ''} onclick="onCellClick(${x},${y})"${_ctxAttr}>${tileEfxHtml}${inner}</div>`)
        }
      }
      grid.innerHTML = cells.join('')
    }

    // Sort pieces so summons appear adjacent to their summoner
    function sortWithSummons(pieces) {
      const mains = pieces.filter(p => !p.summonedByInstanceId && !p.summonerInstanceId)
      const summons = pieces.filter(p => p.summonedByInstanceId || p.summonerInstanceId)
      const result = []
      for (const main of mains) {
        const mine = summons.filter(s =>
          s.summonedByInstanceId === main.instanceId ||
          s.summonerInstanceId === main.instanceId
        )
        // Stable "random" above/below: use last char code of instanceId
        const code = main.instanceId ? main.instanceId.charCodeAt(main.instanceId.length - 1) : 0
        if (code % 2 === 0) {
          result.push(...mine, main)   // summons above
        } else {
          result.push(main, ...mine)   // summons below
        }
      }
      // Any unmatched summons at end
      for (const s of summons) { if (!result.includes(s)) result.push(s) }
      return result
    }

    function renderPanels() {
      if (!G) return
      // Determine which player is me
      const myPieces = sortWithSummons(
        G.pieces.filter(p => p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId)
      )
      const oppPieces = sortWithSummons(
        G.pieces.filter(p => !(p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId))
      )

      // Update labels — use player name if available
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const oppMeta = G.players && G.players.find(p => !(p.playerId && p.playerId.toLowerCase() === myPlayerId))
      const factionIcon = myFaction === 'red' ? '🔴' : '🔵'
      const oppIcon = myFaction === 'red' ? '🔵' : '🔴'
      const myName = myPlayerName || playerNames[myPlayerId] || (myFaction === 'red' ? '我方' : '我方')
      const oppPid = oppMeta && (oppMeta.playerId || '').toLowerCase()
      const oppName = (oppPid && playerNames[oppPid]) || (oppMeta && oppMeta.name) || (myFaction === 'red' ? '对方' : '对方')
      document.getElementById('myLabel').textContent = factionIcon + ' ' + myName
      document.getElementById('oppLabel').textContent = oppIcon + ' ' + oppName

      document.getElementById('myPieces').innerHTML = myPieces.map(p => renderPieceCard(p, true)).join('')
      document.getElementById('oppPieces').innerHTML = oppPieces.map(p => renderPieceCard(p, false)).join('')

      // Update piece select dropdown
      const sel = document.getElementById('pieceSelect')
      const prev = sel.value
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      if (isMyTurn) {
        sel.innerHTML = '<option value="">— 选棋子 —</option>' +
          myPieces.filter(p => p.currentHp > 0).map(p => {
            const tmpl = PIECES_BY_ID[p.templateId]
            const name = p.name || (tmpl && tmpl.name) || p.templateId
            return `<option value="${p.instanceId}">${escHtml(name)} HP:${p.currentHp}</option>`
          }).join('')
        if (prev && myPieces.find(p => p.instanceId === prev && p.currentHp > 0)) sel.value = prev
      } else {
        sel.innerHTML = '<option value="">— 对方回合 —</option>'
      }

      // Update skill bar
      const _skillBarPiece = selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null
      renderSkillBar(_skillBarPiece)
    }

    function renderPieceCard(piece, isMe) {
      const mhp = pieceMaxHp(piece)
      const dispHp = pieceDispHp(piece)
      const pct = Math.max(0, Math.round(dispHp / mhp * 100))
      const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
      const dead = piece.currentHp <= 0
      const sel = piece.instanceId === selectedPieceId && isMe
      const stats = pieceDispStats(piece)

      const tags = pieceDispTags(piece).filter(t => t.visible !== false)
      const tagsHtml = tags.map(t => {
        const label = t.name || t.type || t.id || '?'
        const stacks = t.stacks ? `×${t.stacks}` : (t.duration ? `${t.duration}T` : '')
        return `<span class="status-tag" title="${escHtml(t.id||'')}">${escHtml(label)}${stacks ? ' ' + stacks : ''}</span>`
      }).join('')

      const tmpl = PIECES_BY_ID[piece.templateId]
      const displayName = piece.name || (tmpl && tmpl.name) || piece.templateId
      const imgSrc = tmpl && tmpl.image ? 'images/' + tmpl.image : null
      const onclick = isMe && !dead ? `onclick="selectPiece('${piece.instanceId}')"` : `onclick="showPieceInfo('${escHtml(piece.instanceId)}')" `
      const iid = escHtml(piece.instanceId)
      return `<div class="piece-card ${dead?'dead':''} ${sel?'selected':''}" ${onclick}
        ontouchstart="startPressTimer(event,'${iid}')"
        ontouchend="clearPressTimer()" ontouchmove="clearPressTimer()"
        oncontextmenu="event.preventDefault();showPieceInfo('${iid}')">
        <button class="piece-info-btn" onclick="event.stopPropagation();showPieceInfo('${iid}')">ⓘ</button>
        ${imgSrc ? `<img src="${imgSrc}" onerror="this.style.display='none'" style="width:100%;height:40px;object-fit:cover;border-radius:5px;margin-bottom:3px">` : ''}
        <div class="piece-card-name">${escHtml(displayName)}</div>
        <div class="piece-card-hp">${dispHp}/${mhp} HP</div>
        <div class="hp-bar"><div class="hp-fill ${fillCls}" style="width:${pct}%"></div></div>
        <div class="res-row">⚔${stats.attack??'?'} 🛡${stats.defense??'?'} 👟${stats.moveRange??'?'}</div>
        ${tagsHtml ? '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:3px">' + tagsHtml + '</div>' : ''}
      </div>`
    }

    function renderSkillBar(piece) {
      const bar = document.getElementById('skillBar')
      if (!bar) return
      if (!piece || piece.currentHp <= 0) { bar.style.display = 'none'; return }

      const isMyTurn = G && G.turn && G.turn.currentPlayerId &&
        G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const inAction = G && G.turn && G.turn.phase === 'action'
      const myMeta = G && G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const ap = myMeta ? (myMeta.actionPoints || 0) : 0
      const cp = myMeta ? (myMeta.chargePoints || 0) : 0
      const _hasSageMode = (piece.statusTags || []).some(t => t.type === 'sage-mode')

      const skills = pieceDispSkills(piece).filter(sk => {
        const skData = skillsById[sk.skillId || sk.id] || {}
        return skData.kind !== 'passive'
      })
      if (!skills.length) { bar.style.display = 'none'; return }

      bar.style.display = 'flex'
      bar.innerHTML = skills.map(sk => {
        const sid = sk.skillId || sk.id
        const skData = skillsById[sid] || {}
        const isCharge = skData.type === 'super'
        const onCD = (sk.currentCooldown || 0) > 0
        const noUses = sk.usesRemaining === 0
        const isActive = pendingSkill && pendingSkill.skillId === sid
        const icon = skData.icon || (isCharge ? '💠' : '⚡')
        const rawName = skData.name || sid
        const displayName = rawName.length > 7 ? rawName.slice(0, 6) + '…' : rawName
        const typeLabel = isCharge ? '充能' : '基础'
        const typeCls = isCharge ? 'cp' : 'ap'
        const canAct = isMyTurn && inAction && !_hasSageMode && piece.ownerPlayerId.toLowerCase() === myPlayerId
        const disabled = !canAct || onCD || noUses

        let cls = 'skill-card'
        if (isCharge) cls += ' sk-charge'
        if (isActive) cls += ' sk-active'
        if (disabled) cls += ' sk-disabled'

        const cdCover = (onCD || noUses) ? `
          <div class="sk-cd-cover">
            <div class="sk-cd-num">${onCD ? sk.currentCooldown : '✕'}</div>
            <div class="sk-cd-lbl">${onCD ? 'CD' : '已用'}</div>
          </div>` : ''

        return `<div class="${cls}" onclick="selectSkillCard('${escHtml(sid)}')" title="${escHtml(rawName)}">
          ${cdCover}
          <div class="sk-icon">${icon}</div>
          <div class="sk-name">${escHtml(displayName)}</div>
          <div class="sk-type-tag ${typeCls}">${typeLabel}</div>
        </div>`
      }).join('')
    }

    function renderHand() {
      if (!G) return
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const hand = (myMeta && myMeta.hand) || []
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const ap = myMeta ? myMeta.actionPoints : 0

      document.getElementById('handCount').textContent = hand.length
      const targetHint = document.getElementById('handTarget')
      targetHint.style.display = pendingCardAction ? 'inline' : 'none'

      const container = document.getElementById('handCards')
      if (!hand.length) {
        container.innerHTML = '<div class="hand-empty">暂无手牌</div>'
        return
      }

      container.innerHTML = hand.map(card => {
        const def = cardsById[card.cardId] || (G.customCards && G.customCards[card.cardId]) || {}
        const cost = def.actionPointCost || 0
        const canPlay = isMyTurn && ap >= cost && (def.type === 'active' || def.type === 'reactive' || !def.type)
        const isPending = pendingCardAction && pendingCardAction.cardInstanceId === card.instanceId
        const isReactive = def.type === 'reactive'
        let cls = 'card-item'
        if (isPending) cls += ' card-pending'
        else if (!canPlay) cls += ' card-disabled'
        if (isReactive) cls += ' card-reactive'

        const gemCls = cost === 0 ? 'free' : ''
        const icon = def.icon || '🃏'
        const typeLabel = def.type === 'reactive' ? '⚡被动触发' : def.type === 'passive' ? '🔁持续' : '▶主动'

        const cdTurnsCard = def.cooldownTurns ?? def.cooldown ?? 0
        const cdHtml = cdTurnsCard > 0
          ? `<span style="font-size:8px;color:#475569"> CD${cdTurnsCard}</span>` : ''

        const cid = escHtml(card.instanceId)
        const cdid = escHtml(card.cardId)
        return `<div class="${cls}"
          onclick="onCardClick('${cid}','${cdid}')"
          ontouchstart="startCardPressTimer(event,'${cid}','${cdid}')"
          ontouchend="clearPressTimer()" ontouchmove="clearPressTimer()"
          oncontextmenu="event.preventDefault();showCardDetail('${cid}','${cdid}')">
          <div class="card-mana-gem ${gemCls}">${cost}</div>
          <div class="card-art">${icon}</div>
          <div class="card-name-banner">${escHtml(def.name || card.cardId)}</div>
          <div class="card-body">
            <div class="card-desc">${escHtml(def.description || '（无描述）')}</div>
            <div class="card-type-badge">${typeLabel}${cdHtml}</div>
          </div>
        </div>`
      }).join('')
    }

    function onCardClick(cardInstanceId, cardId) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      if (!isMyTurn) return

      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      const def = cardsById[cardId] || (G.customCards && G.customCards[cardId]) || {}
      const cost = def.actionPointCost || 0
      const ap = myMeta ? myMeta.actionPoints : 0
      if (ap < cost) { setStatusMsg('❌ 行动点不足（需要 ' + cost + '，剩余 ' + ap + '）'); return }

      // Toggle pending off
      if (pendingCardAction && pendingCardAction.cardInstanceId === cardInstanceId) {
        pendingCardAction = null
        renderHand()
        setStatusMsg('✅ 取消手牌')
        return
      }

      // Cancel any pending skill/move
      pendingMove = false
      pendingSkill = null
      document.getElementById('btnMove').className = 'btn-action'
      renderSkillBar(G && selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null)

      // Try to play immediately (server will respond with needsTargetSelection if target required)
      doAction({ type: 'playCard', playerId: myPlayerId, cardInstanceId })
    }

    function renderActionBar() {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const phase = G.turn ? G.turn.phase : ''
      const inAction = phase === 'action'
      const inEnd   = phase === 'end'
      const inStart = phase === 'start'

      // Show/hide phase-specific buttons
      const btnEnd = document.getElementById('btnEnd')
      const btnConfirmEnd = document.getElementById('btnConfirmEnd')
      if (inEnd && isMyTurn) {
        btnEnd.style.display = 'none'
        btnConfirmEnd.style.display = ''
        btnConfirmEnd.disabled = false
      } else {
        btnEnd.style.display = ''
        btnConfirmEnd.style.display = 'none'
        btnEnd.disabled = !isMyTurn || !inAction
      }

      const _selPiece = G && G.pieces && G.pieces.find(p => p.instanceId === selectedPieceId)
      const _hasSageMode = _selPiece && (_selPiece.statusTags || []).some(t => t.type === 'sage-mode')
      document.getElementById('btnMove').disabled = !isMyTurn || !selectedPieceId || !inAction || _hasSageMode

      if (!isMyTurn) {
        setStatusMsg('⏳ 等待对方操作… [' + (PHASE_LABELS[phase] || phase) + ']')
        pendingMove = false
        pendingSkill = null
        document.getElementById('btnMove').className = 'btn-action'
        renderSkillBar(_selPiece || null)
      } else if (inEnd) {
        setStatusMsg('🔚 结束阶段 — 点击"确认结束"推进回合')
      } else if (inStart) {
        setStatusMsg('🌅 开始阶段处理中…')
      } else if (pendingCardAction) {
        setStatusMsg('🟡 点击棋子或格子使用手牌')
      } else if (pendingMove) {
        setStatusMsg('🟢 点击绿色格子移动棋子')
      } else if (pendingSkill) {
        setStatusMsg('🟡 点击目标格子释放技能')
      } else if (selectedPieceId) {
        setStatusMsg('✅ 已选中棋子，选择行动')
      } else {
        setStatusMsg('👆 选择棋子开始行动')
      }
    }

    // ── Cell click ──
    function onCellClick(x, y) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
      const piece = G.pieces.find(p => p.x === x && p.y === y && p.currentHp > 0)

      // Training: place piece mode
      if (TRAINING_MODE && placingMode) {
        const templateId = document.getElementById('placeTemplate')?.value
        const faction = document.getElementById('placeFaction')?.value || 'red'
        if (!templateId) { addLog('❌ 请先选择棋子类型', 'err'); return }
        const tile = G.map.tiles.find(t => t.x === x && t.y === y)
        if (!tile || !tile.props || !tile.props.walkable) { addLog('❌ 不可放置此处', 'err'); return }
        if (piece) { addLog('❌ 该位置已有棋子', 'err'); return }
        sendPatch({ type: 'addPiece', faction, templateId, x, y }).then(ok => {
          if (ok) addLog('➕ 放置 ' + (PIECES_BY_ID[templateId]?.name || templateId), 'info')
        })
        return
      }

      // Pending card target selection
      if (pendingCardAction) {
        const extra = piece ? { targetPieceId: piece.instanceId } : { targetX: x, targetY: y }
        const action = Object.assign({}, pendingCardAction, extra)
        pendingCardAction = null
        document.getElementById('handTarget').style.display = 'none'
        doAction(action)
        return
      }

      if (pendingMove && selectedPieceId) {
        // 合法性拦截：只允许点击高亮格
        if (!validMoves.has(x + ',' + y)) {
          setStatusMsg('❌ 无法移动到该位置')
          return
        }
        doAction({ type: 'move', playerId: myPlayerId, pieceId: selectedPieceId, toX: x, toY: y })
        pendingMove = false
        document.getElementById('btnMove').className = 'btn-action'
        return
      }

      if (pendingSkill && selectedPieceId) {
        // 合法性拦截：只允许点击技能高亮格
        const key = x + ',' + y
        const vt = pendingSkill.validTargets
        if (vt && vt.size > 0 && !vt.has(key)) {
          setStatusMsg('❌ 目标不在技能范围内')
          return
        }
        // Build action — start from baseAction (preserves selectedOption etc.) or create fresh
        const skData = skillsById[pendingSkill.skillId] || {}
        const isCharge = skData.type === 'super' || pendingSkill.skillType === 'super'
        const action = pendingSkill.baseAction
          ? Object.assign({}, pendingSkill.baseAction)
          : {
              type: isCharge ? 'useChargeSkill' : 'useBasicSkill',
              playerId: myPlayerId,
              pieceId: selectedPieceId,
              skillId: pendingSkill.skillId
            }
        // Set target using server-expected flat fields (not nested target object)
        if (piece) {
          action.targetPieceId = piece.instanceId
        } else {
          action.targetX = x
          action.targetY = y
        }
        // Remove old 'target' field if any
        delete action.target
        pendingSkill = null
        doAction(action)
        return
      }

      // Select own piece or show info
      if (piece) {
        const isMyPiece = isMyTurn && piece.ownerPlayerId && piece.ownerPlayerId.toLowerCase() === myPlayerId
        if (isMyPiece) {
          selectPiece(piece.instanceId)
        } else {
          // 点击对方棋子或非本回合时查看棋子信息
          showPieceInfo(piece.instanceId)
        }
      }
    }

    function selectPiece(instanceId) {
      selectedPieceId = instanceId
      pendingMove = false
      pendingSkill = null
      document.getElementById('btnMove').className = 'btn-action'
      // Sync dropdown
      document.getElementById('pieceSelect').value = instanceId
      // Render skill bar
      const sp = G && G.pieces.find(p => p.instanceId === instanceId)
      renderSkillBar(sp)
      render()
    }

    function selectPieceFromDropdown() {
      const val = document.getElementById('pieceSelect').value
      if (val) selectPiece(val)
    }

    function toggleMove() {
      if (!selectedPieceId) return
      pendingMove = !pendingMove
      pendingSkill = null
      document.getElementById('btnMove').className = 'btn-action' + (pendingMove ? ' active-move' : '')
      const sp = G && G.pieces.find(p => p.instanceId === selectedPieceId)
      renderBoard(); renderSkillBar(sp); renderActionBar()
    }

    // 探针干运行：用本地 GameEngine 判断技能是否需要选目标，并拿到真实的 range/targetType/filter
    // 返回 { needsTarget, range, targetType, filter } 或 null（引擎不可用时）
    function _probeSkillTargetInfo(sp, skId) {
      if (!G || typeof GameEngine === 'undefined' || !GameEngine.applyBattleAction) return null
      const skDef = (G.skillsById && G.skillsById[skId]) || skillsById[skId] || {}
      if (!skDef.code) return null  // 没有可执行代码，无法探针
      const isCharge = skDef.type === 'super'
      const probeAction = {
        type: isCharge ? 'useChargeSkill' : 'useBasicSkill',
        playerId: myPlayerId, pieceId: sp.instanceId, skillId: skId
      }
      const savedSkillsById = G.skillsById
      G.skillsById = { [skId]: skDef }
      const stateStr = JSON.stringify(G)
      G.skillsById = savedSkillsById
      try {
        GameEngine.applyBattleAction(JSON.parse(stateStr), probeAction)
        return { needsTarget: false }
      } catch (e) {
        if (e && e.needsTargetSelection) {
          return { needsTarget: true, range: e.range != null ? e.range : 99,
            targetType: e.targetType || '', filter: e.filter || '' }
        }
        if (e && e.needsOptionSelection) return { needsTarget: false }
        return null
      }
    }

    // selectSkillCard: called when a skill card in the skill bar is clicked
    async function selectSkillCard(skId) {
      if (!selectedPieceId || !skId || !G) return
      const sp = G.pieces.find(p => p.instanceId === selectedPieceId)
      if (!sp) return
      const skData = skillsById[skId] || {}
      const isCharge = skData.type === 'super'
      const actionType = isCharge ? 'useChargeSkill' : 'useBasicSkill'

      // Toggle off: clicking the active skill again cancels selection
      if (pendingSkill && pendingSkill.skillId === skId) {
        pendingSkill = null
        renderBoard(); renderSkillBar(sp); renderActionBar(); renderTargetOverlay()
        return
      }

      // 资源预检：充能点 / 行动点不足时直接拦截，不发送 action（防止 beforeSkillUse 被动误触发）
      const myMeta = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() === myPlayerId)
      if (myMeta) {
        const apCost = skData.actionPointCost || 0
        if (apCost > 0 && (myMeta.actionPoints || 0) < apCost) {
          setStatusMsg('❌ 行动点不足（需要 ' + apCost + '，剩余 ' + (myMeta.actionPoints || 0) + '）')
          return
        }
        if (isCharge) {
          const cpCost = skData.chargeCost ?? 1
          if ((myMeta.chargePoints || 0) < cpCost) {
            setStatusMsg('❌ 充能点不足（需要 ' + cpCost + '，剩余 ' + (myMeta.chargePoints || 0) + '）')
            return
          }
        }
      }

      // 探针：用游戏引擎本地干运行判断是否需要选目标
      const probe = _probeSkillTargetInfo(sp, skId)

      if (probe === null && typeof GameEngine !== 'undefined' && GameEngine.applyBattleAction) {
        // GameEngine 可用但探针失败 → 技能因游戏规则无法释放（冷却、条件不满足等）
        setStatusMsg('❌ 技能无法释放')
        return
      }
      if (!probe || !probe.needsTarget) {
        // 立即释放（无 GameEngine 时 probe 为 null，交由 doAction 处理）
        await doAction({ type: actionType, playerId: myPlayerId, pieceId: selectedPieceId, skillId: skId })
        return
      }

      // 需要选目标：进入目标选择模式，range/targetType/filter 来自探针（准确）
      pendingMove = false
      pendingSkill = { skillId: skId, skillType: isCharge ? 'super' : 'normal',
        range: probe.range, targetType: probe.targetType, filter: probe.filter, baseAction: null }
      _updatePendingSkillTargets()
      document.getElementById('btnMove').className = 'btn-action'
      renderBoard(); renderSkillBar(sp); renderActionBar(); renderTargetOverlay()
    }

    async function doEndTurn() {
      await doAction({ type: 'endTurn', playerId: myPlayerId })
      // If phase is now 'end', auto-advance to next player's turn
      if (G && G.turn && G.turn.phase === 'end') {
        await doBeginPhase()
      }
    }

    async function doBeginPhase() {
      await doAction({ type: 'beginPhase' })
    }

    async function trainingDoAction(action) {
      if (!G) return
      try {
        document.getElementById('btnEnd').disabled = true
        document.getElementById('btnMove').disabled = true
        // Dry-run locally
        if (typeof GameEngine !== 'undefined' && GameEngine.safeCloneBattleState) {
          try {
            GameEngine.applyBattleAction(GameEngine.safeCloneBattleState(G), action)
          } catch (e) {
            if (e && e.needsTargetSelection) {
              if (action.type === 'playCard') {
                pendingCardAction = action; renderHand(); setStatusMsg('🟡 点击棋子或格子使用手牌')
              } else {
                const skData = skillsById[action.skillId] || {}
                pendingMove = false
                pendingSkill = { skillId: action.skillId, skillType: skData.type || 'normal',
                  range: e.range || (typeof skData.range === 'number' ? skData.range : 10),
                  targetType: e.targetType || '', filter: e.filter || '', hint: e.hint || '', baseAction: action }
                _updatePendingSkillTargets()
              }
              const _sp0 = G.pieces.find(p => p.instanceId === selectedPieceId)
              renderBoard(); renderSkillBar(_sp0||null); renderActionBar(); renderTargetOverlay(); return
            }
            if (e && e.needsOptionSelection) { showOptionPicker(e.title||'请选择', e.options||[], action); renderActionBar(); return }
            setStatusMsg('❌ ' + (e.message || '操作失败')); renderActionBar(); return
          }
        }
        const oldG = G
        const newG = await trainingApiFetch('PUT', { action, battleState: G })
        G = newG
        spawnStateFloaters(oldG, G)
        flushActionLog(oldG, G)
        if (action.type === 'endTurn') {
          if (G.turn && G.turn.phase === 'end') {
            try { G = await trainingApiFetch('PUT', { action: { type: 'beginPhase' }, battleState: G }) } catch {}
          }
          myPlayerId = G.turn.currentPlayerId
          const btn = document.getElementById('btnSwitchPov')
          if (btn) btn.textContent = myPlayerId === 'training-red' ? '🔄 切换视角 🔴' : '🔄 切换视角 🔵'
        }
        selectedPieceId = null; pendingMove = false; pendingSkill = null; pendingCardAction = null
        render(); checkClientGameOver()
      } catch (e) {
        if (e.needsTargetSelection) {
          const skData = skillsById[action.skillId] || {}
          pendingSkill = { skillId: action.skillId, skillType: skData.type||'normal', range: e.range||10,
            targetType: e.targetType||'', filter: e.filter||'', hint: e.hint||'', baseAction: action }
          _updatePendingSkillTargets()
          const _sp1 = G.pieces.find(p => p.instanceId === selectedPieceId)
          renderBoard(); renderSkillBar(_sp1||null); renderTargetOverlay()
        } else if (e.needsOptionSelection) {
          showOptionPicker(e.title||'请选择', e.options||[], action)
        } else { setStatusMsg('❌ ' + (e.message || '操作失败')); pendingSkill = null; pendingMove = false }
        renderActionBar()
      }
    }

    async function doAction(action) {
      if (TRAINING_MODE) { await trainingDoAction(action); return }
      const url = getServerUrl()
      if (!url) { addLog('❌ 未连接服务器', 'err'); return }
      if (!G) { addLog('❌ 游戏状态未就绪', 'err'); return }
      try {
        document.getElementById('btnEnd').disabled = true
        document.getElementById('btnMove').disabled = true
        if (action.type === 'endTurn') addLog('⏭ 正在结束回合…', 'info')

        // Dry-run on a clone to detect target/option selection needs BEFORE posting
        if (typeof GameEngine !== 'undefined' && GameEngine.safeCloneBattleState) {
          try {
            const clone = GameEngine.safeCloneBattleState(G)
            GameEngine.applyBattleAction(clone, action)
          } catch (e) {
            if (e && e.needsTargetSelection) {
              if (action.type === 'playCard') {
                pendingCardAction = action; renderHand(); setStatusMsg('🟡 点击棋子或格子使用手牌')
              } else if (action.type === 'useBasicSkill' || action.type === 'useChargeSkill') {
                const skData = skillsById[action.skillId] || {}
                pendingMove = false
                pendingSkill = { skillId: action.skillId, skillType: skData.type || 'normal',
                  range: e.range || (typeof skData.range === 'number' ? skData.range : 10),
                  targetType: e.targetType || '', filter: e.filter || '', hint: e.hint || '', baseAction: action }
                _updatePendingSkillTargets()
              }
              const _sp2 = G.pieces.find(p => p.instanceId === selectedPieceId)
              renderBoard(); renderSkillBar(_sp2||null); renderActionBar(); renderTargetOverlay(); return
            }
            if (e && e.needsOptionSelection) {
              showOptionPicker(e.title || '请选择', e.options || [], action); renderActionBar(); return
            }
            setStatusMsg('❌ ' + (e.message || '操作失败')); renderActionBar(); return
          }
        }

        // Build signed request body
        let bodyToPost = { type: 'action', action, playerId: myPlayerId }
        const identity = (typeof RvBIdentity !== 'undefined') ? RvBIdentity.getIdentity() : null
        if (identity && myPlayerId) {
          try {
            const payload = { roomId, playerId: myPlayerId, action, timestamp: Date.now() }
            const signature = await RvBIdentity.sign(payload)
            bodyToPost = { ...bodyToPost, _auth: { playerId: myPlayerId, publicKey: identity.publicKey, payload, signature } }
          } catch (e) { console.warn('[battle] sign failed:', e) }
        }

        // Post to action log relay
        const res = await fetch(url + '/api/rooms/' + roomId + '/battle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyToPost)
        })
        if (!res.ok) {
          const data = await res.json().catch(() => ({}))
          setStatusMsg('❌ ' + (data.error || '操作失败'))
          renderActionBar()
          return
        }

        // Immediately poll so our action comes back and gets applied locally
        await pollActions()

        selectedPieceId = null
        pendingMove = false
        pendingSkill = null
        pendingCardAction = null
      } catch (e) {
        addLog('❌ 网络错误：' + e.message, 'err')
        renderActionBar()
      }
    }

    function actionLabel(a) {
      if (a.type === 'endTurn') return '⏭ 结束回合'
      if (a.type === 'move') return '👣 移动至 (' + a.to.x + ',' + a.to.y + ')'
      if (a.type === 'useBasicSkill' || a.type === 'useChargeSkill') {
        const sk = skillsById[a.skillId]
        return '⚡ 使用技能：' + (sk ? sk.name : a.skillId)
      }
      if (a.type === 'playCard') {
        const def = cardsById[a.cardId] || {}
        return '🃏 打出手牌：' + (def.name || a.cardInstanceId)
      }
      return a.type
    }
    function actionClass(a) {
      if (a.type === 'move') return 'move'
      if (a.type.includes('kill')) return 'skill'
      if (a.type === 'endTurn') return 'turn'
      return 'info'
    }

    function checkClientGameOver() {
      if (!G || G.gameOver || G.winner) return
      const living = G.pieces.filter(p => p.currentHp > 0)
      const redAlive = living.filter(p => p.faction === 'red').length
      const blueAlive = living.filter(p => p.faction === 'blue').length
      if (redAlive === 0 && blueAlive > 0) { G.winner = 'blue'; G.gameOver = true; handleGameOver() }
      else if (blueAlive === 0 && redAlive > 0) { G.winner = 'red'; G.gameOver = true; handleGameOver() }
    }

    function handleGameOver() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      try { localStorage.removeItem('rvb_active_battle') } catch {}
      if (recordSaved) return
      recordSaved = true
      // Save battle record locally
      try {
        const identity = (typeof RvBIdentity !== 'undefined') ? RvBIdentity.getIdentity() : null
        if (identity && G) {
          const winner = G.winner
          const myResult = winner
            ? (winner === myFaction || winner === myPlayerId ? 'win' : 'loss')
            : 'draw'
          const oppPlayer = G.players && G.players.find(p => p.playerId && p.playerId.toLowerCase() !== myPlayerId)
          const record = {
            gameId: roomId + '-' + Date.now(),
            timestamp: Date.now(),
            result: myResult,
            myFaction,
            myPlayerId,
            opponentName: (oppPlayer && (playerNames[oppPlayer.playerId] || oppPlayer.name)) || '对手',
            opponentId: oppPlayer ? oppPlayer.playerId : null,
          }
          const records = JSON.parse(localStorage.getItem('rvb_battle_records') || '[]')
          records.push(record)
          // Keep last 200 records
          if (records.length > 200) records.splice(0, records.length - 200)
          localStorage.setItem('rvb_battle_records', JSON.stringify(records))
        }
      } catch {}
      // Notify server so it can create the game record (only post once)
      const url = getServerUrl()
      if (url && G && (G.winner || G.gameOver)) {
        fetch(url + '/api/rooms/' + roomId + '/battle', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'gameOver', playerId: myPlayerId, winner: G.winner || 'draw' })
        }).catch(() => {})
      }
      const winner = G.winner
      const iWon = winner && (
        winner.toLowerCase() === myFaction ||
        winner.toLowerCase() === myPlayerId
      )
      const isDraw = !winner
      const winnerLabel = winner
        ? (winner === 'red' ? '🔴 红方' : winner === 'blue' ? '🔵 蓝方' : (playerNames[winner.toLowerCase()] || winner))
        : ''
      document.getElementById('resultIcon').textContent = isDraw ? '🤝' : (iWon ? '🏆' : '💀')
      document.getElementById('resultTitle').textContent = isDraw ? '平局' : (iWon ? '胜利！' : '失败')
      document.getElementById('resultSub').textContent = (winnerLabel ? winnerLabel + ' 获胜 · ' : '') + '第 ' + (G.turn ? G.turn.turnNumber : '?') + ' 回合结束'
      if (TRAINING_MODE) {
        // Replace the "返回大厅" button with "重新开始"
        const overlay = document.getElementById('resultOverlay')
        overlay.querySelector('button[onclick="goBack()"]')?.remove()
        const restartBtn = document.createElement('button')
        restartBtn.style.cssText = 'background:#1d4ed8;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px'
        restartBtn.textContent = '🔄 重新开始'
        restartBtn.onclick = () => { overlay.style.display = 'none'; initTraining() }
        overlay.appendChild(restartBtn)
      }
      document.getElementById('resultOverlay').style.display = 'flex'
      // Sign game record asynchronously
      _signGameRecord()
    }

    var _signedRecord = null

    async function _signGameRecord() {
      if (!window.RvBIdentity) return
      const identity = RvBIdentity.getIdentity()
      if (!identity) return
      const statusEl = document.getElementById('recordStatus')
      try {
        statusEl.textContent = '正在获取战报…'
        // Wait a moment for server to finalize the game record
        await new Promise(r => setTimeout(r, 800))
        const res = await RvBUtils.serverFetch('/api/rooms/' + roomId + '/game-record')
        if (!res.ok) { statusEl.textContent = ''; return }
        const record = await res.json()
        if (record.error) { statusEl.textContent = ''; return }

        // Sign the record (without signatures field)
        const { signatures: _s, ...recordToSign } = record
        statusEl.textContent = '正在签名战报…'
        const publicKey = RvBIdentity.getPublicKey()
        const signature = await RvBIdentity.sign(recordToSign)

        // Submit signature
        const submitRes = await RvBUtils.serverFetch('/api/rooms/' + roomId + '/game-record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: identity.id, publicKey, signature })
        })
        const submitData = submitRes.ok ? await submitRes.json() : null
        const count = submitData?.signaturesCount || 1
        statusEl.textContent = '已签名 (' + count + '/2)'

        // Store full record for download
        _signedRecord = { ...record, signatures: { ...(record.signatures || {}), [identity.id]: signature } }
        document.getElementById('recordDownloadBtn').style.display = 'inline-block'
      } catch { statusEl.textContent = '' }
    }

    function downloadGameRecord() {
      if (!_signedRecord) return
      const blob = new Blob([JSON.stringify(_signedRecord, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'rvb-record-' + (_signedRecord.gameId || Date.now()) + '.json'
      a.click()
      URL.revokeObjectURL(url)
    }

    // ── Helpers ──
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }
    function setStatusMsg(msg) {
      document.getElementById('statusMsg').textContent = msg
    }
    function showMsg(msg, type) {
      document.getElementById('loadingMsg').textContent = msg
      if (type === 'err') document.getElementById('loadingMsg').style.color = '#f87171'
    }
    function openLog() { document.getElementById('logOverlay').classList.add('show') }
    function closeLog() { document.getElementById('logOverlay').classList.remove('show') }
    function addLog(msg, cls) {
      const body = document.getElementById('logBody')
      if (!body) return
      const p = document.createElement('p')
      p.className = 'log-' + (cls || 'info')
      p.textContent = msg
      body.appendChild(p)
      body.scrollTop = body.scrollHeight
    }
    function clearLog() { const b = document.getElementById('logBody'); if (b) b.innerHTML = '' }
    function goBack() { window.location.href = TRAINING_MODE ? 'index.html' : 'lobby.html' }
    function confirmLeave() {
      if (TRAINING_MODE || !G || G.gameOver || G.winner) { goBack(); return }
      goBack()
    }

    // ── Start ──
    // ── Dynamic cell sizing ───────────────────────────────────────────────────
    function recalcCellSize() {
      if (!G || !G.map) return
      const cols = G.map.width
      const rows = G.map.height
      const wrap = document.getElementById('boardWrap')
      if (!wrap) return
      const availW = wrap.clientWidth - 8
      const topbarH = document.querySelector('.topbar')?.offsetHeight || 44
      const phaseH  = document.querySelector('.phase-bar')?.offsetHeight || 0
      const actionH = document.querySelector('.action-bar')?.offsetHeight || 0
      const handH   = document.getElementById('handPanel')?.offsetHeight || 0
      const trainingBarH = document.getElementById('trainingBar')?.offsetHeight || 0
      const availH  = window.innerHeight - topbarH - phaseH - actionH - handH - trainingBarH - 20
      const byW = Math.floor(availW / cols)
      const byH = Math.floor(availH / rows)
      const sz = Math.max(28, Math.min(72, byW, byH))
      document.documentElement.style.setProperty('--cell-size', sz + 'px')
      const grid = document.getElementById('gameGrid')
      if (grid) grid.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell-size, 44px))'
    }
    window.addEventListener('resize', recalcCellSize)

    // ── Fullscreen map mode ───────────────────────────────────────────────────
    let fullMapMode = false
    function toggleFullMap() {
      fullMapMode = !fullMapMode
      document.body.classList.toggle('full-map', fullMapMode)
      document.getElementById('btnFullMap').textContent = fullMapMode ? '✕' : '⛶'
      setTimeout(recalcCellSize, 50)
    }

    // ── Collapsible sections (log / hand) ─────────────────────────────────────
    function toggleSection(section) {
      if (section === 'log') {
        const body = document.getElementById('logBody')
        const arrow = document.getElementById('logArrow')
        const open = !body.classList.contains('collapsed')
        body.classList.toggle('collapsed', open)
        if (arrow) { arrow.textContent = open ? '▶' : '▼'; arrow.classList.toggle('open', !open) }
      } else if (section === 'hand') {
        const body = document.getElementById('handBody')
        const arrow = document.getElementById('handArrow')
        const open = !body.classList.contains('collapsed')
        body.classList.toggle('collapsed', open)
        if (arrow) { arrow.textContent = open ? '▶' : '▼'; arrow.classList.toggle('open', !open) }
      }
      setTimeout(recalcCellSize, 50)
    }

    window.addEventListener('load', init)
    window.addEventListener('unload', () => { if (pollTimer) clearInterval(pollTimer) })
  </script>

  <!-- Target selection overlay (pointer-events:none so board stays clickable) -->
  <div id="targetOverlay">
    <div class="target-prompt" id="targetPromptText">🎯 选择目标</div>
    <button class="target-cancel-btn" onclick="cancelTargetSelection()">✕ 取消</button>
  </div>

  <!-- Fullscreen log overlay -->
  <div id="logOverlay">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #334155;flex-shrink:0;background:#070f1e">
      <div style="font-size:15px;font-weight:700;color:#e2e8f0">📜 战斗日志</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="clearLog()" style="background:none;border:1px solid #334155;border-radius:6px;color:#64748b;padding:4px 10px;font-size:12px;cursor:pointer">清空</button>
        <button onclick="closeLog()" style="background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;line-height:1;padding:0 4px">✕</button>
      </div>
    </div>
    <div id="logBody" style="flex:1;overflow-y:auto;padding:10px 16px;font-size:13px;"></div>
  </div>

  <!-- Surrender confirm overlay -->
  <div id="surrenderConfirmOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center">
    <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:28px 24px;max-width:300px;width:90%;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">🏳️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#e2e8f0">确认投降？</div>
      <div style="font-size:13px;color:#94a3b8;margin-bottom:20px">这将立即结束对战。</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="cancelSurrender()" style="flex:1;padding:10px;background:#334155;border:none;border-radius:8px;color:#e2e8f0;font-size:14px;cursor:pointer">取消</button>
        <button onclick="doSurrender()" style="flex:1;padding:10px;background:#dc2626;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">投降</button>
      </div>
    </div>
  </div>
</body>
