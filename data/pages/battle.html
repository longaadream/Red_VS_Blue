<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>对战 - RED vs BLUE</title>
  <script src="js/pack-fetch.js"></script>
  <script src="js/server-utils.js"></script>
  <script src="js/crypto-lib.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/game-engine-runtime.js"></script>
  <script src="js/game-engine.js"></script>
  <script src="js/ws-client.js"></script>
  <script src="js/three.min.js"></script>
  <script src="js/battle-ui/battle-view-model.js"></script>
  <script src="js/battle-ui/battle-legal-actions.js"></script>
  <script src="js/battle-ui/battle-dom-ui.js"></script>
  <script src="js/battle-renderer-3d.js"></script>
  <script src="js/battle-ui/battle-presentation.js"></script>
  <style>
    :root {
      --bg: #0f172a; --bg2: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #64748b; --red: #ef4444; --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 10px; right: 10px; z-index: 86;
      display: flex; align-items: center; justify-content: flex-end; gap: 6px;
      max-width: min(560px, calc(100vw - 20px));
      padding: 6px 7px; background: rgba(5,10,20,.62);
      border: 1px solid rgba(148,163,184,.22); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .back-btn {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      color: #94a3b8; padding: 5px 10px; font-size: 13px; cursor: pointer;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:active { opacity: .7; }
    .btn-surrender {
      background: #450a0a; border: 1px solid #991b1b; border-radius: 8px;
      color: #fca5a5; padding: 5px 10px; font-size: 12px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
    }
    .btn-surrender:active { opacity: .7; }
    .room-name { display: none; }
    .turn-badge {
      font-size: 12px; padding: 4px 14px; border-radius: 20px; font-weight: 800;
      background: var(--bg2); border: 1px solid var(--border); color: var(--muted);
      letter-spacing: .5px;
    }
    .turn-badge.my-turn {
      background: linear-gradient(135deg, #14532d, #052e16);
      border-color: #22c55e; color: #4ade80;
      box-shadow: 0 0 10px rgba(34,197,94,.35);
    }
    .turn-badge.opp-turn {
      background: linear-gradient(135deg, #172554, #0f1629);
      border-color: #3b82f6; color: #93c5fd;
    }
    .battle-hud {
      position: fixed; inset: 10px 10px auto 10px; z-index: 85;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }
    .hud-status, .hud-actions {
      pointer-events: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      max-width: min(580px, calc(100vw - 20px));
      background: rgba(5,10,20,.62); border: 1px solid rgba(148,163,184,.22);
      box-shadow: 0 10px 30px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px); border-radius: 10px; padding: 6px 7px;
    }
    .hud-status { align-items: stretch; }
    .hud-meta {
      min-width: 92px; display: grid; gap: 2px; padding: 1px 5px;
      color: #cbd5e1; font-size: 11px; line-height: 1.2;
    }
    .hud-round { color: #94a3b8; font-weight: 800; }
    .hud-phase { color: #f8fafc; font-weight: 900; }
    .hud-resource {
      display: inline-flex; align-items: center; gap: 4px; min-height: 30px;
      padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 900;
      border: 1px solid rgba(148,163,184,.24); color: #e2e8f0;
    }
    .hud-resource.ap { background: rgba(30,64,175,.38); color: #bfdbfe; }
    .hud-resource.cp { background: rgba(88,28,135,.36); color: #e9d5ff; }
    .hud-hand {
      display: inline-flex; align-items: center; min-height: 30px; padding: 4px 8px;
      border-radius: 8px; background: rgba(15,23,42,.74); color: #cbd5e1;
      border: 1px solid rgba(148,163,184,.2); font-size: 12px; font-weight: 900;
    }
    .hud-btn {
      min-width: 34px; height: 32px; padding: 0 9px; border-radius: 8px;
      border: 1px solid rgba(148,163,184,.26); background: rgba(15,23,42,.78);
      color: #dbeafe; font-size: 13px; font-weight: 900; cursor: pointer;
    }
    .hud-btn.danger { color: #fecaca; border-color: rgba(248,113,113,.42); background: rgba(69,10,10,.74); }
    .hud-btn.training { color: #ddd6fe; border-color: rgba(167,139,250,.42); background: rgba(49,46,129,.66); }
    .hud-btn:active { transform: translateY(1px); filter: brightness(1.15); }
    #playerResCards {
      display: flex !important; gap: 5px; align-items: center; flex-wrap: wrap;
      max-width: min(54vw, 520px); overflow: hidden;
    }
    @media (max-width: 760px) {
      .battle-hud { inset: 6px 6px auto 6px; gap: 6px; }
      .hud-status, .hud-actions { padding: 5px; gap: 4px; border-radius: 9px; }
      .hud-status { max-width: calc(100vw - 68px); }
      .hud-actions { max-width: 58px; justify-content: flex-end; }
      .hud-meta { min-width: 72px; font-size: 10px; }
      .hud-resource, .hud-hand { min-height: 28px; padding: 3px 6px; font-size: 11px; }
      .hud-btn { min-width: 28px; height: 28px; padding: 0 6px; font-size: 12px; }
    }

    /* ── Main layout ── */
    .battle-layout {
      display: flex; flex: 1; overflow: hidden; min-height: 0;
    }

    /* ── Side panels ── */
    .side-panel {
      width: 110px; flex-shrink: 0; overflow-y: auto;
      border-right: 1px solid var(--border); padding: 6px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .side-panel.right { border-right: none; border-left: 1px solid var(--border); }
    .panel-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px;
    }
    .piece-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 6px; cursor: pointer; transition: border-color .15s;
    }
    .piece-card:active { opacity: .8; }
    .piece-card.selected { border-color: #60a5fa; background: #172554; }
    .piece-card.dead { opacity: .4; cursor: default; }
    .piece-card-name { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
    .piece-card-hp { font-size: 10px; color: var(--muted); }
    .hp-bar { height: 3px; background: #1e3a5f; border-radius: 2px; margin-top: 2px; overflow: hidden; }
    .hp-fill { height: 100%; background: #22c55e; transition: width .3s; }
    .hp-fill.low { background: #f59e0b; }
    .hp-fill.crit { background: #ef4444; }
    .res-row { font-size: 10px; color: #94a3b8; margin-top: 1px; }

    /* ── Main board area ── */
    .main-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    }
    .phase-bar {
      position: fixed; top: 10px; left: 10px; z-index: 85;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 8px; background: rgba(5,10,20,.62);
      border: 1px solid rgba(148,163,184,.22); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px); font-size: 12px; flex-shrink: 0;
    }
    .board-wrap {
      flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center;
      padding: 8px 10px; min-height: 0;
      touch-action: none; cursor: grab;
    }
    .board-wrap.dragging { cursor: grabbing; }
    .board-shell {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-width: max-content;
    }
    .board-stage {
      position: relative; display: inline-block; flex-shrink: 0;
      transform-origin: 0 0; will-change: transform;
    }
    .board-shell-3d {
      flex: 1; min-width: 0; align-items: stretch; justify-content: flex-start;
      align-self: stretch;
    }
    .board-shell-3d .board-stage {
      flex: 1; min-height: 320px; position: relative !important;
    }
    .board-shell-3d .board-stage canvas {
      position: absolute !important; inset: 0 !important;
      width: 100% !important; height: 100% !important; display: block;
    }
    .board-side-rail {
      width: 146px; align-self: stretch; min-height: 100%;
      display: flex; flex-direction: column; justify-content: center; gap: 16px;
      flex-shrink: 0;
    }
    .selected-status-card {
      min-height: 132px; border: 1px solid rgba(148,163,184,.2);
      background: linear-gradient(180deg, rgba(15,23,42,.9), rgba(15,23,42,.58));
      border-radius: 8px; padding: 10px 10px 11px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .selected-status-empty {
      min-height: 132px; display: flex; align-items: center; justify-content: center;
      color: rgba(148,163,184,.38); font-size: 13px; font-weight: 700;
      border: 1px dashed rgba(148,163,184,.14); border-radius: 8px;
      background: rgba(15,23,42,.28);
    }
    .selected-piece-name { font-size: 15px; font-weight: 900; color: #f8fafc; margin-bottom: 6px; }
    .selected-piece-hp { font-size: 12px; color: #cbd5e1; margin-bottom: 14px; }
    .selected-status-title {
      font-size: 10px; font-weight: 800; color: #64748b;
      letter-spacing: .08em; margin-bottom: 7px;
    }
    .selected-status-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .selected-status-tags .status-tag {
      font-size: 10px; padding: 3px 6px; border-radius: 999px;
      background: rgba(124,58,237,.2); border: 1px solid rgba(167,139,250,.38);
      color: #ddd6fe;
    }
    .selected-status-tags .status-empty { font-size: 12px; color: rgba(148,163,184,.42); }
    .turn-control-wrap {
      display: flex; justify-content: center;
    }
    #gameGrid {
      display: grid; gap: 1px; background: #0a0a0f;
    }

    /* ── Tiles ── */
    .cell {
      width: var(--cell-size, 44px); height: var(--cell-size, 44px);
      position: relative; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .cell::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background-size: cover; background-position: center; opacity: .96; z-index: 0;
    }
    .cell > * { position: relative; z-index: 2; }
    .t-floor     { background: #3f3f46; }
    .t-floor::before { background-image: url("images/terrain/floor.webp"); }
    .t-wall      { background: #18181b; cursor: default; }
    .t-wall::before { background-image: url("images/terrain/wall.webp"); }
    .t-spawn     { background: #064e3b; }
    .t-cover     { background: #78350f; }
    .t-cover::before { background-image: url("images/terrain/cover.webp"); }
    .t-hole      { background: #082f49; cursor: default; }
    .t-hole::before { background-image: url("images/terrain/trap.webp"); }
    .t-lava      { background: #7c2d12; }
    .t-spring    { background: #134e4a; }
    .t-chargepad { background: #3b0764; }
    .hl-move     { outline: 2px solid #22c55e; z-index: 1; }
    .hl-skill    { outline: 2px solid #f59e0b; z-index: 1; }
    .hl-place    { outline: 2px solid #8b5cf6; z-index: 1; }
    .hl-selected { outline: 3px solid #60a5fa; z-index: 2; }

    /* ── Piece token ── */
    .piece-tok {
      width: calc(var(--cell-size, 44px) - 8px); height: calc(var(--cell-size, 44px) - 8px);
      border-radius: 6px; overflow: visible;
      position: relative; display: flex; align-items: center; justify-content: center;
      flex-direction: column; border: 2px solid transparent;
    }
    .piece-tok.red  { border-color: #ef4444; }
    .piece-tok.blue { border-color: #3b82f6; }
    .piece-tok.selected-tok { box-shadow: 0 0 0 2px #60a5fa; }
    .piece-tok img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .piece-tok-ph { font-size: 20px; line-height: 1; }
    .tok-hp-bar { position: absolute; bottom: -4px; left: 0; right: 0; height: 3px; background: #0f172a; border-radius: 2px; }
    .tok-hp-fill { height: 100%; background: #22c55e; border-radius: 2px; transition: width .3s; }
    .tok-hp-fill.low  { background: #f59e0b; }
    .tok-hp-fill.crit { background: #ef4444; }

    /* ── StatusTags ── */
    .piece-tags {
      position: absolute; top: -14px; left: 0; right: 0;
      display: flex; flex-wrap: wrap; gap: 1px; justify-content: center;
    }
    .status-tag {
      background: #7c3aed; color: #fff; font-size: 8px; font-weight: 700;
      border-radius: 3px; padding: 1px 3px; white-space: nowrap; line-height: 1.3;
    }

    /* ── Action bar ── */
    .action-bar {
      border-top: 1px solid var(--border); padding: 8px 10px;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap;
      background: var(--bg);
    }
    .action-bar select {
      background: var(--bg2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; font-size: 13px; padding: 7px 10px; outline: none; flex: 1; min-width: 0;
    }
    .btn-action {
      background: var(--bg2); border: 1px solid var(--border); color: #94a3b8;
      border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
      flex-shrink: 0; white-space: nowrap;
    }
    .btn-action:active { background: #263348; }
    .btn-action:disabled { opacity: .4; cursor: default; }
    .btn-action.active-move { border-color: #22c55e; color: #4ade80; background: #052e16; }
    .btn-action.active-skill { border-color: #f59e0b; color: #fbbf24; background: #451a03; }
    .btn-end {
      background: linear-gradient(180deg, #15803d 0%, #14532d 100%);
      border: 2px solid #4ade80; border-radius: 50px;
      color: #fff; font-size: 14px; font-weight: 900; letter-spacing: .5px;
      padding: 9px 18px; cursor: pointer; flex-shrink: 0; min-width: 124px;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      box-shadow: 0 0 18px rgba(74,222,128,.45), 0 3px 8px rgba(0,0,0,.5);
      animation: endTurnPulse 2.4s ease-in-out infinite;
      position: relative; overflow: hidden;
    }
    .btn-end::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      animation: btnShimmer 2.4s ease-in-out infinite;
    }
    @keyframes endTurnPulse {
      0%,100% { box-shadow: 0 0 18px rgba(74,222,128,.45), 0 3px 8px rgba(0,0,0,.5); }
      50%      { box-shadow: 0 0 32px rgba(74,222,128,.75), 0 3px 8px rgba(0,0,0,.5); }
    }
    @keyframes btnShimmer {
      0%      { left: -60%; }
      50%,100% { left: 120%; }
    }
    .btn-end:disabled {
      background: linear-gradient(180deg, #374151, #1f2937);
      border-color: #4b5563; color: #6b7280;
      animation: none; box-shadow: 0 2px 4px rgba(0,0,0,.4); cursor: default;
    }
    .btn-end:disabled::before { display: none; }
    .btn-end:active:not(:disabled) { transform: scale(.97); }
    .btn-end.is-start {
      background: linear-gradient(180deg, #2563eb 0%, #1e3a8a 100%);
      border-color: #93c5fd;
      box-shadow: 0 0 18px rgba(147,197,253,.35), 0 3px 8px rgba(0,0,0,.5);
    }
    .status-msg { font-size: 12px; color: var(--muted); flex: 1; min-width: 120px; }
    .player-state-strip {
      display: flex; align-items: center; justify-content: flex-end; gap: 5px;
      flex-wrap: wrap;
    }
    .player-state-chip {
      min-width: 112px; border-radius: 8px; padding: 4px 6px;
      border: 1px solid #334155; background: #101827;
      display: flex; flex-direction: column; gap: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .player-state-chip.red { border-color: rgba(239,68,68,.38); background: linear-gradient(180deg, rgba(69,10,10,.56), rgba(15,23,42,.78)); }
    .player-state-chip.blue { border-color: rgba(59,130,246,.42); background: linear-gradient(180deg, rgba(23,37,84,.62), rgba(15,23,42,.78)); }
    .player-state-chip.active { box-shadow: 0 0 0 1px rgba(34,197,94,.34), inset 0 1px 0 rgba(255,255,255,.05); }
    .player-state-main {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 900; color: #e2e8f0; white-space: nowrap;
    }
    .player-side-name { min-width: 28px; }
    .resource-glyph {
      position: relative; width: 16px; height: 16px; flex: 0 0 auto;
      display: inline-grid; place-items: center;
    }
    .resource-glyph.action {
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
      background: #1f6feb;
      box-shadow: inset 0 0 0 2px rgba(191,219,254,.9);
    }
    .resource-glyph.action::before {
      content: ""; width: 36%; height: 66%; background: #eaf4ff;
      clip-path: polygon(56% 0, 96% 0, 66% 42%, 100% 42%, 28% 100%, 42% 55%, 0 55%);
      transform: rotate(8deg);
    }
    .resource-glyph.charge {
      transform: rotate(45deg); border-radius: 4px; background: #8b5cf6;
      box-shadow: inset 0 0 0 2px rgba(245,208,254,.88);
    }
    .resource-glyph.charge::before {
      content: ""; width: 48%; height: 48%; border-radius: 3px;
      border: 2px solid #f6eaff;
    }
    .resource-glyph.charge::after {
      content: ""; position: absolute; width: 14%; height: 14%;
      border-radius: 50%; background: #f6eaff;
    }
    .resource-orb {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 22px; min-width: 42px; padding: 0 7px 0 5px; border-radius: 999px;
      color: #e2e8f0; font-size: 13px; font-weight: 950; line-height: 1;
      background: rgba(15,23,42,.72); border: 1px solid rgba(148,163,184,.22);
    }
    .resource-orb.action { border-color: rgba(59,130,246,.48); color: #dbeafe; }
    .resource-orb.charge { border-color: rgba(168,85,247,.48); color: #f3e8ff; }
    .player-state-tags { display: none; }
    .player-state-tags .status-tag {
      font-size: 9px; padding: 2px 5px; border-radius: 999px;
      background: rgba(51,65,85,.58); border: 1px solid rgba(148,163,184,.24);
      color: #cbd5e1;
    }

    /* ── Hand panel ── */
    .hand-panel {
      border-top: 1px solid var(--border); flex-shrink: 0;
      background: #080f1e;
    }
    .hand-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 10px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid #1a2540;
    }
    .hand-scroll {
      display: flex; gap: 6px; padding: 6px 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: #334155 transparent;
    }
    .hand-scroll::-webkit-scrollbar { height: 3px; }
    .hand-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    /* ── Hearthstone-style cards ── */
    .card-item {
      flex-shrink: 0; width: 88px; height: 138px;
      background: linear-gradient(180deg, #1a2744 0%, #0f1929 55%, #131c30 100%);
      border: 2px solid #4a6a9a; border-radius: 10px;
      cursor: pointer; position: relative;
      display: flex; flex-direction: column; overflow: visible;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(100,150,255,.12);
    }
    .card-item:hover { transform: translateY(-10px) scale(1.06); box-shadow: 0 14px 28px rgba(0,0,0,.85); z-index: 10; }
    .card-item.card-pending { border-color: #f59e0b; box-shadow: 0 0 18px rgba(245,158,11,.45); }
    .card-item.card-disabled { opacity: .45; cursor: default; }
    .card-item.card-disabled:hover { transform: none; box-shadow: 0 4px 12px rgba(0,0,0,.6); }
    .card-item.card-reactive { border-color: #818cf8; box-shadow: 0 0 12px rgba(99,102,241,.35); }

    /* Mana gem */
    .card-mana-gem {
      position: absolute; top: -9px; left: -9px;
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #93c5fd, #1d4ed8 60%, #1e3a8a);
      border: 2px solid #bfdbfe;
      box-shadow: 0 0 12px rgba(59,130,246,.75), 0 2px 4px rgba(0,0,0,.5);
      color: #fff; font-size: 14px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    .card-mana-gem.free {
      background: radial-gradient(circle at 35% 30%, #86efac, #15803d 60%, #14532d);
      border-color: #bbf7d0; box-shadow: 0 0 12px rgba(34,197,94,.75), 0 2px 4px rgba(0,0,0,.5);
    }

    /* Art area */
    .card-art {
      width: 100%; height: 66px; flex-shrink: 0;
      border-radius: 8px 8px 0 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; background: rgba(0,0,0,.25); position: relative;
    }
    .card-art::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(10,15,30,.75));
      pointer-events: none;
    }

    /* Name banner */
    .card-name-banner {
      background: linear-gradient(90deg, transparent, rgba(18,38,80,.96) 18%, rgba(18,38,80,.96) 82%, transparent);
      text-align: center; padding: 4px 10px;
      font-size: 10px; font-weight: 800; color: #e2e8f0;
      border-top: 1px solid rgba(100,150,220,.3);
      border-bottom: 1px solid rgba(100,150,220,.3);
      flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Card body */
    .card-body { flex: 1; padding: 4px 7px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .card-desc { font-size: 9px; color: #94a3b8; line-height: 1.35; flex: 1; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .card-type-badge { font-size: 8px; color: #475569; font-weight: 600; text-align: center; }
    .hand-empty { font-size: 12px; color: #334155; padding: 10px; }

    /* ── Turn announcement overlay ── */
    #turnAnnounce {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 30px; font-weight: 900; letter-spacing: 3px;
      pointer-events: none; z-index: 500; display: none; white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
    }
    #turnAnnounce.show { display: block; animation: turnAnnounceAnim 1.8s ease-out forwards; }
    @keyframes turnAnnounceAnim {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.55); }
      22%  { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
      60%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.12); }
    }

    /* ── Log ── */
    .log-panel {
      flex-shrink: 0; border-top: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border);
      flex-shrink: 0; cursor: pointer; user-select: none;
    }
    .log-header:active { background: var(--bg2); }
    .log-body { overflow-y: auto; padding: 4px 10px; font-size: 12px; max-height: 90px; }
    .log-body.collapsed { display: none; }
    .log-body p { margin: 2px 0; line-height: 1.4; }
    .log-turn { color: #fbbf24; }
    .log-move { color: #4ade80; }
    .log-skill { color: #c084fc; }
    .log-err  { color: #f87171; }
    .log-info { color: #94a3b8; }
    .btn-clear { background: transparent; border: none; color: var(--muted); font-size: 11px; cursor: pointer; }
    .collapse-arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
    .collapse-arrow.open { transform: rotate(90deg); }

    /* ── Hand panel collapsible ── */
    .hand-body { }
    .hand-body.collapsed { display: none; }
    .hand-header { cursor: pointer; user-select: none; }
    .hand-header:active { background: #0d1929; }

    /* ── Fullscreen map mode ── */
    .btn-fullmap {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      color: #94a3b8; padding: 5px 9px; font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .btn-fullmap:active { opacity: .7; }
    body.full-map .side-panel,
    body.full-map .action-bar,
    body.full-map .hand-panel,
    body.full-map .log-panel,
    body.full-map .phase-bar,
    body.full-map .tile-legend,
    body.full-map .board-side-rail {
      display: none !important;
    }
    body.full-map .topbar   { display: none !important; }
    body.full-map #skillBar { display: none !important; }
    body.full-map .board-wrap {
      align-items: center; justify-content: center; padding: 2px;
    }
    #fullMapExitBtn {
      display: none;
      position: fixed; top: 8px; right: 8px; z-index: 100;
      background: rgba(0,0,0,0.65); color: #e2e8f0;
      border: 1px solid #475569; border-radius: 6px;
      padding: 4px 10px; font-size: 13px; cursor: pointer;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    body.full-map #fullMapExitBtn { display: block; }

    /* ── Damage floaters ── */
    .dmg-float {
      position: absolute; pointer-events: none; white-space: nowrap;
      font-size: 16px; font-weight: 900; z-index: 50;
      transform: translateX(-50%);
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      animation: floatUp 1.1s ease-out forwards;
    }
    .dmg-float.big { font-size: 22px; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(-8px); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-54px); }
    }

    /* ── Loading / result overlays ── */
    #loadingOverlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 200;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--bg2); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #resultOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 200; display: none;
    }
    .result-icon { font-size: 64px; }
    .result-title { font-size: 28px; font-weight: 800; }
    .result-sub { font-size: 15px; color: #94a3b8; }

    #red43QaPanel {
      display: none; position: fixed; left: 12px; bottom: 12px; z-index: 190;
      width: min(360px, calc(100vw - 24px)); padding: 12px 14px;
      border: 1px solid rgba(96,165,250,.62); border-radius: 12px;
      background: rgba(3,7,18,.92); color: #dbeafe;
      box-shadow: 0 18px 50px rgba(0,0,0,.46); backdrop-filter: blur(12px);
      font-size: 11px; line-height: 1.55;
    }
    body.red43-qa #red43QaPanel { display: block; }
    #red43QaPanel[data-consistent="true"] { border-color: rgba(74,222,128,.78); }
    #red43QaPanel[data-consistent="false"] { border-color: rgba(248,113,113,.76); }
    .red43-qa-title { color: #93c5fd; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .red43-qa-grid { display: grid; grid-template-columns: 84px 1fr; gap: 2px 8px; margin-top: 7px; }
    .red43-qa-key { color: #64748b; }
    .red43-qa-value { color: #e2e8f0; overflow-wrap: anywhere; }
    .red43-qa-button {
      width: 100%; margin-top: 9px; padding: 7px 10px; border: 1px solid #3b82f6;
      border-radius: 8px; background: #1d4ed8; color: #fff; cursor: pointer;
      font-size: 11px; font-weight: 900;
    }
    .red43-qa-button:disabled { cursor: not-allowed; opacity: .48; }

    /* ── Option picker overlay ── */
    #optionPickerOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); z-index: 300;
      align-items: center; justify-content: center;
    }
    #optionPickerOverlay.show { display: flex; }
    .option-sheet {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 20px 16px; width: min(340px, 92vw);
      display: flex; flex-direction: column; gap: 10px;
    }
    .option-title {
      font-size: 15px; font-weight: 700; color: #e2e8f0;
      text-align: center; margin-bottom: 4px;
    }
    .option-btn {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      color: #e2e8f0; padding: 13px 16px; font-size: 14px;
      cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
    }
    .option-btn:active { border-color: #3b82f6; background: #172554; }
    .option-btn-label { font-weight: 600; }
    .option-btn-desc { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .option-cancel {
      background: none; border: 1px solid #475569; border-radius: 10px;
      color: #94a3b8; padding: 10px; font-size: 13px;
      cursor: pointer; text-align: center; margin-top: 4px;
    }
    .option-cancel:active { background: #1e293b; }

    /* Training setup */
    #trainingSetupOverlay {
      display: none; position: fixed; inset: 0;
      align-items: center; justify-content: center; padding: 18px;
      z-index: 260; background: rgba(2,6,23,.58);
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
    }
    #trainingSetupOverlay.show { display: flex; }
    .training-setup-sheet {
      width: min(520px, 94vw); background: rgba(15,23,42,.78);
      border: 1px solid rgba(255,255,255,.16); border-radius: 18px;
      box-shadow: 0 28px 90px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
    }
    .training-setup-title {
      font-size: 18px; font-weight: 900; color: #f8fafc;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .training-setup-sub { margin-top: 5px; color: #94a3b8; font-size: 12px; line-height: 1.5; }
    .training-setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .training-setup-col {
      border: 1px solid rgba(51,65,85,.9); border-radius: 10px;
      background: rgba(15,23,42,.72); padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .training-setup-label { color: #e2e8f0; font-size: 13px; font-weight: 900; }
    .training-setup-field { display: flex; flex-direction: column; gap: 5px; }
    .training-setup-field span { font-size: 11px; color: #64748b; font-weight: 800; }
    .training-setup-field select {
      width: 100%; background: #1e293b; border: 1px solid #334155;
      color: #e2e8f0; border-radius: 8px; padding: 8px 9px; font-size: 13px;
    }
    .training-piece-list {
      max-height: 230px; overflow-y: auto; display: grid; gap: 6px;
      padding: 6px; border: 1px solid #334155; border-radius: 8px; background: #111827;
    }
    .training-piece-option {
      display: flex; align-items: center; gap: 8px; min-height: 38px;
      padding: 8px; border: 1px solid rgba(51,65,85,.9); border-radius: 8px;
      background: rgba(30,41,59,.72); color: #e2e8f0; font-size: 12px; font-weight: 700;
      cursor: pointer; user-select: none;
    }
    .training-piece-option input { width: 18px; height: 18px; flex-shrink: 0; }
    .training-piece-option:has(input:checked) {
      border-color: #22c55e; background: rgba(22,101,52,.28); color: #dcfce7;
    }
    .training-setup-hint { color: #64748b; font-size: 11px; line-height: 1.45; }
    .training-setup-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .training-setup-btn {
      border: 1px solid rgba(148,163,184,.34); border-radius: 12px; padding: 10px 14px;
      background: rgba(30,41,59,.78); color: #cbd5e1; font-size: 13px; font-weight: 800; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      transition: transform .16s ease, filter .16s ease, border-color .16s ease;
    }
    .training-setup-btn.primary { background: rgba(22,101,52,.86); border-color: rgba(34,197,94,.72); color: #dcfce7; }
    .training-setup-btn:active { transform: scale(.985); filter: brightness(1.12); }
    @media (prefers-reduced-motion: reduce) {
      .training-setup-btn { transition: none; }
    }
    @media (max-width: 560px) {
      .training-setup-grid { grid-template-columns: 1fr; }
      .training-setup-actions { flex-direction: column; }
      .training-setup-btn { width: 100%; }
    }

    /* Tile legend */
    .tile-legend {
      display: flex; flex-wrap: wrap; gap: 5px; padding: 5px 8px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tile-legend { display: none !important; }
    .legend-item { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #64748b; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── Piece info button ── */
    .piece-info-btn {
      float: right; background: none; border: none; color: #475569;
      font-size: 13px; cursor: pointer; padding: 0 0 0 4px; line-height: 1;
    }

    /* ── Piece info modal ── */
    #pieceInfoModal {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 150; display: none; align-items: flex-start; justify-content: center;
      padding: 16px; overflow-y: auto;
    }
    .pi-layout {
      width: 100%; max-width: 760px; display: flex; gap: 14px; align-items: flex-start;
      margin: auto;
    }
    .pi-sheet {
      flex: 1; width: 100%; max-width: 420px; background: #1e293b;
      border: 1px solid #334155; border-radius: 14px; padding: 16px;
    }
    .pi-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .pi-name { font-size: 17px; font-weight: 800; }
    .pi-close {
      background: none; border: none; color: #64748b;
      font-size: 20px; cursor: pointer; padding: 0 4px;
    }
    .pi-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
      margin-bottom: 12px;
    }
    .pi-stat {
      background: #0f172a; border-radius: 8px; padding: 7px 4px; text-align: center;
    }
    .pi-stat-val { font-size: 14px; font-weight: 800; }
    .pi-stat-lbl { font-size: 9px; color: #475569; margin-top: 1px; text-transform: uppercase; }
    .pi-section-label {
      font-size: 10px; font-weight: 700; color: #475569;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }
    .pi-skill {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
      padding: 10px; margin-bottom: 7px;
    }
    .pi-skill-header {
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    }
    .pi-skill-icon { font-size: 18px; flex-shrink: 0; }
    .pi-skill-name { font-size: 13px; font-weight: 700; }
    .pi-skill-badge {
      margin-left: auto; font-size: 9px; color: #64748b;
      background: #1e293b; border-radius: 4px; padding: 1px 5px;
    }
    .pi-skill-desc { font-size: 11px; color: #94a3b8; line-height: 1.45; }
    .pi-skill-meta { font-size: 10px; color: #475569; margin-top: 3px; }
    .pi-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .pi-keywords { margin-top: 8px; }

    /* ── Card detail modal ── */
    #cardDetailModal {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      z-index: 160; display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .cd-layout {
      width: 100%; max-width: 640px; display: flex; gap: 14px; align-items: flex-start;
    }
    .cd-sheet {
      width: 220px; background: #1e293b; border: 2px solid #334155;
      border-radius: 16px; padding: 16px; position: relative;
    }
    .cd-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer;
    }
    .cd-cost {
      display: inline-block; background: #1e3a5f; color: #93c5fd;
      font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 8px; margin-bottom: 8px;
    }
    .cd-cost.free { background: #052e16; color: #4ade80; }
    .cd-icon { font-size: 40px; text-align: center; margin-bottom: 6px; }
    .cd-name { font-size: 16px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .cd-type { font-size: 11px; color: #64748b; text-align: center; margin-bottom: 10px; }
    .cd-desc {
      font-size: 12px; color: #94a3b8; line-height: 1.5;
      background: #0f172a; border-radius: 8px; padding: 10px; margin-bottom: 8px;
    }
    .cd-meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .cd-meta-tag {
      font-size: 10px; background: #1e293b; border: 1px solid #334155;
      border-radius: 6px; padding: 3px 8px; color: #64748b;
    }
    .keyword-badges {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
    }
    .keyword-badge {
      border: 1px solid #475569; background: #0f172a; color: #cbd5e1;
      border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700;
      cursor: pointer;
    }
    .keyword-badge.active {
      background: #1d4ed8; border-color: #60a5fa; color: #eff6ff;
      box-shadow: 0 0 0 1px rgba(147,197,253,.2) inset;
    }
    .keyword-panel {
      width: 240px; background: #0f172a; border: 1px solid #334155;
      border-radius: 14px; padding: 14px; color: #cbd5e1;
    }
    .keyword-panel-title {
      font-size: 11px; color: #64748b; letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .keyword-empty {
      color: #64748b; font-size: 12px; line-height: 1.5;
    }
    .keyword-name {
      font-size: 16px; font-weight: 800; color: #f8fafc; margin-bottom: 6px;
    }
    .keyword-short {
      font-size: 12px; color: #cbd5e1; line-height: 1.5; margin-bottom: 8px;
    }
    .keyword-long {
      font-size: 11px; color: #94a3b8; line-height: 1.6;
    }
    .keyword-panel-list {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
    }
    .keyword-mini {
      font-size: 10px; color: #64748b; border: 1px solid #1e293b;
      border-radius: 999px; padding: 2px 8px;
    }
    @media (max-width: 760px) {
      #cardDetailModal, #pieceInfoModal { align-items: flex-start; overflow-y: auto; }
      .cd-layout, .pi-layout { max-width: 420px; flex-direction: column; }
      .cd-sheet { width: 100%; }
      .keyword-panel { width: 100%; }
      .board-shell { gap: 8px; align-items: center; }
      .board-side-rail { width: 124px; gap: 10px; }
      .selected-status-card,
      .selected-status-empty { min-height: 110px; }
      .btn-end { min-width: 112px; padding: 8px 13px; font-size: 12px; }
      .player-state-chip { min-width: 116px; }
      .topbar { top: 6px; right: 6px; max-width: 58px; padding: 5px; gap: 4px; border-radius: 9px; }
      .phase-bar { top: 6px; left: 6px; max-width: calc(100vw - 72px); padding: 5px 6px; flex-wrap: wrap; }
      .back-btn, .btn-surrender, .btn-fullmap, #btnSwitchPov, #btnResetCD {
        min-width: 28px; height: 28px; padding: 0 6px; font-size: 12px;
      }
      #roundLabel, #wsStatus { display: none !important; }
      #resApDisplay, #resCpDisplay { min-height: 28px; padding: 3px 6px; font-size: 11px; }
      #playerResCards { max-width: calc(100vw - 84px); }
      .player-state-chip { min-width: 96px; padding: 3px 5px; }
      .player-state-main { gap: 4px; font-size: 10px; }
      .resource-orb { padding: 1px 4px; }
    }

    /* ── Windows hover ── */
    @media (hover: hover) {
      .back-btn:hover { background: #263348; }
      .piece-card:hover:not(.dead) { border-color: #475569; }
      .btn-action:hover:not(:disabled) { background: #263348; }
      .btn-end:hover:not(:disabled) { filter: brightness(1.15); }
      .piece-info-btn:hover { color: #94a3b8; }
      .cell:hover { filter: brightness(1.3); }
      .keyword-badge:hover { border-color: #60a5fa; color: #eff6ff; }
    }

    /* ── Resource gem display (Hearthstone-style AP/CP) ── */
    .res-gem { display:flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-weight:800; flex-shrink:0; }
    .res-gem.ap { background:#071429; border:1.5px solid #3b82f6; color:#93c5fd; box-shadow:0 0 8px rgba(59,130,246,.35); }
    .res-gem.cp { background:#120922; border:1.5px solid #7c3aed; color:#d8b4fe; box-shadow:0 0 8px rgba(124,58,237,.35); }
    .res-gem-icon { font-size:15px; line-height:1; }
    .res-gem-val { font-size:17px; line-height:1; letter-spacing:-.5px; }
    .res-gem-frac { font-size:10px; opacity:.65; }

    /* ── Side panels: fullscreen map by default ── */
    .side-panel { display:none !important; }

    /* ── Training bar ── */
    .training-bar { align-items:center; gap:5px; flex-wrap:wrap; padding:4px 8px; background:#04080f; border-top:1px solid #1a2540; flex-shrink:0; }
    .training-bar select { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:6px; font-size:11px; padding:3px 6px; }
    .tb-btn { border-radius:6px; font-size:11px; padding:3px 9px; cursor:pointer; border:1px solid; white-space:nowrap; background:transparent; }

    /* ── Hand always visible ── */
    .hand-body { display:block !important; }

    /* ── Skill card bar ── */
    #skillBar {
      display:none; flex-direction:row; gap:6px; flex-shrink:0;
      padding:5px 10px; overflow-x:auto; overflow-y:hidden;
      background:rgba(2,6,23,.95); border-top:1px solid #1a2540;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    #skillBar::-webkit-scrollbar { display:none; }
    .skill-card {

    /* ── Fullscreen log overlay ── */
    #logOverlay { position:fixed; inset:0; background:rgba(2,8,22,.96); z-index:400; flex-direction:column; display:none; }
    #logOverlay.show { display:flex; }
    #logBody { flex:1; overflow-y:auto; padding:10px 16px; }
    #logBody p { margin:3px 0; line-height:1.45; }

    /* ── Target selection overlay ── */
    #targetOverlay {
      position:fixed; inset:0; background:rgba(0,0,0,.58);
      pointer-events:none; z-index:60;
      display:none; flex-direction:column; align-items:center; padding-top:72px; gap:10px;
    }
    #targetOverlay.show { display:flex; }
    .target-prompt {
      font-size:22px; font-weight:900; color:#fbbf24;
      letter-spacing:1.5px;

      animation:targetPulse 1.6s ease-in-out infinite;
    }
    .target-cancel-btn {
      pointer-events:auto; background:rgba(15,23,42,.85);
      border:1px solid #475569; border-radius:8px;
      color:#94a3b8; padding:6px 18px; font-size:13px; cursor:pointer;
    }
    .target-cancel-btn:active { background:#1e293b; }
    @keyframes targetPulse {
      0%,100% { opacity:.85; }
      50%      { opacity:1; text-shadow:0 0 32px rgba(245,158,11,1), 0 2px 6px rgba(0,0,0,.9); }
    }

    /* Final Android/Windows parity override. Keep this at the end of CSS. */
    body::after {
      content: "UI 20260517";
      position: fixed; right: 6px; bottom: 6px; z-index: 9999;
      padding: 2px 5px; border-radius: 5px;
      background: rgba(2,6,23,.55); border: 1px solid rgba(148,163,184,.18);
      color: rgba(203,213,225,.58); font-size: 9px; pointer-events: none;
    }

      position: fixed !important; top: 8px !important; right: 8px !important; left: auto !important;

    }

      padding: 5px 6px !important; background: rgba(2,6,23,.46) !important;

  <script>
    // ── URL params ──
    const params = new URLSearchParams(location.search)
    const roomId = (params.get('roomId') || '').trim().toLowerCase()
    let myPlayerId = (params.get('playerId') || '').trim().toLowerCase()
    const myAccountId = (params.get('accountId') || params.get('account') || '').trim().toLowerCase()
    const myPlayerName = params.get('playerName') || '玩家'
    const TRAINING_MODE = params.get('mode') === 'training'
    const SPECTATE_MODE = params.get('mode') === 'spectate'
    const RED43_QA_MODE = params.get('qa') === 'RED-43'
    if (RED43_QA_MODE) document.body.classList.add('red43-qa')
    function shouldUseRelayMode() {
      if (params.get('relay') === '1' || params.get('server') === 'remote') return true
      return !!(window.RvBUtils && RvBUtils.getActiveServerMode && RvBUtils.getActiveServerMode() === 'remote')
    }

    // ── Server URL ──
    const getServerUrl = () => RvBUtils.getServerUrl()

    // ── Training mode: server URL helpers ──
    let _trainingBaseUrl = null

      if (window.electronAPI) {
        // Wait for the local server to become ready.
        for (let i = 0; i < 24; i++) {
          try {
            const info = await window.electronAPI.getHostInfo()
            if (info && info.port && info.running) {

              return _trainingBaseUrl
            }
            if (i === 0) showMsg('等待本地服务器启动...')

        }

          const info = await window.electronAPI.getHostInfo()
          if (info && info.port) { _trainingBaseUrl = 'http://localhost:' + info.port; return _trainingBaseUrl }

    async function trainingApiFetch(method, body) {
      const Engine = await window.RvBGameEngine.ensure()
      if (method === 'POST') {
        const firstPlayerId = body && body.firstPlayerId === 'training-blue' ? 'training-blue' : 'training-red'
        const secondPlayerId = firstPlayerId === 'training-red' ? 'training-blue' : 'training-red'
        // Alignment filters the piece pool only; red/blue are engine seats.
        const firstAlignment = body && body.firstFaction === 'blue' ? 'blue' : 'red'
        const secondAlignment = body && body.secondFaction === 'red' ? 'red' : 'blue'
        // First player is always red in the engine, second player is blue.
        const firstEngineFaction = 'red'
        const secondEngineFaction = 'blue'
        const firstPieces = resolveTrainingInitialPieces(firstAlignment, body && (body.firstTemplateIds || body.firstTemplateId))
        const secondPieces = resolveTrainingInitialPieces(secondAlignment, body && (body.secondTemplateIds || body.secondTemplateId))
        if (!firstPieces.length || !secondPieces.length) {
          throw new Error('训练棋子资源未加载，请返回后重试')
        }
        const state = await Engine.createInitialBattleForPlayers(
          ['training-red', 'training-blue'],
          [],
          [
            { playerId: firstPlayerId, pieces: firstPieces, faction: firstEngineFaction },
            { playerId: secondPlayerId, pieces: secondPieces, faction: secondEngineFaction },
          ],
          body && body.mapId,
          { firstPlayerId }
        )
        if (!state) throw new Error('Failed to create training battle state')
        state.skillsById = Object.assign({}, skillsById || {}, state.skillsById || {})
        state.players = state.players.map(function(player) {
          return Object.assign({}, player, {
            faction: player.playerId === firstPlayerId ? firstEngineFaction : secondEngineFaction,
            actionPoints: player.playerId === firstPlayerId ? 10 : 0,
            maxActionPoints: 10,
          })
        })
        state.turn.currentPlayerId = firstPlayerId
        return state
      }
      if (method === 'PUT') {
        if (!body || !body.action || !body.battleState) throw new Error('Missing action or battleState')
        const next = Engine.applyBattleAction(Engine.safeCloneBattleState(body.battleState), body.action)
        next.pieces = next.pieces.filter(function(piece, index, self) {
          return index === self.findIndex(function(p) { return p.instanceId === piece.instanceId })
        })
        return next
      }
      if (method === 'PATCH') {
        if (!body || !body.type || !body.battleState) throw new Error('Missing type or battleState')
        const next = Engine.safeCloneBattleState(body.battleState)
        if (body.type === 'updateResources') {
          next.players = next.players.map(function(player) {
            if (player.playerId !== body.playerId) return player
            return Object.assign({}, player, {
              actionPoints: Math.max(0, Math.min(20, body.actionPoints)),
              chargePoints: Math.max(0, Math.min(20, body.chargePoints)),
            })
          })
          return next
        }
        if (body.type === 'removePiece') {
          next.pieces = next.pieces.filter(function(p) { return p.instanceId !== body.instanceId })
          return next
        }
        if (body.type === 'resetCooldowns') {
          next.pieces = next.pieces.map(function(piece) {
            return Object.assign({}, piece, {
              skills: (piece.skills || []).map(function(skill) {
                return Object.assign({}, skill, {
                  currentCooldown: 0,
                  usesRemaining: skill.usesRemaining === 0 ? 1 : skill.usesRemaining,
                })
              })
            })
          })
          return next
        }
        if (body.type === 'addPiece') {
          const tpl = PIECES_BY_ID[body.templateId]
          if (!tpl) throw new Error('棋子模板未找到: ' + body.templateId)
          const occupied = next.pieces.some(function(p) { return p.x === body.x && p.y === body.y && p.currentHp > 0 })
          if (occupied) throw new Error('Position is already occupied')
          const ownerPlayerId = body.ownerPlayerId === 'training-blue' ? 'training-blue' : 'training-red'
          const ownerFaction = getTrainingPlayerFaction(ownerPlayerId)
          const stats = tpl.stats || {}
          const rules = (tpl.rules || [])
            .map(function(ruleId) { return Engine.loadRuleById ? Engine.loadRuleById(ruleId, true) : null })
            .filter(Boolean)
          next.pieces.push({
            instanceId: ownerPlayerId + '-' + Date.now() + '-' + Math.floor(Math.random() * 100000),
            templateId: tpl.id,
            name: tpl.name,
            ownerPlayerId: ownerPlayerId,
            faction: ownerFaction,
            currentHp: stats.maxHp || 1,
            maxHp: stats.maxHp || 1,
            attack: stats.attack || 0,
            defense: stats.defense || 0,
            moveRange: stats.moveRange || 3,
            x: body.x,
            y: body.y,
            skills: (tpl.skills || []).map(function(s) { return { skillId: s.skillId || s.id || s, level: s.level || 1, currentCooldown: 0, usesRemaining: -1 } }),
            buffs: [],
            debuffs: [],
            statusTags: [],
            ruleTags: [],
            rules: rules,
          })
          return next
        }
        throw new Error('Unknown operation type: ' + body.type)
      }
      throw new Error('Unsupported training method: ' + method)
    }

    function red43QaSnapshot() {
      if (!RED43_QA_MODE) return null
      const pieces = G && G.pieces ? G.pieces.filter(p => p.currentHp > 0) : []
      const allies = pieces.filter(p => String(p.ownerPlayerId || '').toLowerCase() === myPlayerId)
      const enemies = pieces.filter(p => String(p.ownerPlayerId || '').toLowerCase() !== myPlayerId)
      const expectedFilter = params.get('qaExpected') || ''
      const expectedIds = (params.get('qaExpectedTargets') || '').split(',').filter(Boolean).sort()
      const targetKeys = pendingSkill && pendingSkill.validTargets
        ? Array.from(pendingSkill.validTargets).sort()
        : []
      const highlightedPieces = targetKeys.map(key => {
        const parts = key.split(',')
        const x = Number(parts[0]), y = Number(parts[1])
        const piece = pieces.find(p => p.x === x && p.y === y)
        if (!piece) return null
        return {
          key,
          pieceId: piece.instanceId,
          ownerPlayerId: piece.ownerPlayerId,
          relation: String(piece.ownerPlayerId || '').toLowerCase() === myPlayerId ? 'ally' : 'enemy',
        }
      }).filter(Boolean)
      const actualIds = highlightedPieces.map(target => target.pieceId).sort()
      const consistent = expectedIds.length > 0 && actualIds.length === expectedIds.length &&
        actualIds.every((id, index) => id === expectedIds[index])
      return {
        roomId,
        seed: gameSeed,
        scenario: params.get('qaScenario') || '',
        alignment: params.get('qaAlignment') || '',
        playerId: myPlayerId,
        skillId: pendingSkill && pendingSkill.skillId ? pendingSkill.skillId : '',
        expectedFilter,
        allyPieceIds: allies.map(p => p.instanceId).sort(),
        enemyPieceIds: enemies.map(p => p.instanceId).sort(),
        expectedTargetPieceIds: expectedIds,
        highlightedTargets: highlightedPieces,
        actualTargetPieceIds: actualIds,
        consistent,
      }
    }

    }
    function pieceDispHp(p) {
      if (p.masterPieceId && G && G.pieces) {
        const master = G.pieces.find(m => m.instanceId === p.masterPieceId && m.currentHp > 0)
        if (master) return master.currentHp
      }

    }
    function pieceDispStats(p) {
      if (p.masterPieceId && G && G.pieces) {
        const master = G.pieces.find(m => m.instanceId === p.masterPieceId && m.currentHp > 0)
        if (master) {
          const mb = master.stats || master
          return { attack: mb.attack, defense: mb.defense, moveRange: mb.moveRange }
        }
      }
      const base = p.stats || p
      return {
        attack:    p.displayAttack    !== undefined ? p.displayAttack    : base.attack,
        defense:   p.displayDefense   !== undefined ? p.displayDefense   : base.defense,
        moveRange: p.displayMoveRange !== undefined ? p.displayMoveRange : base.moveRange,
      }
    }
    function pieceDispSkills(p) {
      if (p.masterPieceId && G && G.pieces) {
        const master = G.pieces.find(m => m.instanceId === p.masterPieceId && m.currentHp > 0)
        if (master) return master.skills || []
      }
      const base = p.displaySkills !== undefined ? p.displaySkills : (p.skills || [])
      // Also show runtime-added derived skills not present in the base template.
      if (p.displaySkills !== undefined && p.skills && p.skills.length) {
        const baseIds = new Set(base.map(s => s && (s.skillId || s.id || s) || ''))
        const extra = p.skills.filter(s => { const id = s && (s.skillId || s.id || s) || ''; return id && !baseIds.has(id) })
        if (extra.length) return [...base, ...extra]
      }
      return base
    }
    function skillIdOf(sk) {
      if (!sk) return ''
      if (typeof sk === 'string') return sk
      return sk.skillId || sk.id || sk.definitionId || ''
    }
    function skillDefOf(skillId) {
      if (!skillId) return {}
      const cached = (G && G.skillsById && G.skillsById[skillId]) || skillsById[skillId]
      if (cached) return cached
      try {
        const xhr = new XMLHttpRequest()
        xhr.open('GET', './data/skills/' + skillId + '.json', false)
        xhr.send(null)
        if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText)) {
          const sk = JSON.parse(xhr.responseText)
          skillsById[skillId] = sk
          if (G && G.skillsById) G.skillsById[skillId] = sk
          return sk
        }
      } catch (_) {}
      return {}
    }
    function pieceDispTags(p) {
      // Shadow clones keep a summon-time display snapshot only; real rules still read statusTags.
      return p.displayStatusTags !== undefined ? p.displayStatusTags : (p.statusTags || [])
    }
    function normalizeKeywordList(items) {
      return [...new Set((items || []).filter(Boolean).map(v => String(v).trim()).filter(Boolean))]
    }
    function getKeywordMeta(name) {
      const meta = keywordGlossaryByName[name] || {}
      return {
        name,
        shortDescription: meta.shortDescription || '',
        longDescription: meta.longDescription || ''
      }
    }
    function keywordBadgeHtml(name, scope, activeName) {
      return `<button type="button" class="keyword-badge${name === activeName ? ' active' : ''}" data-scope="${scope}" data-keyword="${escHtml(name)}">${escHtml(name)}</button>`

    function renderKeywordPanel(keywordNames, activeName, emptyText) {

      const meta = getKeywordMeta(selected)
      const extra = keywordNames.filter(name => name !== selected)
      return `<div class="keyword-panel-title">关键词</div>
        <div class="keyword-name">${escHtml(meta.name)}</div>
        <div class="keyword-short">${escHtml(meta.shortDescription || '该关键词暂无说明')}</div>
        ${meta.longDescription ? `<div class="keyword-long">${escHtml(meta.longDescription)}</div>` : ''}
        ${extra.length ? `<div class="keyword-panel-list">${extra.map(name => `<span class="keyword-mini">${escHtml(name)}</span>`).join('')}</div>` : ''}`
    }
    function bindKeywordBadges(scope) {
      document.querySelectorAll(`.keyword-badge[data-scope="${scope}"]`).forEach(btn => {
        btn.onclick = (event) => {
          event.stopPropagation()
          const keyword = btn.getAttribute('data-keyword') || ''
          if (scope === 'card') selectCardKeyword(keyword)
          if (scope === 'piece') selectPieceKeyword(keyword)
        }

    }
    function selectCardKeyword(keyword) {
      activeCardKeyword = keyword
      if (currentCardDetail) showCardDetail(currentCardDetail.cardInstanceId, currentCardDetail.cardId, true)

    function selectPieceKeyword(keyword) {

    // State diff -> detailed log entries
    function diffStates(oldG, newG) {
      if (!oldG || !newG) return []
      const logs = []
      // Turn change
      const oid = oldG.turn && oldG.turn.currentPlayerId
      const nid = newG.turn && newG.turn.currentPlayerId
      if (oid !== nid && nid) {
        const isMe = nid.toLowerCase() === myPlayerId
        logs.push({ msg: `第 ${newG.turn ? newG.turn.turnNumber : '?'} 回合，${isMe ? '你的' : '对方的'}回合`, cls: 'turn' })
      }
      // Piece changes
      const allIds = new Set([
        ...oldG.pieces.map(p => p.instanceId),
        ...newG.pieces.map(p => p.instanceId)
      ])
      for (const id of allIds) {
        const op = oldG.pieces.find(p => p.instanceId === id)
        const np = newG.pieces.find(p => p.instanceId === id)
        if (!op && np) {
          logs.push({ msg: `${pieceName(np)} 登场 (${np.x},${np.y})`, cls: 'info' }); continue
        }
        if (op && !np) {
          logs.push({ msg: `${pieceName(op)} 已倒下`, cls: 'err' }); continue
        }
        if (!op || !np) continue
        // HP
        const hpDiff = np.currentHp - op.currentHp
        const mhp = pieceMaxHp(np)
        if (hpDiff < 0) {
          if (np.currentHp <= 0) {
            logs.push({ msg: `${pieceName(np)} 阵亡，受到 ${-hpDiff} 点伤害`, cls: 'err' })
          } else {
            logs.push({ msg: `${pieceName(np)} 受到 ${-hpDiff} 点伤害 -> ${np.currentHp}/${mhp} HP`, cls: 'skill' })
          }
        } else if (hpDiff > 0) {
          logs.push({ msg: `${pieceName(np)} 恢复 ${hpDiff} 点生命 -> ${np.currentHp}/${mhp} HP`, cls: 'move' })
        }
        // Move
        if (op.currentHp > 0 && np.currentHp > 0 && (op.x !== np.x || op.y !== np.y)) {
          logs.push({ msg: `${pieceName(np)} (${op.x},${op.y}) -> (${np.x},${np.y})`, cls: 'move' })
        }
        // Status effects
        const ot = (op.statusTags || []).map(t => t.id || t.type).filter(Boolean)
        const nt = (np.statusTags || []).map(t => t.id || t.type).filter(Boolean)
        for (const tag of nt.filter(t => !ot.includes(t)))
          logs.push({ msg: `${pieceName(np)} 获得 [${tag}]`, cls: 'info' })
        for (const tag of ot.filter(t => !nt.includes(t)))
          logs.push({ msg: `${pieceName(np)} 失去 [${tag}]`, cls: 'info' })
        // Skill cooldowns (skill used)
        const oss = op.skills || []
        const nss = np.skills || []
        for (const ns of nss) {
          const sid = ns.skillId || ns.id
          const os = oss.find(s => (s.skillId || s.id) === sid)
          if (os !== undefined && (ns.currentCooldown || 0) > (os.currentCooldown || 0)) {
            const skn = (skillDefOf(sid) && skillDefOf(sid).name) || sid
            logs.push({ msg: `${pieceName(np)} 使用技能 [${skn}]`, cls: 'skill' })
          }
        }
      }
      // Player AP/CP changes
      if (oldG.players && newG.players) {
        for (const np of newG.players) {
          const op = oldG.players.find(p => p.playerId === np.playerId)
          if (!op) continue
          const label = (np.playerId && np.playerId.toLowerCase() === myPlayerId) ? '你' : '对方'
          if (op.chargePoints !== np.chargePoints) {
            const diff = np.chargePoints - op.chargePoints
            if (diff > 0) logs.push({ msg: `${label}获得 ${diff} 充能点 (共 ${np.chargePoints} CP)`, cls: 'info' })
          }
          if (op.actionPoints !== np.actionPoints && op.actionPoints > 0 && np.actionPoints > op.actionPoints) {
            logs.push({ msg: `${label}行动点恢复至 ${np.actionPoints} AP`, cls: 'info' })
          }
        }
      }
      return logs
    }

    // ── Damage / heal floaters ──
    function spawnFloater(x, y, text, color, big) {
      if (_use3d && battlePresentation) {
        battlePresentation.spawnFloater(x, y, text, color, big)
        return
      }
      const layer = document.getElementById('floatLayer')
      if (!layer) return
      const cellSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size')) || 44
      const el = document.createElement('div')
      el.className = 'dmg-float' + (big ? ' big' : '')
      el.style.color = color
      el.style.left = (x * cellSize + cellSize / 2) + 'px'
      el.style.top  = (y * cellSize + 4) + 'px'
      el.textContent = text
      layer.appendChild(el)
      setTimeout(() => el.remove(), 1200)
    }

    function spawnStateFloaters(oldG, newG) {
      if (!oldG || !newG || !oldG.pieces || !newG.pieces) return
      for (const np of newG.pieces) {
        const op = oldG.pieces.find(p => p.instanceId === np.instanceId)
        if (!op) continue
        const newHp = np.currentHp ?? np.hp ?? 0
        const oldHp = op.currentHp ?? op.hp ?? 0
        const diff = newHp - oldHp
        if (diff < 0) {
          const dead = newHp <= 0
          const big = dead || -diff >= 50
          spawnFloater(np.x, np.y, dead ? '💀' : String(-diff), dead ? '#c4b5fd' : '#f87171', big)
        } else if (diff > 0) {
          spawnFloater(np.x, np.y, '+' + diff, '#4ade80', false)
        }
      }
    }

    function logClassFromType(type) {
      if (type === 'move') return 'move'
      if (type === 'useBasicSkill' || type === 'useChargeSkill') return 'skill'
      if (type === 'endTurn' || type === 'beginPhase') return 'turn'
      if (type === 'triggerEffect') return 'skill'
      if (type === 'tileEffect') return 'info'
      if (type === 'playCard') return 'skill'
      if (type === 'surrender') return 'err'
      return 'info'
    }
    function flushActionLog(oldG, newG) {
      if (!newG || !newG.actions) return
      const start = (oldG && oldG.actions) ? oldG.actions.length : lastActionCount
      const newEntries = newG.actions.slice(start)
      for (const entry of newEntries) {
        const msg = (entry.payload && entry.payload.message) ? entry.payload.message : entry.type
        addLog('[T' + entry.turn + '] ' + msg, logClassFromType(entry.type))
      }
      lastActionCount = newG.actions.length
    }

    function showOptionPicker(title, options, originalAction) {
      pendingOptionAction = originalAction
      _pickerOptions = options
      document.getElementById('optionPickerTitle').textContent = title || '请选择'
      const list = document.getElementById('optionPickerList')
      list.innerHTML = options.map((opt, i) =>
        `<button class="option-btn" data-opt-idx="${i}">

          ${opt.description ? `<div class="option-btn-desc">${escHtml(opt.description)}</div>` : ''}
        </button>`
      ).join('')

    function selectOptionChoice(index) {
      document.getElementById('optionPickerOverlay').classList.remove('show')
      if (!pendingOptionAction) return
      const opt = _pickerOptions[index]
      if (!opt) return
      const action = Object.assign({}, pendingOptionAction, { selectedOption: opt.value !== undefined ? opt.value : opt })
      pendingOptionAction = null
      _pickerOptions = []
      doAction(action)

    function cancelOptionPicker() {
      document.getElementById('optionPickerOverlay').classList.remove('show')
      const action = pendingOptionAction
      pendingOptionAction = null
      _pickerOptions = []
      _pendingChoiceShown = null
      pendingSkill = null
      if (action && action.type === 'pendingOptionSelect' && action.cancelValue !== undefined) {
        const cancelValue = action.cancelValue
        const retry = Object.assign({}, action, { selectedOption: cancelValue })
        delete retry.cancelValue
        doAction(retry)
        return

      if (G && pendingOptionSelectionForMe()) {
        doAction({ type: 'cancelPendingSelection', playerId: myPlayerId })

    // ── Load local static data ──
    function withTimeout(promise, ms, label) {
      let timer = null
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(label + ' timeout after ' + ms + 'ms')), ms)
      })
      return Promise.race([promise, timeout]).finally(() => { if (timer) clearTimeout(timer) })
    }

    async function fetchLocalJson(path, timeoutMs) {
      timeoutMs = timeoutMs || 3500
      if (window.fetchPackJson && /^\.?\/?data\//.test(path)) {
        return withTimeout(window.fetchPackJson(path), timeoutMs, path)
      }
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null
      const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null
      let res
      try {
        res = await fetch(path, ctrl ? { signal: ctrl.signal } : undefined)
      } finally {
        if (timer) clearTimeout(timer)
      }
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.json()
    }

    async function fetchServerJson(path, timeoutMs) {
      const res = await RvBUtils.serverFetch(path, { timeoutMs: timeoutMs || 3500 })
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.json()
    }

    async function loadServerBattleDataFallback() {
      const payloads = await Promise.all([
        fetchServerJson('/api/pieces'),
        fetchServerJson('/api/skills'),
      ])
      const pieces = payloads[0] && Array.isArray(payloads[0].pieces) ? payloads[0].pieces : []
      pieces.forEach(function(piece) {
        if (piece && piece.id) PIECES_BY_ID[piece.id] = piece
      })
      const serverSkills = payloads[1] && payloads[1].skills
      if (serverSkills && typeof serverSkills === 'object') {
        Object.assign(skillsById, serverSkills)
      }
      if (!Object.keys(PIECES_BY_ID).length) {
        throw new Error('服务器未返回棋子资源')
      }
    }

    async function loadJsonRequired(path, errors) {
      try {
        return await fetchLocalJson(path)
      } catch (e) {
        const msg = path + ': ' + (e && e.message ? e.message : String(e))
        errors.push(msg)
        throw new Error(msg)
      }
    }

    async function loadJsonOptional(path, errors) {
      try {
        return await fetchLocalJson(path)
      } catch (e) {
        errors.push(path + ': ' + (e && e.message ? e.message : String(e)))
        return null
      }
    }

    async function loadLocalData() {
      const errors = []
      let recoveredFromServer = false
      try {
        try {
          const glossary = await loadJsonOptional('./data/skill-keywords.json', errors)
          keywordGlossaryByName = Object.fromEntries((glossary || []).map(item => [item.name, item]))
        } catch {}
        // Load piece templates
        const ids = await loadJsonRequired('./data/pieces/manifest.json', errors)
          const skillIds = new Set()
          await Promise.all(ids.map(async id => {
            try {
              const p = await loadJsonRequired('./data/pieces/' + id + '.json', errors)
              PIECES_BY_ID[id] = p
              // Collect all skill IDs referenced by this piece
              ;(p.skills || []).forEach(s => {
                const sid = s.skillId || s.id
                if (sid) skillIds.add(sid)
              })
            } catch {}
          }))
          // Load the full skill table before battle state arrives. Runtime effects can grant
          // skills that were not on the initial pieces, so referenced-only loading is not enough.
          try {
            const allSkillIds = await loadJsonOptional('./data/skills/manifest.json', errors)
            ;(allSkillIds || []).forEach(id => skillIds.add(id))
          } catch {}
          await Promise.all(Array.from(skillIds).map(async sid => {
            try {
              const sk = await loadJsonOptional('./data/skills/' + sid + '.json', errors)
              if (sk) skillsById[sid] = sk
            } catch {}
          }))
        // Load card definitions
        try {
          const cardIds = await loadJsonOptional('./data/cards/manifest.json', errors)
          await Promise.all((cardIds || []).map(async cid => {
            try {
              const cd = await loadJsonOptional('./data/cards/' + cid + '.json', errors)
              if (cd) cardsById[cid] = cd
            } catch {}
          }))
        } catch {}
      } catch (e) {
        console.warn('[battle] loadLocalData error:', e.message)
      }
      if (!Object.keys(PIECES_BY_ID).length) {
        try {
          await loadServerBattleDataFallback()
          recoveredFromServer = true
        } catch (e) {
          errors.push('server battle data: ' + (e && e.message ? e.message : String(e)))
        }
      }
      if (errors.length) {
        console.warn('[battle] local data load failures' + (recoveredFromServer ? ' (recovered from server)' : '') + ':', errors)
      }
      return { ok: recoveredFromServer || errors.length === 0, errors }
    }

    // ── Server-authoritative state handling ──

    // Apply an authoritative state snapshot received from server (WS or GET)
    var _lastAppliedState = null
    function resolveAuthoritySeed(state, seed) {
      var resolved = typeof seed === 'number' && Number.isInteger(seed) ? (seed >>> 0) : null
      if (resolved === null && state && typeof GameEngine !== 'undefined' && GameEngine.getBattleRootSeed) {
        var tracedSeed = GameEngine.getBattleRootSeed(state)
        if (typeof tracedSeed === 'number') resolved = tracedSeed >>> 0
      }
      if (resolved === null) return gameSeed
      if (typeof gameSeed === 'number' && gameSeed !== resolved) throw new Error('Authority root seed changed')
      if (typeof gameSeed !== 'number') gameSeed = resolved
      return gameSeed
    }
    function runDeterministicAuthorityAction(state, action) {
      if (!state || typeof GameEngine === 'undefined' || !GameEngine.runBattleAction) throw new Error('Deterministic authority runner is unavailable')
      var seed = resolveAuthoritySeed(state, null)
      if (typeof seed !== 'number') throw new Error('Missing authority root seed')
      return GameEngine.runBattleAction(state, action, { rootSeed: seed })
    }
    function applyServerState(state, seed, preserveWsSeq) {
      if (!state) return
      resolveAuthoritySeed(state, seed)
      if (!preserveWsSeq) wsActionSeq = -1
      const wasNull = !G
      const oldG = G
      G = state
      G.skillsById = Object.assign({}, skillsById || {}, G.skillsById || {})

      // Init seeded RNG once
      if (seed && !gameSeed && typeof GameEngine !== 'undefined' && GameEngine.setRng) {
        gameSeed = seed
        GameEngine.setRng(GameEngine.mulberry32(seed))
      }

      // Derive myFaction from pieces
      if (!myFaction && G.pieces) {
        const myPiece = G.pieces.find(function(p) { return p.ownerPlayerId && p.ownerPlayerId.toLowerCase() === myPlayerId })
        if (myPiece) myFaction = myPiece.faction
      }

      if (wasNull) {
        // First state received from WS; player names arrive via roomUpdate.
        playerNames[myPlayerId] = myPlayerName
        document.getElementById('loadingOverlay').style.display = 'none'
      }

      if (oldG) { flushActionLog(oldG, G); spawnStateFloaters(oldG, G) }
      render()

      if (G.gameOver || G.winner) { handleGameOver(); return }

      // Auto-advance start phase (only the current player sends beginPhase)
      if (G.turn && G.turn.phase === 'start') {
        var isMyTurn = G.turn.currentPlayerId && G.turn.currentPlayerId.toLowerCase() === myPlayerId
        if (isMyTurn) { addLog('自动初始化回合', 'info'); doBeginPhase() }
      }
    }

    function applyLegacyBattleEntry(entry) {
      if (!entry || typeof entry.seq !== 'number' || entry.seq <= wsActionSeq) return
      if (entry.type === 'init') {
        wsActionSeq = entry.seq
        applyServerState(entry.payload, entry.seed || gameSeed || null, true)
        return
      }
      if (!G) return
      if (entry.type === 'gameOver') {
        G.gameOver = true
        G.winner = entry.winner || G.winner
        wsActionSeq = entry.seq
        handleGameOver()
        return
      }
      if (entry.action && typeof GameEngine !== 'undefined' && GameEngine.applyBattleAction) {
        try {
          const oldG = G
          const nextG = runDeterministicAuthorityAction(G, entry.action).state
          wsActionSeq = entry.seq
          applyServerState(nextG, null, true)
          spawnStateFloaters(oldG, G)
        } catch (e) {
          const msg = e && e.message ? e.message : String(e)
          addLog('[WS] 动作日志回放失败：' + msg, 'err')
          setStatusMsg('WS 动作日志回放失败：' + msg)
        }
      }
    }

    function applyLegacyBattleSnapshot(msg) {
      const actions = msg && Array.isArray(msg.actions) ? msg.actions : []
      if (typeof msg.seed === 'number' && !gameSeed && typeof GameEngine !== 'undefined' && GameEngine.setRng) {
        gameSeed = msg.seed
        GameEngine.setRng(GameEngine.mulberry32(msg.seed))
      }
      actions.forEach(applyLegacyBattleEntry)
      if (!actions.length && msg && msg.state) applyServerState(msg.state, msg.seed || null)
    }

    // Connect WebSocket for the given mode ('lan' | 'relay')
    function connectBattleWs(mode) {
      if (typeof RvBWs === 'undefined') return
      wsMode = mode || 'lan'

      RvBWs.on('connect', function() {
        wsConnected = true
        var el = document.getElementById('wsStatus')
        if (el) { el.style.display = ''; el.textContent = 'WS' }
        addLog('WebSocket 已连接', 'info')
      })

      RvBWs.on('disconnect', function() {
        wsConnected = false
        var el = document.getElementById('wsStatus')
        if (el) el.style.display = 'none'
        addLog('WebSocket 断开，等待重连', 'info')
      })

      RvBWs.on('message', function(msg) {
        if (msg.to && String(msg.to).toLowerCase() !== myPlayerId) return
        if (msg.type === 'subscribed') {
          wsRole = msg.role || 'guest'
          addLog('[WS] 角色：' + wsRole, 'info')
          try { RvBWs.send({ type: 'requestBattleSnapshot' }) } catch {}
          if (wsMode === 'relay' && wsRole === 'host') initRelayHostBattle()
        } else if (msg.type === 'stateUpdate') {
          if (_use3d && battlePresentation && G && msg.state) {
            battlePresentation.animateAction(
              msg.lastAction || null,
              createBattlePresentationModel(G),
              createBattlePresentationModel(msg.state)
            )
          }
          applyServerState(msg.state, msg.seed || null)
        } else if (msg.type === 'battleSnapshot') {
          applyLegacyBattleSnapshot(msg)
        } else if (msg.type === 'roomUpdate') {
          if (msg.room) {
            isHost = msg.room.hostId && msg.room.hostId.toLowerCase() === myPlayerId
            ;(msg.room.players || []).forEach(function(p) {
              var pid = (p.id || '').toLowerCase()
              if (pid && p.name) playerNames[pid] = p.name
            })
          }
        } else if (msg.type === 'battleUnavailable') {
          var reason = msg.reason || 'unknown'
          if (!G) {
            if (reason === 'battle-not-started' && msg.room && msg.room.players) {
              var picked = msg.room.players.filter(function(p) { return p.hasSelectedPieces }).length
              showMsg('WebSocket 已连接，但战斗尚未开始：已选阵容 ' + picked + '/' + msg.room.players.length, 'err')
            } else {
              showMsg('WebSocket 已连接，但服务端暂时没有战斗状态：' + reason, 'err')
            }
          }
        } else if (msg.type === 'actionLog') {
          applyLegacyBattleEntry(msg.entry)
        } else if (msg.type === 'actionError') {
          addLog('[DEBUG actionError] action=' + JSON.stringify(msg.action || null) + ' error=' + (msg.error || 'unknown') + ' needsTarget=' + (!!msg.needsTargetSelection) + ' needsOption=' + (!!msg.needsOptionSelection), 'err')
          if (msg.needsTargetSelection && enterActionTargetMode(msg.action, msg.preparation)) return
          if (msg.needsOptionSelection && msg.action) {
            var optionAction = Object.assign({}, msg.action)
            if (msg.preparation && msg.preparation.kind === 'needOption') {
              optionAction.selectionId = msg.preparation.selectionId
              optionAction.stateRevision = msg.preparation.stateRevision
            }
            showOptionPicker(msg.title || '请选择', msg.options || [], optionAction)
            renderActionBar()
            return
          }
          addLog('服务端处理动作失败：' + (msg.error || 'unknown error'), 'err')
          setStatusMsg('服务端处理动作失败：' + (msg.error || 'unknown error'))
          renderActionBar()
        } else if (msg.type === 'pendingAction') {
          // Relay host: process guest action locally and push stateUpdate.
          if (wsMode === 'relay' && wsRole === 'host' && G &&
              typeof GameEngine !== 'undefined' && GameEngine.runBattleAction) {
            try {
              if (!msg.action || !msg.from || !msg.action.playerId ||
                  String(msg.from).toLowerCase() !== String(msg.action.playerId).toLowerCase()) {
                var playerMismatch = new Error('Relay sender does not match action player')
                playerMismatch.code = 'ACTION_PLAYER_MISMATCH'
                throw playerMismatch
              }
              var result = runDeterministicAuthorityAction(G, msg.action)
              var newG = result.state
              applyServerState(newG, gameSeed)
              relaySeq++
              RvBWs.send({ type: 'stateUpdate', seq: relaySeq, state: newG, seed: gameSeed, stateHash: result.stateHash })
            } catch (e) {
              addLog('处理来自 ' + msg.from + ' 的动作失败：' + e.message, 'err')
              RvBWs.send({
                type: 'actionError',
                to: msg.from,
                from: myPlayerId,
                action: msg.action,
                error: e.message || String(e),
                code: e.code,
                preparation: e.preparation,
                needsTargetSelection: e.needsTargetSelection,
                targetType: e.targetType,
                range: e.range,
                filter: e.filter,
                targetIndex: e.targetIndex,
                needsOptionSelection: e.needsOptionSelection,
                title: e.title,
                options: e.options,
              })
            }
          }
        } else if (msg.type === 'hostResume') {
          if (wsMode === 'relay' && wsRole === 'host' && msg.state) applyServerState(msg.state, null)
        } else if (msg.type === 'gameOver') {
          if (G && !G.gameOver) { G.gameOver = true; G.winner = msg.winner; handleGameOver() }
        }
      })
