<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>选择棋子 - RED vs BLUE</title>
  <script src="js/pack-fetch.js"></script>
  <script src="js/server-utils.js"></script>
  <script src="js/crypto-lib.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/ws-client.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(96,165,250,.16), transparent 28%),
        radial-gradient(circle at 80% 8%, rgba(248,113,113,.13), transparent 30%),
        #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 0 0 calc(92px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: rgba(15,23,42,.78); border-bottom: 1px solid rgba(148,163,184,.18);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      position: sticky; top: 0; z-index: 20;
    }
    .back-btn {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; padding: 6px 11px; font-size: 14px; cursor: pointer;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:active { opacity: .7; }
    .topbar-title { font-size: 16px; font-weight: 700; flex: 1; }

    .section { width: min(1120px, 100%); margin: 0 auto; padding: 16px 14px 8px; }
    .section-label {
      font-size: 11px; font-weight: 700; color: #475569;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
    }

    .piece-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 10px;
    }
    .piece-card {
      background: rgba(30,41,59,.82); border: 1px solid rgba(148,163,184,.2);
      border-radius: 12px; padding: 12px;
      cursor: pointer; transition: border-color .15s, background .15s;
      -webkit-user-select: none;
      min-height: 94px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .piece-card:active { background: #263348; }
    .piece-card.selected { border-color: #3b82f6; background: rgba(59,130,246,.1); }
    .piece-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .piece-avatar {
      width: 36px; height: 36px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0;
    }
    .piece-avatar-ph {
      width: 36px; height: 36px; border-radius: 8px;
      background: #0f172a; display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .piece-name { font-size: 14px; font-weight: 600; flex: 1; }
    .piece-stats { font-size: 11px; color: #64748b; line-height: 1.6; }
    .check-mark {
      font-size: 16px; color: #3b82f6; font-weight: 700;
      position: absolute; top: 8px; right: 10px;
    }
    .piece-card { position: relative; }

    .confirm-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15,23,42,.88); border-top: 1px solid rgba(148,163,184,.18);
      padding: 6px 14px calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    .confirm-row {
      width: min(1120px, 100%); margin: 0 auto 4px;
      display: flex; align-items: center; gap: 10px;
    }
    .selected-count { font-size: 13px; color: #64748b; flex: 1; }
    .btn-confirm {
      background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; padding: 12px 24px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-confirm:disabled { opacity: .4; cursor: default; }
    .btn-confirm:not(:disabled):active { opacity: .85; }
    .server-row {
      width: min(1120px, 100%); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .server-label { font-size: 11px; color: #475569; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-disconnect-sm {
      background: transparent; border: 1px solid #ef4444; color: #f87171;
      border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; flex-shrink: 0;
    }
    .btn-disconnect-sm:active { opacity: .7; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.8); z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .overlay.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #1e293b; border-top-color: #3b82f6;
      border-radius: 50%; margin-bottom: 20px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wait-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .wait-sub { font-size: 14px; color: #64748b; }

    .loading { text-align: center; padding: 60px 20px; color: #475569; font-size: 14px; }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 4px solid #1e293b; border-top-color: #3b82f6;
      border-radius: 50%; margin: 0 auto 16px;
      animation: spin .7s linear infinite;
    }

    @media (hover: hover) {
      .piece-card:hover { background: #263348; }
      .piece-card.selected:hover { background: rgba(59,130,246,.15); }
      .back-btn:hover { background: #263348; }
    }

    .detail-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7); z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    .detail-overlay.show { display: flex; }
    .detail-sheet {
      background: #1e293b; border-radius: 16px 16px 0 0;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      width: 100%; max-width: 480px;
      max-height: 80vh; overflow-y: auto;
    }
    .detail-head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .detail-avatar {
      width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    }
    .detail-avatar-ph {
      width: 56px; height: 56px; border-radius: 12px;
      background: #0f172a; display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .detail-name { font-size: 18px; font-weight: 700; }
    .detail-faction { font-size: 12px; color: #64748b; margin-top: 2px; }
    .detail-stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; margin-bottom: 14px;
    }
    .detail-stat {
      background: #0f172a; border-radius: 8px;
      padding: 8px 6px; text-align: center;
    }
    .detail-stat-val { font-size: 16px; font-weight: 700; }
    .detail-stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .detail-desc {
      font-size: 13px; color: #94a3b8; margin-bottom: 14px;
      line-height: 1.5;
    }
    .detail-skills-label {
      font-size: 11px; font-weight: 700; color: #475569;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;
    }
    .skill-entry {
      background: #0f172a; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .skill-entry-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .skill-icon { font-size: 18px; }
    .skill-name { font-size: 14px; font-weight: 600; flex: 1; }
    .skill-type-badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; background: #1e293b; color: #64748b;
    }
    .skill-type-super { background: rgba(168,85,247,.2); color: #a855f7; }
    .skill-type-buff  { background: rgba(34,197,94,.15); color: #22c55e; }
    .skill-meta { font-size: 11px; color: #475569; margin-bottom: 4px; }
    .skill-desc { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .btn-close-detail {
      width: 100%; margin-top: 12px;
      background: transparent; border: 1px solid #334155;
      border-radius: 10px; color: #94a3b8;
      padding: 11px; font-size: 15px; cursor: pointer;
    }
    .btn-close-detail:active { opacity: .7; }
    .detail-related-label {
      font-size: 11px; font-weight: 700; color: #a855f7;
      letter-spacing: 1.5px; text-transform: uppercase; margin: 12px 0 6px;
    }
    .detail-related-card {
      background: #0f172a; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    .detail-related-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .detail-related-type { font-size: 10px; color: #475569; }
    .detail-related-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
    .detail-keyword-label {
      font-size: 11px; font-weight: 700; color: #22c55e;
      letter-spacing: 1.5px; text-transform: uppercase; margin: 12px 0 6px;
    }
    .detail-keyword-row { display: flex; gap: 8px; padding: 4px 0; }
    .detail-keyword-name { font-size: 12px; font-weight: 600; color: #a855f7; }
    .detail-keyword-desc { font-size: 11px; color: #64748b; }
    .hint-bar {
      text-align: center; font-size: 11px; color: #334155;
      padding: 6px 0 0;
    }
    .alignment-panel {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      width: min(1120px, 100%); margin: 0 auto; padding: 12px 14px 2px;
    }
    .alignment-btn {
      border: 1px solid #334155; border-radius: 10px;
      background: #162033; color: #94a3b8;
      min-height: 46px; padding: 8px 10px;
      font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .alignment-btn.active.light {
      color: #dbeafe; border-color: #60a5fa; background: rgba(37,99,235,.22);
    }
    .alignment-btn.active.dark {
      color: #fecaca; border-color: #f87171; background: rgba(185,28,28,.22);
    }
    .alignment-btn:disabled { cursor: not-allowed; opacity: .58; }
    .alignment-lock-notice {
      width: min(1120px, 100%); margin: 0 auto; padding: 4px 14px 0;
      color: #94a3b8; font-size: 11px; text-align: center;
    }
    @media (max-width: 560px) {
      body { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
      .piece-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .piece-card { padding: 10px; min-height: 90px; }
      .piece-name { font-size: 13px; }
      .piece-stats { font-size: 10px; }
      .btn-confirm { padding: 11px 14px; white-space: nowrap; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <a class="back-btn" onclick="goBackToLobby()" style="cursor:pointer">返回</a>
    <div class="topbar-title">选择出战棋子</div>
    <div id="factionBadge" style="font-size:13px;padding:4px 10px;border-radius:6px;background:#1e293b;border:1px solid #334155;color:#64748b;flex-shrink:0">加载中...</div>
  </div>

  <div class="alignment-panel">
    <button class="alignment-btn light" id="alignmentLightBtn" disabled>光方</button>
    <button class="alignment-btn dark" id="alignmentDarkBtn" disabled>暗方</button>
  </div>
  <div id="alignmentLockNotice" class="alignment-lock-notice">阵营将在大厅准备后锁定</div>

  <!-- Piece list -->
  <div class="section">
    <div class="section-label" id="sectionLabel">可用棋子</div>
    <div class="hint-bar">右键或长按棋子可查看技能详情</div>
    <div id="pieceGrid" class="piece-grid" style="margin-top:8px">
      <div class="loading" style="grid-column:1/-1">
        <div class="loading-spinner"></div>
        <div>加载棋子数据...</div>
      </div>
    </div>
  </div>

  <!-- Confirm bar + server row -->
  <div class="confirm-bar">
    <div class="confirm-row">
      <div class="selected-count" id="selectedCount">已选 0 / 8 个棋子</div>
      <button class="btn-confirm" id="confirmBtn" disabled onclick="confirmSelection()">确认出战</button>
    </div>
    <div class="server-row">
      <span class="server-label" id="serverLabel">未连接</span>
      <button class="btn-disconnect-sm" id="disconnectBtn" onclick="doDisconnect()" style="display:none">断开服务器</button>
    </div>
  </div>

  <!-- Piece detail popup -->
  <div class="detail-overlay" id="detailOverlay" onclick="closePieceDetail()">
    <div class="detail-sheet" onclick="event.stopPropagation()">
      <div id="detailContent"></div>
      <button class="btn-close-detail" onclick="closePieceDetail()">关闭</button>
    </div>
  </div>

  <!-- Waiting overlay -->
  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <div class="wait-title">等待对方选择棋子...</div>
    <div class="wait-sub" id="waitSub">房间 ID: -</div>
  </div>

  <script>
    // Back navigation: return to the room while preserving server params.
    function goBackToLobby() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      const sp = new URLSearchParams(location.search)
      const rid = sp.get('roomId') || ''
      const pid = sp.get('playerId') || ''
      const pname = sp.get('playerName') || ''
      if (rid && pid) {
        window.location.href = 'room.html?roomId=' + encodeURIComponent(rid)
          + '&playerId=' + encodeURIComponent(pid)
          + '&playerName=' + encodeURIComponent(pname)
          + (shouldUseRelayMode() ? '&relay=1' : '')
        return
      }
      // Fallback: no room context, return to lobby while preserving server mode.
      const p = window.RvBUtils && RvBUtils.appendServerParams
        ? RvBUtils.appendServerParams(new URLSearchParams())
        : new URLSearchParams()
      p.set('v', Date.now().toString())
      window.location.href = 'lobby.html?' + p.toString()
    }

    // URL params
    const params = new URLSearchParams(location.search)
    const roomId = params.get('roomId') || ''
    const playerId = params.get('playerId') || ('anon-' + Date.now())
    const accountId = params.get('accountId') || params.get('account') || ''
    const playerName = params.get('playerName') || '玩家'
    function shouldUseRelayMode() {
      if (params.get('relay') === '1' || params.get('server') === 'remote') return true
      return !!(window.RvBUtils && RvBUtils.getActiveServerMode && RvBUtils.getActiveServerMode() === 'remote')
    }

    // RvBUtils loaded from js/server-utils.js
    const getServerUrl = () => RvBUtils.getServerUrl()

    // Piece data
    let PIECE_TEMPLATES = []
    let selectedIds = new Set()
    let pollTimer = null
    let playerFaction = null    // 'red' | 'blue' turn order seat
    let playerAlignment = null  // 'light' | 'dark' content alignment
    playerAlignment = params.get('alignment') || playerAlignment
    let wsReady = false
    let latestRoom = null
    let pieceLoadError = ''

    const LOCAL_PIECE_LOAD_TIMEOUT_MS = 2000
    const SERVER_PIECE_LOAD_TIMEOUT_MS = 2500


    // Skill cache
    const SKILL_CACHE = {}

    function connectSelectionWs() {
      if (typeof RvBWs === 'undefined' || !roomId || !playerId) return
      RvBWs.on('connect', function() {
        wsReady = true
        RvBWs.send({ type: 'roomState' })
      })
      RvBWs.on('disconnect', function() { wsReady = false })
      RvBWs.on('message', function(msg) {
        if (msg.type === 'roomUpdate' && msg.room) {
          latestRoom = msg.room
          const me = (msg.room.players || []).find(p => p.id && p.id.toLowerCase() === playerId.toLowerCase())
          if (me) {
            let changed = false
            if (me.faction && me.faction !== playerFaction) { playerFaction = me.faction; changed = true }
            if (me.alignment && me.alignment !== playerAlignment) { playerAlignment = me.alignment; changed = true }
            if (changed) { updateFactionBadge(); loadPieces() }
          }
          if (roomLooksBattleReady(msg.room)) {
            navigateBattle()
          }
        } else if (msg.type === 'roomActionResult') {
          if (!msg.success) {
            alert('Submit failed: ' + (msg.error || 'unknown error'))
            const btn = document.getElementById('confirmBtn')
            if (btn) { btn.disabled = false; btn.textContent = 'Confirm lineup ->' }
            return
          }
          {
            let changed = false
            if (msg.faction && msg.faction !== playerFaction) { playerFaction = msg.faction; changed = true }
            if (msg.alignment && msg.alignment !== playerAlignment) { playerAlignment = msg.alignment; changed = true }
            if (changed) { updateFactionBadge(); loadPieces() }
          }
          if (msg.room) {
            latestRoom = msg.room
            if (roomLooksBattleReady(msg.room)) navigateBattle()
          }
        } else if (msg.type === 'stateUpdate' || msg.type === 'battleSnapshot') {
          navigateBattle()
        }
      })
      RvBWs.connect(roomId, playerId, shouldUseRelayMode() ? 'relay' : 'lan')
    }

    function waitForSelectionWs(timeoutMs) {
      timeoutMs = timeoutMs || 5000
      return new Promise((resolve, reject) => {
        if (typeof RvBWs === 'undefined') {
          reject(new Error('WebSocket client not loaded'))
          return
        }
        if (RvBWs.isConnected && RvBWs.isConnected()) {
          wsReady = true
          resolve()
          return
        }
        const started = Date.now()
        const timer = setInterval(() => {
          if (RvBWs.isConnected && RvBWs.isConnected()) {
            clearInterval(timer)
            wsReady = true
            resolve()
            return
          }
          if (Date.now() - started >= timeoutMs) {
            clearInterval(timer)
            reject(new Error('WebSocket connect timeout'))
          }
        }, 100)
      })
    }

    async function claimFactionViaWs() {
      const result = await sendRoomAction({
        action: 'claim-faction',
        playerId,
        accountId,
        playerName,
        alignment: playerAlignment
      })
      if (result && result.faction) playerFaction = result.faction
      if (result && result.alignment) playerAlignment = result.alignment
      if (result && result.room) latestRoom = result.room
      return result
    }

    function navigateBattle() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      const p = new URLSearchParams({ roomId, playerId, playerName })
      if (playerAlignment) p.set('alignment', playerAlignment)
      if (accountId) p.set('accountId', accountId)
      if (params.get('debug')) p.set('debug', params.get('debug'))
      if (window.RvBUtils && RvBUtils.appendServerParams) RvBUtils.appendServerParams(p)
      if (shouldUseRelayMode()) p.set('relay', '1')
      window.location.href = 'battle.html?' + p.toString()
    }

    function roomLooksBattleReady(room) {
      if (!room) return false
      if (room.battleState && (room.battleState.state || room.battleState.type)) return true
      return room.status === 'in-progress' || room.status === 'playing' || room.status === 'battle'
    }

    async function fetchJson(path) {
      if (window.fetchPackJson && /^\.?\/?data\//.test(path)) {
        return window.fetchPackJson(path)
      }
      const res = await fetch(path)
      if (!res.ok) throw new Error(res.status)
      return res.json()
    }

    function errorReason(error) {
      return error && error.message ? error.message : String(error)
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char])
    }

    function withTimeout(promise, timeoutMs, source) {
      let timer = null
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(source + ' timeout after ' + timeoutMs + 'ms')), timeoutMs)
      })
      return Promise.race([promise, timeout]).finally(() => {
        if (timer) clearTimeout(timer)
      })
    }

    async function loadLocalPieceTemplates() {
      const manifestPath = './data/pieces/manifest.json'
      let ids
      try {
        ids = await fetchJson(manifestPath)
      } catch (error) {
        throw new Error(manifestPath + ': ' + errorReason(error))
      }
      if (!Array.isArray(ids) || ids.length === 0 || ids.some(id => typeof id !== 'string' || !id)) {
        throw new Error(manifestPath + ': expected a non-empty string array')
      }
      return Promise.all(ids.map(async id => {
        const resourcePath = './data/pieces/' + id + '.json'
        try {
          const piece = await fetchJson(resourcePath)
          if (!piece || typeof piece !== 'object' || piece.id !== id) {
            throw new Error('expected a piece object whose id matches the manifest')
          }
          return piece
        } catch (error) {
          throw new Error(resourcePath + ': ' + errorReason(error))
        }
      })).then(pieces => validatePieceTemplates(pieces))
    }

    async function loadServerPieceTemplates() {
      if (!window.RvBWs || !RvBWs.request) {
        throw new Error('当前页面没有可用的服务器连接')
      }
      await waitForSelectionWs(SERVER_PIECE_LOAD_TIMEOUT_MS)
      const data = await RvBWs.request('catalog.pieces', {}, SERVER_PIECE_LOAD_TIMEOUT_MS)
      if (!data || !Array.isArray(data.pieces) || data.pieces.length === 0) {
        throw new Error('响应缺少非空 pieces 数组')
      }
      return validatePieceTemplates(data.pieces)
    }

    function validatePieceTemplates(pieces) {
      const seen = new Set()
      for (const piece of pieces) {
        if (!piece || typeof piece !== 'object' || typeof piece.id !== 'string' || !piece.id) {
          throw new Error('棋子数据缺少有效 id')
        }
        if (piece.faction !== 'good' && piece.faction !== 'evil') {
          throw new Error('棋子 ' + piece.id + ' 的 faction 必须是 good 或 evil')
        }
        if (seen.has(piece.id)) throw new Error('棋子数据包含重复 id：' + piece.id)
        seen.add(piece.id)
      }
      const expectedFaction = (playerAlignment === 'light' || playerAlignment === 'good')
        ? 'good'
        : (playerAlignment === 'dark' || playerAlignment === 'evil') ? 'evil' : null
      if (expectedFaction) {
        const available = pieces.filter(piece => piece.faction === expectedFaction).length
        if (available < 8) {
          const label = expectedFaction === 'good' ? '光方' : '暗方'
          throw new Error(label + '可用棋子不足 8 个（实际 ' + available + ' 个）')
        }
      }
      return pieces
    }

    function filterPiecesForAlignment(pieces) {
      if (playerAlignment === 'dark' || playerAlignment === 'evil') {
        return pieces.filter(piece => piece.faction === 'evil')
      }
      if (playerAlignment === 'light' || playerAlignment === 'good') {
        return pieces.filter(piece => piece.faction === 'good')
      }
      return pieces
    }

    async function sendRoomAction(payload) {
      const body = Object.assign({ roomId }, payload)
      await waitForSelectionWs(5000)
      return RvBWs.request('rooms.action', body, 7000)
    }

    // Fetch player's faction from room data, then load matching pieces
    async function init() {
      if (window.RvBUtils && RvBUtils.restoreServerFromParams) {
        await RvBUtils.restoreServerFromParams(params)
      }
      updateServerRow()
      connectSelectionWs()

      if (roomId) {
        try {
          const result = await claimFactionViaWs()
          if (result && result.room && roomLooksBattleReady(result.room)) {
            navigateBattle()
            return
          }
        } catch (e) {
          alert('无法认领阵营：' + (e && e.message ? e.message : e))
        }
      }

      updateFactionBadge()
      await loadPieces()
    }

    function updateFactionBadge() {
      const badge = document.getElementById('factionBadge')
      const label = document.getElementById('sectionLabel')
      const lightBtn = document.getElementById('alignmentLightBtn')
      const darkBtn = document.getElementById('alignmentDarkBtn')
      const lockNotice = document.getElementById('alignmentLockNotice')
      const alignmentLocked = playerAlignment === 'light' || playerAlignment === 'dark' || playerAlignment === 'good' || playerAlignment === 'evil'
      if (lightBtn) lightBtn.classList.toggle('active', playerAlignment === 'light' || playerAlignment === 'good')
      if (darkBtn) darkBtn.classList.toggle('active', playerAlignment === 'dark' || playerAlignment === 'evil')
      if (lightBtn) lightBtn.disabled = alignmentLocked
      if (darkBtn) darkBtn.disabled = alignmentLocked
      if (lockNotice) lockNotice.textContent = alignmentLocked
        ? '阵营已在大厅锁定，只能选择本阵营棋子'
        : '正在读取大厅分配的阵营'
      if (!badge) return
      const orderLabel = playerFaction === 'red' ? '座位 red' : playerFaction === 'blue' ? '座位 blue' : null
      if (playerAlignment === 'dark' || playerAlignment === 'evil') {
        badge.textContent = '暗方' + (orderLabel ? ' (' + orderLabel + ')' : '')
        badge.style.color = '#f87171'
        badge.style.borderColor = '#ef4444'
        if (label) label.textContent = '选择暗方棋子'
      } else if (playerAlignment === 'light' || playerAlignment === 'good') {
        badge.textContent = '光方' + (orderLabel ? ' (' + orderLabel + ')' : '')
        badge.style.color = '#60a5fa'
        badge.style.borderColor = '#3b82f6'
        if (label) label.textContent = '选择光方棋子'
      } else {
        badge.textContent = orderLabel || '加载中...'
        badge.style.color = '#64748b'
        if (label) label.textContent = '可用棋子'
      }
    }

    async function loadPieces() {
      pieceLoadError = ''
      try {
        let loaded
        try {
          loaded = await withTimeout(
            loadLocalPieceTemplates(),
            LOCAL_PIECE_LOAD_TIMEOUT_MS,
            '本地资源'
          )
        } catch (localError) {
          console.warn('[piece-selection] local piece resources failed; falling back to current server:', localError)
          try {
            loaded = await withTimeout(
              loadServerPieceTemplates(),
              SERVER_PIECE_LOAD_TIMEOUT_MS,
              '服务器 WS catalog.pieces'
            )
          } catch (serverError) {
            pieceLoadError = '棋子资源加载失败。本地资源：' + errorReason(localError)
              + '；服务器 WS catalog.pieces：' + errorReason(serverError)
            console.error('[piece-selection] piece resources unavailable:', {
              local: errorReason(localError),
              server: errorReason(serverError)
            })
            throw new Error(pieceLoadError)
          }
        }
        // Client filtering is only immediate feedback. The server re-reads the
        // versioned Demo manifest and enforces alignment, count and uniqueness.
        PIECE_TEMPLATES = filterPiecesForAlignment(loaded)
      } catch (error) {
        PIECE_TEMPLATES = []
        if (!pieceLoadError) pieceLoadError = '棋子资源加载失败：' + errorReason(error)
      }
      renderPieces()
    }

    function factionIcon(f) {
      return f === 'evil' ? '暗' : f === 'good' ? '光' : '中'
    }
    function factionLabel(f) {
      return f === 'evil' ? '暗方' : f === 'good' ? '光方' : '中立'
    }

    function renderPieces() {
      const grid = document.getElementById('pieceGrid')
      if (!PIECE_TEMPLATES.length) {
        const message = pieceLoadError || '暂无可用棋子'
        const color = pieceLoadError ? '#f87171' : '#475569'
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:' + color + '">'
          + escapeHtml(message) + '</div>'
        return
      }
      grid.innerHTML = PIECE_TEMPLATES.map(p => {
        const s = p.stats || {}
        const sel = selectedIds.has(p.id)
        const imgHtml = (p.image && p.image.includes('.'))
          ? `<img class="piece-avatar" src="images/${p.image}" onerror="this.outerHTML='<div class=\\'piece-avatar-ph\\'>${factionIcon(p.faction)}</div>'">`
          : `<div class="piece-avatar-ph">${factionIcon(p.faction)}</div>`
        return `<div class="piece-card${sel ? ' selected' : ''}"
            data-pid="${p.id}"
            onclick="togglePiece('${p.id}')"
            oncontextmenu="showPieceDetail('${p.id}');return false;">
          ${sel ? '<span class="check-mark">✓</span>' : ''}
          <div class="piece-card-header">
            ${imgHtml}
            <div class="piece-name">${p.name || p.id}</div>
          </div>
          <div class="piece-stats">
            HP: ${s.maxHp || '?'} · ATK: ${s.attack || '?'}<br>
            DEF: ${s.defense || 0} · MOV: ${s.moveRange || 3}
          </div>
        </div>`
      }).join('')

      // Long-press for touch devices
      setupLongPress()
    }

    // Long-press
    let lpTimer = null
    let lpMoved = false

    function setupLongPress() {
      document.getElementById('pieceGrid').addEventListener('touchstart', function(e) {
        const card = e.target.closest('[data-pid]')
        if (!card) return
        lpMoved = false
        lpTimer = setTimeout(() => {
          if (!lpMoved) showPieceDetail(card.dataset.pid)
        }, 600)
      }, { passive: true })

      document.getElementById('pieceGrid').addEventListener('touchmove', function() {
        lpMoved = true
        if (lpTimer) { clearTimeout(lpTimer); lpTimer = null }
      }, { passive: true })

      document.getElementById('pieceGrid').addEventListener('touchend', function() {
        if (lpTimer) { clearTimeout(lpTimer); lpTimer = null }
      }, { passive: true })
    }

    // Piece detail popup
    async function getSkill(skillId) {
      if (SKILL_CACHE[skillId]) return SKILL_CACHE[skillId]
      try {
        const d = await fetchJson('./data/skills/' + skillId + '.json')
        SKILL_CACHE[skillId] = d
        return d
      } catch {
        return { id: skillId, name: skillId, description: '', icon: '*', type: 'normal', actionPointCost: 0, cooldownTurns: 0 }
      }
    }

    const CARD_CACHE = {}
    async function getCard(cardId) {
      if (CARD_CACHE[cardId]) return CARD_CACHE[cardId]
      try {
        const d = await fetchJson('./data/cards/' + cardId + '.json')
        CARD_CACHE[cardId] = d
        return d
      } catch {
        return null
      }
    }

    let keywordsCache = null
    async function getKeywords() {
      if (keywordsCache) return keywordsCache
      try {
        keywordsCache = await fetchJson('./data/skill-keywords.json')
        return keywordsCache
      } catch {
        return []
      }
    }

    async function showPieceDetail(pieceId) {
      const p = PIECE_TEMPLATES.find(t => t.id === pieceId)
      if (!p) return
      const overlay = document.getElementById('detailOverlay')
      const content = document.getElementById('detailContent')
      const s = p.stats || {}
      const imgHtml = (p.image && p.image.includes('.'))
        ? `<img class="detail-avatar" src="images/${p.image}" onerror="this.outerHTML='<div class=\\'detail-avatar-ph\\'>${factionIcon(p.faction)}</div>'">`
        : `<div class="detail-avatar-ph">${factionIcon(p.faction)}</div>`

      content.innerHTML = `
        <div class="detail-head">
          ${imgHtml}
          <div>
            <div class="detail-name">${p.name || p.id}</div>
            <div class="detail-faction">${factionLabel(p.faction)}</div>
          </div>
        </div>
        <div class="detail-stats-row">
          <div class="detail-stat"><div class="detail-stat-val" style="color:#f87171">${s.maxHp || '?'}</div><div class="detail-stat-label">生命</div></div>
          <div class="detail-stat"><div class="detail-stat-val" style="color:#fb923c">${s.attack || '?'}</div><div class="detail-stat-label">攻击</div></div>
          <div class="detail-stat"><div class="detail-stat-val" style="color:#60a5fa">${s.defense || 0}</div><div class="detail-stat-label">防御</div></div>
          <div class="detail-stat"><div class="detail-stat-val" style="color:#4ade80">${s.moveRange || 3}</div><div class="detail-stat-label">移动</div></div>
        </div>
        ${p.description ? `<div class="detail-desc">${p.description}</div>` : ''}
        <div class="detail-skills-label">技能</div>
        <div id="detailSkillList"><div style="color:#475569;font-size:13px">加载中...</div></div>
        <div id="detailRelatedCards"></div>
        <div id="detailKeywords"></div>
      `
      overlay.classList.add('show')

      // Load skills async, including transformed/derived skills that can be gained in battle.
      const baseSkillEntries = (p.skills || [])
        .map(sk => ({ id: typeof sk === 'string' ? sk : (sk.skillId || sk.id), derived: false, trigger: '' }))
        .filter(sk => sk.id)
      const derivedSkillEntries = (p.transformedSkills || [])
        .map(sk => ({
          id: typeof sk === 'string' ? sk : (sk.skillId || sk.id),
          derived: true,
          trigger: typeof sk === 'string' ? '' : (sk.triggeredBy || sk.trigger || '')
        }))
        .filter(sk => sk.id)
      const skillEntries = baseSkillEntries.concat(derivedSkillEntries)
      const skills = await Promise.all(skillEntries.map(async entry => {
        const def = await getSkill(entry.id)
        return Object.assign({}, def, { _derived: entry.derived, _trigger: entry.trigger })
      }))
      const typeLabel = { normal: '普通', super: '充能', buff: '增益' }
      const typeCls = { super: 'skill-type-super', buff: 'skill-type-buff' }
      document.getElementById('detailSkillList').innerHTML = skills.length
        ? skills.map(sk => `
          <div class="skill-entry">
            <div class="skill-entry-head">
              <span class="skill-icon">${sk.icon || '*'}</span>
              <span class="skill-name">${sk.name || sk.id}${sk._derived ? ' <span style="color:#a855f7;font-size:11px">衍生</span>' : ''}</span>
              <span class="skill-type-badge ${typeCls[sk.type] || ''}">${typeLabel[sk.type] || sk.type || '主动'}</span>
            </div>
            <div class="skill-meta">行动点：${sk.actionPointCost || 0} | 冷却：${sk.cooldownTurns || 0} 回合${sk.range ? ' | 范围：' + sk.range : ''}${sk._derived && sk._trigger ? ' | 由 ' + sk._trigger + ' 获得' : ''}</div>
            <div class="skill-desc">${sk.description || '暂无描述'}</div>
          </div>`)
          .join('')
        : '<div style="color:#475569;font-size:13px">暂无技能</div>'

      // Load related cards
      const relatedContainer = document.getElementById('detailRelatedCards')
      if (p.relatedCards && p.relatedCards.length > 0) {
        let relatedHtml = '<div class="detail-related-label">相关手牌</div>'
        for (const cardId of p.relatedCards) {
          const card = await getCard(cardId)
          if (card) {
            relatedHtml += `<div class="detail-related-card">
              <div class="detail-related-name">${card.icon || '*'} ${card.name || cardId} <span style="color:#a855f7;font-size:11px">AP:${card.actionPointCost ?? 0}</span></div>
              <div class="detail-related-type">${card.type === 'active' ? '主动' : '反应'}</div>
              <div class="detail-related-desc">${card.description || ''}</div>
            </div>`
          }
        }
        relatedContainer.innerHTML = relatedHtml
      } else {
        relatedContainer.innerHTML = ''
      }

      // Load keywords
      const keywordsContainer = document.getElementById('detailKeywords')
      const allKeywords = []
      for (const sk of skills) {
        if (sk && sk.keywords && sk.keywords.length > 0) {
          allKeywords.push(...sk.keywords)
        }
      }
      if (allKeywords.length > 0) {
        const keywordsData = await getKeywords()
        const keywordMap = {}
        if (Array.isArray(keywordsData)) {
          keywordsData.forEach(kw => { keywordMap[kw.name] = kw })
        }
        let keywordsHtml = '<div class="detail-keyword-label">关键词</div>'
        const seen = new Set()
        for (const kwName of allKeywords) {
          if (seen.has(kwName)) continue
          seen.add(kwName)
          const kw = keywordMap[kwName]
          keywordsHtml += `<div class="detail-keyword-row">
            <div class="detail-keyword-name">${kwName}</div>
            <div class="detail-keyword-desc">${kw ? (kw.shortDescription || kw.longDescription || '') : ''}</div>
          </div>`
        }
        keywordsContainer.innerHTML = keywordsHtml
      } else {
        keywordsContainer.innerHTML = ''
      }
    }

    function closePieceDetail() {
      document.getElementById('detailOverlay').classList.remove('show')
    }

    function togglePiece(id) {
      if (selectedIds.has(id)) selectedIds.delete(id)
      else selectedIds.add(id)
      updateConfirmBar()
      renderPieces()
    }

    function updateConfirmBar() {
      const n = selectedIds.size
      document.getElementById('selectedCount').textContent = '已选 ' + n + ' / 8 个棋子'
      document.getElementById('confirmBtn').disabled = !playerAlignment || n !== 8
    }

    async function confirmSelection() {
      const url = getServerUrl()
      if (!url) { alert('服务器未连接'); return }
      if (!playerAlignment) { alert('请先选择光方或暗方'); return }
      const selected = PIECE_TEMPLATES.filter(p => selectedIds.has(p.id))
      if (selected.length !== 8) { alert('请选择正好 8 个棋子'); return }
      const btn = document.getElementById('confirmBtn')
      btn.disabled = true
      btn.textContent = '提交中...'
      try {
        const result = await sendRoomAction({
          action: 'select-pieces',
          playerId,
          accountId,
          playerName,
          alignment: playerAlignment,
          pieces: selected.map(p => ({ templateId: p.id, faction: p.faction || 'neutral' }))
        })
        if (result && result.room) {
          latestRoom = result.room
          if (roomLooksBattleReady(result.room)) {
            navigateBattle()
            return
          }
        }
        startWaitForBattle()
      } catch (e) {
        alert('提交失败：' + e.message)
        btn.disabled = false
        btn.textContent = '确认出战'
      }
    }

    function startWaitForBattle() {
      try { if (window.RvBWs && RvBWs.send) RvBWs.send({ type: 'requestBattleSnapshot' }) } catch {}
      document.getElementById('waitSub').textContent = '房间 ID: ' + roomId
      document.getElementById('waitOverlay').classList.add('show')
      if (pollTimer) clearInterval(pollTimer)
      pollTimer = setInterval(pollRoomStatus, 1500)
      pollRoomStatus()
    }

    async function pollRoomStatus() {
      if (!roomId) return
      try {
        await waitForSelectionWs(2500)
        const room = await RvBWs.request('rooms.get', { roomId }, 5000)
        latestRoom = room
        if (roomLooksBattleReady(room)) navigateBattle()
      } catch {}
    }

    // Disconnect
    function doDisconnect() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
      RvBUtils.clearServerUrl()
      window.location.href = 'index.html'
    }

    function updateServerRow() {
      const url = RvBUtils.getServerUrl()
      const label = document.getElementById('serverLabel')
      const btn = document.getElementById('disconnectBtn')
      if (!label) return
      if (url) {
        label.textContent = '已连接 ' + url.replace(/^https?:\/\//, '').slice(0, 30)
        label.style.color = '#22c55e'
        if (btn) btn.style.display = 'block'
      } else {
        label.textContent = '未连接服务器'
        label.style.color = '#475569'
        if (btn) btn.style.display = 'none'
      }
    }

    // Init
    window.addEventListener('load', () => { init() })
    window.addEventListener('unload', () => { if (pollTimer) clearInterval(pollTimer) })
  </script>
</body>
</html>
