<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能横幅 · 效果预览</title>
<link rel="stylesheet" href="css/battle-context-ui.css"><link rel="stylesheet" href="tabletop-battle/skin.css"><link rel="stylesheet" href="tabletop-battle/comic.css"><link rel="stylesheet" href="tabletop-battle/dusk.css"><link rel="stylesheet" href="tabletop-battle/refinements.css">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#2b2520 url('tabletop-battle/assets/table.png') center/cover!important}body::before{opacity:.15}#stage{position:absolute;inset:0}header{position:absolute;left:7%;top:40px;color:#e7cfa4;font-family:var(--comic-font)}header h1{font-weight:400;font-size:28px;margin:0 0 8px}header p{font-size:14px;opacity:.7;margin:0}.controls{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:900;white-space:nowrap}.controls button{cursor:pointer;padding:12px 22px;background:#c1a77e;color:#30241c;border:3px solid #251d18;border-radius:12px 6px 15px 8px;box-shadow:3px 4px #17120e;font:18px var(--comic-font)}.controls button:last-child{background:#456063;color:#f4d8a8}#stage.still .battle-vignette-status{animation-play-state:paused!important;animation-delay:-420ms!important}#stage .battle-vignette-speed-control{display:none}.caption{position:absolute;left:0;right:0;text-align:center;bottom:5%;color:#ddc49a;font:14px var(--comic-font);opacity:.7}
</style></head><body><header><h1>技能横幅 · 效果预览</h1><p>当前游戏的实际组件 · 点击下方按钮切换或播放</p></header><div id="stage" class="still"></div><div class="controls"><button id="active">主动技能</button><button id="response">连锁响应</button><button id="play">播放连锁演出 ▶</button></div><div class="caption">演示顺序：死神施法 → 水门响应（示例事件，用于查看横幅表现）</div>
<script src="js/battle-ui/battle-action-identity.js"></script><script src="js/battle-ui/battle-action-vignette.js"></script><script>
const stage=document.getElementById('stage');let vignette;let serial=0;
function preview(mode){if(vignette)vignette.dispose();const still=mode!=='play';stage.className=still?'still':'';vignette=BattleActionVignette.create(still?{setTimeout:()=>1,clearTimeout:()=>{}}:{});vignette.mount({boardContainer:stage,floatLayer:stage});const model={turn:{isViewerTurn:false},pieces:[{id:'caster',name:'死神',portraitId:'reaper',faction:'red'},{id:'minato',name:'波风水门',portraitId:'minato',faction:'blue'}],skillSummariesById:{shotgun:{name:'地狱火霰弹枪'}},presentationEvents:[]};vignette.update(model);const rootId='demo-'+(++serial);const active={eventId:rootId,rootEventId:rootId,sequence:0,kind:'skill',sourcePieceId:'caster',skillId:'shotgun'};const response={eventId:rootId+':1',rootEventId:rootId,parentEventId:rootId,sequence:1,kind:'passive',sourcePieceId:'minato',ruleId:'raijin',label:'飞雷神触发',result:{pending:true}};model.presentationEvents=mode==='play'?[active,response]:mode==='response'?[{...response,eventId:rootId,parentEventId:undefined}]:[active];vignette.update(model)}
document.getElementById('active').onclick=()=>preview('active');document.getElementById('response').onclick=()=>preview('response');document.getElementById('play').onclick=()=>preview('play');preview('active');
</script></body></html>
