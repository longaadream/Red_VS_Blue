      const hand = (myMeta && myMeta.hand) || []
      const isMyTurn = G.turn && G.turn.currentPlayerId === localPlayerId
      const phase = G.turn ? G.turn.phase : ''
      const ap = myMeta ? myMeta.actionPoints : 0

      document.getElementById('handCount').textContent = hand.length
      document.getElementById('handTargetHint').style.display = pendingCardAction ? 'inline' : 'none'

      const container = document.getElementById('handCards')
      if (!hand.length) {
        renderArcHand()
        container.innerHTML = '<div class="hand-empty">鏆傛棤鎵嬬墝</div>'
        return
      }

      container.innerHTML = hand.map(card => {
        const def = cardsById[card.cardId] || {}
        const cost = def.actionPointCost || 0
        const canPlay = isMyTurn && phase === 'action' && ap >= cost && (def.type === 'active' || def.type === 'reactive' || !def.type)
        const isPending = pendingCardAction && pendingCardAction.cardInstanceId === card.instanceId
        let cls = 'card-item'
        if (isPending) cls += ' card-pending'
        else if (!canPlay) cls += ' card-disabled'
        if (def.type === 'reactive') cls += ' card-reactive'

        const gemCls = cost === 0 ? 'free' : ''
        const icon = def.icon || '🃏'
        const typeLabel = def.type === 'reactive' ? '触发' : def.type === 'passive' ? '持续' : '主动'
        const artSrc = def.image ? `images/card-art/${def.image}` : null
        const artContent = artSrc
          ? `<img src="${artSrc}" style="width:100%;height:100%;object-fit:cover;border-radius:8px 8px 0 0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none;font-size:28px;width:100%;height:100%;align-items:center;justify-content:center">${def.icon || '🃏'}</span>`
          : `<span style="font-size:28px">${def.icon || '🃏'}</span>`
        const cid = card.instanceId.replace(/'/g, "\\'")
        const cdid = (card.cardId || '').replace(/'/g, "\\'")
        return `<div class="${cls}" onclick="onCardClick('${cid}','${cdid}')" oncontextmenu="event.preventDefault();showCardDetail('${cid}','${cdid}')">
          <div class="card-mana-gem ${gemCls}">${cost}</div>
          <div class="card-art">${artContent}</div>
          <div class="card-name-banner">${escHtml(def.name || card.cardId)}</div>
          <div class="card-body">
            <div class="card-desc">${escHtml(def.description || '')}</div>
            <div class="card-type-badge">${typeLabel}</div>
          </div>
        </div>`
      }).join('')
      renderArcHand()
    }

    function onCardClick(cardInstanceId, cardId) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId === localPlayerId
      const phase = G.turn ? G.turn.phase : ''
      if (!isMyTurn || phase !== 'action') return

      const myMeta = G.players && G.players.find(p => p.playerId === localPlayerId)
      const def = cardsById[cardId] || {}
      const cost = def.actionPointCost || 0
      const ap = myMeta ? myMeta.actionPoints : 0
      if (ap < cost) { addLog('行动点不足，需要 ' + cost + '，剩余 ' + ap, 'err'); return }

      if (pendingCardAction && pendingCardAction.cardInstanceId === cardInstanceId) {
        pendingCardAction = null
        renderHand()
        return
      }

      pendingMove = false
      pendingSkill = null
      pendingCardAction = { type: 'playCard', playerId: localPlayerId, cardInstanceId }
      addLog('选择目标施放: ' + (def.name || cardId), 'info')
      renderHand()
      renderBoard()
      renderActionPanel()
    }

    // 鈹€鈹€ Game over 鈹€鈹€
    function checkGameOver() {
      if (!G) return
      const ra = G.pieces.filter(p => p.faction === 'red' && p.currentHp > 0).length
      const ba = G.pieces.filter(p => p.faction === 'blue' && p.currentHp > 0).length
      if (ra === 0 || ba === 0) {
        const winner = ra > 0 ? 'red' : 'blue'
        document.getElementById('resultIcon').textContent = winner === 'red' ? '🌑' : '☀️'
        document.getElementById('resultTitle').textContent = (winner === 'red' ? '暗' : '光') + ' 胜利'
        document.getElementById('resultSub').textContent = '第 ' + G.turn.turnNumber + ' 回合结束'
        showScreen('result')
      }
    }

    // 鈹€鈹€ Resource dialog 鈹€鈹€
    function showResDialog() {
      if (!G) return
      const p = G.players.find(p => p.playerId === localPlayerId)
      document.getElementById('resPlayer').value = localPlayerId
      document.getElementById('resAP').value = p ? p.actionPoints : 10
      document.getElementById('resCP').value = p ? p.chargePoints : 0
      document.getElementById('resDlg').classList.add('show')
    }
    function closeResDlg() { document.getElementById('resDlg').classList.remove('show') }
    async function applyRes() {
      const playerId = document.getElementById('resPlayer').value
      const ap = +document.getElementById('resAP').value || 0
      const cp = +document.getElementById('resCP').value || 0
      closeResDlg()
      if (await sendPatch({ type: 'updateResources', playerId, actionPoints: ap, chargePoints: cp }))
        addLog('鈿?璧勬簮宸叉洿鏂?AP=' + ap + ' CP=' + cp, 'info')
    }

    // 鈹€鈹€ Map dialog 鈹€鈹€
      <button class="btn-top" onclick="showMapDialog()">??</button>
      document.getElementById('mapDlgSelect').value = currentMapId
      document.getElementById('mapDlg').classList.add('show')
    }
    function closeMapDlg() { document.getElementById('mapDlg').classList.remove('show') }
    function applyMapChange() {
      const mapId = document.getElementById('mapDlgSelect').value
      closeMapDlg()
      initTraining(mapId || undefined, getInitialPieceConfig())
    }

    // 鈹€鈹€ Screen 鈹€鈹€
    function showScreen(name) {
      document.getElementById('setupScreen').style.display = name === 'setup' ? 'block' : 'none'
      document.getElementById('battleScreen').style.display = name === 'battle' ? 'block' : 'none'
      document.getElementById('resultScreen').style.display = name === 'result' ? 'flex' : 'none'
      document.body.classList.toggle('training-battle', name === 'battle')
      document.getElementById('battleTopBtns').style.display = name === 'battle' ? 'flex' : 'none'
    }
    function goSetup() { G = null; showScreen('setup') }
    function showLoading(on) { document.getElementById('loadingOverlay').className = on ? 'show' : '' }
    function showSetupErr(msg) { const e = document.getElementById('setupErr'); e.textContent = msg; e.style.display = 'block' }
    function hideSetupErr() { document.getElementById('setupErr').style.display = 'none' }

    // 鈹€鈹€ Helpers 鈹€鈹€
    function playerLabel(id) { return id === 'training-red' ? '🔴 绾㈡柟' : '🔵 蓝方' }
    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    // 鈹€鈹€ Piece detail modal 鈹€鈹€
    let pressTimer = null

    function startPiecePress(e, instanceId) {
      pressTimer = setTimeout(() => { pressTimer = null; showPieceDetail(instanceId) }, 600)
    }
    function clearPiecePress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null }
    }

    function showPieceDetail(instanceId) {
      if (!G) return
      const p = G.pieces.find(p => p.instanceId === instanceId)
      if (!p) return
      const tmpl = PIECES_BY_ID[p.templateId] || {}
      const maxHp = p.stats?.maxHp || p.maxHp || 0
      const atk   = p.stats?.attack   ?? p.attack   ?? '?'
      const def   = p.stats?.defense  ?? p.defense  ?? '?'
      const spd   = p.stats?.moveRange ?? p.moveRange ?? '?'

      const avatarHtml = tmpl.image
        ? `<img class="pd-avatar" src="images/${escHtml(tmpl.image)}" onerror="this.style.display='none'">`
        : `<div class="pd-avatar-ph">${p.faction==='red'?'🔴':'🔵'}</div>`

      const pct = maxHp > 0 ? Math.round(p.currentHp / maxHp * 100) : 0
      const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''

      const tags = (p.statusTags || []).filter(t => t.visible !== false)
      const tagsHtml = tags.length
        ? `<div class="pd-section-label">状态</div>
           <div class="pd-tag-row">${tags.map(t =>
             `<span class="pd-tag">${escHtml(t.name||t.id||t.type)}${t.stacks>1?' x'+t.stacks:''}${t.duration?' ('+t.duration+'回合)':''}</span>`
           ).join('')}</div>`
        : ''

      const skillsHtml = (p.skills || []).map(s => {
        const def2 = skillsById[s.skillId] || {}
        const type = def2.type || 'normal'
        const cd = s.currentCooldown || 0
        const cdText = cd > 0 ? `冷却中 ${cd}` : uses === 0 ? '已用尽' : ''
        const cdText = cd > 0 ? `冷却中 ${cd}` : uses === 0 ? '已用尽' : ''
        const cost = type === 'super'
          ? `充能 ${def2.chargeCost||0}CP`
          : type === 'buff' ? '强化' : '普通'
        const ap = def2.actionPointCost ? ` 路 ${def2.actionPointCost}AP` : ''
        const rangeTxt = def2.range != null ? `射程 ${def2.range}` : ''
        const dmgTxt   = def2.damage != null ? `伤害 ${def2.damage}` : ''
        const cdTxt    = def2.cooldown ? `CD ${def2.cooldown}` : ''
        const meta = [cost+ap, rangeTxt, dmgTxt, cdTxt, cdText].filter(Boolean)
        return `<div class="pd-skill-item">
          <div class="pd-skill-name">${def2.icon||''} ${escHtml(def2.name||s.skillId)}</div>
          ${def2.description ? `<div class="pd-skill-desc">${escHtml(def2.description)}</div>` : ''}
          <div class="pd-skill-meta">${meta.map(m=>`<span class="pd-skill-tag ${type}">${escHtml(m)}</span>`).join('')}</div>
        </div>`
      }).join('')

      document.getElementById('pdContent').innerHTML = `
        <div class="pd-header">
          ${avatarHtml}
          <div>
            <div class="pd-name">${escHtml(p.name||p.templateId)}</div>
            <div class="pd-faction">${p.faction==='red'?'红方':'蓝方'}</div>
          </div>
          <button class="pd-close" onclick="closePieceDetail()">关闭</button>
        </div>
        <div class="pd-stats-row">
          <div class="pd-stat"><div class="pd-stat-val" style="color:#22c55e">${p.currentHp}/${maxHp}</div><div class="pd-stat-lbl">生命</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#ef4444">${atk}</div><div class="pd-stat-lbl">攻击</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#3b82f6">${def}</div><div class="pd-stat-lbl">防御</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#eab308">${spd}</div><div class="pd-stat-lbl">速度</div></div>
        </div>
        <div class="piece-hp-bar" style="margin-bottom:12px">
          <div class="piece-hp-fill ${fillCls}" style="width:${pct}%"></div>
        </div>
        ${tagsHtml}
        <div class="pd-section-label">鎶€鑳藉垪琛?/div>
        ${skillsHtml || '<div style="font-size:11px;color:#52525b">鏃犳妧鑳?/div>'}
      `
      document.getElementById('pdOverlay').classList.add('show')
    }

    function closePieceDetail() {
      document.getElementById('pdOverlay').classList.remove('show')
    }

    function showCardDetail(cardInstanceId, cardId) {
      const def = cardsById[cardId] || {}
      const cost = def.actionPointCost || 0
      const typeLabel = def.type === 'reactive' ? '触发' : def.type === 'passive' ? '持续' : '主动'
      const artHtml = def.image
        ? `<img class="pd-avatar" src="images/card-art/${escHtml(def.image)}" onerror="this.style.display='none'">`
        : `<div class="pd-avatar-ph">${def.icon || '🃏'}</div>`
      document.getElementById('pdContent').innerHTML = `
        <div class="pd-header">
          ${artHtml}
          <div>
            <div class="pd-name">${escHtml(def.name || cardId)}</div>
            <div class="pd-faction">手牌 · ${typeLabel} · ${cost} AP</div>
          </div>
          <button class="pd-close" onclick="closePieceDetail()">关闭</button>
        </div>
        <div class="pd-section-label">说明</div>
        <div class="pd-skill-desc" style="font-size:12px;line-height:1.55">${escHtml(def.description || '无描述')}</div>
        <div class="pd-section-label">实例</div>
        <div class="pd-tag-row"><span class="pd-tag">${escHtml(cardInstanceId || '')}</span></div>
      `
      document.getElementById('pdOverlay').classList.add('show')
    }

    // 鈹€鈹€ Dynamic cell sizing 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
    function renderArcHand() {
      const container = document.getElementById('arcHandContainer')
      if (!container) return
      if (!G) { container.innerHTML = ''; return }

      container.innerHTML = ''
      const myMeta = G.players && G.players.find(p => p.playerId === localPlayerId)
      const hand = (myMeta && myMeta.hand) || []
      if (!hand.length) return

      const isMyTurn = G.turn && G.turn.currentPlayerId === localPlayerId
      const phase = G.turn ? G.turn.phase : ''
      const ap = myMeta ? myMeta.actionPoints : 0
      const n = hand.length
      const W = window.innerWidth
      const cardW = 80
      const maxSpread = Math.min(W * 0.85, n * 84)
      const maxAngle = Math.min(28, n * 5)

      hand.forEach((card, i) => {
        const def = cardsById[card.cardId] || {}
        const cost = def.actionPointCost || 0
        const canPlay = isMyTurn && phase === 'action' && ap >= cost && (def.type === 'active' || def.type === 'reactive' || !def.type)
        const isPending = pendingCardAction && pendingCardAction.cardInstanceId === card.instanceId

        const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1
        const angle = t * maxAngle
        const xPos = W / 2 + t * (maxSpread / 2) - cardW / 2
        const yLift = -(t * t) * 16

        const el = document.createElement('div')
        let cls = 'arc-card'
        if (isPending) cls += ' arc-pending'
        else if (!canPlay) cls += ' arc-disabled'
        el.className = cls
        el.style.left = xPos + 'px'
        el.style.transform = `rotate(${angle}deg) translateY(${yLift}px)`

        const artSrc = def.image ? `images/card-art/${def.image}` : null
        const artHtml = artSrc
          ? `<img src="${artSrc}" onerror="this.style.display='none'">`
          : (def.icon || '🃏')
        const typeLabel = def.type === 'reactive' ? '⚡触发' : def.type === 'passive' ? '🔁持续' : '▶主动'

        el.innerHTML = `
          <div class="arc-card-cost">${cost}</div>
          <div class="arc-card-art">${artHtml}</div>
          <div class="arc-card-name">${escHtml(def.name || card.cardId || '')}</div>
          <div class="arc-card-type">${typeLabel}</div>
        `

        el.addEventListener('click', () => onCardClick(card.instanceId, card.cardId))
        el.addEventListener('contextmenu', (event) => {
          event.preventDefault()
          showCardDetail(card.instanceId, card.cardId)
        })
        let pressTimer = null
        el.addEventListener('touchstart', () => {
          el.classList.add('arc-hover')
          pressTimer = setTimeout(() => showCardDetail(card.instanceId, card.cardId), 600)
        }, { passive: true })
        el.addEventListener('touchend', () => {
          clearTimeout(pressTimer)
          setTimeout(() => el.classList.remove('arc-hover'), 300)
        })
        el.addEventListener('touchmove', () => {
          clearTimeout(pressTimer)
          el.classList.remove('arc-hover')
        }, { passive: true })

        container.appendChild(el)
      })
    }

    // ── Map pan / zoom ───────────────────────────────────────────────────────
    let mapViewScale = 1
    let mapViewX = 0
    let mapViewY = 0
    let isPanning = false
    const activePointers = new Map()
    let lastPanPoint = null
    let lastPinchDistance = 0
    let mapClickSuppressed = false

    function getMapTarget() {
      return document.querySelector('.board-core')
    }
    function applyMapView() {
      const target = getMapTarget()
      if (!target) return
      target.style.transform = `translate(${mapViewX}px, ${mapViewY}px) scale(${mapViewScale})`
    }
      <button class="btn-top" onclick="resetMapView()" title="??????">??</button>
      mapViewScale = 1
      mapViewX = 0
      mapViewY = 0
      applyMapView()
    }
    function clampMapScale(v) {
      return Math.max(1, Math.min(2.5, v))
    }
    function pointerDistance() {
      const pts = Array.from(activePointers.values())
      if (pts.length < 2) return 0
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)
    }
    function initMapControls() {
      const wrap = document.getElementById('boardWrap')
      if (!wrap || wrap.dataset.mapControlsReady === '1') return
      wrap.dataset.mapControlsReady = '1'
      wrap.addEventListener('pointerdown', e => {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
        if (activePointers.size >= 2) {
          lastPinchDistance = pointerDistance()
          mapClickSuppressed = true
          try { wrap.setPointerCapture(e.pointerId) } catch {}
          e.preventDefault()
          return
        }
        if (mapViewScale > 1 || e.target === wrap || e.target.id === 'gameGrid') {
          isPanning = mapViewScale > 1
          lastPanPoint = { x: e.clientX, y: e.clientY }
          try { wrap.setPointerCapture(e.pointerId) } catch {}
        }
      })
      wrap.addEventListener('pointermove', e => {
        if (!activePointers.has(e.pointerId)) return
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
        if (activePointers.size >= 2) {
          const dist = pointerDistance()
          if (lastPinchDistance > 0 && dist > 0) {
            mapViewScale = clampMapScale(mapViewScale * (dist / lastPinchDistance))
            applyMapView()
          }
          lastPinchDistance = dist
          mapClickSuppressed = true
          e.preventDefault()
          return
        }
        if (isPanning && lastPanPoint && mapViewScale > 1) {
          const dx = e.clientX - lastPanPoint.x
          const dy = e.clientY - lastPanPoint.y
          if (Math.abs(dx) + Math.abs(dy) > 2) {
            mapViewX += dx
            mapViewY += dy
            lastPanPoint = { x: e.clientX, y: e.clientY }
            mapClickSuppressed = true
            wrap.classList.add('dragging')
            applyMapView()
          }
          e.preventDefault()
        }
      }, { passive: false })
      function endPointer(e) {
        activePointers.delete(e.pointerId)
        if (activePointers.size < 2) lastPinchDistance = 0
        if (!activePointers.size) {
          isPanning = false
          lastPanPoint = null
          wrap.classList.remove('dragging')
          if (mapClickSuppressed) setTimeout(() => { mapClickSuppressed = false }, 60)
        }
      }
      wrap.addEventListener('pointerup', endPointer)
      wrap.addEventListener('pointercancel', endPointer)
      wrap.addEventListener('click', e => {
        if (!mapClickSuppressed) return
        e.preventDefault()
        e.stopPropagation()
      }, true)
      wrap.addEventListener('dblclick', e => {
      <button class="btn-top" onclick="resetMapView()" title="??????">??</button>
        e.preventDefault()
      })
      wrap.addEventListener('wheel', e => {
        const prev = mapViewScale
        const next = clampMapScale(prev * (e.deltaY < 0 ? 1.1 : 0.9))
        if (next === prev) return
        mapViewScale = next
        applyMapView()
        e.preventDefault()
      }, { passive: false })
    }

    function recalcCellSize() {
      if (!G || !G.map) return
      const cols = G.map.width
      const rows = G.map.height
      const wrap = document.getElementById('boardWrap')
      if (!wrap) return
      const availW = wrap.clientWidth - 8
      const topbarH = document.querySelector('.topbar')?.offsetHeight || 44
      const logH    = document.querySelector('.log-panel')?.offsetHeight || 0
      const handH   = document.getElementById('handPanel')?.offsetHeight || 0
      const availH  = window.innerHeight - topbarH - logH - 80
      const byW = Math.floor(availW / cols)
      const byH = Math.floor(availH / rows)
      const sz = Math.max(28, Math.min(72, byW, byH))
      document.documentElement.style.setProperty('--cell-size', sz + 'px')
      const grid = document.getElementById('gameGrid')
      if (grid) grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size, 44px))`
    }
    window.addEventListener('resize', recalcCellSize)

    // 鈹€鈹€ Boot 鈹€鈹€
    window.addEventListener('load', () => {
      initMapControls()
      loadAvailableData()
      showScreen('setup')
    })
  </script>
  <!-- Arc hand container (all screens) -->
  <div id="arcHandContainer"></div>
</body>
</html>
