<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在进入训练营 - RED vs BLUE</title>
  <style>
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: #0f172a; color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { text-align: center; }
    a { color: #93c5fd; }
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search)
      params.set('mode', 'training')
      const target = 'battle.html?' + params.toString() + window.location.hash

      window.addEventListener('DOMContentLoaded', () => {
        const fallback = document.getElementById('continueLink')
        if (fallback) fallback.href = target
      })
      window.location.replace(target)
    })()
  </script>
</head>
<body>
  <main>
    <p>正在进入训练营…</p>
    <a id="continueLink" href="battle.html?mode=training">如果没有自动跳转，请点击继续</a>
  </main>
</body>
</html>
