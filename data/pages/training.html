<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>训练营 - RED vs BLUE</title>
  <script src="js/pack-fetch.js"></script>
  <script src="js/server-utils.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --red: #ef4444; --red-bg: rgba(239,68,68,.15);
      --blue: #3b82f6; --blue-bg: rgba(59,130,246,.15);
      --bg: #09090b; --card: #18181b; --card2: #27272a; --border: #3f3f46;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: #e4e4e7;
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .back-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: #a1a1aa; padding: 5px 10px; font-size: 13px; cursor: pointer;
      text-decoration: none; flex-shrink: 0;
    }
    .topbar-title { font-size: 15px; font-weight: 700; flex: 1; }
    .topbar-btns { display: flex; gap: 6px; }
    .btn-top {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: #a1a1aa; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .btn-top:active { background: var(--card2); }

    /* ── Setup ── */
    #setupScreen { padding: 16px; max-width: 400px; margin: 0 auto; }
    .setup-title { font-size: 13px; font-weight: 700; color: #71717a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: #e4e4e7; font-size: 14px; padding: 9px 10px; outline: none; -webkit-appearance: none;
    }
    select:focus { border-color: var(--blue); }
    .btn-start {
      width: 100%; padding: 14px; margin-top: 16px;
      background: linear-gradient(135deg, #dc2626, #9333ea);
      color: #fff; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }
    .btn-start:active { opacity: .85; }
    .setup-err { color: #f87171; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

    /* ── Battle layout ── */
    #battleScreen { display: none; }
    .battle-layout {
      display: flex; flex-direction: column; gap: 0;
    }
    @media (min-width: 900px) {
      .battle-layout { flex-direction: row; align-items: flex-start; }
      .side-panel { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); min-height: calc(100vh - 45px); }
      .main-panel { flex: 1; overflow-x: auto; }
    }

    /* ── Side panel ── */
    .side-panel { background: var(--bg); }
    .panel-block {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-label {
      font-size: 10px; font-weight: 700; color: #71717a;
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px;
    }

    /* Player toggle */
    .player-toggle { display: flex; gap: 6px; }
    .toggle-btn {
      flex: 1; padding: 7px; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border);
      background: var(--card); color: #71717a; transition: all .15s;
    }
    .toggle-btn.active-red  { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .toggle-btn.active-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

    /* Turn info */
    .phase-bar { display: flex; gap: 3px; margin: 6px 0; }
    .phase-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--card2); }
    .phase-seg.active-start { background: #eab308; }
    .phase-seg.active-action { background: #22c55e; }
    .phase-seg.active-end { background: #ef4444; }

    .player-res-card {
      border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
      border: 1px solid var(--border);
    }
    .player-res-card.red { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.3); }
    .player-res-card.blue { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.3); }
    .prc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .prc-name { font-size: 12px; font-weight: 700; }
    .prc-name.red { color: var(--red); }
    .prc-name.blue { color: var(--blue); }
    .prc-turn-badge { font-size: 9px; background: #16a34a; color: #fff; border-radius: 4px; padding: 1px 5px; }
    .prc-stats { font-size: 11px; color: #a1a1aa; display: flex; gap: 10px; }

    /* Action buttons */
    .action-btns { display: flex; flex-direction: column; gap: 5px; }
    .btn-action {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border);
      background: var(--card); color: #e4e4e7; text-align: left; display: flex; align-items: center; gap: 6px;
    }
    .btn-action:active { background: var(--card2); }
    .btn-action:disabled { opacity: .35; cursor: default; }
    .btn-action.primary { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    .btn-action.primary:active { background: #1e40af; }
    .btn-action.success { background: #15803d; border-color: #22c55e; color: #fff; }
    .btn-action.danger  { background: #991b1b; border-color: #ef4444; color: #fff; }
    .btn-action.warn    { background: #78350f; border-color: #f59e0b; color: #fff; }

    /* Skill buttons */
    .skill-list { display: flex; flex-direction: column; gap: 4px; }
    .skill-item {
      width: 100%; padding: 7px 10px; border-radius: 7px;
      font-size: 11px; cursor: pointer; border: 1px solid var(--border);
      background: var(--card); color: #e4e4e7; text-align: left;
    }
    .skill-item:active { background: var(--card2); }
    .skill-item:disabled { opacity: .35; cursor: default; }
    .skill-item.normal { border-color: #3b82f6; }
    .skill-item.super  { border-color: #a855f7; }
    .skill-item.buff   { border-color: #22c55e; }
    .skill-item.passive { border-color: #71717a; color: #a1a1aa; font-style: italic; cursor: default; }
    .skill-item.active-skill { background: rgba(168,85,247,.2); border-color: #a855f7; }

    /* Place piece panel */
    .place-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .place-row select { flex: 1; font-size: 12px; padding: 6px 8px; }

    /* Piece list */
    .piece-entry {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 8px; border-radius: 8px; margin-bottom: 4px;
      background: var(--card); border: 1px solid var(--border); cursor: pointer;
    }
    .piece-entry:active { background: var(--card2); }
    .piece-entry.selected { border-color: #eab308; }
    .piece-entry.dead { opacity: .4; cursor: default; }
    .piece-avatar {
      width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
    }
    .piece-avatar-ph {
      width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; background: var(--card2);
    }
    .piece-info { flex: 1; overflow: hidden; }
    .piece-info-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .piece-info-hp { font-size: 11px; color: #a1a1aa; }
    .piece-hp-bar { height: 3px; background: var(--card2); border-radius: 2px; margin-top: 3px; }
    .piece-hp-fill { height: 100%; border-radius: 2px; background: #22c55e; }
    .piece-hp-fill.low { background: #eab308; }
    .piece-hp-fill.crit { background: #ef4444; }
    .piece-remove {
      background: transparent; border: none; color: #52525b; font-size: 13px;
      cursor: pointer; padding: 0 3px; flex-shrink: 0;
    }
    .piece-remove:active { color: #ef4444; }

    /* ── Main panel ── */
    .main-panel { padding: 12px 14px; }
    .map-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .map-name { font-size: 12px; color: #71717a; }

    /* Legend */
    .tile-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #a1a1aa; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    /* Board */
    .board-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #gameGrid { display: inline-grid; gap: 2px; user-select: none; }
    .cell {
      width: var(--cell-size, 44px); height: var(--cell-size, 44px);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      transition: filter .1s;
    }
    .cell:active { filter: brightness(.8); }

    /* Tile colors */
    .t-floor    { background: #3f3f46; }
    .t-wall     { background: #18181b; cursor: default; }
    .t-spawn    { background: #064e3b; }
    .t-cover    { background: #78350f; }
    .t-hole     { background: #082f49; cursor: default; }
    .t-lava     { background: #7c2d12; }
    .t-spring   { background: #134e4a; }
    .t-chargepad{ background: #3b0764; }

    /* Cell highlight overlays */
    .cell.hl-move   { outline: 2px solid #22c55e; outline-offset: -2px; }
    .cell.hl-skill  { outline: 2px solid #a855f7; outline-offset: -2px; }
    .cell.hl-place  { outline: 2px dashed #eab308; outline-offset: -2px; }
    .cell.hl-selected { outline: 2px solid #eab308; outline-offset: -2px; }

    /* Piece token */
    .piece-tok {
      width: calc(var(--cell-size, 44px) - 8px); height: calc(var(--cell-size, 44px) - 8px);
      border-radius: 50%;
      overflow: hidden; position: relative;
      border: 2px solid transparent;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .piece-tok.red  { border-color: var(--red); }
    .piece-tok.blue { border-color: var(--blue); }
    .piece-tok.selected-tok { border-color: #eab308; border-width: 2px; }
    .piece-tok img { width: 100%; height: 100%; object-fit: cover; }
    .piece-tok-ph { font-size: 16px; }
    .tok-hp-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; background: rgba(0,0,0,.5);
    }
    .tok-hp-fill { height: 100%; background: #22c55e; }
    .tok-hp-fill.low  { background: #eab308; }
    .tok-hp-fill.crit { background: #ef4444; }

    /* ── Hand panel ── */
    .hand-panel {
      border-top: 1px solid var(--border);
      background: #080f1e; flex-shrink: 0;
    }
    .hand-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 10px; font-size: 11px; color: #71717a;
      border-bottom: 1px solid #1a2540; cursor: pointer; user-select: none;
    }
    .hand-header:active { background: #0d1929; }
    .hand-body.collapsed { display: none; }
    .hand-scroll {
      display: flex; gap: 6px; padding: 6px 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: #334155 transparent;
    }
    .hand-scroll::-webkit-scrollbar { height: 3px; }
    .hand-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    /* ── Hearthstone-style cards ── */
    .card-item {
      flex-shrink: 0; width: 88px; height: 138px;
      background: linear-gradient(180deg, #1a2744 0%, #0f1929 55%, #131c30 100%);
      border: 2px solid #4a6a9a; border-radius: 10px;
      cursor: pointer; position: relative;
      display: flex; flex-direction: column; overflow: visible;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(100,150,255,.12);
    }
    .card-item:hover { transform: translateY(-10px) scale(1.06); box-shadow: 0 14px 28px rgba(0,0,0,.85); z-index: 10; }
    .card-item:active { transform: scale(.97); }
    .card-item.card-pending { border-color: #f59e0b; box-shadow: 0 0 18px rgba(245,158,11,.45); }
    .card-item.card-disabled { opacity: .45; cursor: default; }
    .card-item.card-disabled:hover { transform: none; box-shadow: 0 4px 12px rgba(0,0,0,.6); }
    .card-item.card-reactive { border-color: #818cf8; box-shadow: 0 0 12px rgba(99,102,241,.35); }

    .card-mana-gem {
      position: absolute; top: -9px; left: -9px;
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #93c5fd, #1d4ed8 60%, #1e3a8a);
      border: 2px solid #bfdbfe;
      box-shadow: 0 0 12px rgba(59,130,246,.75), 0 2px 4px rgba(0,0,0,.5);
      color: #fff; font-size: 14px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    .card-mana-gem.free {
      background: radial-gradient(circle at 35% 30%, #86efac, #15803d 60%, #14532d);
      border-color: #bbf7d0; box-shadow: 0 0 12px rgba(34,197,94,.75), 0 2px 4px rgba(0,0,0,.5);
    }
    .card-art {
      width: 100%; height: 66px; flex-shrink: 0;
      border-radius: 8px 8px 0 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; background: rgba(0,0,0,.25); position: relative;
    }
    .card-art::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(10,15,30,.75));
      pointer-events: none;
    }
    .card-name-banner {
      background: linear-gradient(90deg, transparent, rgba(18,38,80,.96) 18%, rgba(18,38,80,.96) 82%, transparent);
      text-align: center; padding: 4px 10px;
      font-size: 10px; font-weight: 800; color: #e2e8f0;
      border-top: 1px solid rgba(100,150,220,.3);
      border-bottom: 1px solid rgba(100,150,220,.3);
      flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-body { flex: 1; padding: 4px 7px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .card-desc { font-size: 9px; color: #94a3b8; line-height: 1.35; flex: 1; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .card-type-badge { font-size: 8px; color: #475569; font-weight: 600; text-align: center; }
    .hand-empty { font-size: 12px; color: #334155; padding: 10px; }

    /* ── End-turn button (Hearthstone style) ── */
    #btnEndTurn:not(:disabled) {
      background: linear-gradient(180deg, #15803d 0%, #14532d 100%) !important;
      border: 2px solid #4ade80 !important; border-radius: 50px !important;
      color: #fff !important; font-weight: 900 !important; letter-spacing: .4px;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      box-shadow: 0 0 18px rgba(74,222,128,.45), 0 3px 8px rgba(0,0,0,.5) !important;
      animation: endTurnPulse 2.4s ease-in-out infinite;
      position: relative; overflow: hidden;
    }
    @keyframes endTurnPulse {
      0%,100% { box-shadow: 0 0 18px rgba(74,222,128,.45), 0 3px 8px rgba(0,0,0,.5); }
      50%      { box-shadow: 0 0 32px rgba(74,222,128,.75), 0 3px 8px rgba(0,0,0,.5); }
    }

    /* ── Turn announcement ── */
    #turnAnnounce {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 30px; font-weight: 900; letter-spacing: 3px;
      pointer-events: none; z-index: 500; display: none; white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
    }
    #turnAnnounce.show { display: block; animation: turnAnnounceAnim 1.8s ease-out forwards; }
    @keyframes turnAnnounceAnim {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.55); }
      22%  { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
      60%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.12); }
    }
    .collapse-arrow { font-size: 10px; color: #71717a; transition: transform .2s; }
    .collapse-arrow.open { transform: rotate(90deg); }

    /* ── Log ── */
    .log-panel {
      margin: 10px 0 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    .log-header { font-size: 10px; font-weight: 700; color: #71717a; letter-spacing: 1px; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .log-body { max-height: 110px; overflow-y: auto; padding: 4px 10px; font-size: 11px; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1c1c1e; color: #a1a1aa; }
    .log-entry:last-child { border-bottom: none; }
    .log-entry.turn  { color: #fde68a; font-weight: 600; }
    .log-entry.atk   { color: #fca5a5; }
    .log-entry.mov   { color: #93c5fd; }
    .log-entry.skill { color: #c4b5fd; }
    .log-entry.die   { color: #f87171; font-weight: 700; }
    .log-entry.info  { color: #6ee7b7; }
    .log-entry.err   { color: #fb923c; }
    .btn-clear { background: transparent; border: none; color: #52525b; font-size: 10px; cursor: pointer; }

    /* ── Result ── */
    #resultScreen {
      display: none; min-height: 60vh; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 20px; text-align: center;
    }
    .result-icon { font-size: 56px; margin-bottom: 12px; }
    .result-title { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
    .result-sub { font-size: 13px; color: #71717a; margin-bottom: 24px; }
    .btn-again { padding: 12px 32px; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; width: 100%; max-width: 260px; }
    .btn-back-menu { padding: 10px 32px; background: var(--card); border: 1px solid var(--border); color: #a1a1aa; border-radius: 10px; font-size: 14px; cursor: pointer; width: 100%; max-width: 260px; }

    /* ── Damage floaters ── */
    .dmg-float {
      position: absolute; pointer-events: none; white-space: nowrap;
      font-size: 16px; font-weight: 900; z-index: 50;
      transform: translateX(-50%);
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      animation: floatUp 1.1s ease-out forwards;
    }
    .dmg-float.big { font-size: 22px; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(-8px); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-54px); }
    }

    /* ── Loading overlay ── */
    #loadingOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    #loadingOverlay.show { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--card2); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Resource dialog ── */
    .dlg-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .dlg-overlay.show { display: flex; }
    .dlg { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; width: 100%; max-width: 320px; }
    .dlg h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .dlg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .dlg-row label { font-size: 12px; color: #a1a1aa; width: 70px; flex-shrink: 0; }
    .dlg-row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: #e4e4e7; font-size: 13px; padding: 7px 9px; outline: none; }
    .dlg-row input:focus { border-color: var(--blue); }
    .dlg-btns { display: flex; gap: 7px; margin-top: 12px; }
    .dlg-btns button { flex: 1; padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
    .btn-ok { background: var(--blue); color: #fff; }
    .btn-cancel-dlg { background: var(--card2); color: #a1a1aa; }

    @media (hover: hover) {
      .piece-entry:hover { background: var(--card2); }
      .btn-action:not(:disabled):hover { background: var(--card2); }
      .skill-item:not(:disabled):not(.passive):hover { background: var(--card2); }
      .back-btn:hover { background: var(--card2); }
      .btn-top:hover { background: var(--card2); }
    }

    /* ── Piece detail modal ── */
    .pd-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 300;
      align-items: flex-end; justify-content: center; padding: 0;
    }
    .pd-overlay.show { display: flex; }
    .pd-sheet {
      background: var(--card); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
      max-height: 80vh; overflow-y: auto; padding: 16px 16px 32px;
    }
    .pd-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .pd-avatar { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--card2); }
    .pd-avatar-ph { width: 48px; height: 48px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .pd-name { font-size: 16px; font-weight: 800; }
    .pd-faction { font-size: 11px; color: #71717a; }
    .pd-close { margin-left: auto; background: var(--card2); border: none; color: #a1a1aa; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
    .pd-stats-row { display: flex; gap: 0; background: var(--card2); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .pd-stat { flex: 1; padding: 8px 4px; text-align: center; border-right: 1px solid var(--border); }
    .pd-stat:last-child { border-right: none; }
    .pd-stat-val { font-size: 14px; font-weight: 700; }
    .pd-stat-lbl { font-size: 9px; color: #52525b; margin-top: 1px; text-transform: uppercase; }
    .pd-section-label { font-size: 10px; font-weight: 700; color: #52525b; letter-spacing: 1px; text-transform: uppercase; margin: 10px 0 6px; }
    .pd-skill-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 6px;
    }
    .pd-skill-name { font-size: 12px; font-weight: 700; }
    .pd-skill-desc { font-size: 11px; color: #71717a; margin-top: 3px; }
    .pd-skill-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .pd-skill-tag { font-size: 10px; background: var(--card2); border-radius: 4px; padding: 1px 6px; color: #a1a1aa; }
    .pd-skill-tag.super { background: rgba(168,85,247,.15); color: #c084fc; }
    .pd-skill-tag.normal { background: rgba(59,130,246,.15); color: #60a5fa; }
    .pd-skill-tag.buff { background: rgba(34,197,94,.15); color: #4ade80; }
    .pd-tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .pd-tag { font-size: 10px; background: var(--card2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; color: #a1a1aa; }
  </style>
</head>
<body>

  <div id="loadingOverlay"><div class="spinner"></div></div>
  <div id="turnAnnounce"></div>

  <!-- Topbar -->
  <div class="topbar">
    <a class="back-btn" href="index.html">← 返回</a>
    <div class="topbar-title">⚔️ 训练营</div>
    <div class="topbar-btns" id="battleTopBtns" style="display:none">
      <button class="btn-top" id="btnSwitchPov" onclick="switchPerspective()" style="font-weight:700">🔄 切换视角</button>
      <button class="btn-top" onclick="showMapDialog()">🗺 地图</button>
      <button class="btn-top" onclick="initTraining(currentMapId)">↺ 重置</button>
    </div>
  </div>

  <!-- ── SETUP SCREEN ── -->
  <div id="setupScreen">
    <div class="setup-title" style="margin-top:16px">选择地图</div>
    <select id="mapSelect"><option value="">默认地图</option></select>
    <button class="btn-start" onclick="startSetup()">⚔️ 开始训练</button>
    <a href="index.html" style="display:block;width:100%;padding:12px;margin-top:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:#a1a1aa;font-size:14px;font-weight:600;text-align:center;text-decoration:none;">← 返回主页</a>
    <div class="setup-err" id="setupErr"></div>
  </div>

  <!-- ── BATTLE SCREEN ── -->
  <div id="battleScreen">
    <div class="battle-layout">

      <!-- Left side panel -->
      <div class="side-panel">

        <!-- Player control toggle -->
        <div class="panel-block">
          <div class="panel-label">当前操控方</div>
          <div class="player-toggle">
            <button class="toggle-btn" id="btnRed" onclick="setLocalPlayer('training-red')">🔴 红方</button>
            <button class="toggle-btn" id="btnBlue" onclick="setLocalPlayer('training-blue')">🔵 蓝方</button>
          </div>
        </div>

        <!-- Turn info -->
        <div class="panel-block">
          <div class="panel-label">回合信息</div>
          <div style="background:var(--card2);border-radius:8px;padding:8px 10px;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;font-size:12px">
              <span style="color:#a1a1aa">阶段</span>
              <span id="phaseLabel" style="font-weight:600">—</span>
            </div>
            <div class="phase-bar" id="phaseBar">
              <div class="phase-seg" id="seg-start"></div>
              <div class="phase-seg" id="seg-action"></div>
              <div class="phase-seg" id="seg-end"></div>
            </div>
            <div style="font-size:11px;color:#71717a" id="turnNum">回合 1</div>
          </div>
          <!-- Player resources -->
          <div id="playerResCards"></div>
        </div>

        <!-- Action buttons (shown in action phase) -->
        <div class="panel-block" id="actionPanel">
          <div class="panel-label">操作</div>
          <div class="action-btns">
            <div id="phaseHint" style="font-size:11px;color:#71717a;text-align:center;padding:4px 0"></div>
            <button class="btn-action primary" id="btnBeginPhase" onclick="doBeginPhase()" style="display:none">▶ 继续</button>
            <button class="btn-action" id="btnMove" onclick="toggleMove()" style="display:none">👣 移动</button>
            <button class="btn-action danger" id="btnEndTurn" onclick="doEndTurn()" style="display:none" disabled>⏭ 结束回合</button>
          </div>
          <!-- Skills for selected piece -->
          <div id="skillSection" style="margin-top:8px;display:none">
            <div class="panel-label" style="margin-bottom:6px">技能</div>
            <div class="skill-list" id="skillList"></div>
          </div>
        </div>

        <!-- Place piece -->
        <div class="panel-block">
          <div class="panel-label">快速放置棋子</div>
          <div class="place-row">
            <select id="placeFaction" onchange="onPlaceFactionChange()">
              <option value="red">🔴 红方</option>
              <option value="blue">🔵 蓝方</option>
            </select>
          </div>
          <div class="place-row">
            <select id="placeTemplate"><option value="">选择棋子…</option></select>
          </div>
          <button class="btn-action warn" id="btnPlace" onclick="togglePlaceMode()">＋ 点击格子放置</button>
        </div>

        <!-- Management tools -->
        <div class="panel-block">
          <div class="panel-label">管理工具</div>
          <div class="action-btns">
            <button class="btn-action" onclick="showResDialog()">⚙ 修改资源</button>
            <button class="btn-action" onclick="resetCooldowns()">↺ 重置冷却</button>
          </div>
        </div>

        <!-- Piece list: Red -->
        <div class="panel-block">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div class="panel-label" style="margin-bottom:0;color:var(--red)">🔴 红方棋子</div>
          </div>
          <div id="redPieces"></div>
        </div>

        <!-- Piece list: Blue -->
        <div class="panel-block">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div class="panel-label" style="margin-bottom:0;color:var(--blue)">🔵 蓝方棋子</div>
          </div>
          <div id="bluePieces"></div>
        </div>

      </div><!-- /side-panel -->

      <!-- Main panel: board + log -->
      <div class="main-panel">
        <div class="map-header">
          <span id="mapNameLabel" style="font-size:13px;font-weight:600"></span>
          <span class="map-name" id="mapSizeLabel"></span>
        </div>

        <!-- Tile legend -->
        <div class="tile-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#3f3f46"></div>地板</div>
          <div class="legend-item"><div class="legend-dot" style="background:#18181b"></div>墙壁</div>
          <div class="legend-item"><div class="legend-dot" style="background:#064e3b"></div>出生点</div>
          <div class="legend-item"><div class="legend-dot" style="background:#78350f"></div>掩体</div>
          <div class="legend-item"><div class="legend-dot" style="background:#082f49"></div>陷阱</div>
          <div class="legend-item"><div class="legend-dot" style="background:#7c2d12"></div>熔岩</div>
          <div class="legend-item"><div class="legend-dot" style="background:#134e4a"></div>治愈泉</div>
          <div class="legend-item"><div class="legend-dot" style="background:#3b0764"></div>充能台</div>
        </div>

        <div class="board-wrap" id="boardWrap">
          <div style="position:relative;display:inline-block">
            <div id="gameGrid"></div>
            <div id="floatLayer" style="position:absolute;inset:0;pointer-events:none;overflow:visible"></div>
          </div>
        </div>

        <!-- Hand -->
        <div class="hand-panel" id="handPanel">
          <div class="hand-header" onclick="toggleHandPanel()">
            <span>🃏 手牌 <span id="handCount">0</span>
              <span id="handTargetHint" style="color:#f59e0b;display:none"> · 点击目标施放</span>
            </span>
            <span class="collapse-arrow" id="handArrow">▶</span>
          </div>
          <div class="hand-body collapsed" id="handBody">
            <div class="hand-scroll" id="handCards">
              <div class="hand-empty">暂无手牌</div>
            </div>
          </div>
        </div>

        <!-- Battle log -->
        <div class="log-panel">
          <div class="log-header">
            战斗日志
            <button class="btn-clear" onclick="clearLog()">清空</button>
          </div>
          <div class="log-body" id="logBody"></div>
        </div>

        <div style="padding:14px 0">
          <button class="btn-back-menu" style="width:100%" onclick="goSetup()">← 新对战</button>
        </div>
      </div><!-- /main-panel -->

    </div><!-- /battle-layout -->
  </div><!-- /battleScreen -->

  <!-- ── RESULT SCREEN ── -->
  <div id="resultScreen">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle">胜利！</div>
    <div class="result-sub" id="resultSub"></div>
    <button class="btn-again" onclick="initTraining(currentMapId)">再来一局</button>
    <button class="btn-back-menu" onclick="goSetup()">← 返回设置</button>
  </div>

  <!-- ── Resource dialog ── -->
  <div class="dlg-overlay" id="resDlg">
    <div class="dlg">
      <h3>修改资源</h3>
      <div class="dlg-row">
        <label>操控方</label>
        <select id="resPlayer" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:#e4e4e7;font-size:12px;padding:7px">
          <option value="training-red">🔴 红方</option>
          <option value="training-blue">🔵 蓝方</option>
        </select>
      </div>
      <div class="dlg-row"><label>行动点 AP</label><input id="resAP" type="number" min="0" max="20" value="10" /></div>
      <div class="dlg-row"><label>充能点 CP</label><input id="resCP" type="number" min="0" max="20" value="0" /></div>
      <div class="dlg-btns">
        <button class="btn-cancel-dlg" onclick="closeResDlg()">取消</button>
        <button class="btn-ok" onclick="applyRes()">确认</button>
      </div>
    </div>
  </div>

  <!-- ── Map select dialog ── -->
  <div class="dlg-overlay" id="mapDlg">
    <div class="dlg">
      <h3>切换地图</h3>
      <select id="mapDlgSelect" style="width:100%;margin-bottom:12px"><option value="">默认地图</option></select>
      <div class="dlg-btns">
        <button class="btn-cancel-dlg" onclick="closeMapDlg()">取消</button>
        <button class="btn-ok" onclick="applyMapChange()">切换并重置</button>
      </div>
    </div>
  </div>

  <!-- ── Piece detail modal ── -->
  <div class="pd-overlay" id="pdOverlay" onclick="closePieceDetail()">
    <div class="pd-sheet" id="pdSheet" onclick="event.stopPropagation()">
      <div id="pdContent"></div>
    </div>
  </div>

  <script>
    // ── Constants ──
    const SERVER_KEY = 'rvb_server_url'
    const getServerUrl = () => localStorage.getItem(SERVER_KEY) || ''
    const TILE_TYPE_CLASS = {
      wall: 't-wall', floor: 't-floor', spawn: 't-spawn',
      cover: 't-cover', hole: 't-hole', lava: 't-lava',
      spring: 't-spring', chargepad: 't-chargepad'
    }
    const PHASE_LABELS = { start: '开始阶段', action: '行动阶段', end: '结束阶段' }

    // ── State ──
    let G = null                          // BattleState from server
    let localPlayerId = 'training-red'    // which side user controls
    let selectedPieceId = null
    let pendingMove = false
    let pendingSkill = null               // {skillId, skillType, baseAction, extraTargets[]}
    let placingMode = false               // board click will place piece
    let PIECES_BY_ID = {}                 // templateId → piece template (for images)
    let MAPS = []                         // available maps from /api/maps
    let currentMapId = ''                 // current map id
    let actionLog = []
    let skillsById = {}            // loaded locally from ./data/skills/
    let cardsById = {}             // loaded locally from ./data/cards/
    let pendingCardAction = null   // { type:'playCard', playerId, cardInstanceId } awaiting target
    let lastActionCount = 0       // for G.actions-based log flushing

    // ── API helpers ──
    let _trainingBaseUrl = null
    async function _getTrainingUrl() {
      if (_trainingBaseUrl) return _trainingBaseUrl
      if (window.RvBBridge) { _trainingBaseUrl = 'http://localhost:7878'; return _trainingBaseUrl }
      if (window.electronAPI) {
        try {
          const info = await window.electronAPI.getHostInfo()
          if (info && info.port) { _trainingBaseUrl = 'http://localhost:' + info.port; return _trainingBaseUrl }
        } catch (e) { console.warn('[training] getHostInfo failed:', e) }
      }
      _trainingBaseUrl = 'http://localhost:54321'
      return _trainingBaseUrl
    }

    async function apiFetch(method, body) {
      const baseUrl = await _getTrainingUrl()
      const res = await fetch(baseUrl + '/api/training', {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw Object.assign(new Error(data.error || 'API错误'), data)
      return data
    }

    async function fetchLocalJson(path) {
      if (window.fetchPackJson && /^\.?\/?data\//.test(path)) {
        return window.fetchPackJson(path)
      }
      const res = await fetch(path)
      if (!res.ok) throw new Error('HTTP ' + res.status)
      return res.json()
    }

    // ── Init ──
    async function loadAvailableData() {
      // Load pieces from local data/ (offline-first)
      try {
        const ids = await fetchLocalJson('./data/pieces/manifest.json')
        for (const id of ids) {
          try {
            const p = await fetchLocalJson('./data/pieces/' + id + '.json')
            PIECES_BY_ID[p.id || id] = p
          } catch {}
        }
        refreshPlaceTemplates()
      } catch {}

      // Load maps from local data/
      try {
        const ids = await fetchLocalJson('./data/maps/manifest.json')
        MAPS = []
        for (const id of ids) {
          try {
            const m = await fetchLocalJson('./data/maps/' + id + '.json')
            MAPS.push(m)
          } catch {}
        }
        populateMapSelects()
      } catch {}

      // Load skills from local data/ for renderActionPanel
      try {
        const ids = await fetchLocalJson('./data/skills/manifest.json')
        for (const id of ids) {
          try {
            const s = await fetchLocalJson('./data/skills/' + id + '.json')
            skillsById[s.id || id] = s
          } catch {}
        }
      } catch {}

      // Load card definitions from local data/
      try {
        const cardIds = await fetchLocalJson('./data/cards/manifest.json')
        await Promise.all(cardIds.map(async cid => {
          try {
            const cd = await fetchLocalJson('./data/cards/' + cid + '.json')
            cardsById[cid] = cd
          } catch {}
        }))
      } catch {}
    }

    function populateMapSelects() {
      const opts = '<option value="">默认地图</option>' + MAPS.map(m =>
        `<option value="${m.id}">${m.name || m.id}${m.width ? ' ('+m.width+'×'+m.height+')' : ''}</option>`
      ).join('')
      document.getElementById('mapSelect').innerHTML = opts
      document.getElementById('mapDlgSelect').innerHTML = opts
    }

    function refreshPlaceTemplates() {
      const faction = document.getElementById('placeFaction').value
      const sel = document.getElementById('placeTemplate')
      const pieces = Object.values(PIECES_BY_ID).filter(p => !p.faction || p.faction === faction || p.faction === 'neutral')
      sel.innerHTML = '<option value="">选择棋子…</option>' + pieces.map(p =>
        `<option value="${p.id}">${p.name || p.id}</option>`
      ).join('')
    }

    function onPlaceFactionChange() {
      refreshPlaceTemplates()
      placingMode = false
      updatePlaceBtn()
    }

    async function startSetup() {
      const url = getServerUrl()
      if (!url) {
        showSetupErr('请先在主页连接服务器')
        return
      }
      const mapId = document.getElementById('mapSelect').value || undefined
      await initTraining(mapId)
    }

    async function initTraining(mapId) {
      showLoading(true)
      hideSetupErr()
      try {
        G = await apiFetch('POST', { mapId: mapId || undefined })
        currentMapId = mapId || ''
        localPlayerId = G.turn.currentPlayerId
        selectedPieceId = null
        pendingMove = false
        pendingSkill = null
        placingMode = false
        actionLog = []
        lastActionCount = 0
        addLog('⚔️ 训练营开始', 'turn')
        addLog('点击 [继续▶] 开始回合', 'info')
        showScreen('battle')
        renderAll()
      } catch (e) {
        showSetupErr('初始化失败：' + e.message)
        showScreen('setup')
      } finally {
        showLoading(false)
      }
    }

    // ── Log helpers ──
    function logClassFromType(type) {
      if (type === 'move') return 'mov'
      if (type === 'useBasicSkill' || type === 'useChargeSkill') return 'skill'
      if (type === 'endTurn' || type === 'beginPhase') return 'turn'
      if (type === 'surrender') return 'die'
      if (type === 'damage' || type === 'attack') return 'atk'
      if (type === 'death') return 'die'
      return 'info'
    }

    function flushActionLog(oldCount, newG) {
      if (!newG || !newG.actions) return
      const entries = newG.actions.slice(oldCount)
      for (const entry of entries) {
        const msg = (entry.payload && entry.payload.message) ? entry.payload.message : entry.type
        addLog('[T' + entry.turn + '] ' + msg, logClassFromType(entry.type))
      }
      lastActionCount = newG.actions.length
    }

    // ── Turn announcement ──
    let _lastAnnouncedTurnPlayer = null
    function showTurnAnnounce(text, color) {
      const el = document.getElementById('turnAnnounce')
      if (!el) return
      el.className = ''
      el.textContent = text
      el.style.color = color
      void el.offsetWidth
      el.className = 'show'
    }

    // ── Damage / heal floaters ──
    function spawnFloater(x, y, text, color, big) {
      const layer = document.getElementById('floatLayer')
      if (!layer) return
      const cellSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-size')) || 44
      const el = document.createElement('div')
      el.className = 'dmg-float' + (big ? ' big' : '')
      el.style.color = color
      el.style.left = (x * cellSize + cellSize / 2) + 'px'
      el.style.top  = (y * cellSize + 4) + 'px'
      el.textContent = text
      layer.appendChild(el)
      setTimeout(() => el.remove(), 1200)
    }
    function spawnStateFloaters(oldG, newG) {
      if (!oldG || !newG || !oldG.pieces || !newG.pieces) return
      for (const np of newG.pieces) {
        const op = oldG.pieces.find(p => p.instanceId === np.instanceId)
        if (!op) continue
        const newHp = np.currentHp ?? np.hp ?? 0
        const oldHp = op.currentHp ?? op.hp ?? 0
        const diff = newHp - oldHp
        if (diff < 0) {
          const dead = newHp <= 0
          spawnFloater(np.x, np.y, dead ? '💀' : String(-diff), dead ? '#c4b5fd' : '#f87171', dead || -diff >= 50)
        } else if (diff > 0) {
          spawnFloater(np.x, np.y, '+' + diff, '#4ade80', false)
        }
      }
    }

    // ── Send action ──
    async function sendAction(action) {
      if (!G) return
      showLoading(true)
      const wasEndTurn = action.type === 'endTurn'
      const oldCount = (G.actions || []).length
      try {
        const newState = await apiFetch('PUT', { action, battleState: G })
        flushActionLog(oldCount, newState)
        const oldG = G
        G = newState
        spawnStateFloaters(oldG, G)
        if (action.type !== 'beginPhase') {
          selectedPieceId = null
          pendingMove = false
          pendingSkill = null
          pendingCardAction = null
        }
        // 检测回合阶段待处理的选择
        if (G.pendingBeginTurnChoice || G.pendingEndTurnChoice) {
          const p = G.pendingBeginTurnChoice || G.pendingEndTurnChoice
          const actionType = G.pendingBeginTurnChoice ? 'beginTurnChoice' : 'endTurnChoice'
          const chosen = await showOptionDialog(p.title, p.options)
          if (chosen !== null) {
            await sendAction({ type: actionType, playerId: G.turn.currentPlayerId, selectedOption: chosen })
            return
          }
        }
        if (G.pendingBeginTurnTarget || G.pendingEndTurnTarget) {
          const pt = G.pendingBeginTurnTarget || G.pendingEndTurnTarget
          const actionType = G.pendingBeginTurnTarget ? 'beginTurnTargetSelect' : 'endTurnTargetSelect'
          pendingSkill = { targetType: pt.targetType, range: pt.range || 10, filter: pt.filter || 'all', turnTargetActionType: actionType, turnTargetPlayerId: G.turn.currentPlayerId }
          addLog('🎯 请在棋盘上点击目标（回合阶段）', 'info')
          renderBoard()
        }
        if (wasEndTurn) {
          // auto-chain beginPhase if server left us in 'end' phase
          if (G.turn.phase === 'end') {
            const oldCount2 = (G.actions || []).length
            try {
              const nextState = await apiFetch('PUT', { action: { type: 'beginPhase' }, battleState: G })
              flushActionLog(oldCount2, nextState)
              G = nextState
            } catch {}
          }
          localPlayerId = G.turn.currentPlayerId
          addLog('🔄 回合结束 → ' + playerLabel(localPlayerId), 'turn')
        }
        renderAll()
        checkGameOver()
      } catch (e) {
        if (e.needsTargetSelection) {
          // pendingSkill 保留 baseAction + extraTargets，只更新范围/过滤参数
          if (pendingSkill) {
            pendingSkill.range = e.range
            pendingSkill.filter = e.filter
          } else {
            pendingSkill = { range: e.range, filter: e.filter, baseAction: null, extraTargets: [] }
          }
          addLog('🎯 请在棋盘上点击目标', 'info')
          renderBoard()
        } else if (e.needsOptionSelection) {
          const chosen = await showOptionDialog(e.title || '请选择', e.options || [])
          if (chosen !== null) {
            // 把 selectedOption 合并进当前 action，更新 baseAction（保留已有目标信息）
            const retryAction = Object.assign({}, action, { selectedOption: chosen })
            if (pendingSkill) pendingSkill.baseAction = retryAction
            showLoading(false)
            await sendAction(retryAction)
            return
          }
          pendingSkill = null; pendingMove = false
        } else {
          addLog('❌ ' + e.message, 'err')
          pendingSkill = null; pendingMove = false
        }
        renderActionPanel()
      } finally {
        showLoading(false)
      }
    }

    async function sendPatch(body) {
      showLoading(true)
      try {
        G = await apiFetch('PATCH', Object.assign({}, body, { battleState: G }))
        renderAll()
        return true
      } catch (e) {
        addLog('❌ ' + e.message, 'err')
        return false
      } finally {
        showLoading(false)
      }
    }

    // ── Actions ──
    async function doBeginPhase() { await sendAction({ type: 'beginPhase' }) }
    async function doEndTurn()    { await sendAction({ type: 'endTurn', playerId: localPlayerId }) }

    // 弹出简易选项选择框（回合阶段规则需要时调用）
    function showOptionDialog(title, options) {
      return new Promise(resolve => {
        const overlay = document.createElement('div')
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999'
        const box = document.createElement('div')
        box.style.cssText = 'background:#1e293b;border:1px solid #334155;border-radius:8px;padding:20px;max-width:320px;width:90%'
        box.innerHTML = '<p style="color:#e2e8f0;font-size:14px;margin-bottom:12px">' + title + '</p>'
        options.forEach(opt => {
          const btn = document.createElement('button')
          btn.textContent = opt.label || opt.id
          btn.style.cssText = 'display:block;width:100%;margin-bottom:8px;padding:8px;background:#1d4ed8;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px'
          btn.onclick = () => { document.body.removeChild(overlay); resolve(opt) }
          box.appendChild(btn)
        })
        const cancel = document.createElement('button')
        cancel.textContent = '取消'
        cancel.style.cssText = 'display:block;width:100%;padding:6px;background:transparent;color:#94a3b8;border:1px solid #475569;border-radius:4px;cursor:pointer;font-size:12px'
        cancel.onclick = () => { document.body.removeChild(overlay); resolve(null) }
        box.appendChild(cancel)
        overlay.appendChild(box)
        document.body.appendChild(overlay)
      })
    }
    async function resetCooldowns() {
      if (await sendPatch({ type: 'resetCooldowns' })) addLog('↺ 冷却已重置', 'info')
    }

    function setLocalPlayer(id) {
      localPlayerId = id
      selectedPieceId = null; pendingMove = false; pendingSkill = null
      addLog('↔️ 操控方 → ' + playerLabel(id), 'turn')
      renderAll()
    }

    function switchPerspective() {
      const next = localPlayerId === 'training-red' ? 'training-blue' : 'training-red'
      setLocalPlayer(next)
      const btn = document.getElementById('btnSwitchPov')
      if (btn) btn.textContent = next === 'training-red' ? '🔄 切换视角 🔴' : '🔄 切换视角 🔵'
    }

    function toggleMove() {
      pendingMove = !pendingMove
      pendingSkill = null
      renderBoard(); renderActionPanel()
    }

    function useSkill(skillId, skillType) {
      if (pendingSkill && pendingSkill.skillId === skillId) {
        pendingSkill = null; pendingMove = false
        renderBoard(); renderActionPanel(); return
      }
      pendingMove = false
      // baseAction = null（未选目标）；extraTargets = 已累积的额外目标列表
      pendingSkill = { skillId, skillType, baseAction: null, extraTargets: [] }
      // Try without target — server will request if needed
      sendAction({
        type: skillType === 'super' ? 'useChargeSkill' : 'useBasicSkill',
        playerId: localPlayerId,
        pieceId: selectedPieceId,
        skillId
      })
    }

    // ── Board click ──
    function onCellClick(x, y) {
      if (!G) return
      const alivePieces = G.pieces.filter(p => p.currentHp > 0)
      const pieceAt = alivePieces.find(p => p.x === x && p.y === y)

      // Pending card target selection
      if (pendingCardAction) {
        const extra = pieceAt ? { targetPieceId: pieceAt.instanceId } : { targetX: x, targetY: y }
        const action = Object.assign({}, pendingCardAction, extra)
        pendingCardAction = null
        document.getElementById('handTargetHint').style.display = 'none'
        sendAction(action)
        return
      }

      // Place piece mode
      if (placingMode) {
        const templateId = document.getElementById('placeTemplate').value
        const faction = document.getElementById('placeFaction').value
        if (!templateId) { addLog('❌ 请先选择棋子类型', 'err'); return }
        const tile = G.map.tiles.find(t => t.x === x && t.y === y)
        if (!tile || !tile.props.walkable) { addLog('❌ 不可放置此处', 'err'); return }
        if (pieceAt) { addLog('❌ 该位置已有棋子', 'err'); return }
        sendPatch({ type: 'addPiece', faction, templateId, x, y }).then(ok => {
          if (ok) addLog('➕ 放置 ' + (PIECES_BY_ID[templateId]?.name || templateId), 'info')
        })
        return
      }

      // Pending move
      if (pendingMove && selectedPieceId) {
        const tile = G.map.tiles.find(t => t.x === x && t.y === y)
        if (!tile || !tile.props.walkable) return
        if (pieceAt && pieceAt.instanceId !== selectedPieceId) return
        pendingMove = false
        sendAction({ type: 'move', playerId: localPlayerId, pieceId: selectedPieceId, toX: x, toY: y })
        return
      }

      // Turn phase target select (beginTurnTargetSelect / endTurnTargetSelect)
      if (pendingSkill && pendingSkill.turnTargetActionType) {
        const action = { type: pendingSkill.turnTargetActionType, playerId: pendingSkill.turnTargetPlayerId || localPlayerId, targetX: x, targetY: y }
        if (pieceAt) action.targetPieceId = pieceAt.instanceId
        pendingSkill = null
        sendAction(action)
        return
      }

      // Pending skill target
      if (pendingSkill && selectedPieceId) {
        let action
        if (pendingSkill.baseAction) {
          // 第 N 次目标选择：在已有 baseAction 基础上追加到 extraTargets[]
          const newExtra = { x, y }
          if (pieceAt) newExtra.pieceId = pieceAt.instanceId
          const newExtraTargets = (pendingSkill.extraTargets || []).concat([newExtra])
          action = Object.assign({}, pendingSkill.baseAction, { extraTargets: newExtraTargets })
          // 更新 pendingSkill 状态（异步 sendAction 返回前不清除，让 catch 能复用）
          pendingSkill = Object.assign({}, pendingSkill, { extraTargets: newExtraTargets })
        } else {
          // 第 1 次目标选择：构建基础 action
          action = {
            type: pendingSkill.skillType === 'super' ? 'useChargeSkill' : 'useBasicSkill',
            playerId: localPlayerId,
            pieceId: selectedPieceId,
            skillId: pendingSkill.skillId,
            targetX: x, targetY: y,
            extraTargets: []
          }
          if (pieceAt) action.targetPieceId = pieceAt.instanceId
          // 存入 baseAction，以便后续调用 selectTarget 时能追加额外目标
          pendingSkill = Object.assign({}, pendingSkill, { baseAction: action, extraTargets: [] })
        }
        sendAction(action)
        return
      }

      // Select piece
      if (pieceAt) {
        selectPiece(pieceAt.instanceId)
      } else {
        selectedPieceId = null; pendingMove = false; pendingSkill = null
        renderBoard(); renderActionPanel()
      }
    }

    function selectPiece(id) {
      selectedPieceId = id
      pendingMove = false; pendingSkill = null
      const p = G.pieces.find(p => p.instanceId === id)
      if (p) addLog('选中：' + p.name + (p.faction === 'red' ? ' 🔴' : ' 🔵'), 'info')
      renderBoard(); renderActionPanel(); renderPieceList()
    }

    // ── Render ──
    function renderAll() {
      renderBoard()
      renderActionPanel()
      renderPieceList()
      renderTurnInfo()
      renderHand()
      updatePlaceBtn()
    }

    function renderBoard() {
      if (!G) return
      const grid = document.getElementById('gameGrid')
      const map = G.map
      recalcCellSize()
      grid.style.gridTemplateColumns = `repeat(${map.width}, var(--cell-size, 44px))`

      document.getElementById('mapNameLabel').textContent = map.name || '训练场'
      document.getElementById('mapSizeLabel').textContent = map.width + ' × ' + map.height

      const cellMap = {}
      G.pieces.filter(p => p.currentHp > 0).forEach(p => { cellMap[p.x + ',' + p.y] = p })

      // Compute highlighted cells
      const hlMove = new Set(), hlSkill = new Set(), hlPlace = new Set()
      if (selectedPieceId) {
        const sp = G.pieces.find(p => p.instanceId === selectedPieceId)
        if (sp && pendingMove) {
          // same row/col within moveRange, not blocked
          const range = sp.moveRange || 3
          for (let x = 0; x < map.width; x++) {
            if (x === sp.x) continue
            if (Math.abs(x - sp.x) > range) continue
            const t = map.tiles.find(t => t.x === x && t.y === sp.y)
            if (t && t.props.walkable && !cellMap[x + ',' + sp.y]) hlMove.add(x + ',' + sp.y)
          }
          for (let y = 0; y < map.height; y++) {
            if (y === sp.y) continue
            if (Math.abs(y - sp.y) > range) continue
            const t = map.tiles.find(t => t.x === sp.x && t.y === y)
            if (t && t.props.walkable && !cellMap[sp.x + ',' + y]) hlMove.add(sp.x + ',' + y)
          }
        }
        if (sp && pendingSkill) {
          const range = (pendingSkill.range || 5)
          map.tiles.forEach(t => {
            if (Math.abs(t.x - sp.x) + Math.abs(t.y - sp.y) <= range) hlSkill.add(t.x + ',' + t.y)
          })
        }
      }
      if (placingMode) {
        map.tiles.forEach(t => {
          if (t.props.walkable && !cellMap[t.x + ',' + t.y]) hlPlace.add(t.x + ',' + t.y)
        })
      }

      // Build tileEffects map
      const tileEffectsMap = {}
      const effects = (G.extensions && G.extensions.tileEffects) ? G.extensions.tileEffects : []
      for (const ef of effects) {
        const k = ef.x + ',' + ef.y
        if (!tileEffectsMap[k]) tileEffectsMap[k] = []
        tileEffectsMap[k].push(ef)
      }

      const cells = []
      for (let y = 0; y < map.height; y++) {
        for (let x = 0; x < map.width; x++) {
          const tile = map.tiles.find(t => t.x === x && t.y === y)
          const ttype = tile ? (tile.props.type || 'floor') : 'floor'
          const tclass = TILE_TYPE_CLASS[ttype] || 't-floor'
          const key = x + ',' + y
          const piece = cellMap[key]
          const isSel = piece && piece.instanceId === selectedPieceId

          let cls = 'cell ' + tclass
          if (isSel) cls += ' hl-selected'
          else if (hlMove.has(key)) cls += ' hl-move'
          else if (hlSkill.has(key)) cls += ' hl-skill'
          else if (hlPlace.has(key)) cls += ' hl-place'

          // Tile effect overlay(s)
          let tileEffectHtml = ''
          if (tileEffectsMap[key]) {
            for (const ef of tileEffectsMap[key]) {
              const bg = ef.bgColor || 'rgba(255,100,0,0.4)'
              const shadow = ef.boxShadow ? `box-shadow:${ef.boxShadow};` : ''
              const iconPos = ef.iconPosition === 'center' ? 'align-items:center;justify-content:center;' : 'align-items:flex-end;justify-content:flex-end;padding:1px;'
              tileEffectHtml += `<div style="position:absolute;inset:0;background:${bg};${shadow}border-radius:3px;display:flex;${iconPos}pointer-events:none;z-index:1">${ef.icon ? `<span style="font-size:10px;line-height:1">${ef.icon}</span>` : ''}</div>`
            }
          }

          let inner = ''
          if (piece) {
            const pct = piece.maxHp > 0 ? Math.round(piece.currentHp / piece.maxHp * 100) : 0
            const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
            const tmpl = PIECES_BY_ID[piece.templateId]
            const imgHtml = (tmpl && tmpl.image)
              ? `<img src="images/${tmpl.image}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
              + `<span class="piece-tok-ph" style="display:none">${piece.faction === 'red' ? '🔴' : '🔵'}</span>`
              : `<span class="piece-tok-ph">${piece.faction === 'red' ? '🔴' : '🔵'}</span>`
            const tokCls = 'piece-tok ' + piece.faction + (isSel ? ' selected-tok' : '')
            inner = `<div class="${tokCls}" style="position:relative;z-index:2">${imgHtml}<div class="tok-hp-bar"><div class="tok-hp-fill ${fillCls}" style="width:${pct}%"></div></div></div>`
          }
          cells.push(`<div class="${cls}" onclick="onCellClick(${x},${y})">${tileEffectHtml}${inner}</div>`)
        }
      }
      grid.innerHTML = cells.join('')
    }

    function renderTurnInfo() {
      if (!G) return
      const curTurnPlayer = G.turn && G.turn.currentPlayerId
      if (curTurnPlayer && curTurnPlayer !== _lastAnnouncedTurnPlayer) {
        _lastAnnouncedTurnPlayer = curTurnPlayer
        const isRed = curTurnPlayer === 'training-red'
        showTurnAnnounce(isRed ? '🔴 红方回合' : '🔵 蓝方回合', isRed ? '#f87171' : '#60a5fa')
      }
      const phase = G.turn.phase
      document.getElementById('phaseLabel').textContent = PHASE_LABELS[phase] || phase
      document.getElementById('turnNum').textContent = '回合 ' + G.turn.turnNumber
      ;['start', 'action', 'end'].forEach(p => {
        document.getElementById('seg-' + p).className = 'phase-seg' + (p === phase ? ' active-' + p : '')
      })

      const cardsEl = document.getElementById('playerResCards')
      cardsEl.innerHTML = G.players.map(player => {
        const isRed = player.playerId === 'training-red'
        const isCurrent = player.playerId === G.turn.currentPlayerId
        const tags = (player.statusTags || []).filter(t => t.visible !== false)
        const tagsHtml = tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px">${
          tags.map(t => `<span style="font-size:9px;background:#1c1c1e;border:1px solid #3f3f46;border-radius:4px;padding:1px 5px;color:#a1a1aa"
            title="${t.id||''}">${t.name||t.id||t.type}${t.stacks>1?' ×'+t.stacks:''}</span>`).join('')
        }</div>` : ''
        return `<div class="player-res-card ${isRed ? 'red' : 'blue'}">
          <div class="prc-top">
            <span class="prc-name ${isRed ? 'red' : 'blue'}">${isRed ? '🔴 红方' : '🔵 蓝方'}</span>
            ${isCurrent ? '<span class="prc-turn-badge">当前回合</span>' : ''}
          </div>
          <div class="prc-stats">
            <span>👟 AP: ${player.actionPoints}/${player.maxActionPoints}</span>
            <span>⚡ CP: ${player.chargePoints}</span>
            ${player.hand && player.hand.length ? `<span>🃏 ${player.hand.length}</span>` : ''}
          </div>
          ${tagsHtml}
        </div>`
      }).join('')

      // Update toggle buttons
      document.getElementById('btnRed').className = 'toggle-btn' + (localPlayerId === 'training-red' ? ' active-red' : '')
      document.getElementById('btnBlue').className = 'toggle-btn' + (localPlayerId === 'training-blue' ? ' active-blue' : '')
    }

    function renderActionPanel() {
      if (!G) return
      const phase = G.turn.phase
      const isMyTurn = G.turn.currentPlayerId === localPlayerId
      const sp = selectedPieceId ? G.pieces.find(p => p.instanceId === selectedPieceId) : null

      const btnBegin = document.getElementById('btnBeginPhase')
      const btnMove  = document.getElementById('btnMove')
      const btnEnd   = document.getElementById('btnEndTurn')
      const hintEl   = document.getElementById('phaseHint')
      const skillSec = document.getElementById('skillSection')

      btnBegin.style.display = (isMyTurn && phase !== 'action') ? 'flex' : 'none'
      btnMove.style.display  = (isMyTurn && phase === 'action') ? 'flex' : 'none'
      btnEnd.style.display   = (isMyTurn && phase === 'action') ? 'flex' : 'none'
      btnEnd.disabled = !isMyTurn || phase !== 'action'

      // Move button state
      btnMove.className = 'btn-action' + (pendingMove ? ' success' : '')
      btnMove.textContent = pendingMove ? '👣 点击格子移动…' : '👣 移动'

      // Hint text
      if (placingMode) hintEl.textContent = '点击棋盘空格放置棋子'
      else if (pendingMove) hintEl.textContent = '点击高亮格子移动'
      else if (pendingSkill) hintEl.textContent = '点击目标使用技能'
      else if (sp) hintEl.textContent = '已选中：' + sp.name
      else if (!isMyTurn) hintEl.textContent = '非当前操控方回合'
      else hintEl.textContent = ''

      // Skills
      if (sp && phase === 'action' && isMyTurn) {
        skillSec.style.display = 'block'
        const skillDefs = skillsById || {}
        const passives = [], actives = []
        sp.skills.forEach(s => {
          const def = skillDefs[s.skillId] || {}
          if (def.kind === 'passive') passives.push({ s, def })
          else actives.push({ s, def })
        })
        let html = ''
        if (passives.length) {
          html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">' +
            passives.map(({ s, def }) =>
              `<span class="skill-item passive">${def.icon || ''}${def.name || s.skillId} <span style="color:#71717a">被动</span></span>`
            ).join('') + '</div>'
        }
        html += actives.map(({ s, def }) => {
          const cd = s.currentCooldown || 0
          const uses = s.usesRemaining
          const disabled = (cd > 0 || uses === 0) ? 'disabled' : ''
          const type = def.type || 'normal'
          const isActive = pendingSkill && pendingSkill.skillId === s.skillId
          const cdText = cd > 0 ? ` [冷却${cd}]` : uses === 0 ? ' [已用]' : ''
          const cost = def.type === 'super' ? `充能${def.chargeCost || 0}点` : '普通'
          const ap = def.actionPointCost ? ` ${def.actionPointCost}AP` : ''
          const cls = `skill-item ${type}` + (isActive ? ' active-skill' : '')
          return `<button class="${cls}" ${disabled} onclick="useSkill('${s.skillId}','${type}')">
            ${def.icon ? def.icon + ' ' : ''}${def.name || s.skillId} (${cost}${ap})${cdText}
          </button>`
        }).join('')
        document.getElementById('skillList').innerHTML = html
      } else {
        skillSec.style.display = 'none'
      }
    }

    function renderPieceList() {
      renderTeam('red', 'redPieces')
      renderTeam('blue', 'bluePieces')
    }

    function renderTeam(faction, elId) {
      const el = document.getElementById(elId)
      const pieces = G ? G.pieces.filter(p => p.faction === faction) : []
      if (!pieces.length) { el.innerHTML = '<div style="font-size:11px;color:#52525b;padding:4px">无棋子</div>'; return }
      el.innerHTML = pieces.map(p => {
        const dead = p.currentHp <= 0
        const sel = p.instanceId === selectedPieceId
        const maxHp = p.stats?.maxHp || p.maxHp || 1
        const pct = maxHp > 0 ? Math.round(p.currentHp / maxHp * 100) : 0
        const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''
        const tmpl = PIECES_BY_ID[p.templateId]
        const avatarHtml = (tmpl && tmpl.image)
          ? `<img class="piece-avatar" src="images/${tmpl.image}" onerror="this.outerHTML='<div class=\\'piece-avatar-ph\\'>${faction==='red'?'🔴':'🔵'}</div>'">`
          : `<div class="piece-avatar-ph">${faction === 'red' ? '🔴' : '🔵'}</div>`
        let cls = 'piece-entry'
        if (sel) cls += ' selected'
        if (dead) cls += ' dead'
        const atk = p.stats?.attack ?? p.attack ?? '?'
        const def = p.stats?.defense ?? p.defense ?? '?'
        const spd = p.stats?.moveRange ?? p.moveRange ?? '?'
        const tags = (p.statusTags || []).filter(t => t.visible !== false)
        const tagsHtml = tags.length ? `<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px">${
          tags.map(t => `<span style="font-size:9px;background:#1c1c1e;border:1px solid #3f3f46;border-radius:3px;padding:0 4px;color:#a1a1aa">${t.name||t.id||t.type}${t.stacks>1?' ×'+t.stacks:''}</span>`).join('')
        }</div>` : ''
        const iid = p.instanceId.replace(/'/g, "\\'")
        return `<div class="${cls}"
          onclick="${dead ? '' : "selectPiece('"+iid+"')"}"
          oncontextmenu="event.preventDefault();showPieceDetail('${iid}')"
          ontouchstart="startPiecePress(event,'${iid}')"
          ontouchend="clearPiecePress()"
          ontouchmove="clearPiecePress()">
          ${avatarHtml}
          <div class="piece-info">
            <div class="piece-info-name">${p.name || p.templateId}</div>
            <div style="font-size:10px;color:#71717a;margin-top:1px">
              ❤${p.currentHp}/${maxHp} ⚔${atk} 🛡${def} 👟${spd}
            </div>
            <div class="piece-hp-bar"><div class="piece-hp-fill ${fillCls}" style="width:${pct}%"></div></div>
            ${tagsHtml}
          </div>
          <button class="piece-remove" onclick="event.stopPropagation();removePiece('${iid}')">✕</button>
        </div>`
      }).join('')
    }

    async function removePiece(instanceId) {
      const p = G && G.pieces.find(p => p.instanceId === instanceId)
      if (await sendPatch({ type: 'removePiece', instanceId })) {
        if (selectedPieceId === instanceId) selectedPieceId = null
        addLog('🗑 移除 ' + (p ? p.name : instanceId), 'info')
      }
    }

    // ── Place piece ──
    function togglePlaceMode() {
      const templateId = document.getElementById('placeTemplate').value
      if (!templateId && !placingMode) { addLog('❌ 请先选择棋子类型', 'err'); return }
      placingMode = !placingMode
      pendingMove = false; pendingSkill = null
      updatePlaceBtn()
      renderBoard(); renderActionPanel()
    }

    function updatePlaceBtn() {
      const btn = document.getElementById('btnPlace')
      btn.className = 'btn-action ' + (placingMode ? 'warn' : '')
      btn.textContent = placingMode ? '✅ 放置中… 点击取消' : '＋ 点击格子放置'
    }

    // ── Log ──
    function addLog(msg, type) {
      actionLog.push({ msg, type: type || '' })
      if (actionLog.length > 120) actionLog.shift()
      renderLog()
    }
    function renderLog() {
      const body = document.getElementById('logBody')
      body.innerHTML = actionLog.map(e => `<div class="log-entry ${e.type}">${e.msg}</div>`).join('')
      body.scrollTop = body.scrollHeight
    }
    function clearLog() { actionLog = []; renderLog() }

    // ── Hand panel ──
    function toggleHandPanel() {
      const body = document.getElementById('handBody')
      const arrow = document.getElementById('handArrow')
      body.classList.toggle('collapsed')
      arrow.classList.toggle('open')
    }

    function renderHand() {
      if (!G) return
      const myMeta = G.players && G.players.find(p => p.playerId === localPlayerId)
      const hand = (myMeta && myMeta.hand) || []
      const isMyTurn = G.turn && G.turn.currentPlayerId === localPlayerId
      const phase = G.turn ? G.turn.phase : ''
      const ap = myMeta ? myMeta.actionPoints : 0

      document.getElementById('handCount').textContent = hand.length
      document.getElementById('handTargetHint').style.display = pendingCardAction ? 'inline' : 'none'

      const container = document.getElementById('handCards')
      if (!hand.length) {
        container.innerHTML = '<div class="hand-empty">暂无手牌</div>'
        return
      }

      container.innerHTML = hand.map(card => {
        const def = cardsById[card.cardId] || {}
        const cost = def.actionPointCost || 0
        const canPlay = isMyTurn && phase === 'action' && ap >= cost && (def.type === 'active' || def.type === 'reactive' || !def.type)
        const isPending = pendingCardAction && pendingCardAction.cardInstanceId === card.instanceId
        let cls = 'card-item'
        if (isPending) cls += ' card-pending'
        else if (!canPlay) cls += ' card-disabled'
        if (def.type === 'reactive') cls += ' card-reactive'

        const gemCls = cost === 0 ? 'free' : ''
        const icon = def.icon || '🃏'
        const typeLabel = def.type === 'reactive' ? '⚡被动触发' : def.type === 'passive' ? '🔁持续' : '▶主动'
        const cid = card.instanceId.replace(/'/g, "\\'")
        const cdid = (card.cardId || '').replace(/'/g, "\\'")
        return `<div class="${cls}" onclick="onCardClick('${cid}','${cdid}')">
          <div class="card-mana-gem ${gemCls}">${cost}</div>
          <div class="card-art">${icon}</div>
          <div class="card-name-banner">${escHtml(def.name || card.cardId)}</div>
          <div class="card-body">
            <div class="card-desc">${escHtml(def.description || '')}</div>
            <div class="card-type-badge">${typeLabel}</div>
          </div>
        </div>`
      }).join('')
    }

    function onCardClick(cardInstanceId, cardId) {
      if (!G) return
      const isMyTurn = G.turn && G.turn.currentPlayerId === localPlayerId
      const phase = G.turn ? G.turn.phase : ''
      if (!isMyTurn || phase !== 'action') return

      const myMeta = G.players && G.players.find(p => p.playerId === localPlayerId)
      const def = cardsById[cardId] || {}
      const cost = def.actionPointCost || 0
      const ap = myMeta ? myMeta.actionPoints : 0
      if (ap < cost) { addLog('❌ 行动点不足（需要 ' + cost + '，剩余 ' + ap + '）', 'err'); return }

      if (pendingCardAction && pendingCardAction.cardInstanceId === cardInstanceId) {
        pendingCardAction = null
        renderHand()
        return
      }

      pendingMove = false
      pendingSkill = null
      pendingCardAction = { type: 'playCard', playerId: localPlayerId, cardInstanceId }
      addLog('🃏 选择目标施放：' + (def.name || cardId), 'info')
      renderHand()
      renderBoard()
      renderActionPanel()
    }

    // ── Game over ──
    function checkGameOver() {
      if (!G) return
      const ra = G.pieces.filter(p => p.faction === 'red' && p.currentHp > 0).length
      const ba = G.pieces.filter(p => p.faction === 'blue' && p.currentHp > 0).length
      if (ra === 0 || ba === 0) {
        const winner = ra > 0 ? 'red' : 'blue'
        document.getElementById('resultIcon').textContent = winner === 'red' ? '🔴' : '🔵'
        document.getElementById('resultTitle').textContent = (winner === 'red' ? '红方' : '蓝方') + ' 胜利！'
        document.getElementById('resultSub').textContent = '第 ' + G.turn.turnNumber + ' 回合结束'
        showScreen('result')
      }
    }

    // ── Resource dialog ──
    function showResDialog() {
      if (!G) return
      const p = G.players.find(p => p.playerId === localPlayerId)
      document.getElementById('resPlayer').value = localPlayerId
      document.getElementById('resAP').value = p ? p.actionPoints : 10
      document.getElementById('resCP').value = p ? p.chargePoints : 0
      document.getElementById('resDlg').classList.add('show')
    }
    function closeResDlg() { document.getElementById('resDlg').classList.remove('show') }
    async function applyRes() {
      const playerId = document.getElementById('resPlayer').value
      const ap = +document.getElementById('resAP').value || 0
      const cp = +document.getElementById('resCP').value || 0
      closeResDlg()
      if (await sendPatch({ type: 'updateResources', playerId, actionPoints: ap, chargePoints: cp }))
        addLog('⚙ 资源已更新 AP=' + ap + ' CP=' + cp, 'info')
    }

    // ── Map dialog ──
    function showMapDialog() {
      document.getElementById('mapDlgSelect').value = currentMapId
      document.getElementById('mapDlg').classList.add('show')
    }
    function closeMapDlg() { document.getElementById('mapDlg').classList.remove('show') }
    function applyMapChange() {
      const mapId = document.getElementById('mapDlgSelect').value
      closeMapDlg()
      initTraining(mapId || undefined)
    }

    // ── Screen ──
    function showScreen(name) {
      document.getElementById('setupScreen').style.display = name === 'setup' ? 'block' : 'none'
      document.getElementById('battleScreen').style.display = name === 'battle' ? 'block' : 'none'
      document.getElementById('resultScreen').style.display = name === 'result' ? 'flex' : 'none'
      document.getElementById('battleTopBtns').style.display = name === 'battle' ? 'flex' : 'none'
    }
    function goSetup() { G = null; showScreen('setup') }
    function showLoading(on) { document.getElementById('loadingOverlay').className = on ? 'show' : '' }
    function showSetupErr(msg) { const e = document.getElementById('setupErr'); e.textContent = msg; e.style.display = 'block' }
    function hideSetupErr() { document.getElementById('setupErr').style.display = 'none' }

    // ── Helpers ──
    function playerLabel(id) { return id === 'training-red' ? '🔴 红方' : '🔵 蓝方' }
    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

    // ── Piece detail modal ──
    let pressTimer = null

    function startPiecePress(e, instanceId) {
      pressTimer = setTimeout(() => { pressTimer = null; showPieceDetail(instanceId) }, 600)
    }
    function clearPiecePress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null }
    }

    function showPieceDetail(instanceId) {
      if (!G) return
      const p = G.pieces.find(p => p.instanceId === instanceId)
      if (!p) return
      const tmpl = PIECES_BY_ID[p.templateId] || {}
      const maxHp = p.stats?.maxHp || p.maxHp || 0
      const atk   = p.stats?.attack   ?? p.attack   ?? '?'
      const def   = p.stats?.defense  ?? p.defense  ?? '?'
      const spd   = p.stats?.moveRange ?? p.moveRange ?? '?'

      const avatarHtml = tmpl.image
        ? `<img class="pd-avatar" src="images/${escHtml(tmpl.image)}" onerror="this.style.display='none'">`
        : `<div class="pd-avatar-ph">${p.faction==='red'?'🔴':'🔵'}</div>`

      const pct = maxHp > 0 ? Math.round(p.currentHp / maxHp * 100) : 0
      const fillCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : ''

      const tags = (p.statusTags || []).filter(t => t.visible !== false)
      const tagsHtml = tags.length
        ? `<div class="pd-section-label">状态效果</div>
           <div class="pd-tag-row">${tags.map(t =>
             `<span class="pd-tag">${escHtml(t.name||t.id||t.type)}${t.stacks>1?' ×'+t.stacks:''}${t.duration?' (${t.duration}回合)':''}</span>`
           ).join('')}</div>`
        : ''

      const skillsHtml = (p.skills || []).map(s => {
        const def2 = skillsById[s.skillId] || {}
        const type = def2.type || 'normal'
        const cd = s.currentCooldown || 0
        const uses = s.usesRemaining
        const cdText = cd > 0 ? `冷却中 ${cd}` : uses === 0 ? '已用尽' : ''
        const cost = type === 'super'
          ? `充能 ${def2.chargeCost||0}CP`
          : type === 'buff' ? '强化' : '普通'
        const ap = def2.actionPointCost ? ` · ${def2.actionPointCost}AP` : ''
        const rangeTxt = def2.range != null ? `射程 ${def2.range}` : ''
        const dmgTxt   = def2.damage != null ? `伤害 ${def2.damage}` : ''
        const cdTxt    = def2.cooldown ? `CD ${def2.cooldown}` : ''
        const meta = [cost+ap, rangeTxt, dmgTxt, cdTxt, cdText].filter(Boolean)
        return `<div class="pd-skill-item">
          <div class="pd-skill-name">${def2.icon||''} ${escHtml(def2.name||s.skillId)}</div>
          ${def2.description ? `<div class="pd-skill-desc">${escHtml(def2.description)}</div>` : ''}
          <div class="pd-skill-meta">${meta.map(m=>`<span class="pd-skill-tag ${type}">${escHtml(m)}</span>`).join('')}</div>
        </div>`
      }).join('')

      document.getElementById('pdContent').innerHTML = `
        <div class="pd-header">
          ${avatarHtml}
          <div>
            <div class="pd-name">${escHtml(p.name||p.templateId)}</div>
            <div class="pd-faction">${p.faction==='red'?'🔴 红方':'🔵 蓝方'}</div>
          </div>
          <button class="pd-close" onclick="closePieceDetail()">✕ 关闭</button>
        </div>
        <div class="pd-stats-row">
          <div class="pd-stat"><div class="pd-stat-val" style="color:#22c55e">${p.currentHp}/${maxHp}</div><div class="pd-stat-lbl">生命</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#ef4444">${atk}</div><div class="pd-stat-lbl">攻击</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#3b82f6">${def}</div><div class="pd-stat-lbl">防御</div></div>
          <div class="pd-stat"><div class="pd-stat-val" style="color:#eab308">${spd}</div><div class="pd-stat-lbl">速度</div></div>
        </div>
        <div class="piece-hp-bar" style="margin-bottom:12px">
          <div class="piece-hp-fill ${fillCls}" style="width:${pct}%"></div>
        </div>
        ${tagsHtml}
        <div class="pd-section-label">技能列表</div>
        ${skillsHtml || '<div style="font-size:11px;color:#52525b">无技能</div>'}
      `
      document.getElementById('pdOverlay').classList.add('show')
    }

    function closePieceDetail() {
      document.getElementById('pdOverlay').classList.remove('show')
    }

    // ── Dynamic cell sizing ───────────────────────────────────────────────────
    function recalcCellSize() {
      if (!G || !G.map) return
      const cols = G.map.width
      const rows = G.map.height
      const wrap = document.getElementById('boardWrap')
      if (!wrap) return
      const availW = wrap.clientWidth - 8
      const topbarH = document.querySelector('.topbar')?.offsetHeight || 44
      const logH    = document.querySelector('.log-panel')?.offsetHeight || 0
      const availH  = window.innerHeight - topbarH - logH - 80
      const byW = Math.floor(availW / cols)
      const byH = Math.floor(availH / rows)
      const sz = Math.max(28, Math.min(72, byW, byH))
      document.documentElement.style.setProperty('--cell-size', sz + 'px')
      const grid = document.getElementById('gameGrid')
      if (grid) grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size, 44px))`
    }
    window.addEventListener('resize', recalcCellSize)

    // ── Boot ──
    window.addEventListener('load', () => {
      loadAvailableData()
      showScreen('setup')
    })
  </script>
</body>
</html>
