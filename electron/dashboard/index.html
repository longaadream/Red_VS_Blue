<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>RED vs BLUE Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      user-select: none;
      width: 520px;
    }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #f8fafc; }
    .subtitle { font-size: 11px; color: #64748b; margin-top: 2px; }

    .status-bar {
      display: flex; align-items: center; gap: 10px;
      margin: 16px 0 14px;
      padding: 10px 14px;
      background: #1e293b;
      border-radius: 8px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #475569;
      transition: background 0.3s;
    }
    .dot.running { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .status-text { font-size: 13px; font-weight: 600; }
    .port-badge {
      margin-left: auto;
      background: #334155;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      color: #94a3b8;
    }

    label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    input[type="text"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #3b82f6; }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-ghost   { background: #334155; color: #e2e8f0; }
    .btn-small { padding: 4px 8px; font-size: 11px; }

    .actions { display: flex; gap: 8px; margin-bottom: 16px; }

    .section-title {
      font-size: 11px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .rooms-container {
      background: #1e293b;
      border-radius: 8px;
      min-height: 100px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
    }
    .room-empty { color: #475569; font-size: 12px; font-style: italic; text-align: center; padding: 20px 0; }
    .room-item {
      background: #0f172a;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .room-item:last-child { margin-bottom: 0; }
    .room-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
    }
    .room-name { font-size: 13px; font-weight: 600; color: #f8fafc; }
    .room-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .room-status.waiting { background: #22c55e33; color: #22c55e; }
    .room-status.in-progress { background: #f59e0b33; color: #f59e0b; }
    .room-status.ended { background: #64748b33; color: #94a3b8; }
    .room-meta { font-size: 11px; color: #64748b; }
    .room-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }

    .copy-hint { font-size: 10px; color: #22c55e; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <h1>🔴 RED vs BLUE Server</h1>
  <p class="subtitle">游戏服务器管理面板</p>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span class="status-text" id="statusText">检查中…</span>
    <span class="port-badge">PORT 3000</span>
  </div>

  <label>内网穿透公网地址（粘贴后复制给朋友）</label>
  <div class="input-row">
    <input type="text" id="tunnelUrl" placeholder="https://xxx.ngrok.io" />
    <button class="btn btn-ghost" onclick="copyUrl()">复制</button>
  </div>
  <div class="copy-hint" id="copyHint">✓ 已复制到剪贴板</div>

  <div class="section-title">资源包管理</div>
  <div class="input-row" style="flex-direction:column;gap:8px">
    <input type="file" id="packFile" accept=".zip" style="background:#1e293b;border:1px dashed #334155;border-radius:6px;padding:10px;color:#94a3b8" />
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="uploadPack()" style="flex:1">上传并更新资源包</button>
      <button class="btn btn-ghost" onclick="checkPackStatus()">刷新状态</button>
    </div>
    <div id="packStatus" style="font-size:12px;color:#64748b;background:#0f172a;border-radius:6px;padding:8px 10px"></div>
    <div id="packProgress" style="display:none">
      <div style="background:#334155;border-radius:4px;height:6px;overflow:hidden;margin-top:6px">
        <div id="progressBar" style="background:#3b82f6;height:100%;width:0%;transition:width 0.3s"></div>
      </div>
      <p id="progressText" style="font-size:11px;color:#94a3b8;margin-top:4px"></p>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-warning" id="btnRestart" onclick="restart()">重启服务器</button>
    <button class="btn btn-danger"  id="btnStop"    onclick="stop()">停止</button>
    <button class="btn btn-primary" id="btnStart"   onclick="start()" style="display:none">启动服务器</button>
    <button class="btn btn-ghost" id="btnRefresh" onclick="refreshRooms()">刷新房间</button>
  </div>

  <div class="section-title">房间列表</div>
  <div class="rooms-container" id="roomsList">
    <span class="room-empty">加载中…</span>
  </div>

  <script>
    const api = window.electronAPI

    function updateUI(running) {
      document.getElementById('dot').classList.toggle('running', running)
      document.getElementById('statusText').textContent = running ? '服务器运行中' : '服务器已停止'
      document.getElementById('btnRestart').style.display = running ? '' : 'none'
      document.getElementById('btnStop').style.display    = running ? '' : 'none'
      document.getElementById('btnStart').style.display   = running ? 'none' : ''
    }

    async function refreshRooms() {
      const data = await api.getRooms()
      const list = document.getElementById('roomsList')
      const rooms = data.rooms ?? []

      if (rooms.length === 0) {
        list.innerHTML = '<span class="room-empty">暂无房间</span>'
        return
      }

      list.innerHTML = rooms.map(r => {
        const statusClass = r.status === 'in-progress' ? 'in-progress' : r.status === 'waiting' ? 'waiting' : 'ended'
        const statusText = r.status === 'in-progress' ? '进行中' : r.status === 'waiting' ? '等待中' : '已结束'
        return `<div class="room-item">
          <div class="room-header">
            <span class="room-name">${escHtml(r.name || r.id)}</span>
            <span class="room-status ${statusClass}">${statusText}</span>
          </div>
          <div class="room-meta">玩家 ${r.playersCount ?? 0}/${r.maxPlayers ?? 2} · 地图: ${r.mapId || '默认'} · ID: ${r.id}</div>
          <div class="room-actions">
            <button class="btn btn-danger btn-small" onclick="deleteRoom('${escHtml(r.id)}')">删除</button>
          </div>
        </div>`
      }).join('')
    }

    async function deleteRoom(roomId) {
      if (!confirm(`确定删除房间 "${roomId}" 吗？`)) return
      const result = await api.deleteRoom(roomId)
      if (result.success) {
        refreshRooms()
      } else {
        alert('删除失败: ' + (result.error || '未知错误'))
      }
    }

    function escHtml(str) {
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    function copyUrl() {
      const url = document.getElementById('tunnelUrl').value.trim()
      if (!url) return
      navigator.clipboard.writeText(url)
      const hint = document.getElementById('copyHint')
      hint.style.display = 'block'
      setTimeout(() => { hint.style.display = 'none' }, 2000)
    }

    function restart() { api.restartServer() }
    function stop()    { api.stopServer() }
    function start()   { api.startServer() }

    async function checkPackStatus() {
      const statusEl = document.getElementById('packStatus')
      statusEl.textContent = '加载中...'
      try {
        const data = await api.getResourcePackStatus()
        if (data.loaded) {
          statusEl.innerHTML = `✅ 已加载 | 版本: ${data.meta?.version || '未知'} | MD5: ${(data.meta?.md5 || '-').slice(0, 16)}...`
          statusEl.style.color = '#22c55e'
        } else if (data.error) {
          statusEl.textContent = '⚠️ ' + data.error
          statusEl.style.color = '#fbbf24'
        } else {
          statusEl.textContent = '⚠️ 未加载（使用内置数据）'
          statusEl.style.color = '#fbbf24'
        }
      } catch (e) {
        statusEl.textContent = '❌ 无法获取状态'
        statusEl.style.color = '#ef4444'
      }
    }

    async function uploadPack() {
      const fileInput = document.getElementById('packFile')
      const file = fileInput.files[0]
      if (!file) {
        alert('请先选择 ZIP 文件')
        return
      }
      const progressEl = document.getElementById('packProgress')
      const barEl = document.getElementById('progressBar')
      const textEl = document.getElementById('progressText')
      const statusEl = document.getElementById('packStatus')

      progressEl.style.display = 'block'
      barEl.style.width = '0%'
      textEl.textContent = '上传中...'
      statusEl.textContent = ''

      try {
        const file = fileInput.files[0]
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result.split(',')[1])
          reader.onerror = reject
          reader.readAsDataURL(file)
        })
        statusEl.textContent = '正在上传...'
        const result = await api.uploadResourcePackData(base64, file.name)

        if (result.success) {
          barEl.style.width = '100%'
          textEl.textContent = '上传完成！正在重启服务器...'
          statusEl.textContent = '✅ 资源包上传成功，服务器即将重启'
          statusEl.style.color = '#22c55e'
          setTimeout(() => {
            restart()
            setTimeout(checkPackStatus, 3000)
          }, 2000)
        } else {
          statusEl.textContent = '❌ 上传失败: ' + (result.message || '未知错误')
          statusEl.style.color = '#ef4444'
          progressEl.style.display = 'none'
        }
      } catch (e) {
        statusEl.textContent = '❌ 上传失败: ' + e.message
        statusEl.style.color = '#ef4444'
        progressEl.style.display = 'none'
      }
    }

    api.onServerStatus(({ running }) => {
      updateUI(running)
      if (running) refreshRooms()
    })

    updateUI(false)
    refreshRooms()
    setInterval(refreshRooms, 8000)
  </script>
</body>
</html>
