<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>连接服务器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 32px;
    }
    .card {
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 28px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      margin-bottom: 20px;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 11px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      margin-top: 8px;
    }
    .err { color: #f87171; font-size: 12px; margin-top: 10px; display: none; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto; }
    .hint { font-size: 11px; color: #475569; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔴 RED vs BLUE</h1>
    <p class="sub">首次使用，请输入服务器地址</p>

    <label>服务器地址</label>
    <input type="text" id="urlInput" placeholder="https://xxx.ngrok.io" />

    <button onclick="connect()">连接并开始游戏</button>
    <button class="secondary" onclick="useLocalServer()">使用本机服务器</button>
    <div class="err" id="err">请输入有效的服务器地址（以 http 开头）</div>
    <p class="hint">地址将保存在本地，下次自动连接</p>
  </div>

  <script>
    const api = window.electronAPI

    async function connect() {
      const url = document.getElementById('urlInput').value.trim()
      const errEl = document.getElementById('err')
      if (!url.startsWith('http')) {
        errEl.style.display = 'block'
        return
      }
      errEl.style.display = 'none'
      // 连接服务器并在新窗口中打开游戏
      await api.connectServer(url)
    }

    async function useLocalServer() {
      const errEl = document.getElementById('err')
      errEl.style.display = 'none'
      const result = await api.openLocalGame()
      if (!result || !result.ok) {
        errEl.textContent = '本机服务器启动失败：' + (result?.error || '未知错误')
        errEl.style.display = 'block'
      }
    }

    // 预填已保存的地址（比如用户想修改）
    api.getRemoteUrl().then(url => {
      if (url) document.getElementById('urlInput').value = url
    })

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') connect()
    })
  </script>
</body>
</html>
