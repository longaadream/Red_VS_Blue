<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>数据编辑器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #09090b;
  --surface:  #18181b;
  --border:   #27272a;
  --muted:    #71717a;
  --text:     #e4e4e7;
  --text-dim: #a1a1aa;
  --accent:   #3b82f6;
  --accent-h: #60a5fa;
  --green:    #10b981;
  --red:      #ef4444;
  --yellow:   #f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── header ── */
#header{display:flex;align-items:center;gap:16px;padding:0 16px;height:48px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
#header h1{font-size:15px;font-weight:600;color:var(--text)}
#header span{color:var(--muted);font-size:12px}

/* ── tabs ── */
#tab-bar{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{padding:6px 16px;border-radius:6px 6px 0 0;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;border-bottom:2px solid transparent;transition:color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}

/* ── tab content ── */
#content{flex:1;overflow:hidden;display:flex}
.tab-panel{display:none;width:100%;height:100%}
.tab-panel.active{display:flex}

/* ── two-column layout ── */
.split{display:grid;grid-template-columns:260px 1fr;height:100%;overflow:hidden}

/* ── entity list ── */
.list-col{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.search-wrap{padding:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap input{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.entity-list{flex:1;overflow-y:auto;padding:4px}
.entity-item{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:background .1s}
.entity-item:hover{background:var(--surface)}
.entity-item.selected{background:#1e3a5f}
.entity-item .name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entity-item .id{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

/* ── detail panel ── */
.detail-col{flex:1;overflow-y:auto;padding:20px}
.placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px}

/* ── form ── */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.form-title{font-size:16px;font-weight:600;margin-bottom:4px}
.form-subtitle{font-size:12px;color:var(--muted);margin-bottom:20px;font-family:monospace}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field-group input,.field-group textarea,.field-group select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{border-color:var(--accent)}
.field-group textarea{resize:vertical;min-height:60px;font-family:inherit}
.field-group select{appearance:none;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

/* ── stats section ── */
.section-label{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-item label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.stat-item input{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:500;text-align:right;outline:none}
.stat-item input:focus{border-color:var(--accent)}

/* ── action row ── */
.action-row{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s,background .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-h)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#34d399}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){color:var(--text);border-color:var(--muted)}
.btn-big{padding:12px 24px;font-size:14px;border-radius:8px;flex:1}
.btn-open{background:#7c3aed;color:#fff}
.btn-open:hover:not(:disabled){background:#8b5cf6}

/* ── open-in-editor panel ── */
.file-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px}
.file-panel h2{font-size:16px;font-weight:600;margin-bottom:4px}
.file-panel .file-id{font-family:monospace;font-size:12px;color:var(--muted);margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-bottom:20px}
.info-grid dt{color:var(--muted);font-size:12px;white-space:nowrap}
.info-grid dd{color:var(--text);font-size:13px}
.open-hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.open-actions{display:flex;gap:10px;flex-wrap:wrap}
.code-preview{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:16px;max-height:200px;overflow-y:auto}
.code-preview pre{font-family:monospace;font-size:11px;color:#a1a1aa;white-space:pre-wrap;word-break:break-all}

/* ── content pipeline tab ── */
.build-panel{width:100%;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;max-width:980px;margin:0 auto}
.build-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.build-card h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text-dim)}
.pipeline-intro{color:var(--muted);font-size:12px;line-height:1.55;margin:-8px 0 16px}
.operation-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.operation-tab{padding:9px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.operation-tab:hover:not(:disabled){border-color:var(--muted);color:var(--text)}
.operation-tab.active{border-color:var(--accent);background:#172554;color:#bfdbfe}
.operation-form{display:none}
.operation-form.active{display:block}
.operation-form .field-group:last-of-type{margin-bottom:0}
.field-help{color:var(--muted);font-size:11px;line-height:1.45;margin-top:-9px;margin-bottom:16px}
.inline-check{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:12px;margin:4px 0 16px}
.inline-check input{width:16px;height:16px;accent-color:var(--accent)}
.console{background:#000;border-radius:8px;padding:12px;height:260px;overflow-y:auto;font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.6}
.console-line{color:#71717a;white-space:pre-wrap;word-break:break-all}
.console-line.stderr{color:#f87171}
.console-cursor{animation:blink 1s step-end infinite;color:#a1a1aa}
@keyframes blink{50%{opacity:0}}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500}
.badge-success{background:#052e16;color:#34d399;border:1px solid #065f46}
.badge-error{background:#450a0a;color:#f87171;border:1px solid #7f1d1d}
.badge-pending{background:#422006;color:#fbbf24;border:1px solid #854d0e}
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

@media (max-width:720px){
  .grid2,.grid4{grid-template-columns:1fr}
  .operation-nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .build-panel{padding:12px}
  .build-card{padding:16px}
}

/* ── toast ── */
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:auto}
.toast-item.show{opacity:1;transform:translateY(0)}
.toast-success{background:#052e16;color:#34d399;border:1px solid #065f46}
.toast-error{background:#450a0a;color:#f87171;border:1px solid #7f1d1d}

/* ── scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#52525b}
</style>
</head>
<body>

<div id="header">
  <h1>数据编辑器</h1>
  <span id="data-root-label"></span>
</div>

<div id="tab-bar">
  <button class="tab-btn active" data-tab="pieces">棋子</button>
  <button class="tab-btn" data-tab="skills">技能</button>
  <button class="tab-btn" data-tab="cards">卡牌</button>
  <button class="tab-btn" data-tab="rules">规则</button>
  <button class="tab-btn" data-tab="build">内容流水线</button>
</div>

<div id="content">

  <!-- ══ PIECES ══ -->
  <div class="tab-panel active" id="tab-pieces">
    <div class="split">
      <div class="list-col">
        <div class="search-wrap"><input id="pieces-search" placeholder="搜索棋子…" type="text"/></div>
        <div class="entity-list" id="pieces-list"></div>
      </div>
      <div class="detail-col" id="pieces-detail">
        <div class="placeholder">← 选择一个棋子开始编辑</div>
      </div>
    </div>
  </div>

  <!-- ══ SKILLS ══ -->
  <div class="tab-panel" id="tab-skills">
    <div class="split">
      <div class="list-col">
        <div class="search-wrap"><input id="skills-search" placeholder="搜索技能…" type="text"/></div>
        <div class="entity-list" id="skills-list"></div>
      </div>
      <div class="detail-col" id="skills-detail">
        <div class="placeholder">← 选择一个技能</div>
      </div>
    </div>
  </div>

  <!-- ══ CARDS ══ -->
  <div class="tab-panel" id="tab-cards">
    <div class="split">
      <div class="list-col">
        <div class="search-wrap"><input id="cards-search" placeholder="搜索卡牌…" type="text"/></div>
        <div class="entity-list" id="cards-list"></div>
      </div>
      <div class="detail-col" id="cards-detail">
        <div class="placeholder">← 选择一张卡牌</div>
      </div>
    </div>
  </div>

  <!-- ══ RULES ══ -->
  <div class="tab-panel" id="tab-rules">
    <div class="split">
      <div class="list-col">
        <div class="search-wrap"><input id="rules-search" placeholder="搜索规则…" type="text"/></div>
        <div class="entity-list" id="rules-list"></div>
      </div>
      <div class="detail-col" id="rules-detail">
        <div class="placeholder">← 选择一条规则</div>
      </div>
    </div>
  </div>

  <!-- ══ CONTENT PIPELINE ══ -->
  <div class="tab-panel" id="tab-build">
    <div class="build-panel">
      <div class="build-card">
        <h3>内容发布链</h3>
        <p class="pipeline-intro">所有路径均相对于隔离 authoring workspace。QA、Stable 与 Community 验证需要显式可信发布者 Key ID；Stable 还需人工确认。</p>
        <div class="grid2">
          <div class="field-group">
            <label for="pipeline-task-id">Linear 任务</label>
            <input id="pipeline-task-id" name="taskId" type="text" value="RED-118" autocomplete="off"/>
          </div>
          <div class="field-group">
            <label for="pipeline-workspace">工作区</label>
            <input id="pipeline-workspace" name="workspace" type="text" value="content-authoring" readonly/>
          </div>
        </div>
        <div class="operation-nav" role="tablist" aria-label="内容流水线操作">
          <button type="button" class="operation-tab active" data-pipeline-operation="build" role="tab" aria-selected="true" aria-controls="pipeline-form-build">构建</button>
          <button type="button" class="operation-tab" data-pipeline-operation="sign" role="tab" aria-selected="false" aria-controls="pipeline-form-sign">签名</button>
          <button type="button" class="operation-tab" data-pipeline-operation="validate" role="tab" aria-selected="false" aria-controls="pipeline-form-validate">验证</button>
          <button type="button" class="operation-tab" data-pipeline-operation="resolve" role="tab" aria-selected="false" aria-controls="pipeline-form-resolve">解析</button>
          <button type="button" class="operation-tab" data-pipeline-operation="smoke" role="tab" aria-selected="false" aria-controls="pipeline-form-smoke">冒烟</button>
        </div>
      </div>

      <form class="build-card operation-form active" id="pipeline-form-build" data-operation-form="build">
        <h3>构建 Snapshot / Patch</h3>
        <div class="grid2">
          <div class="field-group">
            <label for="build-mode">模式</label>
            <select id="build-mode" name="mode"><option value="snapshot">Snapshot</option><option value="patch">Patch</option></select>
          </div>
          <div class="field-group">
            <label for="build-source">源目录</label>
            <input id="build-source" name="source" type="text" value="sources/package" autocomplete="off"/>
          </div>
        </div>
        <div class="grid2">
          <div class="field-group"><label for="build-output">输出归档</label><input id="build-output" name="output" type="text" value="archives/editor-build.rvbpack" autocomplete="off"/></div>
          <div class="field-group"><label for="build-package-id">Package ID</label><input id="build-package-id" name="packageId" type="text" value="rvb.editor-build" autocomplete="off"/></div>
        </div>
        <div class="grid2">
          <div class="field-group"><label for="build-name">显示名称</label><input id="build-name" name="displayName" type="text" value="Editor Build" autocomplete="off"/></div>
          <div class="field-group"><label for="build-version">SemVer</label><input id="build-version" name="version" type="text" value="0.1.0" autocomplete="off"/></div>
        </div>
        <div class="grid2">
          <div class="field-group"><label for="build-publisher">Publisher ID</label><input id="build-publisher" name="publisherId" type="text" value="rvb.editor" autocomplete="off"/></div>
          <div class="field-group"><label for="build-capabilities">Capabilities（逗号或换行）</label><input id="build-capabilities" name="capabilities" type="text" value="game-data" autocomplete="off"/></div>
        </div>
        <div class="field-group"><label for="build-desc">描述</label><input id="build-desc" name="description" type="text" value="balance update" autocomplete="off"/></div>
        <div class="field-group"><label for="build-parent">Patch parent Profile hash（Patch 必填）</label><input id="build-parent" name="parentProfileHash" type="text" autocomplete="off"/></div>
        <div class="field-group"><label for="build-operations">Patch operations JSON</label><textarea id="build-operations" name="operations" rows="5">[]</textarea></div>
        <p class="field-help">Snapshot 会忽略 parent 与 operations；Patch 必须提供完整操作数组。</p>
        <div class="action-row"><button type="submit" class="btn btn-primary btn-big" id="build-btn" data-run-operation="build" data-idle-label="构建资源包">构建资源包</button></div>
      </form>

      <form class="build-card operation-form" id="pipeline-form-sign" data-operation-form="sign" hidden>
        <h3>签名归档</h3>
        <div class="grid2">
          <div class="field-group"><label for="sign-input">输入归档</label><input id="sign-input" name="input" type="text" value="archives/editor-build.rvbpack" autocomplete="off"/></div>
          <div class="field-group"><label for="sign-output">签名输出</label><input id="sign-output" name="output" type="text" value="archives/editor-build-qa.rvbpack" autocomplete="off"/></div>
        </div>
        <div class="grid2">
          <div class="field-group"><label for="sign-key-file">私钥文件</label><input id="sign-key-file" name="keyFile" type="text" value="keys/qa.key" autocomplete="off"/></div>
          <div class="field-group"><label for="sign-channel">渠道</label><select id="sign-channel" name="channel"><option value="qa">QA</option><option value="community">Community</option><option value="stable">Stable</option></select></div>
        </div>
        <label class="inline-check" for="sign-confirm-stable"><input id="sign-confirm-stable" name="confirmStable" type="checkbox"/>我确认执行 Stable 操作</label>
        <div class="action-row"><button type="submit" class="btn btn-primary btn-big" data-run-operation="sign" data-idle-label="签名归档">签名归档</button></div>
      </form>

      <form class="build-card operation-form" id="pipeline-form-validate" data-operation-form="validate" hidden>
        <h3>验证归档</h3>
        <div class="grid2">
          <div class="field-group"><label for="validate-archive">待验证归档</label><input id="validate-archive" name="archive" type="text" value="archives/editor-build-qa.rvbpack" autocomplete="off"/></div>
          <div class="field-group"><label for="validate-base">Base（bundled 或归档路径）</label><input id="validate-base" name="base" type="text" value="bundled" autocomplete="off"/></div>
        </div>
        <div class="field-group"><label for="validate-patches">前置 Patch（按顺序，逗号或换行）</label><textarea id="validate-patches" name="patches" rows="3"></textarea></div>
        <div class="grid2">
          <div class="field-group"><label for="validate-trusted">可信 Key ID（逗号或换行）</label><textarea id="validate-trusted" name="trustedKeyIds" rows="3"></textarea></div>
          <div class="field-group"><label for="validate-channel">渠道</label><select id="validate-channel" name="channel"><option value="local-dev">Local Dev</option><option value="qa">QA</option><option value="community">Community</option><option value="stable">Stable</option></select></div>
        </div>
        <label class="inline-check" for="validate-confirm-stable"><input id="validate-confirm-stable" name="confirmStable" type="checkbox"/>我确认执行 Stable 操作</label>
        <div class="action-row"><button type="submit" class="btn btn-primary btn-big" data-run-operation="validate" data-idle-label="验证归档">验证归档</button></div>
      </form>

      <form class="build-card operation-form" id="pipeline-form-resolve" data-operation-form="resolve" hidden>
        <h3>解析完整 Profile</h3>
        <div class="grid2">
          <div class="field-group"><label for="resolve-base">Base（bundled 或归档路径）</label><input id="resolve-base" name="base" type="text" value="bundled" autocomplete="off"/></div>
          <div class="field-group"><label for="resolve-channel">渠道</label><select id="resolve-channel" name="channel"><option value="local-dev">Local Dev</option><option value="qa">QA</option><option value="community">Community</option><option value="stable">Stable</option></select></div>
        </div>
        <div class="field-group"><label for="resolve-patches">Patch 链（按顺序，逗号或换行）</label><textarea id="resolve-patches" name="patches" rows="3"></textarea></div>
        <div class="field-group"><label for="resolve-trusted">可信 Key ID（逗号或换行）</label><textarea id="resolve-trusted" name="trustedKeyIds" rows="3"></textarea></div>
        <label class="inline-check" for="resolve-confirm-stable"><input id="resolve-confirm-stable" name="confirmStable" type="checkbox"/>我确认执行 Stable 操作</label>
        <div class="action-row"><button type="submit" class="btn btn-primary btn-big" data-run-operation="resolve" data-idle-label="解析 Profile">解析 Profile</button></div>
      </form>

      <form class="build-card operation-form" id="pipeline-form-smoke" data-operation-form="smoke" hidden>
        <h3>固定种子 PVE 冒烟</h3>
        <div class="grid2">
          <div class="field-group"><label for="smoke-base">Base（bundled 或归档路径）</label><input id="smoke-base" name="base" type="text" value="bundled" autocomplete="off"/></div>
          <div class="field-group"><label for="smoke-seed">Seed</label><input id="smoke-seed" name="seed" type="number" min="0" max="4294967295" step="1" value="292604670"/></div>
        </div>
        <div class="grid2">
          <div class="field-group"><label for="smoke-channel">渠道</label><select id="smoke-channel" name="channel"><option value="local-dev">Local Dev</option><option value="qa">QA</option><option value="community">Community</option><option value="stable">Stable</option></select></div>
          <div class="field-group"><label for="smoke-trusted">可信 Key ID（逗号或换行）</label><textarea id="smoke-trusted" name="trustedKeyIds" rows="3"></textarea></div>
        </div>
        <div class="field-group"><label for="smoke-patches">Patch 链（按顺序，逗号或换行）</label><textarea id="smoke-patches" name="patches" rows="3"></textarea></div>
        <label class="inline-check" for="smoke-confirm-stable"><input id="smoke-confirm-stable" name="confirmStable" type="checkbox"/>我确认执行 Stable 操作</label>
        <div class="action-row"><button type="submit" class="btn btn-primary btn-big" data-run-operation="smoke" data-idle-label="运行 PVE 冒烟">运行 PVE 冒烟</button></div>
      </form>

      <div class="build-card">
        <div class="status-bar">
          <h3 style="margin:0">输出</h3>
          <span id="build-badge" role="status" aria-live="polite"></span>
        </div>
        <div class="console" id="build-console" role="log" aria-live="polite" aria-relevant="additions"><span class="console-line" style="color:#3f3f46">选择一个操作并填写参数。</span></div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ─── helpers ─────────────────────────────────────────────────────────────────
const api = window.editorAPI

function toast(msg, type = 'success') {
  const el = document.createElement('div')
  el.className = `toast-item toast-${type}`
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  requestAnimationFrame(() => { el.classList.add('show') })
  setTimeout(() => {
    el.classList.remove('show')
    setTimeout(() => el.remove(), 300)
  }, 2500)
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

// ─── tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
    btn.classList.add('active')
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active')
  })
})

// ─── generic entity list ──────────────────────────────────────────────────────
function buildList(listEl, searchEl, items, onSelect) {
  let selected = null
  const render = (filter) => {
    const f = filter.toLowerCase()
    listEl.innerHTML = ''
    items.filter(it => it.id.includes(f) || (it.name||'').toLowerCase().includes(f))
      .forEach(it => {
        const el = document.createElement('div')
        el.className = 'entity-item' + (it.id === selected ? ' selected' : '')
        el.innerHTML = `<span class="name">${esc(it.name || it.id)}</span><span class="id">${esc(it.id)}</span>`
        el.addEventListener('click', () => {
          selected = it.id
          render(searchEl.value)
          onSelect(it)
        })
        listEl.appendChild(el)
      })
  }
  searchEl.addEventListener('input', e => render(e.target.value))
  render('')
  return { refresh: () => render(searchEl.value), select: id => { selected = id; render(searchEl.value) } }
}

// PIECES
// ══════════════════════════════════════════════════════════════════════════════
;(async () => {
  const files = await api.listFiles('pieces')
  const piecesData = {}
  const listEl   = document.getElementById('pieces-list')
  const searchEl = document.getElementById('pieces-search')
  const detailEl = document.getElementById('pieces-detail')

  await Promise.all(files.map(async f => {
    try { piecesData[f.id] = await api.readFile('pieces', f.filename) } catch {}
  }))

  const items = files.map(f => {
    const d = piecesData[f.id] || {}
    return { id: f.id, filename: f.filename, name: d.name || f.id, faction: d.faction }
  })

  buildList(listEl, searchEl, items, async item => {
    const data = piecesData[item.id]
    if (!data) return

  })

  function renderPieceDetail(item, data) {
    const stats = data.stats || {}
    detailEl.innerHTML = `
      <div class="form-card" id="piece-form">
        <div class="form-title">${esc(data.name || item.id)}</div>
        <div class="form-subtitle">${esc(item.filename)}</div>

        <div class="grid2">
          <div class="field-group">

            <input type="text" id="pf-name" value="${esc(data.name||'')}"/>
          </div>
          <div class="field-group">
            <label>阵营</label>
            <select id="pf-faction">
              <option value="red"   ${data.faction==='red'   ?'selected':''}>红方 (red)</option>
              <option value="blue"  ${data.faction==='blue'  ?'selected':''}>蓝方 (blue)</option>
              <option value="neutral" ${data.faction==='neutral'?'selected':''}>中立 (neutral)</option>
            </select>
          </div>

            <select id="pf-rarity">

        </div>

          ${(data.rules||[]).map(r=>`<span style="background:#1e293b;padding:3px 10px;border-radius:4px;font-size:12px;color:#94a3b8">${esc(r)}</span>`).join('') || '<span style="color:var(--muted);font-size:13px">暂无</span>'}
        </div>

        <div class="action-row">
          <button class="btn btn-ghost" id="pf-open">在系统编辑器中打开 JSON</button>
          <button class="btn btn-ghost" id="pf-reset">重置</button>
          <button class="btn btn-success" id="pf-save">保存</button>
        </div>
        <div id="pf-msg" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
      </div>
    `

    document.getElementById('pf-open').onclick = () => api.openInEditor('pieces', item.filename)

    document.getElementById('pf-reset').onclick = () => renderPieceDetail(item, data)

    document.getElementById('pf-save').onclick = async () => {
      const btn = document.getElementById('pf-save')
      btn.disabled = true
      btn.textContent = '保存中…'
      const updated = {
        ...data,
        name:        document.getElementById('pf-name').value,
        faction:     document.getElementById('pf-faction').value,
        rarity:      document.getElementById('pf-rarity').value,
        description: document.getElementById('pf-desc').value,
        stats: {
          ...stats,
          maxHp:     Number(document.getElementById('pf-maxHp').value),

      }
      btn.disabled = false
      btn.textContent = '保存'
    }
  }
})()

// ══════════════════════════════════════════════════════════════════════════════
// CONTENT PIPELINE
// ══════════════════════════════════════════════════════════════════════════════
;(() => {
  const consoleEl = document.getElementById('build-console')
  const badgeEl   = document.getElementById('build-badge')
  const operationTabs = [...document.querySelectorAll('[data-pipeline-operation]')]
  const operationForms = [...document.querySelectorAll('[data-operation-form]')]
  const runButtons = [...document.querySelectorAll('[data-run-operation]')]
  const operationLabels = { build: '构建', sign: '签名', validate: '验证', resolve: '解析', smoke: '冒烟' }
  let running = false

  function appendLine(text, cls = '') {
    const line = document.createElement('div')
    line.className = 'console-line' + (cls ? ' ' + cls : '')
    line.textContent = text
    consoleEl.appendChild(line)
    consoleEl.scrollTop = consoleEl.scrollHeight
  }

  function field(id) {
    return document.getElementById(id).value.trim()
  }

  function checked(id) {
    return document.getElementById(id).checked
  }

  function list(id) {
    return field(id).split(/[\n,]/).map(value => value.trim()).filter(Boolean)
  }

  function setBadge(text, kind) {
    badgeEl.innerHTML = ''
    if (!text) return
    const badge = document.createElement('span')
    badge.className = `badge badge-${kind}`
    badge.textContent = text
    badgeEl.appendChild(badge)
  }

  function setSelectedOperation(operation) {
    operationTabs.forEach(tab => {
      const selected = tab.dataset.pipelineOperation === operation
      tab.classList.toggle('active', selected)
      tab.setAttribute('aria-selected', selected ? 'true' : 'false')
    })
    operationForms.forEach(form => {
      const selected = form.dataset.operationForm === operation
      form.classList.toggle('active', selected)
      form.hidden = !selected
    })
  }

  operationTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      if (!running) setSelectedOperation(tab.dataset.pipelineOperation)
    })
  })

  function common(operation) {
    const channelId = `${operation}-channel`
    const confirmId = `${operation}-confirm-stable`
    const channel = operation === 'build' ? 'local-dev' : field(channelId)
    return {
      operation,
      taskId: field('pipeline-task-id'),
      channel,
      stableConfirmed: operation !== 'build' && checked(confirmId),
    }
  }

  function requestFor(operation) {
    if (operation === 'build') {
      const mode = field('build-mode')
      const operationsText = field('build-operations')
      const operations = operationsText ? JSON.parse(operationsText) : undefined
      if (mode === 'patch' && (!Array.isArray(operations) || operations.length === 0)) {
        throw new Error('Patch 构建需要非空 operations JSON 数组。')
      }
      return {
        ...common(operation),
        mode,
        source: field('build-source'),
        output: field('build-output'),
        packageId: field('build-package-id'),
        version: field('build-version'),
        displayName: field('build-name'),
        description: field('build-desc'),
        publisherId: field('build-publisher'),
        parentProfileHash: field('build-parent') || undefined,
        operations: mode === 'patch' ? operations : undefined,
        capabilities: list('build-capabilities'),
        compressionLevel: 6,
      }
    }
    if (operation === 'sign') {
      return {
        ...common(operation),
        input: field('sign-input'),
        output: field('sign-output'),
        keyFile: field('sign-key-file'),
      }
    }
    if (operation === 'validate') {
      return {
        ...common(operation),
        archive: field('validate-archive'),
        base: field('validate-base') || undefined,
        patches: list('validate-patches'),
        trustedKeyIds: list('validate-trusted'),
      }
    }
    if (operation === 'resolve') {
      return {
        ...common(operation),
        base: field('resolve-base'),
        patches: list('resolve-patches'),
        trustedKeyIds: list('resolve-trusted'),
      }
    }
    return {
      ...common('smoke'),
      base: field('smoke-base'),
      patches: list('smoke-patches'),
      trustedKeyIds: list('smoke-trusted'),
      seed: Number(field('smoke-seed')),
    }
  }

  function renderResult(result) {
    const report = result.report
    const identity = report.identity
    appendLine(`status: ${report.status} (exit ${result.exitCode})`, result.ok ? '' : 'stderr')
    appendLine(`operation: ${report.operation} / channel: ${report.channel}`)
    appendLine(`packageHash: ${identity.packageHash || '-'}`)
    appendLine(`resolvedProfileHash: ${identity.resolvedProfileHash || '-'}`)
    appendLine(`authorityContentHash: ${identity.authorityContentHash || '-'}`)
    appendLine(`engineAbi: ${identity.engineAbi || '-'}`)
    appendLine(`contentAbi: ${identity.contentAbi || '-'}`)
    appendLine(`publisherKeyId: ${identity.publisherKeyId || '-'}`)
    appendLine(`capabilities: ${(identity.capabilities || []).join(', ') || '-'}`)
    appendLine(`signature: ${identity.signature || '-'}`)
    appendLine(`seed: ${report.seed ?? '-'}`)
    appendLine(`terminalOutcome: ${report.smoke?.terminalOutcome || '-'}`)
    appendLine(`finalRunHash: ${report.smoke?.finalRunHash || '-'}`)
    appendLine(`stage: ${report.refusal?.stage || report.operation}`)
    appendLine(`refusal: ${report.refusal?.code || '-'}`, result.ok ? '' : 'stderr')
    appendLine(`refusalPath: ${report.refusal?.path || '-'}`, result.ok ? '' : 'stderr')
    appendLine(`refusalContent: ${report.refusal?.contentId || '-'}`, result.ok ? '' : 'stderr')
    appendLine(`report: ${result.reportPath}`)
  }

  operationForms.forEach(form => form.addEventListener('submit', async event => {
    event.preventDefault()
    if (running) return
    const operation = form.dataset.operationForm
    const activeButton = form.querySelector('[data-run-operation]')
    running = true
    operationTabs.forEach(tab => { tab.disabled = true })
    runButtons.forEach(button => { button.disabled = true })
    activeButton.textContent = '处理中…'
    form.setAttribute('aria-busy', 'true')
    setBadge(`${operationLabels[operation]}处理中`, 'pending')
    consoleEl.innerHTML = ''

    try {
      const result = await api.contentOperation(requestFor(operation))
      renderResult(result)
      setBadge(result.ok ? `${operationLabels[operation]}成功` : `已拒绝 (exit ${result.exitCode})`, result.ok ? 'success' : 'error')
      toast(result.ok ? `${operationLabels[operation]}操作成功` : `${operationLabels[operation]}被安全策略拒绝`, result.ok ? 'success' : 'error')
    } catch(e) {
      appendLine('[错误] ' + e.message, 'stderr')
      setBadge('操作失败', 'error')
      toast(`${operationLabels[operation]}操作失败`, 'error')
    } finally {
      running = false
      operationTabs.forEach(tab => { tab.disabled = false })
      runButtons.forEach(button => {
        button.disabled = false
        button.textContent = button.dataset.idleLabel
      })
      form.removeAttribute('aria-busy')
    }
  }))
})()
</script>
